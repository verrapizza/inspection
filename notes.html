<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VERRA PRO - الملاحظات العامة</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f1f5f9; color: #1e293b; text-align: right; }
    .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    .branch-card { background: white; border-radius: 25px; padding: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .note-box { background: #f8fafc; padding: 15px; border-radius: 15px; border: 1px solid #eee; margin-bottom: 15px; }
    .notes-input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #d1ba89; background: #fffdf5; font-size: 13px; outline: none; font-family: 'Cairo'; text-align: right; min-height: 80px; }
    /* تنسيق الطباعة المخفي لضمان الجودة */
    #pdf-template { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";
    const branchesList = ["VERRA-Mekkah", "VERRA-Batterjie", "VERRA-Obhur", "VERRA-Kaust"];

    function App() {
      // بنية البيانات: تخزين النصوص والصور لكل فرع
      const [notesData, setNotesData] = useState({
          "VERRA-Mekkah": {1:{text:"", imgs:[]}, 2:{text:"", imgs:[]}, 3:{text:"", imgs:[]}},
          "VERRA-Batterjie": {1:{text:"", imgs:[]}, 2:{text:"", imgs:[]}, 3:{text:"", imgs:[]}},
          "VERRA-Obhur": {1:{text:"", imgs:[]}, 2:{text:"", imgs:[]}, 3:{text:"", imgs:[]}},
          "VERRA-Kaust": {1:{text:"", imgs:[]}, 2:{text:"", imgs:[]}, 3:{text:"", imgs:[]}}
      });
      const [isGenerating, setIsGenerating] = useState(false);

      const downloadPDF = async () => {
          // التحقق من وجود أي محتوى قبل الطباعة
          const hasAnyContent = Object.values(notesData).some(b => 
              Object.values(b).some(n => n.text.trim() !== "")
          );
          
          if (!hasAnyContent) return alert("يرجى كتابة ملاحظة واحدة على الأقل قبل التحميل.");

          setIsGenerating(true);
          const timestamp = new Date().toLocaleString('en-GB', { hour12: true });

          // بناء محتوى الفروع
          let branchesHtml = branchesList.map(b => {
              let notesHtml = [1, 2, 3].map(i => {
                  const data = notesData[b][i];
                  if (!data.text.trim()) return "";
                  return `
                    <div style="padding: 15px; border-bottom: 1px solid #f1f5f9; page-break-inside: avoid; display: block; clear: both; width: 100%;">
                        <b style="font-size: 14px; color: #004b47; display: block; margin-bottom: 8px; font-family: 'Cairo', sans-serif;">الملاحظة ${i}:</b>
                        <p style="font-size: 13px; margin: 0; line-height: 1.6; color: #334155; font-family: 'Cairo', sans-serif;">${data.text}</p>
                    </div>`;
              }).join('');

              if (!notesHtml.trim()) return "";

              return `
                <div style="page-break-inside: avoid; clear: both;">
                    <div style="margin-top: 30px; border-right: 10px solid #d1ba89; background: #f0fdf4; padding: 12px 15px; font-weight: 900; font-size: 18px; color: #004b47; font-family: 'Cairo', sans-serif;">
                        فرع: ${b}
                    </div>
                    ${notesHtml}
                </div>`;
          }).join('');

          const fullHtml = `
            <div style="width: 780px; margin: 0 auto; padding: 45px; background: white; direction: rtl; text-align: right; box-sizing: border-box;">
                <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
                <div style="text-align: center; margin-bottom: 40px;">
                    <img src="${LOGO_URL}" style="height: 100px; margin-bottom: 15px;"/>
                    <div style="clear: both;"></div>
                    <div style="color: #004b47; font-family: 'Cairo', sans-serif; font-size: 32px; font-weight: 900; border-bottom: 6px solid #d1ba89; display: inline-block; padding-bottom: 12px; margin-top: 10px;">
                        سجل ملاحظات الفروع المجمّع
                    </div>
                    <p style="margin-top: 15px; color: #64748b; font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: bold;">
                        نظام VERRA PRO للمتابعة الميدانية - تاريخ التقرير: ${timestamp}
                    </p>
                </div>
                ${branchesHtml}
                <div style="margin-top: 60px; border-top: 1px solid #eee; padding-top: 25px; text-align: center; color: #94a3b8; font-family: 'Cairo', sans-serif; font-size: 11px;">
                    تم توليد التقرير آلياً بواسطة منصة VERRA PRO المركزية
                </div>
            </div>`;

          const opt = {
              margin: [10, 10, 10, 10],
              filename: `Verra_Notes_${Date.now()}.pdf`,
              image: { type: 'jpeg', quality: 0.98 },
              html2canvas: { scale: 2, useCORS: true, letterRendering: true, scrollY: 0 },
              jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
          };

          try {
              await html2pdf().from(fullHtml).set(opt).save();
          } catch (err) {
              console.error(err);
              alert("حدث خطأ أثناء تحميل الملف. يرجى المحاولة مرة أخرى.");
          } finally {
              setIsGenerating(false);
          }
      };

      const handleTextUpdate = (branch, noteIdx, val) => {
          setNotesData(prev => ({
              ...prev,
              [branch]: {
                  ...prev[branch],
                  [noteIdx]: { ...prev[branch][noteIdx], text: val }
              }
          }));
      };

      return (
        <div className="min-h-screen">
          <header className="verra-gradient p-10 text-center text-white rounded-b-[3.5rem] shadow-xl sticky top-0 z-50">
            <div className="flex justify-between items-center max-w-3xl mx-auto">
              <button onClick={() => window.history.back()} className="bg-white/20 px-5 py-2 rounded-xl text-xs font-bold transition active:scale-95">← رجوع</button>
              <h1 className="text-xl font-black italic">VERRA <span className="text-[#d1ba89]">NOTES</span></h1>
              <button onClick={downloadPDF} disabled={isGenerating} className="bg-[#d1ba89] text-[#004b47] px-5 py-2 rounded-xl text-xs font-black shadow-lg transition active:scale-95">
                {isGenerating ? "جاري التحميل..." : "تحميل PDF 📄"}
              </button>
            </div>
          </header>

          <main className="p-5 max-w-3xl mx-auto mt-6">
            {branchesList.map(b => (
                <div key={b} className="branch-card">
                  <div className="bg-[#e8f5ee] -m-5 mb-6 p-4 border-r-8 border-[#d1ba89] font-black text-[#004b47] text-lg rounded-tr-3xl shadow-sm">
                    🏢 {b}
                  </div>
                  {[1, 2, 3].map(i => (
                    <div key={i} className="note-box text-right">
                      <p className="text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest">الملاحظة {i}</p>
                      <textarea 
                        className="notes-input" 
                        placeholder="أدخل نص الملاحظة هنا..."
                        value={notesData[b][i].text}
                        onChange={(e) => handleTextUpdate(b, i, e.target.value)}
                      />
                    </div>
                  ))}
                </div>
            ))}
          </main>

          <footer className="p-10 text-center text-gray-400 text-[10px] font-bold">
             VERRA PRO ADMINISTRATION SYSTEM © 2026
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
