<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VERRA PRO - الملاحظات العامة</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f1f5f9; color: #1e293b; text-align: right; }
    .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    .branch-card { background: white; border-radius: 25px; padding: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .note-box { background: #f8fafc; padding: 15px; border-radius: 15px; border: 1px solid #eee; margin-bottom: 15px; }
    .notes-input { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid #d1ba89; background: #fffdf5; font-size: 13px; outline: none; font-family: 'Cairo'; }
    .upload-btn { background: white; color: #475569; padding: 8px 12px; border-radius: 10px; font-size: 11px; font-weight: bold; border: 1px solid #e2e8f0; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
    .photo-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 10px; border: 2px solid white; shadow: 0 2px 5px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const firebaseConfig = {
      apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
      authDomain: "verra-system-828f2.firebaseapp.com",
      projectId: "verra-system-828f2",
      storageBucket: "verra-system-828f2.firebasestorage.app",
      messagingSenderId: "961104891607",
      appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";
    const branches = ["VERRA-Mekkah", "VERRA-Batterjie", "VERRA-Obhur", "VERRA-Kaust"];

    function App() {
      const [notesData, setNotesData] = useState({}); // { branchName: { 1: {text, imgs}, 2... } }
      const [isGenerating, setIsGenerating] = useState(false);

      const compress = (file) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (e) => {
            const img = new Image(); img.src = e.target.result;
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_W = 280; const scale = MAX_W / img.width;
              canvas.width = MAX_W; canvas.height = img.height * scale;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', 0.15));
            };
          };
        });
      };

      const handleAction = async (branch, noteIdx, e) => {
        const file = e.target.files[0]; if (!file) return;
        const compressed = await compress(file);
        setNotesData(prev => {
            const bData = prev[branch] || {};
            const nData = bData[noteIdx] || { text: "", imgs: [] };
            return { ...prev, [branch]: { ...bData, [noteIdx]: { ...nData, imgs: [...nData.imgs, compressed].slice(0, 3) } } };
        });
      };

      const handleText = (branch, noteIdx, text) => {
          setNotesData(prev => {
              const bData = prev[branch] || {};
              const nData = bData[noteIdx] || { text: "", imgs: [] };
              return { ...prev, [branch]: { ...bData, [noteIdx]: { ...nData, text } } };
          });
      };

      const downloadPDF = async () => {
          setIsGenerating(true);
          let contentHtml = branches.map(b => {
              let bContent = [1, 2, 3].map(i => {
                  const data = notesData[b]?.[i];
                  if (!data || (!data.text && (!data.imgs || data.imgs.length === 0))) return "";
                  return `
                    <div style="padding:15px; border-bottom:1px solid #f1f5f9; page-break-inside:avoid;">
                        <b style="font-size:14px; color:#004b47;">الملاحظة ${i}:</b>
                        <p style="font-size:13px; margin:8px 0; line-height:1.6;">${data.text || "(بدون نص)"}</p>
                        <div style="margin-top:10px;">
                            ${(data.imgs || []).map(img => `<img src="${img}" style="width:180px; height:150px; object-fit:cover; margin:5px; border-radius:12px; border:1px solid #eee; display:inline-block;"/>`).join('')}
                        </div>
                    </div>`;
              }).join('');
              return `<div style="margin-top:30px; border-right:10px solid #d1ba89; background:#f0fdf4; padding:15px; font-weight:900; font-size:18px;">فرع: ${b}</div>${bContent || '<p style="padding:15px; color:#94a3b8; font-size:12px;">لا توجد ملاحظات مسجلة.</p>'}`;
          }).join('');

          const html = `
            <div style="width:800px; margin:0 auto; padding:45px; direction:rtl; text-align:right; font-family:'Cairo', sans-serif;">
                <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
                <div style="text-align:center; margin-bottom:40px;">
                    <img src="${LOGO_URL}" style="height:100px;"/>
                    <h1 style="color:#004b47; font-size:32px; font-weight:900; border-bottom:6px solid #d1ba89; display:inline-block; padding-bottom:10px; margin-top:15px;">تقرير الملاحظات العامة للفروع</h1>
                    <p style="margin-top:10px; color:#64748b;">نظام VERRA PRO للمتابعة الميدانية</p>
                </div>
                ${contentHtml}
            </div>`;

          const opt = { margin:10, filename:`Notes_${Date.now()}.pdf`, image:{type:'jpeg', quality:1.0}, html2canvas:{scale:1.5, useCORS:true}, jsPDF:{unit:'mm', format:'a4', orientation:'portrait'} };
          await html2pdf().from(html).set(opt).save();
          setIsGenerating(false);
      };

      return (
        <div className="min-h-screen pb-20">
          <header className="verra-gradient p-10 text-center text-white rounded-b-[3rem] shadow-xl sticky top-0 z-50">
            <div className="flex justify-between items-center max-w-3xl mx-auto">
              <button onClick={() => window.history.back()} className="bg-white/20 px-4 py-2 rounded-xl text-xs font-bold">← رجوع</button>
              <h1 className="text-xl font-black italic">VERRA <span className="text-[#d1ba89]">NOTES</span></h1>
              <button onClick={downloadPDF} disabled={isGenerating} className="bg-[#d1ba89] text-[#004b47] px-4 py-2 rounded-xl text-xs font-black shadow-lg">
                {isGenerating ? "جاري البناء..." : "تحميل PDF 📄"}
              </button>
            </div>
          </header>

          <main className="p-5 max-w-3xl mx-auto mt-6">
            {branches.map(b => (
                <div key={b} className="branch-card">
                  <div className="bg-[#e8f5ee] -m-5 mb-5 p-4 border-r-8 border-[#d1ba89] font-black text-[#004b47] text-lg rounded-tr-3xl">{b}</div>
                  {[1, 2, 3].map(i => (
                    <div key={i} className="note-box">
                      <p className="text-[10px] font-black text-gray-400 mb-2 uppercase">ملاحظة رقم {i}</p>
                      <textarea 
                        className="notes-input mb-3" 
                        placeholder="دون الملاحظة هنا..."
                        value={notesData[b]?.[i]?.text || ""}
                        onChange={(e) => handleText(b, i, e.target.value)}
                      />
                      <div className="flex justify-between items-center">
                        <div className="flex gap-2">
                           <label className="upload-btn bg-green-50 border-green-100 text-green-700">📷 كاميرا<input type="file" className="hidden" accept="image/*" capture="environment" onChange={(e) => handleAction(b, i, e)} /></label>
                           <label className="upload-btn">🖼️ معرض<input type="file" className="hidden" accept="image/*" onChange={(e) => handleAction(b, i, e)} /></label>
                        </div>
                        <div className="flex gap-1">
                           {(notesData[b]?.[i]?.imgs || []).map((img, ix) => (
                             <img key={ix} src={img} className="photo-thumb" />
                           ))}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
            ))}
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
