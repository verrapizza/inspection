<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام VERRA PRO - إشراف الفروع</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; color: #1e293b; margin: 0; padding: 0; }
    .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    .section-title { background: #e8f5ee; border-right: 8px solid #d1ba89; padding: 12px; border-radius: 10px; font-weight: 900; color: #004b47; margin: 20px 0 10px; cursor: pointer; }
    .item-card { background: white; border-radius: 15px; padding: 18px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
    .ans-btn { width: 52px; height: 40px; border-radius: 8px; font-weight: 700; font-size: 11px; background: #f1f5f9; border: 1px solid #e2e8f0; transition: 0.2s; }
    .btn-yes.active { background: #10b981 !important; color: white; border-color: #059669; }
    .btn-no.active { background: #ef4444 !important; color: white; border-color: #dc2626; }
    .btn-na.active { background: #64748b !important; color: white; }
    .notes-input { width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid #d1ba89; background: #fffdf5; font-size: 13px; outline: none; }
    .photo-thumb { width: 75px; height: 75px; object-fit: cover; border-radius: 10px; border: 2px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .del-img { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 1px solid white; z-index: 50; }
    .upload-btn { background: #e8f5ee; color: #004b47; padding: 8px 15px; border-radius: 10px; font-size: 10px; font-weight: bold; cursor: pointer; border: 1px solid #c8ddd3; display: inline-flex; align-items: center; gap: 5px; }
    .upload-btn-gallery { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .sticky-header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.98); backdrop-filter: blur(10px); border-bottom: 2px solid #004b47; padding: 12px 15px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const firebaseConfig = {
      apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
      authDomain: "verra-system-828f2.firebaseapp.com",
      projectId: "verra-system-828f2",
      storageBucket: "verra-system-828f2.firebasestorage.app",
      messagingSenderId: "961104891607",
      appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";

    // بنود مشرف الفروع الجديدة
    const sectionsData = [
      { title: "الواجهة والمداخل", items: [{id:1,q:"نظافة واجهة المطعم وأرضية المدخل والستارة القماش والهوائية واللوحة"}]},
      { title: "الصالات والحمامات", items: [
          {id:2,q:"صالة 1: نظافة الطاولات والكراسي والجدران والتكييف والمعطر والطفايات"},
          {id:3,q:"حمام صالة 1: النظافة العامة ومكائن المناديل والصابون والمعطر وجدول النظافة"},
          {id:4,q:"صالة 2: نظافة الطاولات والكراسي والجدران والتكييف والطفايات"},
          {id:5,q:"حمام صالة 2: النظافة العامة ومكائن المناديل والصابون والمعطر وجدول النظافة"}
      ]},
      { title: "الكاشير والتشغيل", items: [
          {id:6,q:"قسم الكاشير: النت والهاتف والعهدة ونظام فودو وفيد أس وتطبيقات التوصيل"},
          {id:7,q:"متابعة قوقل ماب"},
          {id:8,q:"الأشجار: التشيك على الأشجار ومتابعتها بالكامل إن وجد"}
      ]},
      { title: "الإنتاج والمخازن", items: [
          {id:9,q:"قسم العصائر: الخلاطات وماكينة البيبسي والغاز وثلاجة العصائر والتواريخ"},
          {id:10,q:"المستودع: المصعد والترتيب والنظافة والتكديس ومراقبة التواريخ"},
          {id:11,q:"القسم الخلفي: النظافة العامة والستائر الهوائية والغاز"}
      ]},
      { title: "الموظفين والالتزام", items: [
          {id:12,q:"العمال: النظافة الشخصية واليونفرم والأظافر والريحة والكرت والكمام والقفاز"},
          {id:13,q:"كشف الحضور: تشيك كشف الحضور والانصراف"},
          {id:14,q:"الاجتماع: هل تم الاجتماع مع جميع الموظفين اليوم؟"},
          {id:15,q:"الطلبات: رفع وتشيك الطلبات حسب الجدول"},
          {id:16,q:"المرافق العامة: اللمبات والبلاط والمعدات والأدوات (سليمة/خربانة)"},
          {id:17,q:"الإشراف: متابعة مهام مشرفين الفروع اليومية"}
      ]}
    ];

    const buildReportHTML = (branch, email, score, answers, notes, photos, signature) => {
        return `
          <div style="width: 800px; margin: 0 auto; padding: 40px; background: white; direction: rtl; font-family: 'Cairo', sans-serif; text-align: right;">
            <div style="text-align: center; border-bottom: 5px solid #004b47; padding-bottom: 20px; margin-bottom: 30px;">
              <img src="${LOGO_URL}" style="height: 100px; margin-bottom: 10px;" />
              <h1 style="color: #004b47; font-size: 26px; font-weight: 900; margin:0;">تقرير إشراف الفروع اليومي</h1>
              <p style="font-size:12px; color:#666;">نموذج فحص العمليات التشغيلية</p>
            </div>
            <div style="background: #f8fafc; padding: 25px; border-radius: 15px; border: 1px solid #e2e8f0; margin-bottom: 30px; display: flex; justify-content: space-between;">
              <div style="flex: 1; line-height: 2">
                <p><b>🏢 الفرع:</b> ${branch || '---'}</p>
                <p><b>👤 مشرف الفروع:</b> ${email}</p>
                <p><b>📅 التاريخ:</b> ${new Date().toLocaleString('en-GB')}</p>
              </div>
              <div style="width: 150px; text-align: center; border-right: 2px solid #ddd;">
                <p style="color: #64748b; font-weight: bold; font-size: 11px">نسبة الجاهزية</p>
                <div style="font-size: 40px; font-weight: 900; color: ${score >= 70 ? '#10b981' : '#ef4444'}">${score}%</div>
              </div>
            </div>
            ${sectionsData.map(sec => `
              <div style="background: #e8f5ee; padding: 10px; font-weight: bold; border-right: 5px solid #d1ba89; color: #004b47; font-size: 16px; margin-top: 20px;">${sec.title}</div>
              ${sec.items.map(i => {
                const ans = answers[i.id]; const note = notes[i.id]; const itemPhotos = photos[i.id] || [];
                return `
                  <div style="padding: 12px; border-bottom: 1px solid #eee; page-break-inside: avoid;">
                    <p style="margin: 0; font-size: 14px; font-weight: bold;">${i.q}</p>
                    <p style="font-size: 12px; margin: 5px 0;">الحالة: ${ans === 'yes' ? '✅ تم' : ans === 'no' ? '❌ يوجد ملاحظات' : '🔘 N/A'}</p>
                    ${note ? `<div style="background: #fff9e6; padding: 8px; font-size: 11px; margin-top: 5px;">الملاحظة: ${note}</div>` : ''}
                    <div style="display: flex; gap: 5px; margin-top: 10px;">
                      ${itemPhotos.map(p => `<img src="${p}" style="width: 150px; height: 110px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd;" />`).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            `).join('')}
            <div style="margin-top: 40px; text-align: left;">
              <p style="font-weight: 900; color: #004b47; margin-bottom:10px;">توقيع المشرف المسؤول:</p>
              <img src="${signature}" style="width: 180px; border-bottom: 2px solid #004b47" />
            </div>
          </div>
        `;
    };

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [submitting, setSubmitting] = useState(false);
      const [branch, setBranch] = useState("");
      const [branches, setBranches] = useState([]);
      const [answers, setAnswers] = useState({});
      const [notes, setNotes] = useState({});
      const [photos, setPhotos] = useState({});
      const [expanded, setExpanded] = useState(new Set([sectionsData[0].title]));
      const canvasRef = useRef(null);
      const sigPad = useRef(null);

      useEffect(() => {
        auth.onAuthStateChanged(u => { setUser(u); setLoading(false); });
        db.collection("branches").onSnapshot(snap => setBranches(snap.docs.map(d => d.data().name)));
      }, []);

      useEffect(() => { if (user && canvasRef.current) sigPad.current = new SignaturePad(canvasRef.current); }, [user]);

      const handlePhotoAction = (id, e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => setPhotos(prev => ({...prev, [id]: [...(prev[id] || []), ev.target.result].slice(0,2)}));
        reader.readAsDataURL(file);
      };

      const getScore = () => {
        const vals = Object.values(answers);
        const yes = vals.filter(v => v === 'yes').length;
        const total = vals.filter(v => v !== 'na' && v !== undefined).length;
        return total > 0 ? Math.round((yes / total) * 100) : 0;
      };

      const handleFinalSubmit = async () => {
          if(!branch) return alert("يرجى اختيار الفرع");
          if(submitting) return;
          setSubmitting(true);
          const score = getScore();
          const reportId = Date.now();
          const timestampStr = new Date().toLocaleString('en-GB', { hour12: true });

          const reportData = { 
              id: reportId, branch, score, inspector: user.email, date: timestampStr, timestamp: reportId, isCrit: score < 70,
              type: "Branch Report" // تمييز نوع التقرير للادمن
          };

          try {
              let local = JSON.parse(localStorage.getItem('v2_reports')) || [];
              local.unshift(reportData);
              localStorage.setItem('v2_reports', JSON.stringify(local.slice(0, 30)));

              await db.collection("inspections").add({ 
                  ...reportData, signature: sigPad.current ? sigPad.current.toDataURL() : "", answers, notes, photos 
              });

              alert("✅ تم إرسال تقرير الإشراف بنجاح!");
              window.location.reload();
          } catch (error) { alert("⚠️ خطأ سحابي."); }
          finally { setSubmitting(false); }
      };

      const handlePreview = () => {
        const signature = sigPad.current ? sigPad.current.toDataURL() : "";
        const html = buildReportHTML(branch, user.email, getScore(), answers, notes, photos, signature);
        const opt = { margin:0, filename:`Branches_${branch}.pdf`, html2canvas:{scale:2}, jsPDF:{unit:'mm', format:'a4'} };
        html2pdf().from(html).set(opt).save();
      };

      if (loading) return <div className="h-screen flex items-center justify-center font-bold text-green-900 animate-pulse text-2xl">جاري التحميل...</div>;
      if (!user) return <Login auth={auth} logo={LOGO_URL} />;

      return (
        <div className="pb-40 text-right">
          <div className="verra-gradient p-10 text-center shadow-xl rounded-b-[4rem]">
            <img src={LOGO_URL} className="h-32 mx-auto mb-4 drop-shadow-2xl" />
            <h1 className="text-white font-bold text-lg italic">بوابة مشرف الفروع</h1>
          </div>

          <div className="sticky-header flex justify-between items-center shadow-lg">
            <div className="text-right">
              <p className="text-[10px] font-bold text-gray-400">READY SCORE</p>
              <p className="text-3xl font-black text-green-700">{getScore()}%</p>
            </div>
            <div className="flex gap-2">
                <button onClick={handlePreview} className="bg-blue-600 text-white px-4 py-2.5 rounded-xl font-bold text-xs active:scale-95 transition">معاينة</button>
                <button onClick={handleFinalSubmit} disabled={submitting} className={`${submitting ? 'bg-gray-400':'verra-gradient'} text-white px-4 py-2.5 rounded-xl font-black shadow-lg text-xs active:scale-95 transition`}>{submitting ? '...':'إرسال التقرير'}</button>
            </div>
          </div>

          <main className="p-4 max-w-2xl mx-auto space-y-6 mt-4">
            <div className="card p-6 border-r-[12px] border-green-800 shadow-md">
                <select className="w-full text-xl font-bold outline-none bg-transparent text-green-900" value={branch} onChange={e=>setBranch(e.target.value)}>
                    <option value="">-- اختر الفرع --</option>
                    {branches.map(b => <option key={b} value={b}>{b}</option>)}
                </select>
            </div>

            {sectionsData.map(sec => (
              <div key={sec.title}>
                <div className="section-title flex justify-between items-center" onClick={() => {
                  const n = new Set(expanded); n.has(sec.title) ? n.delete(sec.title) : n.add(sec.title); setExpanded(n);
                }}><span>{sec.title}</span><span className="text-[10px] opacity-60 font-normal">{expanded.has(sec.title) ? 'إخفاء ▲' : 'عرض ▼'}</span></div>
                {expanded.has(sec.title) && sec.items.map((i) => (
                  <div key={i.id} className="item-card shadow-md">
                    <p className="text-md font-bold text-green-950 mb-4 leading-relaxed">{i.q}</p>
                    <div className="flex gap-2 justify-end mb-4">
                      <button onClick={()=>setAnswers({...answers, [i.id]:'yes'})} className={`ans-btn btn-yes ${answers[i.id]==='yes'?'active':''}`}>تم</button>
                      <button onClick={()=>setAnswers({...answers, [i.id]:'no'})} className={`ans-btn btn-no ${answers[i.id]==='no'?'active':''}`}>ملاحظة</button>
                      <button onClick={()=>setAnswers({...answers, [i.id]:'na'})} className={`ans-btn btn-na ${answers[i.id]==='na'?'active':''}`}>N/A</button>
                    </div>
                    <textarea className="notes-input shadow-inner" placeholder="تفاصيل الملاحظة..." value={notes[i.id]||""} onChange={e=>setNotes({...notes, [i.id]:e.target.value})} />
                    <div className="mt-4 flex flex-wrap gap-2 items-center justify-end">
                        <label className="upload-btn">📷 كاميرا<input type="file" className="hidden" accept="image/*" capture="environment" onChange={e => handlePhotoAction(i.id, e)} /></label>
                        <label className="upload-btn upload-btn-gallery">🖼️ معرض<input type="file" className="hidden" accept="image/*" onChange={e => handlePhotoAction(i.id, e)} /></label>
                        <div className="flex flex-wrap mr-auto">
                          {(photos[i.id] || []).map((img, px) => (
                            <div key={px} className="relative m-1">
                              <img src={img} className="photo-thumb" /><div className="del-img" onClick={()=>setPhotos({...photos, [i.id]: photos[i.id].filter((_,x)=>x!==px)})}>×</div>
                            </div>
                          ))}
                        </div>
                    </div>
                  </div>
                ))}
              </div>
            ))}
            
            <div className="card p-8 border-2 border-dashed border-gray-300 text-center">
              <h3 className="font-bold text-green-900 mb-4 uppercase text-xs italic">Signature / التوقيع</h3>
              <canvas ref={canvasRef} className="sig-canvas w-full h-40 border border-gray-100 rounded-xl bg-gray-50 shadow-inner"></canvas>
              <button onClick={()=>sigPad.current.clear()} className="text-red-500 text-[10px] font-bold mt-4 underline">مسح</button>
            </div>
          </main>
        </div>
      );
    }

    function Login({ auth, logo }) {
      const [email, setEmail] = useState(""); const [pass, setPass] = useState("");
      return (
        <div className="h-screen verra-gradient flex items-center justify-center p-6 text-right">
           <form onSubmit={(ev)=>{ev.preventDefault(); auth.signInWithEmailAndPassword(email, pass).catch(()=>alert("⚠️ خطأ"))}} className="bg-white p-10 rounded-[3.5rem] shadow-2xl w-full max-w-sm text-center">
              <img src={logo} className="h-24 mx-auto mb-6 shadow-2xl rounded-full" />
              <input className="w-full border-2 p-5 rounded-2xl mb-4 text-right outline-none" placeholder="البريد" value={email} onChange={v=>setEmail(v.target.value)} />
              <input className="w-full border-2 p-5 rounded-2xl mb-8 text-right outline-none" type="password" placeholder="الكلمة" value={pass} onChange={v=>setPass(v.target.value)} />
              <button type="submit" className="w-full verra-gradient text-white font-black py-4 rounded-2xl shadow-xl">دخول</button>
           </form>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
