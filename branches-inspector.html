    const buildReportHTML = (branch, email, score, answers, notes, photos, signature) => {
        const formattedDate = new Date().toLocaleString('en-GB', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:true });
        return `
          <div style="width: 790px; margin: 0 auto; padding: 30px; background: white; direction: rtl; font-family: sans-serif; text-align: right;">

            </div>
            
            <div style="background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 25px; display: flex; align-items: center; page-break-inside: avoid;">

                    <div style="font-size: 38px; font-weight: 900; color: ${score >= 70 ? '#059669' : '#dc2626'}">${score}%</div>
                </div>
            </div>

            ${sectionsData.map(sec => `
              <div style="page-break-inside: avoid;">
                <div style="background: #e8f5ee; padding: 8px 15px; margin-top: 20px; border-right: 6px solid #d1ba89; color: #004b47; font-weight: 900; font-size: 16px;">${sec.title}</div>
              </div>
              ${sec.items.map(i => {
                const ans = answers[i.id]; const note = notes[i.id] || ""; const pics = photos[i.id] || [];
                if (!ans) return ""; // عدم إظهار الأسئلة غير المجاب عليها في الـ PDF
                let status = ans === 'yes' ? 'مطابق ✅' : ans === 'no' ? 'مخالفة ❌' : 'N/A';
                return `
                <div style="padding: 15px; border-bottom: 1px solid #eee; page-break-inside: avoid;">
                    <p style="margin: 0; font-size: 13px; font-weight: bold; color: #1e293b; line-height:1.5;">${i.q.replace(/\n/g, '<br>')}</p>

                    <div style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px;">
                      ${pics.map(p => `<img src="${p}" style="width: 180px; height: 130px; object-fit: cover; border-radius: 8px; border: 1px solid #eee;" />`).join('')}

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [submitting, setSubmitting] = useState(false);
      const [branch, setBranch] = useState("");

      const [notes, setNotes] = useState({});
      const [photos, setPhotos] = useState({});
      const [expanded, setExpanded] = useState(new Set([sectionsData[0].title]));
      const canvasRef = useRef(null);
      const sigPad = useRef(null);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(async u => {
            if (u) {
                const authCheck = await db.collection("authorized_users").where("email", "==", u.email.toLowerCase()).get();
                if (u.email === ADMIN_EMAIL || !authCheck.empty) {
                    setUser(u);
                    db.collection("branches").orderBy("name").onSnapshot(snap => setBranches(snap.docs.map(d => d.data().name)));
                } else {
                    alert("⏳ بانتظار التفعيل.");
                    auth.signOut();
                }
            } else { setUser(null); }
            setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => { if (user && canvasRef.current) sigPad.current = new SignaturePad(canvasRef.current); }, [user]);

      const compressExtreme = (file) => {
        return new Promise((resolve) => {
