<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام VERRA PRO - إشراف الفروع (نسخة الصور المكثفة)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; color: #1e293b; }
    .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    .section-title { background: #e8f5ee; border-right: 8px solid #d1ba89; padding: 12px; border-radius: 10px; font-weight: 900; color: #004b47; margin: 20px 0 10px; cursor: pointer; }
    .item-card { background: white; border-radius: 15px; padding: 18px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
    .ans-btn { width: 55px; height: 40px; border-radius: 8px; font-weight: 700; font-size: 10px; background: #f1f5f9; border: 1px solid #e2e8f0; }
    .btn-yes.active { background: #10b981 !important; color: white; }
    .btn-no.active { background: #ef4444 !important; color: white; }
    .btn-na.active { background: #64748b !important; color: white; }
    .notes-input { width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid #d1ba89; background: #fffdf5; font-size: 13px; }
    .photo-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
    .sticky-header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.98); backdrop-filter: blur(10px); border-bottom: 2px solid #004b47; padding: 12px 15px; }
    .upload-btn { background: #e8f5ee; color: #004b47; padding: 8px 12px; border-radius: 10px; font-size: 10px; font-weight: bold; cursor: pointer; border: 1px solid #c8ddd3; display: inline-flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
      apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
      authDomain: "verra-system-828f2.firebaseapp.com",
      projectId: "verra-system-828f2",
      storageBucket: "verra-system-828f2.firebasestorage.app",
      messagingSenderId: "961104891607",
      appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";
    const ADMIN_EMAIL = "ch3f.ramzi@gmail.com";

    // البنود الأصلية
    const sectionsData = [
      { 
        title: "الواجهة والصالات | Front & Lounge", 
        items: [
          {id:1, q:"تشيك قسم واجهة المطعم ( نظافة الواجهة + المدخل + الستارة + اللوحة )"},
          {id:2, q:"تشيك صالة 1 ( طاولات + كراسي + جدران + تكييف + معطر )"},
          {id:3, q:"تشيك الحمام صالة 1 ( نظافة + صابون + مناديل + جدول النظافة )"},
          {id:8, q:"تشيك صالة 2 ( طاولات + كراسي + جدران + تكييف )"},
          {id:9, q:"تشيك الحمام صالة 2 ( نظافة + صابون + مناديل )"}
        ]
      },
      { 
        title: "قسم الإدارة والتشغيل | Admin & Operation", 
        items: [
          {id:4, q:"تشيك الكاشير ( نت + تلفون + نظام فودو + فيد اس + تطبيقات التوصيل )"},
          {id:5, q:"متابعة قوقل ماب"},
          {id:10, q:"تشيك الأشجار والنباتات بالفرع"},
          {id:16, q:"كشف الحضور والانصراف"},
          {id:17, q:"الاجتماع اليومي مع الموظفين"},
          {id:18, q:"متابعة مهام مشرفين الفروع"}
        ]
      }
      // يمكن إضافة بقية الأقسام هنا...
    ];

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [branch, setBranch] = useState("");
      const [branches, setBranches] = useState([]);
      const [answers, setAnswers] = useState({});
      const [notes, setNotes] = useState({});
      const [photos, setPhotos] = useState({});
      const [submitting, setSubmitting] = useState(false);
      const [expanded, setExpanded] = useState(new Set([sectionsData[0].title]));
      const canvasRef = useRef(null);
      const sigPad = useRef(null);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(async u => {
            if (u) {
                setUser(u);
                db.collection("branches").orderBy("name").onSnapshot(snap => setBranches(snap.docs.map(d => d.data().name)));
            }
            setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => { if (user && canvasRef.current) sigPad.current = new SignaturePad(canvasRef.current); }, [user]);

      // --- خاصية الضغط المتطرف من ملف "مفتش الجودة" ---
      const compressExtreme = (file) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_W = 250; // تقليل الحجم جداً لرفع 120 صورة
              const scale = MAX_W / img.width;
              canvas.width = MAX_W; canvas.height = img.height * scale;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', 0.15)); // جودة 15% فقط
            };
          };
        });
      };

      const handlePhoto = async (id, e) => {
        const file = e.target.files[0]; if (!file) return;
        const compressed = await compressExtreme(file);
        setPhotos(prev => ({...prev, [id]: [...(prev[id] || []), compressed]}));
      };

      const getScore = () => {
        const vals = Object.values(answers);
        const yes = vals.filter(v => v === 'yes').length;
        const total = vals.filter(v => v !== 'na' && v !== undefined).length;
        return total > 0 ? Math.round((yes / total) * 100) : 0;
      };

      // --- خاصية تجزئة البيانات لرفع 120 صورة ---
      const handleFinalSubmit = async () => {
        if(!branch) return alert("اختر المنشأة");
        if(submitting) return;
        setSubmitting(true);
        const reportId = Date.now().toString();

        try {
            // تقسيم مصفوفة الصور لجزئين لتجنب حد الـ 1 ميجابايت في Firestore
            const photoEntries = Object.entries(photos);
            const mid = Math.ceil(photoEntries.length / 2);
            const part1 = Object.fromEntries(photoEntries.slice(0, mid));
            const part2 = Object.fromEntries(photoEntries.slice(mid));

            // الوثيقة الرئيسية
            await db.collection("inspections").doc(reportId).set({
                branch, score: getScore(), inspector: user.email,
                date: new Date().toLocaleString('en-GB'), timestamp: Date.now(),
                signature: sigPad.current.toDataURL(), answers, notes,
                photos: part1, // الجزء الأول من الصور
                hasExtra: true, type: "Branch Report"
            });

            // الوثيقة الملحقة (للصور الإضافية)
            if (photoEntries.length > mid) {
                await db.collection("inspection_attachments").doc(reportId).set({
                    reportId, photos: part2
                });
            }

            alert("✅ تم رفع التقرير و 120+ صورة بنجاح!");
            window.location.reload();
        } catch (e) {
            alert("⚠️ فشل الإرسال: " + e.message);
        } finally {
            setSubmitting(false);
        }
      };

      if (loading) return <div className="h-screen flex items-center justify-center font-black">جاري التحميل...</div>;
      if (!user) return <div className="p-20 text-center">يرجى تسجيل الدخول</div>;

      return (
        <div className="pb-40 text-right">
          <div className="verra-gradient p-10 text-center text-white rounded-b-[3rem]">
            <img src={LOGO_URL} className="h-20 mx-auto mb-4" />
            <h1 className="text-xl font-bold">إشراف الفروع - نظام الصور المكثفة</h1>
          </div>

          <div className="sticky-header flex justify-between items-center shadow-md">
            <p className="text-3xl font-black text-green-700">{getScore()}%</p>
            <button onClick={handleFinalSubmit} disabled={submitting} className="verra-gradient text-white px-6 py-2 rounded-xl font-bold shadow-lg">
                {submitting ? 'جاري الرفع...' : 'إرسال التقرير'}
            </button>
          </div>

          <main className="p-5 max-w-2xl mx-auto space-y-6">
            <div className="item-card border-r-8 border-green-800 shadow-md">
                <select className="w-full text-lg font-bold outline-none bg-transparent" value={branch} onChange={e=>setBranch(e.target.value)}>
                    <option value="">-- اختر المنشأة --</option>
                    {branches.map(b => <option key={b} value={b}>{b}</option>)}
                </select>
            </div>

            {sectionsData.map(sec => (
              <div key={sec.title}>
                <div className="section-title flex justify-between" onClick={() => {
                  const n = new Set(expanded); n.has(sec.title) ? n.delete(sec.title) : n.add(sec.title); setExpanded(n);
                }}>
                  <span>{sec.title}</span>
                  <span>{expanded.has(sec.title) ? '▲' : '▼'}</span>
                </div>
                {expanded.has(sec.title) && sec.items.map(i => (
                  <div key={i.id} className="item-card">
                    <p className="font-bold mb-4">{i.q}</p>
                    <div className="flex gap-2 justify-end mb-4">
                      <button onClick={()=>setAnswers({...answers, [i.id]:'yes'})} className={`ans-btn ${answers[i.id]==='yes'?'active btn-yes':''}`}>نعم</button>
                      <button onClick={()=>setAnswers({...answers, [i.id]:'no'})} className={`ans-btn ${answers[i.id]==='no'?'active btn-no':''}`}>لا</button>
                      <button onClick={()=>setAnswers({...answers, [i.id]:'na'})} className={`ans-btn ${answers[i.id]==='na'?'active btn-na':''}`}>N/A</button>
                    </div>
                    <textarea className="notes-input" placeholder="ملاحظة..." value={notes[i.id]||""} onChange={e=>setNotes({...notes, [i.id]:e.target.value})} />
                    
                    <div className="mt-4 flex flex-wrap gap-2 items-center">
                        <label className="upload-btn">📷 إضافة صورة<input type="file" className="hidden" accept="image/*" capture="environment" onChange={e => handlePhoto(i.id, e)} /></label>
                        <div className="flex flex-wrap gap-1">
                          {(photos[i.id] || []).map((img, idx) => (
                            <img key={idx} src={img} className="photo-thumb" />
                          ))}
                        </div>
                    </div>
                  </div>
                ))}
              </div>
            ))}

            <div className="item-card p-10 border-2 border-dashed border-gray-300 text-center shadow-inner">
                <h3 className="font-bold text-green-900 mb-4">توقيع المفتش</h3>
                <canvas ref={canvasRef} className="w-full h-40 bg-gray-50 rounded-2xl border shadow-inner"></canvas>
                <button onClick={()=>sigPad.current.clear()} className="text-red-500 text-xs mt-2 underline">مسح التوقيع</button>
            </div>
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
