<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام VERRA PRO - إشراف الفروع</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; text-align: right; }
    .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    .section-title { background: #e8f5ee; border-right: 8px solid #d1ba89; padding: 12px; border-radius: 10px; font-weight: 900; color: #004b47; margin: 20px 0 10px; cursor: pointer; }
    .item-card { background: white; border-radius: 15px; padding: 18px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
    .ans-btn { width: 60px; height: 40px; border-radius: 8px; font-weight: 700; font-size: 10px; background: #f1f5f9; border: 1px solid #e2e8f0; transition: 0.2s; }
    .btn-yes.active { background: #1C780B !important; color: white; border-color: #166534; }
    .btn-no.active { background: #D91414 !important; color: white; border-color: #991b1b; }
    .btn-na.active { background: #64748b !important; color: white; }
    .notes-input { width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid #d1ba89; background: #fffdf5; font-size: 13px; outline: none; }
    .photo-thumb { width: 65px; height: 65px; object-fit: cover; border-radius: 10px; border: 2px solid white; shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .upload-btn { background: #f8fafc; color: #475569; padding: 10px 14px; border-radius: 12px; font-size: 11px; font-weight: bold; cursor: pointer; border: 1px solid #e2e8f0; display: inline-flex; align-items: center; gap: 6px; }
    .sticky-header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.98); backdrop-filter: blur(10px); border-bottom: 2px solid #004b47; padding: 12px 15px; }
    .nav-btn { padding: 8px 16px; border-radius: 10px; font-size: 11px; font-weight: bold; transition: 0.3s; display: inline-flex; align-items: center; gap: 5px; }
    .logout-btn { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
    .notes-page-btn { background: #d1ba89; color: #004b47; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
      authDomain: "verra-system-828f2.firebaseapp.com",
      projectId: "verra-system-828f2",
      storageBucket: "verra-system-828f2.firebasestorage.app",
      messagingSenderId: "961104891607",
      appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";
    const ADMIN_MAIN = "ch3f.ramzi@gmail.com";
    const branchesList = ["VERRA-Mekkah", "VERRA-Batterjie", "VERRA-Obhur", "VERRA-Kaust"];

    // البنود الـ 18 الأصلية
    const sectionsData = [
      { 
        title: "الواجهة والصالات | Front & Lounge", 
        items: [
          {id:1, q:"check the restaurant front section (restaurant front + entrance floor + thermometer + air curtain)\nتشيك قسم واجهة المطعم ( نظافة واجهة المطعم + أرضية المدخل + الستارة القماش + الستارة الهوائية + تشيك على اللوحة بداية ونهاية الدوام )"},
          {id:2, q:"Check lounge section 1 (tables + Chairs + walls and floor + air conditioning)\nتشيك قسم صالة 1 ( طاولات + كراسي + جدران و الأرضية + تكيف + مكينة المعطر + طفايات )"},
          {id:3, q:"check bathroom hall 1 (general cleaning + tissue machine + soap machine + perfume machine)\nتشيك الحمام صالة 1 ( نظافة عامة + مكينة المناديل + مكينة الصابون + مكينة المعطر + متابعة جدول النظافة )"},
          {id:8, q:"Check lounge section 2 (tables + Chairs + walls and floor + air conditioning)\nتشيك قسم صالة 2 ( طاولات + كراسي + جدران والأرضية + تكيف + طفايات )"},
          {id:9, q:"check bathroom hall 2 (general cleaning + tissue machine + soap machine + perfume machine)\nتشيك الحمام صالة 2 ( نظافة عامة + مكينة المناديل + مكينة الصابون + مكينة المعطر + متابعة جدول النظافة )"}
        ]
      },
      { 
        title: "قسم الإدارة والتشغيل | Admin & Operation", 
        items: [
          {id:4, q:"checks, the cashier department (net + phone + cashier + applications)\nتشيك قسم الكاشير ( نت + تلفون + متابعة عهدة الكاشير + تشيك على نظام فودو في الكاشير + التشيك على نظاف فيد اس + متابعة الدوامات في مواقع التطبيقات )"},
          {id:5, q:"Monitor and Google Maps.\n( متابعة قوقل ماب )"},
          {id:10, q:"Check and monitor all plants/trees in the branch, if available.\n( تشيك على الأشجار ومتابعتها بالكامل ان وجد في الفرع . )"},
          {id:16, q:"Check attendance and leave تشيك ( كشف الحضور )"},
          {id:17, q:"Has a meeting been conducted with all employees today?\n( هل تم الاجتماع مع جميع الموظفين اليوم )"},
          {id:18, q:"Follow-up on branch supervisors' daily tasks\nمتابعة مهام مشرفين الفروع"}
        ]
      },
      { 
        title: "الإنتاج والمخزون | Production & Store", 
        items: [
          {id:6, q:"Check the juices section (mixers + Pepsi machine + gas tube + chiller + dates)\nتشيك قسم العصائر ( تشيك الخلاطات + نظافة مكينة البيبسي + كراتين التابعة للمكينة مع الغاز + ثلاجة العصائر + تواريخ )"},
          {id:7, q:"Check the store section (elevator + store arrangement + cleaning + stacking + date control + store under the stairs)\nتشيك قسم المستودع ( المصعد + ترتيب المستودع + نظافة + التكديس + مراقبة التواريخ + مستودع تحت الدرج مكة )"},
          {id:11, q:"Check Restaurant, back side (general cleaning + air curtains)\nتشيك القسم الخلفي للمطعم ( نظافة عامة + ستاير هوائية + الغاز )"},
          {id:13, q:"Send orders according to schedule\nرفع الطلبات حسب الجدول"},
          {id:14, q:"check requests\nتشيك الطلبات"}
        ]
      },
      { 
        title: "العمال والمرافق | Staff & Facilities", 
        items: [
          {id:12, q:"Check the employees (personal hygiene * uniform hygiene * nails * smell * health certificate * masks * gloves * harnet)\nتشيك العمال ( النظافة الشخصية * نظافة اليونفرم * اظافر * ريحة * كرت البلدية * الكمام * قلفزات * هرنت )"},
          {id:15, q:"General check (sanitary facilities + all lamps + tiles + Damaged or broken equipment + Damaged or broken tools)\nتشيك عام ( مرافق صحية + جميع اللمبات + البلاط + المكاين الخربانة او المكسرة + أدوات الخربانة او المكسرة )"}
        ]
      }
    ];

    function App() {
      const [user, setUser] = useState(null);
      const [userRole, setUserRole] = useState("");
      const [view, setView] = useState("main");
      const [loading, setLoading] = useState(true);
      const [submitting, setSubmitting] = useState(false);
      const [branch, setBranch] = useState("");
      const [branches, setBranches] = useState([]);
      const [answers, setAnswers] = useState({});
      const [notes, setNotes] = useState({});
      const [photos, setPhotos] = useState({});
      const [extraNotes, setExtraNotes] = useState({});
      const canvasRef = useRef(null);
      const sigPad = useRef(null);

      // إصلاح منطق التحقق لضمان إخفاء شاشة التحميل
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(async u => {
            try {
              if (u) {
                  const uEmail = u.email.toLowerCase().trim();
                  const authSnap = await db.collection("authorized_users").where("email", "==", uEmail).get();
                  if (uEmail === ADMIN_MAIN || !authSnap.empty) {
                      const role = uEmail === ADMIN_MAIN ? 'admin' : authSnap.docs[0].data().role;
                      setUserRole(role);
                      if (role === 'admin' || role === 'supervisor') {
                          setUser(u);
                          db.collection("branches").orderBy("name").onSnapshot(snap => setBranches(snap.docs.map(d => d.data().name)));
                      } else { window.location.href = "index.html"; }
                  } else { auth.signOut(); }
              } else { setUser(null); }
            } catch (err) {
              console.error(err);
            } finally {
              setLoading(false);
            }
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => { if (user && canvasRef.current) sigPad.current = new SignaturePad(canvasRef.current); }, [user]);

      const compressImage = (file) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_W = 280; const scale = MAX_W / img.width;
              canvas.width = MAX_W; canvas.height = img.height * scale;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', 0.15));
            };
          };
        });
      };

      const handlePhotoAction = async (id, e, isExtra = false, branchKey = "", noteIndex = 0) => {
        const file = e.target.files[0]; if (!file) return;
        const compressed = await compressImage(file);
        if (isExtra) {
            setExtraNotes(prev => ({
                ...prev, [branchKey]: { ...prev[branchKey], [noteIndex]: {
                ...prev[branchKey]?.[noteIndex], imgs: [...(prev[branchKey]?.[noteIndex]?.imgs || []), compressed].slice(0, 3) } }
            }));
        } else {
            setPhotos(prev => ({...prev, [id]: [...(prev[id] || []), compressed].slice(0, 3)}));
        }
      };

      const generateNotesPDF = () => {
          const timestamp = new Date().toLocaleString('en-GB');
          let content = branchesList.map(b => {
              let branchContent = [1, 2, 3].map(i => {
                  const data = extraNotes[b]?.[i] || { text: "", imgs: [] };
                  if (!data.text && data.imgs.length === 0) return "";
                  return `<div style="padding:10px; border-bottom:1px solid #eee; page-break-inside:avoid;"><p style="font-weight:bold;">ملاحظة ${i}:</p><p>${data.text || ""}</p><div style="margin-top:5px;">${data.imgs.map(img => `<img src="${img}" style="width:150px; height:120px; object-fit:cover; margin:5px; border-radius:8px;"/>`).join('')}</div></div>`;
              }).join('');
              return `<div style="margin-top:20px; border-right:8px solid #d1ba89; background:#f0fdf4; padding:10px; font-weight:900;">فرع: ${b}</div>${branchContent || '<p style="padding:10px; color:#999;">لا توجد ملاحظات</p>'}`;
          }).join('');
          const html = `<div style="width:750px; margin:0 auto; padding:40px; direction:rtl; text-align:right; font-family:sans-serif;"><div style="text-align:center; border-bottom:4px solid #004b47; padding-bottom:15px;"><img src="${LOGO_URL}" style="height:80px;"/><h1 style="color:#004b47; font-size:24px; font-weight:900;">سجل ملاحظات الفروع الموحد</h1><p>التاريخ: ${timestamp}</p></div>${content}</div>`;
          html2pdf().from(html).set({ margin:10, filename:`Notes_${Date.now()}.pdf`, image:{type:'jpeg', quality:0.98}, html2canvas:{scale:2}, jsPDF:{format:'a4'} }).save();
      };

      const getScore = () => {
        const vals = Object.values(answers);
        const yes = vals.filter(v => v === 'yes').length;
        const total = vals.filter(v => v !== 'na' && v !== undefined).length;
        return total > 0 ? Math.round((yes / total) * 100) : 0;
      };

      const handleFinalSubmit = async () => {
          if(!branch) return alert("اختر الفرع");
          if(submitting) return; setSubmitting(true);
          const score = getScore(); const reportId = Date.now().toString();
          try {
              const photoEntries = Object.entries(photos);
              const mid = Math.ceil(photoEntries.length / 2);
              const p1 = Object.fromEntries(photoEntries.slice(0, mid));
              const p2 = Object.fromEntries(photoEntries.slice(mid));
              await db.collection("inspections").doc(reportId).set({
                  branch, score, inspector: user.email, date: new Date().toLocaleString('en-GB'), timestamp: Date.now(),
                  signature: sigPad.current ? sigPad.current.toDataURL() : "", answers, notes, photos: p1, type: "Branch Report", hasExtra: true
              });
              await db.collection("inspection_attachments").doc(reportId).set({ reportId, photos: p2 });
              alert("✅ تم الإرسال بنجاح!"); window.location.reload();
          } catch (e) { alert("⚠️ خطأ في الإرسال"); } finally { setSubmitting(false); }
      };

      if (loading) return <div className="h-screen flex items-center justify-center font-bold text-[#004b47] animate-pulse uppercase">Verra Pro Loading...</div>;
      if (!user) return <div className="p-20 text-center font-bold">يرجى تسجيل الدخول.</div>;

      if (view === "notes") {
          return (
            <div className="min-h-screen bg-gray-50 pb-20 text-right">
                <div className="verra-gradient p-8 text-center text-white sticky top-0 z-[110] shadow-lg">
                    <div className="flex justify-between items-center max-w-2xl mx-auto">
                        <button onClick={() => setView('main')} className="bg-white/20 p-2 rounded-xl text-xs font-bold">← رجوع</button>
                        <h2 className="font-black text-lg">الملاحظات العامة</h2>
                        <button onClick={generateNotesPDF} className="bg-[#d1ba89] text-[#004b47] px-4 py-2 rounded-xl text-xs font-black shadow-sm">تحميل PDF 📄</button>
                    </div>
                </div>
                <main className="p-5 max-w-2xl mx-auto space-y-8">
                    {branchesList.map(b => (
                        <div key={b} className="bg-white rounded-3xl shadow-md overflow-hidden border border-gray-100">
                            <div className="bg-[#e8f5ee] p-4 border-r-8 border-[#d1ba89] font-black text-[#004b47]">{b}</div>
                            <div className="p-4 space-y-6">
                                {[1, 2, 3].map(i => (
                                    <div key={i} className="border-b border-gray-50 pb-4 last:border-0">
                                        <textarea className="notes-input w-full p-3 rounded-xl border border-gray-200 text-sm mb-3" placeholder={`اكتب ملاحظة ${i} هنا...`}
                                            value={extraNotes[b]?.[i]?.text || ""} onChange={e => setExtraNotes({...extraNotes, [b]: {...extraNotes[b], [i]: {...extraNotes[b]?.[i], text: e.target.value}}})} />
                                        <div className="flex flex-wrap gap-2 items-center justify-end">
                                            <div className="flex gap-1 mr-auto">{(extraNotes[b]?.[i]?.imgs || []).map((img, ix) => ( <img key={ix} src={img} className="w-12 h-12 object-cover rounded-lg border shadow-sm" /> ))}</div>
                                            <label className="upload-btn bg-green-50 text-green-700 border-green-100">📷 كاميرا<input type="file" className="hidden" accept="image/*" capture="environment" onChange={e => handlePhotoAction(0, e, true, b, i)} /></label>
                                            <label className="upload-btn">🖼️ معرض<input type="file" className="hidden" accept="image/*" onChange={e => handlePhotoAction(0, e, true, b, i)} /></label>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ))}
                </main>
            </div>
          );
      }

      return (
        <div className="pb-40 text-right">
          <div className="verra-gradient p-10 text-center shadow-xl rounded-b-[3rem]">
            <img src={LOGO_URL} className="h-24 mx-auto mb-4" />
            <div className="flex flex-col items-center gap-3 text-white">
                <span className="bg-white/10 px-4 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest">👤 {user.email}</span>
                <div className="flex gap-2">
                    <button onClick={() => setView('notes')} className="nav-btn notes-page-btn">📝 الملاحظات العامة</button>
                    <button onClick={() => auth.signOut()} className="nav-btn logout-btn">خروج ↪</button>
                </div>
            </div>
          </div>
          <div className="sticky-header flex justify-between items-center shadow-md">
            <div className="text-right">
                <p className="text-[10px] font-bold text-gray-400 uppercase leading-none">Overall Score</p>
                <p className="text-3xl font-black text-green-700 mt-1">{getScore()}%</p>
            </div>
            <button onClick={handleFinalSubmit} disabled={submitting} className="verra-gradient text-white px-8 py-3 rounded-2xl font-black shadow-lg">إرسال التقرير اليومي</button>
          </div>
          <main className="p-5 max-w-2xl mx-auto space-y-6">
            <div className="item-card p-6 border-r-[10px] border-[#004b47] shadow-xl"><select className="w-full text-xl font-black bg-transparent outline-none" value={branch} onChange={e=>setBranch(e.target.value)}><option value="">-- اختر الفرع للتفتيش اليومي --</option>{branches.map(b => <option key={b} value={b}>{b}</option>)}</select></div>
            {sectionsData.map(sec => (
              <div key={sec.title}>
                <div className="section-title text-lg">{sec.title}</div>
                {sec.items.map(i => (
                  <div key={i.id} className="item-card shadow-sm">
                    <p className="font-bold text-gray-800 mb-4 leading-relaxed whitespace-pre-line">{i.q}</p>
                    <div className="flex gap-2 justify-end mb-4">
                      <button onClick={()=>setAnswers({...answers, [i.id]:'yes'})} className={`ans-btn ${answers[i.id]==='yes'?'active btn-yes':''}`}>نعم</button>
                      <button onClick={()=>setAnswers({...answers, [i.id]:'no'})} className={`ans-btn ${answers[i.id]==='no'?'active btn-no':''}`}>لا</button>
                      <button onClick={()=>setAnswers({...answers, [i.id]:'na'})} className={`ans-btn ${answers[i.id]==='na'?'active btn-na':''}`}>N/A</button>
                    </div>
                    <textarea className="notes-input text-right" placeholder="ملاحظات..." value={notes[i.id]||""} onChange={e=>setNotes({...notes, [i.id]:e.target.value})} />
                    <div className="mt-4 flex flex-wrap gap-2 items-center justify-end">
                        <div className="flex gap-1 mr-auto">{(photos[i.id] || []).map((img, idx) => ( <img key={idx} src={img} className="photo-thumb" /> ))}</div>
                        <label className="upload-btn active:scale-95 bg-green-50 border-green-100 text-green-700 shadow-sm">📷 كاميرا<input type="file" className="hidden" accept="image/*" capture="environment" onChange={e => handlePhotoAction(i.id, e)} /></label>
                        <label className="upload-btn active:scale-95 shadow-sm">🖼️ معرض<input type="file" className="hidden" accept="image/*" onChange={e => handlePhotoAction(i.id, e)} /></label>
                    </div>
                  </div>
                ))}
              </div>
            ))}
            <div className="item-card p-10 border-2 border-dashed border-gray-300 text-center shadow-inner text-right"><h3 className="font-black text-green-900 mb-4 text-center">توقيع المسؤول المعتمد</h3><canvas ref={canvasRef} className="w-full h-40 bg-gray-50 rounded-2xl border shadow-inner"></canvas><button onClick={()=>sigPad.current.clear()} className="text-red-500 text-xs mt-3 underline font-bold">مسح التوقيع</button></div>
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
