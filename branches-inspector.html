<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام VERRA PRO - إشراف الفروع</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
    .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    .section-title { background: #e8f5ee; border-right: 8px solid #d1ba89; padding: 12px; border-radius: 10px; font-weight: 900; color: #004b47; margin: 20px 0 10px; cursor: pointer; }
    .item-card { background: white; border-radius: 15px; padding: 18px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
    .ans-btn { width: 60px; height: 40px; border-radius: 8px; font-weight: 700; font-size: 10px; background: #f1f5f9; border: 1px solid #e2e8f0; transition: 0.2s; }
    .btn-yes.active { background: #10b981 !important; color: white; border-color: #059669; }
    .btn-no.active { background: #ef4444 !important; color: white; border-color: #dc2626; }
    .btn-na.active { background: #64748b !important; color: white; }
    .notes-input { width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid #d1ba89; background: #fffdf5; font-size: 13px; outline: none; }
    .photo-thumb { width: 65px; height: 65px; object-fit: cover; border-radius: 10px; border: 2px solid white; shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .del-img { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; z-index: 50; }
    .upload-btn { background: #f8fafc; color: #475569; padding: 10px 14px; border-radius: 12px; font-size: 11px; font-weight: bold; cursor: pointer; border: 1px solid #e2e8f0; display: inline-flex; align-items: center; gap: 6px; }
    .sticky-header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.98); backdrop-filter: blur(10px); border-bottom: 2px solid #004b47; padding: 12px 15px; }
    .nav-btn { padding: 5px 14px; border-radius: 8px; font-size: 10px; font-weight: bold; transition: 0.3s; display: inline-flex; align-items: center; gap: 5px; }
    .logout-btn { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
    .home-btn { background: rgba(209, 186, 137, 0.2); color: #d1ba89; border: 1px solid rgba(209, 186, 137, 0.4); }
    .preview-btn { background: #d1ba89 !important; color: #004b47 !important; font-weight: 900 !important; }
  </style>
</head>
<body class="text-right">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const firebaseConfig = {
      apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
      authDomain: "verra-system-828f2.firebaseapp.com",
      projectId: "verra-system-828f2",
      storageBucket: "verra-system-828f2.firebasestorage.app",
      messagingSenderId: "961104891607",
      appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";
    const ADMIN_EMAIL = "ch3f.ramzi@gmail.com";

    const sectionsData = [
      { 
        title: "الواجهة والصالات | Front & Lounge", 
        items: [
          {id:1, q:"check the restaurant front section (restaurant front + entrance floor + thermometer + air curtain)\nتشيك قسم واجهة المطعم ( نظافة واجهة المطعم + أرضية المدخل + الستارة القماش + الستارة الهوائية + تشيك على اللوحة بداية ونهاية الدوام )"},
          {id:2, q:"Check lounge section 1 (tables + Chairs + walls and floor + air conditioning)\nتشيك قسم صالة 1 ( طاولات + كراسي + جدران و الأرضية + تكيف + مكينة المعطر + طفايات )"},
          {id:3, q:"check bathroom hall 1 (general cleaning + tissue machine + soap machine + perfume machine)\nتشيك الحمام صالة 1 ( نظافة عامة + مكينة المناديل + مكينة الصابون + مكينة المعطر + متابعة جدول النظافة )"},
          {id:8, q:"Check lounge section 2 (tables + Chairs + walls and floor + air conditioning)\nتشيك قسم صالة 2 ( طاولات + كراسي + جدران والأرضية + تكيف + طفايات )"},
          {id:9, q:"check bathroom hall 2 (general cleaning + tissue machine + soap machine + perfume machine)\nتشيك الحمام صالة 2 ( نظافة عامة + مكينة المناديل + مكينة الصابون + مكينة المعطر + متابعة جدول النظافة )"}
        ]
      },
      { 
        title: "قسم الإدارة والتشغيل | Admin & Operation", 
        items: [
          {id:4, q:"checks, the cashier department (net + phone + cashier + applications)\nتشيك قسم الكاشير ( نت + تلفون + متابعة عهدة الكاشير + تشيك على نظام فودو في الكاشير + التشيك على نظاف فيد اس + متابعة الدوامات في مواقع التطبيقات )"},
          {id:5, q:"Monitor and Google Maps.\n( متابعة قوقل ماب )"},
          {id:10, q:"Check and monitor all plants/trees in the branch, if available.\n( تشيك على الأشجار ومتابعتها بالكامل ان وجد في الفرع . )"},
          {id:16, q:"Check attendance and leave تشيك ( كشف الحضور )"},
          {id:17, q:"Has a meeting been conducted with all employees today?\n( هل تم الاجتماع مع جميع الموظفين اليوم )"},
          {id:18, q:"Follow-up on branch supervisors' daily tasks\nمتابعة مهام مشرفين الفروع"}
        ]
      },
      { 
        title: "الإنتاج والمخزون | Production & Store", 
        items: [
          {id:6, q:"Check the juices section (mixers + Pepsi machine + gas tube + chiller + dates)\nتشيك قسم العصائر ( تشيك الخلاطات + نظافة مكينة البيبسي + كراتين التابعة للمكينة مع الغاز + ثلاجة العصائر + تواريخ )"},
          {id:7, q:"Check the store section (elevator + store arrangement + cleaning + stacking + date control + store under the stairs)\nتشيك قسم المستودع ( المصعد + ترتيب المستودع + نظافة + التكديس + مراقبة التواريخ + مستودع تحت الدرج مكة )"},
          {id:11, q:"Check Restaurant, back side (general cleaning + air curtains)\nتشيك القسم الخلفي للمطعم ( نظافة عامة + ستاير هوائية + الغاز )"},
          {id:13, q:"Send orders according to schedule\nرفع الطلبات حسب الجدول"},
          {id:14, q:"check requests\nتشيك الطلبات"}
        ]
      },
      { 
        title: "العمال والمرافق | Staff & Facilities", 
        items: [
          {id:12, q:"Check the employees (personal hygiene * uniform hygiene * nails * smell * health certificate * masks * gloves * harnet)\nتشيك العمال ( النظافة الشخصية * نظافة اليونفرم * اظافر * ريحة * كرت البلدية * الكمام * قلفزات * هرنت )"},
          {id:15, q:"General check (sanitary facilities + all lamps + tiles + Damaged or broken equipment + Damaged or broken tools)\nتشيك عام ( مرافق صحية + جميع اللمبات + البلاط + المكاين الخربانة او المكسرة + أدوات الخربانة او المكسرة )"}
        ]
      }
    ];

    function App() {
      const [user, setUser] = useState(null);
      const [userRole, setUserRole] = useState("");
      const [loading, setLoading] = useState(true);
      const [submitting, setSubmitting] = useState(false);
      const [branch, setBranch] = useState("");
      const [branches, setBranches] = useState([]);
      const [answers, setAnswers] = useState({});
      const [notes, setNotes] = useState({});
      const [photos, setPhotos] = useState({});
      const [expanded, setExpanded] = useState(new Set([sectionsData[0].title]));
      const canvasRef = useRef(null);
      const sigPad = useRef(null);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(async u => {
            if (u) {
                const uEmail = u.email.toLowerCase().trim();
                const authSnap = await db.collection("authorized_users").where("email", "==", uEmail).get();
                if (uEmail === ADMIN_EMAIL || !authSnap.empty) {
                    const role = uEmail === ADMIN_EMAIL ? 'admin' : authSnap.docs[0].data().role;
                    setUserRole(role);
                    if (role === 'admin' || role === 'supervisor') {
                        setUser(u);
                        db.collection("branches").orderBy("name").onSnapshot(snap => setBranches(snap.docs.map(d => d.data().name)));
                    } else {
                        window.location.href = "index.html";
                    }
                } else { auth.signOut(); }
            } else { setUser(null); }
            setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => { if (user && canvasRef.current) sigPad.current = new SignaturePad(canvasRef.current); }, [user]);

      const compressExtreme = (file) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_W = 280; const scale = MAX_W / img.width;
              canvas.width = MAX_W; canvas.height = img.height * scale;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', 0.15));
            };
          };
        });
      };

      const handlePhotoAction = async (id, e) => {
        const file = e.target.files[0]; if (!file) return;
        const compressed = await compressExtreme(file);
        setPhotos(prev => ({...prev, [id]: [...(prev[id] || []), compressed].slice(0, 3)}));
      };

      const getScore = () => {
        const vals = Object.values(answers);
        const yes = vals.filter(v => v === 'yes').length;
        const total = vals.filter(v => v !== 'na' && v !== undefined).length;
        return total > 0 ? Math.round((yes / total) * 100) : 0;
      };

      const handlePreview = () => {
        if (!branch) return alert("اختر المنشأة أولاً");
        const score = getScore();
        const signatureImg = sigPad.current && !sigPad.current.isEmpty() ? sigPad.current.toDataURL() : "";
        const timestamp = new Date().toLocaleString('en-GB', { hour12: true });

        let reportContent = sectionsData.map(sec => {
          let items = sec.items.map(i => {
            const ans = answers[i.id]; const note = notes[i.id] || ""; const pics = photos[i.id] || [];
            let statusColor = ans === 'yes' ? '#1C780B' : ans === 'no' ? '#D91414' : '#64748b';
            let statusText = ans === 'yes' ? 'مطابق ✅' : ans === 'no' ? 'مخالفة ❌' : 'غير متوفر';
            return `
              <div style="padding: 15px; border-bottom: 1px solid #f1f5f9; text-align: right; page-break-inside: avoid; display: block; clear: both; width: 100%;">
                <div style="font-weight: 900; font-size: 14px; color: #1e293b; direction: rtl; text-align: right; line-height: 1.6; margin-bottom: 10px;">${i.q.replace(/\n/g, '<br>')}</div>
                <div style="margin-bottom: 15px;"><span style="font-size: 12px; color: ${statusColor}; font-weight: bold; background: ${statusColor}10; padding: 4px 12px; border-radius: 6px;">الحالة: ${statusText}</span></div>
                ${note ? `<div style="background: #fff9e6; padding: 8px; border-radius: 8px; font-size: 11px; border: 1px solid #fde68a; margin-bottom: 10px; color: #92400e;">الملاحظة: ${note}</div>` : ""}
                <div style="width: 100%; display: block; text-align: right; clear: both;">
                    ${pics.map(p => `<div style="display: inline-block; width: 30%; margin-left: 1%; margin-bottom: 10px; vertical-align: top;"><img src="${p}" style="width: 100%; height: 180px; object-fit: cover; border-radius: 12px; border: 2px solid #eee; display: block;" /></div>`).join('')}
                </div>
              </div>`;
          }).join("");
          return `<div style="page-break-inside: avoid; clear: both;"><div style="background: #f0fdf4; padding: 12px 20px; border-right: 10px solid #d1ba89; color: #004b47; font-weight: 900; margin-top: 30px; text-align: right; font-size: 18px;">${sec.title}</div>${items}</div>`;
        }).join("");

        const html = `
          <div style="width: 800px; margin: 0 auto; padding: 45px; background: white; direction: rtl; text-align: right; box-sizing: border-box; font-family: sans-serif;">
            <div style="text-align: center; margin-bottom: 30px;">
                <img src="${LOGO_URL}" style="height: 100px; margin-bottom: 15px;" />
                <div style="color: #004b47; font-size: 32px; font-weight: 900; border-bottom: 5px solid #d1ba89; display: inline-block; padding-bottom: 8px;">تقرير إشراف الفروع الرسمي</div>
            </div>
            <div style="background: #f8fafc; padding: 25px; border-radius: 20px; border: 1px solid #e2e8f0; margin-bottom: 40px; display: table; width: 100%;">
                <div style="display: table-cell; width: 70%; line-height: 2.2; vertical-align: middle;">
                    <p style="margin:0;"><b>🏢 المنشأة:</b> ${branch}</p>
                    <p style="margin:0;"><b>👤 المسؤول:</b> ${user.email}</p>
                    <p style="margin:0;"><b>📅 التاريخ:</b> ${timestamp}</p>
                </div>
                <div style="display: table-cell; width: 30%; text-align: center; border-right: 4px solid #004b47; vertical-align: middle;">
                    <p style="font-size: 14px; font-weight: 900; color: #64748b;">الامتثال</p>
                    <div style="font-size: 50px; font-weight: 900; color: ${score >= 70 ? '#1C780B':'#D91414'}">${score}%</div>
                </div>
            </div>
            ${reportContent}
            <div style="margin-top: 60px; border-top: 3px solid #eee; padding-top: 30px; page-break-inside: avoid;">
                <p style="font-weight: 900; color: #004b47; font-size: 20px; margin-bottom: 20px;">توقيع المشرف المعتمد:</p>
                <div style="background: #fafafa; padding: 15px; border-radius: 20px; display: inline-block; border: 1px solid #f1f5f9;"><img src="${signatureImg}" style="width: 350px; height: 130px; object-fit: contain; display: block;" /></div>
            </div>
          </div>`;

        html2pdf().from(html).set({ margin:10, filename:`Report_Branches_${branch}.pdf`, image:{type:'jpeg', quality:1.0}, html2canvas:{scale:2, useCORS:true}, jsPDF:{unit:'mm', format:'a4', orientation:'portrait'} }).save();
      };

      const handleFinalSubmit = async () => {
          if(!branch) return alert("اختر المنشأة أولاً");
          if(submitting) return; setSubmitting(true);
          const score = getScore(); const reportId = Date.now().toString(); const timestampStr = new Date().toLocaleString('en-GB', { hour12: true });

          try {
              const photoEntries = Object.entries(photos);
              const mid = Math.ceil(photoEntries.length / 2);
              const part1 = Object.fromEntries(photoEntries.slice(0, mid));
              const part2 = Object.fromEntries(photoEntries.slice(mid));

              await db.collection("inspections").doc(reportId).set({
                  branch, score, inspector: user.email, date: timestampStr, timestamp: Date.now(), isCrit: score < 70, signature: sigPad.current ? sigPad.current.toDataURL() : "", answers, notes, photos: part1, type: "Branch Report", hasExtra: true
              });
              await db.collection("inspection_attachments").doc(reportId).set({ reportId, photos: part2 });
              alert("✅ تم الإرسال والمزامنة بنجاح!"); window.location.reload();
          } catch (e) { alert("⚠️ خطأ في الإرسال: " + e.message); } 
          finally { setSubmitting(false); }
      };

      if (loading) return <div className="h-screen flex items-center justify-center font-bold text-[#004b47] animate-pulse">جاري التحقق...</div>;
      if (!user) return <div className="p-20 text-center font-bold">يرجى تسجيل الدخول.</div>;

      return (
        <div className="pb-40 text-right">
          <div className="verra-gradient p-10 text-center shadow-xl rounded-b-[3rem]">
            <img src={LOGO_URL} className="h-24 mx-auto mb-4" />
            <div className="flex flex-col items-center gap-3">
                <span className="bg-white/10 px-4 py-1 rounded-full text-[10px] text-white font-bold">👤 {user.email}</span>
                <div className="flex gap-2">
                    {userRole === 'admin' && <button onClick={() => window.location.href='admin.html'} className="nav-btn home-btn">🏠 الرئيسية</button>}
                    <button onClick={() => auth.signOut()} className="nav-btn logout-btn">خروج ↪</button>
                </div>
            </div>
          </div>

          <div className="sticky-header flex justify-between items-center shadow-md text-right">
            <div className="text-right">
                <p className="text-[10px] font-bold text-gray-400 uppercase leading-none text-right">Score</p>
                <p className="text-3xl font-black text-green-700 mt-1 text-right">{getScore()}%</p>
            </div>
            <div className="flex gap-2">
                <button onClick={handlePreview} className="nav-btn preview-btn bg-[#d1ba89] text-[#004b47] px-4 py-2 rounded-xl">معاينة</button>
                <button onClick={handleFinalSubmit} disabled={submitting} className={`${submitting ? 'bg-gray-400':'verra-gradient'} text-white px-5 py-2 rounded-xl font-black shadow-lg text-xs`}>{submitting ? 'جاري...' : 'إرسال'}</button>
            </div>
          </div>

          <main className="p-5 max-w-3xl mx-auto space-y-6">
            <div className="item-card p-6 border-r-[10px] border-[#004b47] shadow-xl">
                <select className="w-full text-xl font-black bg-transparent text-right outline-none" value={branch} onChange={e=>setBranch(e.target.value)}>
                    <option value="">-- اختر الفرع --</option>
                    {branches.map(b => <option key={b} value={b}>{b}</option>)}
                </select>
            </div>

            {sectionsData.map(sec => (
              <div key={sec.title}>
                <div className="section-title flex justify-between items-center px-4" onClick={() => {
                  const n = new Set(expanded); n.has(sec.title) ? n.delete(sec.title) : n.add(sec.title); setExpanded(n);
                }}><span>{sec.title}</span><span>{expanded.has(sec.title) ? '▲' : '▼'}</span></div>
                {expanded.has(sec.title) && sec.items.map((i) => (
                  <div key={i.id} className="item-card shadow-md">
                    <p className="text-sm font-black text-green-950 mb-4 leading-relaxed text-right whitespace-pre-line">{i.q}</p>
                    <div className="flex gap-2 justify-end mb-4">
                      <button onClick={()=>setAnswers({...answers, [i.id]:'yes'})} className={`ans-btn ${answers[i.id]==='yes'?'active btn-yes':''}`}>نعم</button>
                      <button onClick={()=>setAnswers({...answers, [i.id]:'no'})} className={`ans-btn ${answers[i.id]==='no'?'active btn-no':''}`}>لا</button>
                      <button onClick={()=>setAnswers({...answers, [i.id]:'na'})} className={`ans-btn ${answers[i.id]==='na'?'active btn-na':''}`}>N/A</button>
                    </div>
                    <textarea className="notes-input text-right" placeholder="ملاحظات إضافية..." value={notes[i.id]||""} onChange={e=>setNotes({...notes, [i.id]:e.target.value})} />
                    
                    <div className="mt-4 flex flex-wrap gap-2 items-center justify-end">
                        <div className="flex gap-1 mr-auto">
                            {(photos[i.id] || []).map((img, idx) => (
                                <div key={idx} className="relative">
                                    <img src={img} className="photo-thumb shadow-sm" />
                                    <div className="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-4 h-4 text-[8px] flex items-center justify-center shadow-md" onClick={()=>setPhotos({...photos, [i.id]: photos[i.id].filter((_,x)=>x!==idx)})}>×</div>
                                </div>
                            ))}
                        </div>
                        <label className="upload-btn active:scale-95 bg-green-50 border-green-200 text-green-700 shadow-sm">
                            📷 كاميرا
                            <input type="file" className="hidden" accept="image/*" capture="environment" onChange={e => handlePhotoAction(i.id, e)} />
                        </label>
                        <label className="upload-btn active:scale-95 shadow-sm">
                            🖼️ معرض
                            <input type="file" className="hidden" accept="image/*" onChange={e => handlePhotoAction(i.id, e)} />
                        </label>
                    </div>
                  </div>
                ))}
              </div>
            ))}
            <div className="item-card p-10 border-2 border-dashed border-gray-300 text-center shadow-inner text-right">
                <h3 className="font-black text-green-900 mb-4 text-center underline decoration-[#d1ba89]">توقيع المشرف المعتمد</h3>
                <canvas ref={canvasRef} className="sig-canvas w-full h-40 bg-gray-50 rounded-2xl border shadow-inner"></canvas>
                <button onClick={()=>sigPad.current.clear()} className="text-red-500 text-xs mt-3 underline font-bold">مسح التوقيع</button>
            </div>
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
