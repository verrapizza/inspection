<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VERRA PRO - إشراف الفروع</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
    .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    .section-title { background: #e8f5ee; border-right: 8px solid #d1ba89; padding: 12px; border-radius: 10px; font-weight: 900; color: #004b47; margin: 20px 0 10px; cursor: pointer; }
    .item-card { background: white; border-radius: 15px; padding: 18px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
    .ans-btn { width: 55px; height: 40px; border-radius: 8px; font-weight: 700; font-size: 10px; background: #f1f5f9; border: 1px solid #e2e8f0; }
    .btn-yes.active { background: #10b981 !important; color: white; }
    .btn-no.active { background: #ef4444 !important; color: white; }
    .btn-na.active { background: #64748b !important; color: white; }
    .notes-input { width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid #d1ba89; background: #fffdf5; font-size: 13px; outline: none; text-align: right; }
    .photo-thumb { width: 65px; height: 65px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
    .del-img { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; z-index: 50; cursor: pointer; }
    .upload-btn { background: #e8f5ee; color: #004b47; padding: 8px 12px; border-radius: 10px; font-size: 10px; font-weight: bold; cursor: pointer; border: 1px solid #c8ddd3; display: inline-flex; align-items: center; gap: 4px; }
    .sticky-header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.98); backdrop-filter: blur(10px); border-bottom: 2px solid #004b47; padding: 12px 15px; }
  </style>
</head>
<body class="text-right">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const firebaseConfig = {
      apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
      authDomain: "verra-system-828f2.firebaseapp.com",
      projectId: "verra-system-828f2",
      storageBucket: "verra-system-828f2.firebasestorage.app",
      messagingSenderId: "961104891607",
      appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";
    const ADMIN_EMAIL = "ch3f.ramzi@gmail.com";

    const sectionsData = [
      { 
        title: "الواجهة والصالات | Front & Lounge", 
        items: [
          {id:1, q:"تشيك واجهة المطعم والمدخل والستائر واللوحة"},
          {id:2, q:"تشيك صالة 1 (طاولات، كراسي، تكييف، معطر)"},
          {id:3, q:"تشيك حمام صالة 1 (نظافة، صابون، مناديل)"},
          {id:8, q:"تشيك صالة 2 (طاولات، كراسي، تكييف)"},
          {id:9, q:"تشيك حمام صالة 2 (نظافة عامة)"}
        ]
      },
      { 
        title: "قسم الإدارة والتشغيل | Admin & Operation", 
        items: [
          {id:4, q:"تشيك الكاشير والأنظمة وتطبيقات التوصيل"},
          {id:5, q:"متابعة قوقل ماب"},
          {id:10, q:"تشيك الأشجار والنباتات"},
          {id:16, q:"كشف الحضور والانصراف"},
          {id:17, q:"الاجتماع اليومي بالموظفين"},
          {id:18, q:"متابعة مهام المشرفين"}
        ]
      },
      { 
        title: "الإنتاج والمخزون | Production & Store", 
        items: [
          {id:6, q:"تشيك قسم العصائر والمكائن والتواريخ"},
          {id:7, q:"تشيك المستودع والترتيب والنظافة"},
          {id:11, q:"تشيك القسم الخلفي والغاز والستائر الهوائية"},
          {id:13, q:"رفع الطلبات حسب الجدول"},
          {id:14, q:"تشيك الطلبات المستلمة"}
        ]
      },
      { 
        title: "العمال والمرافق | Staff & Facilities", 
        items: [
          {id:12, q:"تشيك نظافة العمال والزي الرسمي والشهادات الصحية"},
          {id:15, q:"تشيك المرافق واللمبات والمعدات الخربانة"}
        ]
      }
    ];

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [branch, setBranch] = useState("");
      const [branches, setBranches] = useState([]);
      const [answers, setAnswers] = useState({});
      const [notes, setNotes] = useState({});
      const [photos, setPhotos] = useState({});
      const [submitting, setSubmitting] = useState(false);
      const [expanded, setExpanded] = useState(new Set([sectionsData[0].title]));
      const canvasRef = useRef(null);
      const sigPad = useRef(null);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(async u => {
            if (u) { setUser(u); db.collection("branches").orderBy("name").onSnapshot(s => setBranches(s.docs.map(d => d.data().name))); }
            setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => { if (user && canvasRef.current) sigPad.current = new SignaturePad(canvasRef.current); }, [user]);

      const compressImage = (file) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_W = 180; 
              const scale = MAX_W / img.width;
              canvas.width = MAX_W; canvas.height = img.height * scale;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', 0.1)); 
            };
          };
        });
      };

      const handlePhoto = async (id, e) => {
        const file = e.target.files[0]; if (!file) return;
        const compressed = await compressImage(file);
        setPhotos(prev => ({...prev, [id]: [...(prev[id] || []), compressed]}));
      };

      const generatePDF = () => {
        if (!branch) return alert("اختر المنشأة");
        const score = Object.values(answers).filter(v => v === 'yes').length / (Object.values(answers).filter(v => v !== 'na').length || 1) * 100;
        const signatureImg = sigPad.current ? sigPad.current.toDataURL() : "";
        const timestamp = new Date().toLocaleString('en-GB');

        let rowsHTML = "";
        sectionsData.forEach(sec => {
          const answered = sec.items.filter(i => answers[i.id]);
          if (answered.length > 0) {
            rowsHTML += `<tr><td colspan="2" style="background:#f0fdf4; padding:10px; font-weight:bold; color:#004b47; border:1px solid #ddd;">${sec.title}</td></tr>`;
            answered.forEach(i => {
              const ans = answers[i.id];
              const note = notes[i.id] || "";
              const pics = photos[i.id] || [];
              rowsHTML += `
                <tr>
                  <td colspan="2" style="padding:15px; border:1px solid #eee; page-break-inside:avoid;">
                    <div style="font-weight:bold; font-size:13px; margin-bottom:5px;">${i.q}</div>
                    <div style="color:${ans==='yes'?'#1C780B':'#D91414'}; font-weight:bold; font-size:11px; margin-bottom:5px;">الحالة: ${ans==='yes'?'مطابق ✅':'مخالفة ❌'}</div>
                    ${note ? `<div style="background:#fff9e6; padding:8px; font-size:10px; border-radius:5px; margin-bottom:10px;">${note}</div>` : ""}
                    <div style="width:100%;">
                      ${pics.map(p => `<img src="${p}" style="width:30%; height:120px; object-fit:cover; margin:1%; border-radius:5px; border:1px solid #ddd;" />`).join('')}
                    </div>
                  </td>
                </tr>`;
            });
          }
        });

        const template = `
          <div style="width:700px; margin:0 auto; padding:20px; background:white; direction:rtl; text-align:right; font-family:sans-serif;">
            <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
              <tr>
                <td style="text-align:right;"><h1 style="color:#004b47; font-size:24px; margin:0;">تقرير إشراف الفروع الرسمي</h1></td>
                <td style="text-align:left;"><img src="${LOGO_URL}" style="height:60px;" /></td>
              </tr>
            </table>
            <table style="width:100%; border-collapse:collapse; background:#f8fafc; border:1px solid #ddd; margin-bottom:20px;">
              <tr>
                <td style="padding:15px; width:70%; line-height:1.8;">
                  <b>🏢 المنشأة:</b> ${branch}<br/>
                  <b>👤 المسؤول:</b> ${user.email}<br/>
                  <b>📅 التاريخ:</b> ${timestamp}
                </td>
                <td style="width:30%; text-align:center; border-right:2px solid #004b47;">
                  <div style="font-size:12px; color:#64748b;">الالتزام</div>
                  <div style="font-size:40px; font-weight:bold; color:${score>=70?'#1C780B':'#D91414'};">${Math.round(score)}%</div>
                </td>
              </tr>
            </table>
            <table style="width:100%; border-collapse:collapse;">
              ${rowsHTML}
            </table>
            <div style="margin-top:40px; border-top:2px solid #004b47; padding-top:20px; page-break-inside:avoid;">
              <p style="font-weight:bold; color:#004b47;">التوقيع المعتمد:</p>
              <img src="${signatureImg}" style="width:200px; height:80px; object-fit:contain;" />
            </div>
          </div>`;

        const opt = { margin: 10, filename: `VERRA_Report_${branch}.pdf`, image: { type: 'jpeg', quality: 0.95 }, html2canvas: { scale: 1.0, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
        alert("جاري إنشاء التقرير الاحترافي...");
        html2pdf().from(template).set(opt).save();
      };

      const finalSubmit = async () => {
          if(!branch) return alert("اختر الفرع");
          setSubmitting(true);
          const reportId = Date.now().toString();
          try {
              const photoEntries = Object.entries(photos);
              const mid = Math.ceil(photoEntries.length / 2);
              await db.collection("inspections").doc(reportId).set({ 
                  branch, score: Math.round(Object.values(answers).filter(v => v === 'yes').length / (Object.values(answers).filter(v => v !== 'na').length || 1) * 100), 
                  inspector: user.email, date: new Date().toLocaleString('en-GB'), timestamp: Date.now(),
                  signature: sigPad.current ? sigPad.current.toDataURL() : "",
                  answers, notes, photos: Object.fromEntries(photoEntries.slice(0, mid)), type: "Branch Report", hasExtra: true
              });
              if (photoEntries.length > mid) await db.collection("inspection_attachments").doc(reportId).set({ reportId, photos: Object.fromEntries(photoEntries.slice(mid)) });
              alert("✅ تم الإرسال!"); window.location.reload();
          } catch (e) { alert("⚠️ خطأ"); }
          finally { setSubmitting(false); }
      };

      if (loading) return <div className="h-screen flex items-center justify-center font-bold">جاري التحميل...</div>;
      if (!user) return <Login auth={auth} logo={LOGO_URL} />;

      return (
        <div className="pb-40 text-right">
          <div className="verra-gradient p-10 text-center shadow-xl rounded-b-[4rem]">
            <img src={LOGO_URL} className="h-24 mx-auto mb-4" />
            <div className="text-white text-[10px] font-bold">{user.email}</div>
            <button onClick={() => auth.signOut()} className="bg-red-500/20 text-red-300 rounded px-4 py-1 text-[10px] mt-2">خروج</button>
          </div>

          <div className="sticky-header flex justify-between items-center shadow-lg">
            <div className="text-2xl font-black text-green-700">
                {Math.round(Object.values(answers).filter(v => v === 'yes').length / (Object.values(answers).filter(v => v !== 'na').length || 1) * 100)}%
            </div>
            <div className="flex gap-2">
                <button onClick={generatePDF} className="bg-[#d1ba89] text-[#004b47] px-4 py-2 rounded-xl font-bold text-xs shadow">PDF</button>
                <button onClick={finalSubmit} disabled={submitting} className="verra-gradient text-white px-5 py-2 rounded-xl font-bold text-xs shadow">إرسال</button>
            </div>
          </div>

          <main className="p-5 max-w-3xl mx-auto space-y-8 mt-4">
            <div className="item-card p-6 border-r-[15px] border-green-800 shadow-xl">
                <select className="w-full text-lg font-black outline-none bg-transparent" value={branch} onChange={e=>setBranch(e.target.value)}>
                    <option value="">-- اختر المنشأة --</option>
                    {branches.map(b => <option key={b} value={b}>{b}</option>)}
                </select>
            </div>

            {sectionsData.map(sec => (
              <div key={sec.title}>
                <div className="section-title flex justify-between items-center" onClick={() => { const n = new Set(expanded); n.has(sec.title) ? n.delete(sec.title) : n.add(sec.title); setExpanded(n); }}>
                  <span>{sec.title}</span>
                  <span className="text-[10px] font-bold">{expanded.has(sec.title) ? 'إخفاء' : 'عرض'}</span>
                </div>
                {expanded.has(sec.title) && sec.items.map((i) => (
                  <div key={i.id} className="item-card shadow-lg">
                    <p className="text-[13px] font-bold mb-4">{i.q}</p>
                    <div className="flex gap-2 justify-end mb-4">
                      <button onClick={()=>setAnswers({...answers, [i.id]:'yes'})} className={`ans-btn ${answers[i.id]==='yes'?'active btn-yes':''}`}>نعم</button>
                      <button onClick={()=>setAnswers({...answers, [i.id]:'no'})} className={`ans-btn ${answers[i.id]==='no'?'active btn-no':''}`}>لا</button>
                      <button onClick={()=>setAnswers({...answers, [i.id]:'na'})} className={`ans-btn ${answers[i.id]==='na'?'active btn-na':''}`}>N/A</button>
                    </div>
                    <textarea className="notes-input" placeholder="اكتب ملاحظة..." value={notes[i.id]||""} onChange={e=>setNotes({...notes, [i.id]:e.target.value})} />
                    <div className="mt-4 flex flex-wrap gap-2 items-center justify-end">
                        <label className="upload-btn">📷 إضافة صورة<input type="file" className="hidden" accept="image/*" onChange={e => handlePhoto(i.id, e)} /></label>
                        <div className="flex flex-wrap mr-auto">
                          {(photos[i.id] || []).map((img, px) => (
                            <div key={px} className="relative m-1"><img src={img} className="photo-thumb" /><div className="del-img" onClick={()=>setPhotos({...photos, [i.id]: photos[i.id].filter((_,x)=>x!==px)})}>×</div></div>
                          ))}
                        </div>
                    </div>
                  </div>
                ))}
              </div>
            ))}
            <div className="item-card p-10 border-2 border-dashed border-gray-300 text-center shadow-inner">
              <h3 className="font-bold text-green-900 mb-4 text-sm">توقيع المفتش</h3>
              <canvas ref={canvasRef} className="w-full h-40 border rounded-3xl bg-gray-50"></canvas>
              <button onClick={()=>sigPad.current.clear()} className="text-red-500 text-xs font-bold mt-4 underline">مسح</button>
            </div>
          </main>
        </div>
      );
    }

    function Login({ auth, logo }) {
      const [email, setEmail] = useState(""); const [pass, setPass] = useState("");
      return (
        <div className="h-screen verra-gradient flex items-center justify-center p-6 text-right">
           <form onSubmit={(e)=>{e.preventDefault(); auth.signInWithEmailAndPassword(email.trim(), pass).catch(()=>alert("خطأ"));}} className="bg-white p-12 rounded-[4rem] shadow-2xl w-full max-w-sm text-center">
              <img src={logo} className="h-20 mx-auto mb-10" />
              <input className="w-full border-2 p-4 rounded-xl mb-4 text-right" placeholder="الإيميل" value={email} onChange={v=>setEmail(v.target.value)} />
              <input className="w-full border-2 p-4 rounded-xl mb-8 text-right" type="password" placeholder="كلمة المرور" value={pass} onChange={v=>setPass(v.target.value)} />
              <button type="submit" className="w-full bg-[#004b47] text-white font-bold py-4 rounded-2xl">دخول</button>
           </form>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
