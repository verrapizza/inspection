<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام VERRA PRO - إشراف الفروع</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; color: #1e293b; margin: 0; padding: 0; }
    .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    .card { background: white; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    .section-title { background: #e8f5ee; border-right: 8px solid #d1ba89; padding: 12px; border-radius: 10px; font-weight: 900; color: #004b47; margin: 20px 0 10px; cursor: pointer; }
    .item-card { background: white; border-radius: 15px; padding: 18px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
    .ans-btn { width: 52px; height: 40px; border-radius: 8px; font-weight: 700; font-size: 11px; background: #f1f5f9; border: 1px solid #e2e8f0; transition: 0.2s; }
    .btn-yes.active { background: #10b981 !important; color: white; border-color: #059669; }
    .btn-no.active { background: #ef4444 !important; color: white; border-color: #dc2626; }
    .btn-na.active { background: #64748b !important; color: white; }
    .notes-input { width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid #d1ba89; background: #fffdf5; font-size: 13px; outline: none; }
    .photo-thumb { width: 75px; height: 75px; object-fit: cover; border-radius: 10px; border: 2px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .del-img { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 1px solid white; cursor: pointer; z-index: 50; }
    .upload-btn { background: #e8f5ee; color: #004b47; padding: 8px 15px; border-radius: 10px; font-size: 10px; font-weight: bold; cursor: pointer; border: 1px solid #c8ddd3; display: inline-flex; align-items: center; gap: 5px; }
    .upload-btn-gallery { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .sticky-header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.98); backdrop-filter: blur(10px); border-bottom: 2px solid #004b47; padding: 12px 15px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const firebaseConfig = {
      apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
      authDomain: "verra-system-828f2.firebaseapp.com",
      projectId: "verra-system-828f2",
      storageBucket: "verra-system-828f2.firebasestorage.app",
      messagingSenderId: "961104891607",
      appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";

    // البنود كما أرسلتها (عربي + إنجليزي)
    const sectionsData = [
      { 
        title: "قسم الواجهة والصالات | Front & Lounge", 
        items: [
          {id:1, q:"1. check the restaurant front section (restaurant front + entrance floor + thermometer + air curtain)\nتشيك قسم واجهة المطعم ( نظافة واجهة المطعم + أرضية المدخل + الستارة القماش + الستارة الهوائية + تشيك على اللوحة بداية ونهاية الدوام )"},
          {id:2, q:"2. Check lounge section 1 (tables + Chairs + walls and floor + air conditioning)\nتشيك قسم صالة 1 ( طاولات + كراسي + جدران و الأرضية + تكيف + مكينة المعطر + طفايات )"},
          {id:3, q:"3. check bathroom hall 1 (general cleaning + tissue machine + soap machine + perfume machine)\nتشيك الحمام صالة 1 ( نظافة عامة + مكينة المناديل + مكينة الصابون + مكينة المعطر + متابعة جدول النظافة )"},
          {id:4, q:"9. Check lounge section 2 (tables + Chairs + walls and floor + air conditioning)\nتشيك قسم صالة 2 ( طاولات + كراسي + جدران والأرضية + تكيف + طفايات )"},
          {id:5, q:"10. check bathroom hall 2 (general cleaning + tissue machine + soap machine + perfume machine)\nتشيك الحمام صالة 2 ( نظافة عامة + مكينة المناديل + مكينة الصابون + مكينة المعطر + متابعة جدول النظافة )"}
        ]
      },
      { 
        title: "قسم الإدارة والتشغيل | Admin & Operation", 
        items: [
          {id:6, q:"4.checks, the cashier department (net + phone + cashier + applications)\nتشيك قسم الكاشير ( نت + تلفون + متابعة عهدة الكاشير + تشيك على نظام فودو في الكاشير + التشيك على نظاف فيد اس + متابعة الدوامات في مواقع التطبيقات )"},
          {id:7, q:"6. Monitor and Google Maps.\n( متابعة قوقل ماب )"},
          {id:8, q:"11. Check and monitor all plants/trees in the branch, if available.\n( تشيك على الأشجار ومتابعتها بالكامل ان وجد في الفرع . )"},
          {id:9, q:"15. Check attendance and leave تشيك ( كشف الحضور )"},
          {id:10, q:"16. Has a meeting been conducted with all employees today?\n( هل تم الاجتماع مع جميع الموظفين اليوم )"},
          {id:11, q:"17. Follow-up on branch supervisors' daily tasks\nمتابعة مهام مشرفين الفروع"}
        ]
      },
      { 
        title: "الإنتاج والمخزون | Production & Store", 
        items: [
          {id:12, q:"7. Check the juices section (check the mixers + Clean the Pepsi machine + The keratin of the Pepsi machine with the gas tube + juice chiller + dates)\nتشيك قسم العصائر ( تشيك الخلاطات + نظافة مكينة البيبسي + كراتين التابعة للمكينة مع الغاز + ثلاجة العصائر + تواريخ )"},
          {id:13, q:"8. Check the store section (elevator + store arrangement + cleaning + stacking + date control + store under the stairs)\nتشيك قسم المستودع ( المصعد + ترتيب المستودع + نظافة + التكديس + مراقبة التواريخ + مستودع تحت الدرج مكة )"},
          {id:14, q:"12. Check Restaurant, back side (general cleaning + air curtains)\nتشيك القسم الخلفي للمطعم ( نظافة عامة + ستاير هوائية + الغاز )"},
          {id:15, q:"12. Send orders according to schedule\nرفع الطلبات حسب الجدول"},
          {id:16, q:"13. check requests\nتشيك الطلبات"}
        ]
      },
      { 
        title: "العمال والمرافق | Staff & Facilities", 
        items: [
          {id:17, q:"11. Check the employees (personal hygiene * uniform hygiene * nails * smell * health certificate * masks * gloves * harnet)\nتشيك العمال ( النظافة الشخصية * نظافة اليونفرم * اظافر * ريحة * كرت البلدية * الكمام * قلفزات * هرنت )"},
          {id:18, q:"14. General check (sanitary facilities + all lamps + tiles + Damaged or broken equipment + Damaged or broken tools)\nتشيك عام ( مرافق صحية + جميع اللمبات + البلاط + المكاين الخربانة او المكسرة + أدوات الخربانة او المكسرة )"}
        ]
      }
    ];

    const buildReportHTML = (branch, email, score, answers, notes, photos, signature) => {
        return `
          <div style="width: 800px; margin: 0 auto; padding: 40px; background: white; direction: rtl; font-family: 'Cairo', sans-serif; text-align: right;">
            <div style="text-align: center; border-bottom: 5px solid #004b47; padding-bottom: 20px; margin-bottom: 30px;">
              <img src="${LOGO_URL}" style="height: 100px; margin-bottom: 10px;" />
              <h1 style="color: #004b47; font-size: 26px; font-weight: 900; margin:0;">تقرير إشراف الفروع | Branch Supervision Report</h1>
            </div>
            <div style="background: #f8fafc; padding: 25px; border-radius: 15px; border: 1px solid #e2e8f0; margin-bottom: 30px; display: flex; justify-content: space-between;">
              <div style="flex: 1; line-height: 2">
                <p><b>🏢 الفرع / Branch:</b> ${branch || '---'}</p>
                <p><b>👤 المشرف / Supervisor:</b> ${email}</p>
                <p><b>📅 التاريخ / Date:</b> ${new Date().toLocaleString('en-GB')}</p>
              </div>
              <div style="width: 150px; text-align: center; border-right: 2px solid #ddd;">
                <p style="color: #64748b; font-weight: bold; font-size: 11px">الامتثال التشغيلي</p>
                <div style="font-size: 42px; font-weight: 900; color: ${score >= 70 ? '#10b981' : '#ef4444'}">${score}%</div>
              </div>
            </div>
            ${sectionsData.map(sec => `
              <div style="background: #e8f5ee; padding: 10px; font-weight: bold; border-right: 5px solid #d1ba89; color: #004b47; font-size: 16px; margin-top: 25px;">${sec.title}</div>
              ${sec.items.map(i => {
                const ans = answers[i.id]; const note = notes[i.id]; const itemPhotos = photos[i.id] || [];
                return `
                  <div style="padding: 15px; border-bottom: 1px solid #eee; page-break-inside: avoid;">
                    <p style="margin: 0; font-size: 14px; font-weight: bold; color: #1e293b; white-space: pre-line;">${i.q}</p>
                    <p style="font-size: 12px; margin: 8px 0;">الحالة: ${ans === 'yes' ? '✅ مطابق / Yes' : ans === 'no' ? '❌ ملاحظة / No' : '🔘 N/A'}</p>
                    ${note ? `<div style="background: #fff9e6; padding: 8px; border-radius: 5px; font-size: 11px; margin-top: 5px;">Note: ${note}</div>` : ''}
                    <div style="display: flex; gap: 8px; margin-top: 10px;">
                      ${itemPhotos.map(p => `<img src="${p}" style="width: 180px; height: 130px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd;" />`).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            `).join('')}
            <div style="margin-top: 50px; text-align: left;">
              <p style="font-weight: 900; color: #004b47; margin-bottom:10px;">توقيع المشرف / Supervisor Signature:</p>
              <img src="${signature}" style="width: 200px; border-bottom: 2px solid #004b47" />
            </div>
          </div>
        `;
    };

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [submitting, setSubmitting] = useState(false);
      const [branch, setBranch] = useState("");
      const [branches, setBranches] = useState([]);
      const [location, setLoc] = useState("جاري التحديد...");
      const [answers, setAnswers] = useState({});
      const [notes, setNotes] = useState({});
      const [photos, setPhotos] = useState({});
      const [expanded, setExpanded] = useState(new Set([sectionsData[0].title]));
      const canvasRef = useRef(null);
      const sigPad = useRef(null);

      useEffect(() => {
        auth.onAuthStateChanged(u => { setUser(u); setLoading(false); });
        db.collection("branches").orderBy("name").onSnapshot(snap => setBranches(snap.docs.map(d => d.data().name)));
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(pos => setLoc(`Lat: ${pos.coords.latitude.toFixed(4)}, Lng: ${pos.coords.longitude.toFixed(4)}`));
        }
      }, []);

      useEffect(() => { if (user && canvasRef.current) sigPad.current = new SignaturePad(canvasRef.current); }, [user]);

      const handlePhotoAction = (id, e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => setPhotos(prev => ({...prev, [id]: [...(prev[id] || []), ev.target.result].slice(0,2)}));
        reader.readAsDataURL(file);
      };

      const getScore = () => {
        const vals = Object.values(answers);
        const yes = vals.filter(v => v === 'yes').length;
        const total = vals.filter(v => v !== 'na' && v !== undefined).length;
        return total > 0 ? Math.round((yes / total) * 100) : 0;
      };

      const handleFinalSubmit = async () => {
          if(!branch) return alert("يرجى اختيار الفرع أولاً");
          if(submitting) return;
          setSubmitting(true);
          const score = getScore();
          const reportId = Date.now();
          const timestampStr = new Date().toLocaleString('en-GB', { hour12: true });

          const reportData = { id: reportId, branch, score, inspector: user.email, date: timestampStr, timestamp: reportId, isCrit: score < 70, type: "Branch Operation Report" };

          try {
              let local = JSON.parse(localStorage.getItem('v2_reports')) || [];
              local.unshift(reportData);
              localStorage.setItem('v2_reports', JSON.stringify(local.slice(0, 30)));

              await db.collection("inspections").add({ 
                  ...reportData, signature: sigPad.current ? sigPad.current.toDataURL() : "", answers, notes, photos, location 
              });

              alert("✅ تم إرسال تقرير الإشراف بنجاح!");
              window.location.reload();
          } catch (error) { alert("⚠️ فشل الاتصال بالسحابة."); }
          finally { setSubmitting(false); }
      };

      const handlePreview = () => {
        const signature = sigPad.current ? sigPad.current.toDataURL() : "";
        const html = buildReportHTML(branch, user.email, getScore(), answers, notes, photos, signature);
        const opt = { margin:0, filename:`Supervision_${branch}.pdf`, html2canvas:{scale:2, useCORS:true}, jsPDF:{unit:'mm', format:'a4'} };
        html2pdf().from(html).set(opt).save();
      };

      if (loading) return <div className="h-screen flex items-center justify-center font-bold text-[#004b47] animate-pulse text-2xl uppercase italic tracking-widest">VERRA PRO System...</div>;
      if (!user) return <Login auth={auth} logo={LOGO_URL} />;

      return (
        <div className="pb-40 text-right">
          <div className="verra-gradient p-12 text-center shadow-xl rounded-b-[4rem]">
            <img src={LOGO_URL} className="h-32 mx-auto mb-4 drop-shadow-2xl" />
            <h1 className="text-white font-black text-xl italic uppercase tracking-tighter">بوابة مشرف الفروع</h1>
            <p className="text-[10px] text-[#d1ba89] font-bold uppercase mt-2">Branch Supervisor Hub</p>
          </div>

          <div className="sticky-header flex justify-between items-center shadow-lg">
            <div className="text-right">
              <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest leading-none">Operational Score</p>
              <p className="text-4xl font-black text-green-700 leading-none mt-1">{getScore()}%</p>
            </div>
            <div className="flex gap-2">
                <button onClick={handlePreview} className="bg-blue-600 text-white px-5 py-3 rounded-2xl font-bold text-xs active:scale-95 transition shadow-lg shadow-blue-100">معاينة</button>
                <button onClick={handleFinalSubmit} disabled={submitting} className={`${submitting ? 'bg-gray-400':'verra-gradient'} text-white px-5 py-3 rounded-2xl font-black shadow-lg text-xs active:scale-95 transition`}>{submitting ? '...':'إرسال التقرير'}</button>
            </div>
          </div>

          <main className="p-5 max-w-3xl mx-auto space-y-8 mt-4">
            <div className="card p-7 border-r-[15px] border-[#004b47] shadow-xl">
                <p className="text-[10px] font-black text-gray-400 uppercase mb-2">Select Branch / اختر الفرع:</p>
                <select className="w-full text-2xl font-black outline-none bg-transparent text-green-950" value={branch} onChange={e=>setBranch(e.target.value)}>
                    <option value="">-- اختر من القائمة --</option>
                    {branches.map(b => <option key={b} value={b}>{b}</option>)}
                </select>
            </div>

            {sectionsData.map(sec => (
              <div key={sec.title}>
                <div className="section-title flex justify-between items-center px-6 py-4 shadow-sm" onClick={() => {
                  const n = new Set(expanded); n.has(sec.title) ? n.delete(sec.title) : n.add(sec.title); setExpanded(n);
                }}>
                    <span className="text-lg">{sec.title}</span>
                    <span className="text-xs font-bold bg-white/30 px-3 py-1 rounded-full uppercase">{expanded.has(sec.title) ? 'Hide ▲' : 'Show ▼'}</span>
                </div>
                {expanded.has(sec.title) && sec.items.map((i) => (
                  <div key={i.id} className="item-card shadow-lg border border-gray-100">
                    <p className="text-md font-bold text-green-950 mb-5 leading-relaxed white-space-pre-line text-right">{i.q}</p>
                    <div className="flex gap-2 justify-end mb-6">
                      <button onClick={()=>setAnswers({...answers, [i.id]:'yes'})} className={`ans-btn ${answers[i.id]==='yes'?'active btn-yes':''}`}>نعم / Yes</button>
                      <button onClick={()=>setAnswers({...answers, [i.id]:'no'})} className={`ans-btn ${answers[i.id]==='no'?'active btn-no':''}`}>لا / No</button>
                      <button onClick={()=>setAnswers({...answers, [i.id]:'na'})} className={`ans-btn ${answers[i.id]==='na'?'active btn-na':''}`}>N/A</button>
                    </div>
                    <textarea className="notes-input shadow-inner text-right p-4 rounded-xl" placeholder="Write observation / الملاحظة..." value={notes[i.id]||""} onChange={e=>setNotes({...notes, [i.id]:e.target.value})} />
                    
                    <div className="mt-5 flex flex-wrap gap-3 items-center justify-end">
                        <label className="upload-btn active:scale-95 shadow-md">📷 كاميرا / Camera<input type="file" className="hidden" accept="image/*" capture="environment" onChange={e => handlePhotoAction(i.id, e)} /></label>
                        <label className="upload-btn upload-btn-gallery active:scale-95 shadow-md">🖼️ معرض / Gallery<input type="file" className="hidden" accept="image/*" onChange={e => handlePhotoAction(i.id, e)} /></label>
                        <div className="flex flex-wrap mr-auto">
                          {(photos[i.id] || []).map((img, px) => (
                            <div key={px} className="relative m-1">
                              <img src={img} className="photo-thumb" /><div className="del-img" onClick={()=>setPhotos({...photos, [i.id]: photos[i.id].filter((_,x)=>x!==px)})}>×</div>
                            </div>
                          ))}
                        </div>
                    </div>
                  </div>
                ))}
              </div>
            ))}
            
            <div className="card p-10 border-2 border-dashed border-gray-300 text-center shadow-inner">
              <h3 className="font-black text-green-900 mb-6 uppercase text-sm italic tracking-widest border-b pb-2">Digital Authorized Signature / التوقيع الرقمي</h3>
              <canvas ref={canvasRef} className="sig-canvas w-full h-48 border border-gray-100 rounded-3xl bg-gray-50 shadow-inner"></canvas>
              <button onClick={()=>sigPad.current.clear()} className="text-red-500 text-xs font-bold mt-5 underline decoration-red-200">Reset Signature / مسح</button>
            </div>
          </main>
        </div>
      );
    }

    function Login({ auth, logo }) {
      const [email, setEmail] = useState(""); const [pass, setPass] = useState("");
      return (
        <div className="h-screen verra-gradient flex items-center justify-center p-6 text-right">
           <form onSubmit={(ev)=>{ev.preventDefault(); auth.signInWithEmailAndPassword(email, pass).catch(()=>alert("⚠️ Invalid Login"))}} className="bg-white p-12 rounded-[4rem] shadow-2xl w-full max-w-md text-center">
              <img src={logo} className="h-28 mx-auto mb-8 drop-shadow-2xl" />
              <h1 className="text-3xl font-black text-green-900 mb-2 italic">VERRA PRO</h1>
              <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-10">Operation Management Hub</p>
              <input className="w-full border-2 p-5 rounded-2xl mb-4 text-right outline-none focus:border-green-600 shadow-sm" placeholder="Email / البريد" value={email} onChange={v=>setEmail(v.target.value)} />
              <input className="w-full border-2 p-5 rounded-2xl mb-8 text-right outline-none focus:border-green-600 shadow-sm" type="password" placeholder="Password / الكلمة" value={pass} onChange={v=>setPass(v.target.value)} />
              <button type="submit" className="w-full verra-gradient text-white font-black py-5 rounded-3xl shadow-xl active:scale-95 transition uppercase tracking-widest">Login System</button>
           </form>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
