<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERRA Pro - نظام التتبع المتكامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        .page { transition: 0.3s; }
        .hidden { display: none; }
        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slide-up 0.3s ease-out; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-28">

    <!-- الصفحة الرئيسية -->
    <div id="dashboardPage" class="page">
        <header class="bg-[#004d40] p-8 pb-20 rounded-b-[45px] text-white shadow-lg relative">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold">VERRA <span class="text-green-400 text-xs italic">SYSTEM</span></h1>
                    <p class="text-[10px] opacity-70">أهلاً بك في نظام الإدارة الذكي</p>
                </div>
                <div class="w-12 h-12 bg-green-500 rounded-full flex items-center justify-center font-bold border-2 border-white/20 shadow-xl">R</div>
            </div>
        </header>

        <main class="px-5 -mt-12 relative z-10">
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-white p-5 rounded-[30px] shadow-sm border-b-4 border-green-500 text-center">
                    <p class="text-gray-400 text-[10px] font-bold">إجمالي الفروع</p>
                    <h2 id="branchStats" class="text-3xl font-bold text-green-600">0</h2>
                </div>
                <div onclick="navigateTo('tracePage')" class="bg-white p-5 rounded-[30px] shadow-sm border-b-4 border-blue-500 text-center">
                    <p class="text-gray-400 text-[10px] font-bold">مواد مخزنة</p>
                    <h2 id="traceCount" class="text-3xl font-bold text-blue-600">0</h2>
                </div>
            </div>

            <h3 class="font-bold text-gray-700 mb-4 px-1">العمليات السريعة</h3>
            <div class="grid grid-cols-1 gap-4">
                <div class="bg-white p-5 rounded-3xl flex items-center justify-between shadow-sm border-r-[10px] border-blue-500">
                    <div class="flex items-center gap-4">
                        <span class="text-2xl">🌡️</span>
                        <div><p class="font-bold text-sm">فحص الحرارة</p><p class="text-[9px] text-gray-400 font-bold">نقطة CCP</p></div>
                    </div>
                    <button onclick="openModal('سجل الحرارة')" class="bg-blue-600 text-white text-[10px] px-5 py-2 rounded-xl font-bold">بدء</button>
                </div>
                <div class="bg-white p-5 rounded-3xl flex items-center justify-between shadow-sm border-r-[10px] border-orange-500">
                    <div class="flex items-center gap-4">
                        <span class="text-2xl">📦</span>
                        <div><p class="font-bold text-sm">استلام شحنة</p><p class="text-[9px] text-gray-400 font-bold">وحدة التتبع</p></div>
                    </div>
                    <button onclick="openModal('تتبع شحنة')" class="bg-orange-600 text-white text-[10px] px-5 py-2 rounded-xl font-bold">استلام</button>
                </div>
            </div>
        </main>
    </div>

    <!-- صفحة التتبع (جديدة) -->
    <div id="tracePage" class="page hidden px-5 pt-10">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">سجل تتبع المواد</h2>
            <button onclick="openModal('تتبع شحنة')" class="bg-orange-600 text-white px-4 py-2 rounded-xl text-xs font-bold">إضافة شحنة +</button>
        </div>
        <div id="traceList" class="space-y-4">
            <!-- قائمة المواد ستظهر هنا -->
        </div>
    </div>

    <!-- بقية الصفحات: السجل والفروع -->
    <div id="reportsPage" class="page hidden px-5 pt-10"><h2 class="text-2xl font-bold mb-6 italic">سجل العمليات</h2><div id="reportsList" class="space-y-4"></div></div>
    <div id="branchesPage" class="page hidden px-5 pt-10">
        <div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold italic">إدارة الفروع</h2><button onclick="addB()" class="bg-[#004d40] text-white px-4 py-2 rounded-xl text-xs font-bold">جديد +</button></div>
        <div id="branchesList" class="space-y-4"></div>
    </div>

    <!-- القائمة السفلية المحدثة -->
    <nav class="fixed bottom-0 w-full bg-[#004d40] text-white flex justify-around p-4 z-50 rounded-t-[40px] shadow-2xl">
        <button onclick="navigateTo('dashboardPage')" id="nav-dashboard" class="flex flex-col items-center text-green-400"><span class="text-xl">🏠</span><span class="text-[9px] font-bold">الرئيسية</span></button>
        <button onclick="navigateTo('tracePage')" id="nav-trace" class="flex flex-col items-center text-white/40"><span class="text-xl">📦</span><span class="text-[9px] font-bold">التتبع</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-xl">📊</span><span class="text-[9px] font-bold">السجل</span></button>
        <button onclick="navigateTo('branchesPage')" id="nav-branches" class="flex flex-col items-center text-white/40"><span class="text-xl">🏢</span><span class="text-[9px] font-bold">الفروع</span></button>
    </nav>

    <!-- النافذة المنبثقة (المودال) الذكية -->
    <div id="logModal" class="fixed inset-0 bg-black/70 z-[60] hidden flex items-end">
        <div class="bg-white w-full rounded-t-[45px] p-8 animate-slide-up shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="w-16 h-1 bg-gray-200 rounded-full mx-auto mb-8"></div>
            <h3 class="text-xl font-bold mb-8 text-center" id="modalTitle">تسجيل بيانات</h3>
            
            <div id="modalContent" class="space-y-5 mb-8">
                <!-- المحتوى يتغير ديناميكياً بناءً على نوع العملية -->
            </div>

            <div class="flex gap-4">
                <button onclick="closeModal()" class="flex-1 p-5 rounded-3xl bg-gray-100 text-gray-400 font-bold">إلغاء</button>
                <button onclick="saveEntry()" class="flex-1 p-5 rounded-3xl bg-green-600 text-white font-bold shadow-lg">حفظ البيانات</button>
            </div>
        </div>
    </div>

    <script>
        let branches = JSON.parse(localStorage.getItem('v_branches')) || [];
        let reports = JSON.parse(localStorage.getItem('v_reports')) || [];
        let items = JSON.parse(localStorage.getItem('v_items')) || [];

        function navigateTo(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-green-400', 'text-white/40'));
            document.getElementById('nav-' + id.replace('Page','')).classList.replace('text-white/40', 'text-green-400');
            if(id === 'tracePage') renderTrace();
            if(id === 'branchesPage') renderBranches();
            if(id === 'reportsPage') renderReports();
        }

        function openModal(type) {
            const content = document.getElementById('modalContent');
            document.getElementById('modalTitle').innerText = type;
            
            if(type === 'تتبع شحنة') {
                content.innerHTML = `
                    <input type="text" id="itemName" placeholder="اسم المنتج (مثلاً: صدور دجاج)" class="w-full bg-gray-50 p-4 rounded-2xl border-2 border-gray-100 font-bold">
                    <input type="text" id="supplier" placeholder="اسم المورد" class="w-full bg-gray-50 p-4 rounded-2xl border-2 border-gray-100 font-bold">
                    <label class="text-xs font-bold text-gray-400 mr-1">تاريخ انتهاء الصلاحية</label>
                    <input type="date" id="expDate" class="w-full bg-gray-50 p-4 rounded-2xl border-2 border-gray-100 font-bold">
                `;
            } else {
                content.innerHTML = `
                    <select id="bSel" class="w-full bg-gray-50 p-4 rounded-2xl border-2 border-gray-100 font-bold italic">
                        ${branches.map(b => `<option>${b.name}</option>`).join('')}
                    </select>
                    <input type="number" id="tVal" placeholder="القراءة الرقمية" class="w-full bg-gray-50 p-5 rounded-3xl text-3xl font-bold text-center border-2 border-gray-100 focus:border-green-500">
                `;
            }
            document.getElementById('logModal').classList.remove('hidden');
        }

        function saveEntry() {
            const type = document.getElementById('modalTitle').innerText;
            if(type === 'تتبع شحنة') {
                const n = document.getElementById('itemName').value;
                const s = document.getElementById('supplier').value;
                const d = document.getElementById('expDate').value;
                if(!n || !d) return alert("أكمل البيانات!");
                items.unshift({name: n, supplier: s, expiry: d, id: Date.now()});
                localStorage.setItem('v_items', JSON.stringify(items));
            } else {
                const v = document.getElementById('tVal').value;
                const b = document.getElementById('bSel').value;
                if(!v) return alert("أدخل القيمة!");
                reports.unshift({branch: b, value: v, date: new Date().toLocaleString('ar-SA')});
                localStorage.setItem('v_reports', JSON.stringify(reports));
            }
            alert("تم الحفظ بنجاح!"); closeModal(); updateStats();
        }

        function renderTrace() {
            document.getElementById('traceList').innerHTML = items.length === 0 ? '<p class="text-center text-gray-400 py-10 italic">لا توجد مواد مخزنة بعد..</p>' :
            items.map(i => `
                <div class="bg-white p-5 rounded-3xl shadow-sm border-r-8 border-orange-500">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="font-bold text-gray-800">${i.name}</p>
                            <p class="text-[10px] text-gray-400">المورد: ${i.supplier}</p>
                        </div>
                        <span class="text-[10px] bg-orange-100 text-orange-600 px-2 py-1 rounded-lg font-bold italic">ينتهي: ${i.expiry}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderBranches() {
            document.getElementById('branchesList').innerHTML = branches.map(b => `<div class="bg-white p-5 rounded-3xl shadow-sm border-r-8 border-[#004d40] font-bold">${b.name}</div>`).join('');
        }

        function renderReports() {
            document.getElementById('reportsList').innerHTML = reports.map(r => `<div class="bg-white p-4 rounded-2xl shadow-sm border-r-4 border-blue-500 font-bold text-xs">${r.branch}: ${r.value} | ${r.date}</div>`).join('');
        }

        function addB() { let n = prompt("الفرع:"); if(n) { branches.push({name: n}); localStorage.setItem('v_branches', JSON.stringify(branches)); updateStats(); renderBranches(); } }
        function closeModal() { document.getElementById('logModal').classList.add('hidden'); }
        function updateStats() {
            document.getElementById('branchStats').innerText = branches.length;
            document.getElementById('traceCount').innerText = items.length;
        }

        updateStats();
    </script>
</body>
</html>
