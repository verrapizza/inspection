<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERRA Pro - نظام إدارة الجودة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        @keyframes slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.3s ease-out; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-24">

    <!-- الهيدر العلوي -->
    <header class="bg-[#004d40] p-8 pb-24 rounded-b-[40px] shadow-lg text-white relative">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">VERRA <span class="text-green-400 text-sm">PRO</span></h1>
                <p class="text-xs opacity-70">أهلاً، رمزي الشريف</p>
            </div>
            <div class="w-12 h-12 bg-green-500 rounded-full border-2 border-white flex items-center justify-center font-bold text-lg shadow-inner">R</div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="px-5 -mt-16 relative z-10">
        
        <!-- كروت الملخص السريع -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-white p-5 rounded-[30px] shadow-sm border-b-4 border-green-500">
                <p class="text-gray-400 text-[10px] mb-1">نسبة الجودة</p>
                <h2 id="overallQuality" class="text-3xl font-bold text-green-600">88%</h2>
            </div>
            <div class="bg-white p-5 rounded-[30px] shadow-sm border-b-4 border-orange-500 text-left">
                <p class="text-gray-400 text-[10px] mb-1">مهام معلقة</p>
                <h2 class="text-3xl font-bold text-orange-600 text-right">5</h2>
            </div>
        </div>

        <!-- قسم العمليات الميدانية -->
        <div class="flex justify-between items-center px-1 mb-4">
            <h3 class="font-bold text-lg text-gray-700">العمليات الميدانية</h3>
            <button class="text-xs text-green-600 font-bold">عرض الكل</button>
        </div>
        
        <div class="space-y-4 mb-10">
            <!-- مهمة 1: سجل الحرارة -->
            <div class="bg-white p-5 rounded-3xl flex items-center justify-between shadow-sm border-r-8 border-blue-500">
                <div class="flex items-center gap-4">
                    <span class="text-3xl">🌡️</span>
                    <div>
                        <p class="font-bold text-sm">سجل درجات الحرارة</p>
                        <p class="text-[10px] text-gray-400">فرع مكة - منذ ساعتين</p>
                    </div>
                </div>
                <button onclick="openModal('سجل درجات الحرارة')" class="bg-blue-50 text-blue-600 text-xs px-4 py-2 rounded-xl font-bold active:scale-95 transition-transform">بدء الآن</button>
            </div>

            <!-- مهمة 2: التنظيف -->
            <div class="bg-white p-5 rounded-3xl flex items-center justify-between shadow-sm border-r-8 border-purple-500">
                <div class="flex items-center gap-4">
                    <span class="text-3xl">🧹</span>
                    <div>
                        <p class="font-bold text-sm">جدول التنظيف الدوري</p>
                        <p class="text-[10px] text-gray-400">فرع أبحر - لم يكتمل</p>
                    </div>
                </div>
                <button onclick="openModal('جدول التنظيف الدوري')" class="bg-purple-50 text-purple-600 text-xs px-4 py-2 rounded-xl font-bold active:scale-95 transition-transform">بدء الآن</button>
            </div>
        </div>

        <!-- قسم التحليل الأسبوعي -->
        <div class="bg-white p-6 rounded-[35px] shadow-sm mb-10">
            <h3 class="font-bold mb-6 text-gray-700">أداء الفروع الأسبوعي</h3>
            <div class="flex items-end justify-between h-40 gap-3 px-2">
                <div class="bg-green-600 w-full rounded-t-xl shadow-md" style="height: 60%"></div>
                <div class="bg-green-400 w-full rounded-t-xl shadow-md" style="height: 90%"></div>
                <div class="bg-green-500 w-full rounded-t-xl shadow-md" style="height: 45%"></div>
                <div class="bg-[#004d40] w-full rounded-t-xl shadow-md" style="height: 30%"></div>
            </div>
            <div class="flex justify-between text-[10px] mt-4 text-gray-400 font-bold">
                <span class="w-full text-center">مكة</span>
                <span class="w-full text-center">التحلية</span>
                <span class="w-full text-center">أبحر</span>
                <span class="w-full text-center">الخالدية</span>
            </div>
        </div>
    </main>

    <!-- القائمة الجانبية للهاتف (Bottom Navigation) -->
    <nav class="fixed bottom-0 w-full bg-[#004d40] text-white flex justify-around p-4 z-50 rounded-t-[35px] shadow-[0_-10px_25px_rgba(0,0,0,0.1)]">
        <button class="flex flex-col items-center text-green-400 scale-110">
            <span class="text-xl">🏠</span>
            <span class="text-[10px] font-bold">الرئيسية</span>
        </button>
        <button class="flex flex-col items-center text-gray-400 opacity-60">
            <span class="text-xl">📋</span>
            <span class="text-[10px] font-bold">المهام</span>
        </button>
        <button class="flex flex-col items-center text-gray-400 opacity-60">
            <span class="text-xl">⚠️</span>
            <span class="text-[10px] font-bold">بلاغات</span>
        </button>
        <button class="flex flex-col items-center text-gray-400 opacity-60">
            <span class="text-xl">📊</span>
            <span class="text-[10px] font-bold">تقارير</span>
        </button>
    </nav>

    <!-- نافذة إدخال البيانات (Bottom Sheet Modal) -->
    <div id="logModal" class="fixed inset-0 bg-black/60 z-[60] hidden flex items-end">
        <div class="bg-white w-full rounded-t-[40px] p-8 animate-slide-up shadow-2xl">
            <div class="w-16 h-1.5 bg-gray-200 rounded-full mx-auto mb-8"></div>
            
            <h3 id="modalTitle" class="text-2xl font-bold mb-6 text-gray-800">سجل درجات الحرارة</h3>
            
            <div class="space-y-5 mb-10">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 mr-1">الموقع / الوحدة</label>
                    <select class="w-full bg-gray-50 p-4 rounded-2xl outline-none border border-gray-100 focus:border-green-500 font-bold">
                        <option>ثلاجة التحضير الرئيسية</option>
                        <option>فريزر التخزين العميق</option>
                        <option>ثلاجة العرض</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 mr-1">القراءة الحالية (°C)</label>
                    <input type="number" id="tempInput" placeholder="0" class="w-full bg-gray-50 p-4 rounded-2xl outline-none border border-gray-100 focus:border-green-500 text-2xl font-bold text-center">
                </div>

                <div class="bg-blue-50 p-5 rounded-2xl flex items-center gap-4 border border-blue-100">
                    <span class="text-2xl">📸</span>
                    <div class="flex-1">
                        <p class="text-xs text-blue-800 font-bold">التوثيق البصري</p>
                        <p class="text-[9px] text-blue-600">يرجى تصوير شاشة القراءة</p>
                    </div>
                    <button class="bg-blue-500 text-white p-3 rounded-xl shadow-lg active:scale-90 transition-transform">📷</button>
                </div>
            </div>

            <div class="flex gap-4 mb-2">
                <button onclick="closeModal()" class="flex-1 p-5 rounded-[22px] bg-gray-100 text-gray-500 font-bold active:scale-95 transition-transform">إلغاء</button>
                <button onclick="submitData()" class="flex-1 p-5 rounded-[22px] bg-green-600 text-white font-bold shadow-lg shadow-green-200 active:scale-95 transition-transform">حفظ وإرسال</button>
            </div>
        </div>
    </div>

    <!-- البرمجة (JavaScript) -->
    <script>
        function openModal(title) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('logModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // منع التمرير عند فتح النافذة
        }

        function closeModal() {
            document.getElementById('logModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function submitData() {
            const temp = document.getElementById('tempInput').value;
            if(!temp) {
                alert('يرجى إدخال البيانات المطلوبة أولاً');
                return;
            }
            
            // محاكاة الإرسال
            alert('شكرًا لك! تم إرسال التقرير بنجاح وتحديث لوحة التحكم.');
            closeModal();
            
            // تحديث نسبة الجودة بشكل تفاعلي
            const qualityEl = document.getElementById('overallQuality');
            qualityEl.innerText = "94%";
            qualityEl.classList.add('scale-110', 'text-blue-600');
            setTimeout(() => qualityEl.classList.remove('scale-110'), 300);
        }
    </script>
</body>
</html>
