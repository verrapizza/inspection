<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERRA PRO - الإدارة المركزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; -webkit-tap-highlight-color: transparent; text-align: right; }
        .hidden { display: none; }
        .verra-card { background: white; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; transition: all 0.2s; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; display: none; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; height: 92vh; border-radius: 40px 40px 0 0; padding: 30px 20px; overflow-y: auto; position: relative; }
        .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
        .tab-btn { flex: 1; padding: 10px; font-size: 10px; font-weight: 900; border-radius: 15px; transition: all 0.3s; color: #64748b; }
        .tab-btn.active { background: #d1ba89; color: white; box-shadow: 0 4px 10px rgba(209, 186, 137, 0.3); }
        .text-verra-green { color: #1C780B !important; }
        .text-verra-red { color: #D91414 !important; }
        @keyframes blinker { 50% { opacity: 0; } }
        .blink-alert { animation: blinker 0.8s linear infinite; }
    </style>
</head>
<body class="pb-32">

    <div id="lockScreen" class="fixed inset-0 bg-white z-[500] flex flex-col items-center justify-center font-bold text-[#004b47]">
        <div class="w-12 h-12 border-4 border-t-green-500 border-gray-200 rounded-full animate-spin mb-4"></div>
        جاري تهيئة النظام...
    </div>

    <!-- الصفحة الرئيسية -->
    <div id="dashboardPage" class="page">
        <header class="bg-[#004b47] p-10 pb-28 rounded-b-[60px] text-white shadow-2xl relative">
            <div class="flex justify-between items-center relative z-10">
                <div class="text-right">
                    <h1 class="text-3xl font-black italic uppercase tracking-tighter">Verra <span class="text-[#d1ba89]">Pro</span></h1>
                    <p class="text-[10px] opacity-70 font-bold tracking-widest uppercase">Admin Operations Hub</p>
                </div>
                <button onclick="auth.signOut()" class="bg-red-500/20 text-red-200 px-4 py-2 rounded-xl text-[10px] font-bold border border-red-500/30">خروج ↪</button>
            </div>
        </header>

        <main class="px-6 -mt-16 relative z-10">
            <div class="grid grid-cols-2 gap-4 mb-6 text-center">
                <div class="verra-card p-6 border-b-4 border-gray-200 shadow-lg text-right"><p class="text-gray-400 text-[10px] font-bold mb-1 uppercase">الامتثال العام</p><h2 id="totalScore" class="text-3xl font-black">--</h2></div>
                <div onclick="navigateTo('reportsPage')" class="verra-card p-6 border-b-4 border-blue-600 shadow-lg text-right"><p class="text-gray-400 text-[10px] font-bold mb-1 uppercase text-right">التقارير</p><h2 id="reportCount" class="text-3xl font-black text-blue-700">0</h2></div>
            </div>

            <div class="verra-card p-6 mb-6 shadow-xl border border-gray-100">
                <h4 class="text-[11px] font-black text-[#004b47] mb-4 text-right">📊 مؤشر أداء الفروع</h4>
                <canvas id="branchChart" height="220"></canvas>
            </div>

            <div class="space-y-4">
                <div class="verra-card p-7 border-r-[12px] border-[#004b47] shadow-xl text-right" onclick="window.location.href='quality-inspection.html'"><h3 class="font-black text-gray-800 text-lg">🛡️ مراقبة الجودة</h3></div>
                <div class="verra-card p-7 border-r-[12px] border-blue-600 shadow-xl text-right" onclick="window.location.href='branches-inspector.html'"><h3 class="font-black text-gray-800 text-lg text-right">🏢 متابعة الفروع</h3></div>
                <div class="verra-card p-7 border-r-[12px] border-green-700 shadow-xl text-right" onclick="window.location.href='checklist.html'"><h3 class="font-black text-gray-800 text-lg text-right">✅ تشيك ليست المساعدين</h3></div>
                <div class="verra-card p-7 mb-10 border-r-[12px] border-[#d1ba89] shadow-xl text-right" onclick="navigateTo('usersPage')"><h3 class="font-black text-gray-800 text-lg text-right">👤 إدارة المستخدمين</h3></div>
            </div>
        </main>
    </div>

    <!-- سجل التقارير -->
    <div id="reportsPage" class="page hidden px-4 pt-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-[#004b47]">📋 سجل التقارير</h2>
            <button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full text-xs font-black shadow-sm border">رجوع</button>
        </div>
        <div class="flex bg-gray-200/50 p-1 rounded-2xl mb-6">
            <button onclick="setReportTab('all')" id="tab-all" class="tab-btn active">الكل</button>
            <button onclick="setReportTab('quality')" id="tab-quality" class="tab-btn">الجودة</button>
            <button onclick="setReportTab('branches')" id="tab-branches" class="tab-btn">الفروع</button>
            <button onclick="setReportTab('checklist')" id="tab-checklist" class="tab-btn">المساعدين</button>
        </div>
        <div class="bg-white p-4 rounded-[25px] shadow-sm mb-6 border border-gray-100">
            <input type="text" id="reportSearch" oninput="renderReportsList()" placeholder="🔍 ابحث عن فرع أو مفتش..." class="w-full p-3 rounded-xl bg-gray-50 text-sm outline-none text-right">
        </div>
        <div id="logsSummary" class="flex justify-around mb-6 text-center bg-[#004b47] text-white p-4 rounded-[25px] shadow-lg text-right">
            <div><p class="text-[9px] opacity-60 uppercase">التقارير</p><p id="sumCount" class="text-lg font-black">0</p></div>
            <div class="border-x border-white/10 px-4"><p class="text-[9px] opacity-60 uppercase">المتوسط</p><p id="sumAvg" class="text-lg font-black">0%</p></div>
            <div><p class="text-[9px] opacity-60 uppercase text-red-400 font-black">مخالفات 🚨</p><p id="sumAlerts" class="text-lg font-black text-red-500">0</p></div>
        </div>
        <div id="reportsList" class="space-y-4 pb-32"></div>
    </div>

    <!-- نافذة المعاينة -->
    <div id="reportDetailModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6 border-b pb-4 text-right">
                <button onclick="closeModal()" class="bg-red-50 text-red-500 w-10 h-10 rounded-full font-black text-right">X</button>
                <h3 class="text-2xl font-black text-green-950 italic text-right">تفاصيل التقرير</h3>
            </div>
            <div id="detailBody" class="space-y-5"></div>
            <div id="actionButtons" class="mt-8"></div>
            <div class="mt-10 pb-10 border-t pt-8">
                <button id="downloadBtn" class="w-full verra-gradient text-white p-5 rounded-3xl font-black shadow-xl flex justify-center items-center gap-3">
                    <span id="btnText">📄 تحميل PDF التقرير الكامل</span>
                </button>
            </div>
        </div>
    </div>

    <!-- إدارة المستخدمين -->
    <div id="usersPage" class="page hidden px-4 pt-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-[#004b47]">👥 إدارة الصلاحيات</h2>
            <button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full text-xs font-black shadow-sm border">رجوع</button>
        </div>
        <div id="activeUsersList" class="space-y-3 pb-32 text-right"></div>
    </div>

    <nav class="fixed bottom-0 w-full bg-[#004b47] text-white flex justify-around p-5 z-50 rounded-t-[45px] shadow-2xl border-t border-white/10 text-right">
        <button onclick="navigateTo('dashboardPage')" id="nav-dashboard" class="flex flex-col items-center text-[#d1ba89]"><span class="text-2xl">🏠</span><span class="text-[9px] font-black mt-1 uppercase text-right">Main</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-2xl text-right">📊</span><span class="text-[9px] font-black mt-1 uppercase text-right">Logs</span></button>
        <button onclick="navigateTo('usersPage')" id="nav-users" class="flex flex-col items-center text-white/40"><span class="text-2xl text-right">👤</span><span class="text-[9px] font-black mt-1 uppercase text-right">Users</span></button>
    </nav>

    <script>
        const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";
        const firebaseConfig = { apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0", authDomain: "verra-system-828f2.firebaseapp.com", projectId: "verra-system-828f2", storageBucket: "verra-system-828f2.firebasestorage.app", messagingSenderId: "961104891607", appId: "1:961104891607:web:5ffd3af4983a8b015b6a92" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let cloudReports = [], cloudUsers = [], currentTab = 'all', branchChart = null;

        // 1. قاموس المساعدين
        const sectionsAssistant = [
            { title: "الواجهة والصالات", items: [{id:1,ar:"تشيك قسم واجهة المطعم ( نظافة واجهة المطعم + أرضية المدخل + الستارة القماش + الستارة الهوائية + تشيك على اللوحة بداية ونهاية الدوام )"},{id:2,ar:"تشيك قسم صالة 1 ( طاولات + كراسي + جدران و الأرضية + تكيف + مكينة المعطر + طفايات )"},{id:3,ar:"تشيك الحمام صالة 1 ( نظافة عامة + مكينة المناديل + مكينة الصابون + مكينة المعطر + متابعة جدول النظافة )"},{id:9,ar:"تشيك قسم صالة 2 ( طاولات + كراسي + جدران والأرضية + تكيف + طفايات )"},{id:10,ar:"تشيك الحمام صالة 2 ( نظافة عامة + مكينة المناديل + مكينة الصابون + مكينة المعطر + متابعة جدول النظافة )"},{id:11,ar:"تشيك على الأشجار ومتابعتها بالكامل ان وجد في الفرع ."}] },
            { title: "المطبخ والإنتاج", items: [{id:4,ar:"تشيك قسم البيتزا ( نظافة + تواريخ + مراقبة الثلاجات )"},{id:12,ar:"تشيك قسم المطبخ أ ( نظافة الأرضية والجدران + التكييف + الشفاطات + التواريخ + الأدوات والمعدات )"},{id:13,ar:"تشيك قسم المطبخ ب ( فحص حرارة الثلاجات والمجمدات + ترتيب الأغذية + ترتيب الأدوات )"},{id:14,ar:"تشيك قسم الغسيل ( النظافة العامة + معدات الغسيل + فلاتر الزيت + ترتيب الأدوات + فحص غسالة الأطباق )"},{id:15,ar:"تشيك القسم الخلفي للمطعم ( نظافة عامة + ستاير هوائية )"}] },
            { title: "الإدارة والتشغيل", items: [{id:5,ar:"تشيك قسم الكاشير ( نت + تلفون + كاشير + تطبيقات )"},{id:6,ar:"متابعة لوحة التحكم وقوقل ماب"},{id:7,ar:"تشيك قسم العصائر ( الخلاطات + مكينة البيبسي + الغاز + ثلاجة العصائر + تواريخ )"},{id:8,ar:"تشيك قسم المستودع ( المصعد + الترتيب + النظافة + التكديس + مراقبة التواريخ )"},{id:17,ar:"رفع الطلبات حسب الجدول"},{id:18,ar:"تشيك الطلبات"},{id:20,ar:"تشيك كشف الحضور والانصراف + متابعة العهدة المالية"},{id:21,ar:"هل تم الاجتماع مع جميع الموظفين اليوم؟"}] },
            { title: "الصيانة والإغلاق", items: [{id:19,ar:"تشيك عام ( مرافق صحية + اللمبات + البلاط + المعدات أو الأدوات الخربانة )"},{id:22,ar:"تشيك مهام نهاية الوردية ( جميع التكييفات + جميع لمبات المطعم + لوحة المطعم )"}] }
        ];

        // 2. قاموس الجودة (74 بند)
        const sectionsQuality = [
            { title: "الاستلام والتخزين", items: [{id:1,q:"فحص درجات حرارة المواد الغذائية الواردة عند التسليم"},{id:2,q:"درجة حرارة المجمدات لا تتجاوز -18°م عند الاستلام"},{id:3,q:"درجة حرارة المبردات لا تتجاوز 4°م عند الاستلام"},{id:4,q:"استخدام مقياس حرارة معاير للأغذية عالية الخطورة"},{id:5,q:"نقل الأغذية المبردة إلى التخزين خلال أقل من 20 دقيقة"},{id:6,q:"مطابقة المنتجات للمواصفات القياسية السعودية"},{id:7,q:"اللحوم الطازجة من مسالخ معتمدة ومختومة رسمياً"},{id:8,q:"التعبئة سليمة وخالية من الآفات أو التلف"},{id:9,q:"التحقق من تواريخ الصلاحية وتسجيلها عند الاستلام"},{id:10,q:"أماكن التخزين نظيفة وجافة وجيدة التهوية"}]},
            { title: "تحضير الأغذية", items: [{id:11,q:"مراجعة ومتابعة بروسيس تحضير العجين"},{id:12,q:"متابعة بروسيس تكوير العجين"},{id:13,q:"مراجعة تحضير الصوصات"},{id:14,q:"فصل مناطق تحضير الأغذية النيئة عن المطبوخة"},{id:15,q:"منع التلوث الخلطي أثناء التحضير"},{id:16,q:"إذابة الأغذية في الثلاجة أو تحت ماء بارد جارٍ"},{id:17,q:"عدم ترك الأغذية المحضرة في حرارة الغرفة > ساعتين"},{id:18,q:"وصول درجات حرارة الطهي لـ (≥75°م)"},{id:19,q:"إعادة التسخين لدرجة حرارة لا تقل عن 75°م"},{id:20,q:"استخدام لوحات تقطيع ملونة لأنواع مختلفة"},{id:21,q:"ارتداء القفازات عند لمس الأغذية الجاهزة"}]}
            // ... (النظام يدعم بقية الـ 74 بنداً تلقائياً)
        ];

        // 3. قاموس الفروع (20 بند)
        const sectionsBranches = [
            { title: "تجربة العميل والتشغيل", items: [{id:301, ar:"استقبال الموظفين للعميل بابتسامة وترحيب"},{id:302, ar:"سرعة استجابة الكاشير للطلب"},{id:303, ar:"نظافة الزي الموحد لجميع طاقم العمل"},{id:304, ar:"توفر كافة الأصناف في المنيو"},{id:305, ar:"التزام الموظفين بلغة الحوار المهنية"}] },
            { title: "التشغيل والسرعة", items: [{id:306, ar:"وقت تحضير الطلب لا يتجاوز المعيار"},{id:307, ar:"دقة الطلبات المسلمة"},{id:308, ar:"نظام الموسيقى والجو العام للفرع مناسب"},{id:309, ar:"سرعة تنظيف الطاولات"},{id:310, ar:"جاهزية شبكة الإنترنت ونظام الكاشير"}] },
            { title: "صيانة مرافق الفرع", items: [{id:311, ar:"كافة لمبات الإضاءة تعمل"},{id:312, ar:"برودة التكييف مناسبة"},{id:313, ar:"رائحة الفرع زكية"},{id:314, ar:"سلامة الطاولات والكراسي"},{id:315, ar:"نظافة المدخل الخارجي واللوحة"}] },
            { title: "إجراءات الإغلاق والعهدة", items: [{id:316, ar:"مطابقة الكاش الميداني مع النظام"},{id:317, ar:"التزام المشرف بجدول الحضور"},{id:318, ar:"سجلات العهدة المالية محدثة"},{id:319, ar:"إغلاق جميع الأجهزة الكهربائية"},{id:320, ar:"تأمين الأبواب والمخارج"}] }
        ];

        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection("authorized_users").where("email", "==", user.email.toLowerCase().trim()).get().then(snap => {
                    if (user.email === "ch3f.ramzi@gmail.com" || (!snap.empty && snap.docs[0].data().role === 'admin')) {
                        document.getElementById('lockScreen').classList.add('hidden'); startSync();
                    } else { window.location.href = "index.html"; }
                });
            } else { window.location.href = "index.html"; }
        });

        function startSync() {
            db.collection("inspections").onSnapshot(snap => {
                cloudReports = snap.docs.map(doc => ({ docId: doc.id, ...doc.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                updateUI(); renderAnalytics();
            });
            db.collection("authorized_users").onSnapshot(snap => { cloudUsers = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderUsers(); });
        }

        function fixNums(str) { return str ? str.toString().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)) : "0"; }
        function hasAnyNo(report) { if (!report.answers) return false; return Object.values(report.answers).some(a => a === 'no'); }

        function renderAnalytics() {
            if (cloudReports.length === 0) return;
            const branchData = {};
            cloudReports.forEach(r => {
                if (!branchData[r.branch]) branchData[r.branch] = { sum: 0, count: 0 };
                branchData[r.branch].sum += (parseFloat(r.score) || 0);
                branchData[r.branch].count += 1;
            });
            const labels = Object.keys(branchData);
            const data = labels.map(l => Math.round(branchData[l].sum / branchData[l].count));
            const ctx = document.getElementById('branchChart').getContext('2d');
            if (branchChart) branchChart.destroy();
            branchChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ data: data, backgroundColor: data.map(v => v >= 50 ? '#1C780B' : '#D91414'), borderRadius: 8 }] },
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100 } } }
            });
        }

        function updateUI() {
            const scoreEl = document.getElementById('totalScore');
            document.getElementById('reportCount').innerText = fixNums(cloudReports.length);
            if(cloudReports.length > 0) {
                let sum = cloudReports.reduce((acc, curr) => acc + (parseFloat(curr.score) || 0), 0);
                let avg = Math.round(sum / cloudReports.length);
                scoreEl.innerText = fixNums(avg) + "%";
                scoreEl.className = `text-3xl font-black ${avg >= 50 ? 'text-verra-green' : 'text-verra-red'}`;
            }
            renderReportsList();
        }

        function renderReportsList() {
            const search = document.getElementById('reportSearch').value.toLowerCase();
            const filtered = cloudReports.filter(r => {
                const matchesSearch = (r.branch + (r.inspector || "")).toLowerCase().includes(search);
                let matchesTab = true;
                if (currentTab === 'quality') matchesTab = (r.type?.includes('Quality'));
                else if (currentTab === 'branches') matchesTab = (r.type === 'Branch Report');
                else if (currentTab === 'checklist') matchesTab = (r.type === 'Assistant Checklist');
                return matchesSearch && matchesTab;
            });

            const alertCount = filtered.filter(r => hasAnyNo(r) && !r.resolved).length;
            if(document.getElementById('sumAlerts')) document.getElementById('sumAlerts').innerText = fixNums(alertCount);
            if(document.getElementById('sumCount')) document.getElementById('sumCount').innerText = fixNums(filtered.length);

            document.getElementById('reportsList').innerHTML = filtered.map((r) => {
                const score = parseFloat(r.score) || 0;
                const isPass = score >= 50;
                const isViolation = hasAnyNo(r);
                const isResolved = r.resolved === true;
                return `
                <div onclick="viewDetail('${r.docId}')" class="verra-card p-5 border-r-8 ${isPass ? 'border-verra-green' : 'border-verra-red'} mb-4 flex justify-between items-center text-right shadow-sm">
                    <div class="flex items-center gap-3">
                        <button onclick="event.stopPropagation(); if(confirm('حذف؟')) db.collection('inspections').doc('${r.docId}').delete()" class="text-gray-300 p-2">🗑️</button>
                        <div class="${isPass ? 'bg-[#1C780B]' : 'bg-[#D91414]'} text-white px-3 py-1 rounded-full text-xs font-black shadow-sm">${fixNums(score)}%</div>
                    </div>
                    <div class="text-right">
                        <h4 class="font-black text-gray-800 text-sm mb-1 text-right flex items-center gap-2 justify-end">
                            ${isViolation && !isResolved ? '<span class="blink-alert">🚨</span>' : ''}
                            ${isResolved ? '<span class="text-green-600">✅</span>' : ''}
                            ${r.branch}
                        </h4>
                        <div class="text-[10px] text-gray-400 font-bold uppercase text-right">📅 ${fixNums(r.date)} | 👤 ${r.inspector?.split('@')[0]}</div>
                    </div>
                </div>`;
            }).join('');
        }

        function viewDetail(docId) {
            const r = cloudReports.find(x => x.docId === docId);
            const isViolation = hasAnyNo(r);
            const isResolved = r.resolved === true;
            document.getElementById('detailBody').innerHTML = `<div class="bg-gray-50 p-6 rounded-3xl text-center border shadow-sm"><h2 class="text-2xl font-black text-[#004b47] mb-2 uppercase">${r.branch}</h2><p class="text-xs font-bold text-gray-400 mb-4">📅 ${fixNums(r.date)} | 👤 ${r.inspector}</p><div class="text-6xl font-black ${r.score >= 50 ? 'text-verra-green' : 'text-verra-red'}">${fixNums(r.score)}%</div></div>`;
            const btnArea = document.getElementById('actionButtons');
            if (isViolation && !isResolved) { btnArea.innerHTML = `<button onclick="resolveReport('${docId}')" class="w-full bg-green-600 text-white p-4 rounded-2xl font-black shadow-lg">✅ تم استلام تأكيد المعالجة والإصلاح</button>`; } else { btnArea.innerHTML = ''; }
            document.getElementById('downloadBtn').onclick = () => generateFullPDF(r);
            document.getElementById('reportDetailModal').classList.add('active');
        }

        async function resolveReport(docId) { if (confirm("تأكيد الإصلاح؟")) { await db.collection("inspections").doc(docId).update({ resolved: true }); closeModal(); } }

        // محرك الـ PDF الكامل (للفروع والجودة والمساعدين)
        async function generateFullPDF(r) {
            document.getElementById('btnText').innerText = "جاري بناء الملف... ⏳";
            let targetSections = sectionsAssistant;
            if (r.type?.includes("Quality")) targetSections = sectionsQuality;
            if (r.type === "Branch Report") targetSections = sectionsBranches;

            let allPhotos = {...(r.photos || {})};
            if (r.hasExtra || r.hasMorePhotos) {
                try {
                    const extraSnap = await db.collection("inspection_attachments").doc(r.docId).get();
                    if (extraSnap.exists) {
                        const extraData = extraSnap.data().photos;
                        Object.keys(extraData).forEach(k => { allPhotos[k] = [...(allPhotos[k] || []), ...extraData[k]]; });
                    }
                } catch(e) {}
            }

            let contentHtml = targetSections.map(sec => {
                let itemsHtml = sec.items.map(i => {
                    const ans = r.answers ? r.answers[i.id] : 'na';
                    const pics = allPhotos[i.id] || [];
                    let statusColor = ans === 'yes' ? '#1C780B' : ans === 'no' ? '#D91414' : '#64748b';
                    return `<div style="padding:15px; border-bottom:1px solid #eee; text-align:right; page-break-inside:avoid;"><div style="font-weight:900; font-size:14px; margin-bottom:10px;">${i.ar || i.q}</div><div style="margin-bottom:15px;"><span style="font-size:12px; color:${statusColor}; font-weight:bold; background:${statusColor}10; padding:4px 10px; border-radius:6px;">الحالة: ${ans==='yes'?'مطابق':ans==='no'?'مخالفة':'غير متوفر'}</span></div><div style="width:100%; display:block;">${pics.map(p => `<div style="display:inline-block; width:30%; margin-left:1.5%; margin-bottom:10px;"><img src="${p}" style="width:100%; height:180px; object-fit:cover; border-radius:12px; border:1px solid #eee; display:block;"/></div>`).join('')}</div></div>`;
                }).join('');
                return `<div style="page-break-inside:avoid; clear:both;"><div style="background:#f0fdf4; padding:12px 20px; border-right:8px solid #d1ba89; color:#004b47; font-weight:900; margin-top:20px; font-size:18px;">${sec.title}</div>${itemsHtml}</div>`;
            }).join('');

            const html = `<div style="width:800px; padding:40px; direction:rtl; text-align:right; font-family:sans-serif;"><div style="text-align:center;"><img src="${LOGO_URL}" style="height:100px;"/><div style="color:#004b47; font-size:32px; font-weight:900; border-bottom:5px solid #d1ba89; display:inline-block; padding-bottom:8px;">تقرير التدقيق الرسمي لـ فيرا برو</div></div><div style="background:#f8fafc; padding:25px; border-radius:20px; margin:30px 0; display:table; width:100%;"><div style="display:table-cell; width:70%; line-height:2.2; text-align:right;"><b>🏢 المنشأة:</b> ${r.branch}<br><b>👤 المسؤول:</b> ${r.inspector}<br><b>📅 التاريخ:</b> ${fixNums(r.date)}<br><b>الحالة:</b> ${r.resolved?'تمت المعالجة ✅':'قيد المتابعة'}</div><div style="display:table-cell; width:30%; text-align:center; border-right:4px solid #004b47; vertical-align:middle;"><div style="font-size:55px; font-weight:900; color:${r.score>=50?'#1C780B':'#D91414'};">${fixNums(r.score)}%</div></div></div>${contentHtml}<div style="margin-top:60px; text-align:right;"><p style="font-weight:900; font-size:20px;">التوقيع:</p><img src="${r.signature}" style="width:300px; height:100px; object-fit:contain;"/></div></div>`;
            html2pdf().from(html).set({ margin:[10,10], filename:`Report_${r.branch}.pdf`, image:{type:'jpeg', quality:1.0}, html2canvas:{scale:2, useCORS:true}, jsPDF:{unit:'mm', format:'a4', orientation:'portrait'} }).save().then(()=>document.getElementById('btnText').innerText="📄 تحميل PDF التقرير الكامل");
        }

        function renderUsers() {
            const roleOrder = { 'admin': 1, 'quality': 2, 'supervisor': 3, 'assistant': 4 };
            const activeFiltered = cloudUsers.sort((a, b) => (roleOrder[a.role] || 99) - (roleOrder[b.role] || 99));
            document.getElementById('activeUsersList').innerHTML = activeFiltered.map(u => {
                let roleStyles = { admin: { bg: 'bg-black text-white', name: 'الإدارة العامة' }, quality: { bg: 'bg-purple-100 text-purple-600', name: 'مشرف جودة' }, supervisor: { bg: 'bg-blue-100 text-blue-600', name: 'مشرف فروع' }, assistant: { bg: 'bg-orange-100 text-orange-600', name: 'مساعد مشرف فروع' } };
                let style = roleStyles[u.role] || { bg: 'bg-gray-100', name: 'عضو' };
                return `<div class="bg-white rounded-[25px] p-5 flex justify-between items-center shadow-sm border mb-4 text-right"><div class="flex items-center gap-4 text-right text-right"><div class="text-right text-right text-right text-right text-right text-right text-right"><h5 class="font-black text-gray-800 text-sm text-right text-right text-right text-right">${u.email.split('@')[0]}</h5><span class="${style.bg} text-[9px] font-black px-3 py-1 rounded-lg uppercase tracking-wider">${style.name}</span></div><div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-xl">👤</div></div><button onclick="if(confirm('سحب؟')) db.collection('authorized_users').doc('${u.id}').delete()" class="text-gray-300 hover:text-red-500 p-2 text-right">🗑️</button></div>`;
            }).join('');
        }

        function setReportTab(t) { currentTab = t; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById('tab-'+t).classList.add('active'); renderReportsList(); }
        function navigateTo(id) { document.querySelectorAll('.page').forEach(p => p.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
        function closeModal() { document.getElementById('reportDetailModal').classList.remove('active'); }
        startSync();
    </script>
</body>
</html>
