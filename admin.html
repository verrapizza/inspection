<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERRA PRO - لوحة الإدارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; }
        .hidden { display: none; }
        .verra-card { background: white; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: none; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; height: 92vh; border-radius: 40px 40px 0 0; padding: 25px; overflow-y: auto; }
        .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    </style>
</head>
<body class="pb-32">

    <!-- شاشة التحميل -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white z-[200] flex flex-col items-center justify-center font-bold text-[#004b47]">
        <div class="w-12 h-12 border-4 border-t-green-500 border-gray-200 rounded-full animate-spin mb-4"></div>
        جاري مزامنة التقارير...
    </div>

    <!-- الصفحة الرئيسية -->
    <div id="dashboardPage" class="page">
        <header class="bg-[#004b47] p-10 pb-28 rounded-b-[60px] text-white shadow-2xl relative text-right">
            <h1 class="text-3xl font-black italic">VERRA <span class="text-[#d1ba89]">PRO</span></h1>
            <p class="text-[10px] opacity-70 font-bold tracking-widest uppercase">Admin Dashboard</p>
        </header>

        <main class="px-6 -mt-16 relative z-10 text-right">
            <div class="grid grid-cols-2 gap-4 mb-8 text-center">
                <div class="verra-card p-6 border-b-4 border-green-600 shadow-lg">
                    <p class="text-gray-400 text-[10px] font-bold uppercase">الامتثال</p>
                    <h2 id="totalScore" class="text-3xl font-black text-green-700">--</h2>
                </div>
                <div onclick="navigateTo('reportsPage')" class="verra-card p-6 border-b-4 border-blue-600 shadow-lg">
                    <p class="text-gray-400 text-[10px] font-bold uppercase">التقارير</p>
                    <h2 id="reportCount" class="text-3xl font-black text-blue-700">0</h2>
                </div>
            </div>

            <div class="verra-card p-8 mb-10 border-r-[12px] border-[#004b47] shadow-xl">
                <h3 class="font-black text-gray-800 text-lg mb-2 italic">تفتيش الميدان</h3>
                <p class="text-[11px] text-gray-500 mb-8 font-bold leading-relaxed">فتح بوابة المفتش لإجراء الجولة التدقيقية ومزامنتها.</p>
                <a href="https://verrapizza.github.io/inspection/" class="w-full verra-gradient text-white p-5 rounded-[22px] font-black shadow-lg flex justify-between items-center text-center">
                    <span>دخول الأداة</span>
                    <span class="text-xl">⬅</span>
                </a>
            </div>
        </main>
    </div>

    <!-- سجل التقارير -->
    <div id="reportsPage" class="page hidden px-6 pt-10 text-right">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-black text-[#004b47] italic underline decoration-[#d1ba89] underline-offset-8">سجل السحابة</h2>
            <button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full text-xs font-black border shadow-sm">رجوع</button>
        </div>
        <div id="reportsList" class="space-y-4 pb-24 text-right">
            <!-- التقارير تظهر هنا -->
        </div>
    </div>

    <!-- نافذة التفاصيل -->
    <div id="reportDetailModal" class="modal">
        <div class="modal-content text-right">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <button onclick="closeModal()" class="bg-red-50 text-red-500 w-10 h-10 rounded-full font-black">X</button>
                <h3 class="text-xl font-black text-green-950">تفاصيل التقرير</h3>
            </div>
            <div id="detailBody" class="space-y-4"></div>
            <div class="mt-8 pb-10">
                <button id="downloadBtn" class="w-full verra-gradient text-white p-5 rounded-3xl font-black shadow-xl flex justify-center items-center gap-3">📄 تحميل PDF</button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-[#004b47] text-white flex justify-around p-5 z-50 rounded-t-[45px] shadow-2xl">
        <button onclick="navigateTo('dashboardPage')" id="nav-dashboard" class="flex flex-col items-center text-[#d1ba89]"><span class="text-2xl">🏠</span><span class="text-[9px] font-black mt-1 uppercase">Main</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-2xl">📊</span><span class="text-[9px] font-black mt-1 uppercase">Sajil</span></button>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
            authDomain: "verra-system-828f2.firebaseapp.com",
            projectId: "verra-system-828f2",
            storageBucket: "verra-system-828f2.firebasestorage.app",
            messagingSenderId: "961104891607",
            appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let cloudReports = [];

        // تحويل الأرقام العربية إلى إنجليزية لأي بيانات قديمة
        function fixNumbers(str) {
            if(!str) return "";
            return str.toString().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
        }

        function startSync() {
            db.collection("inspections").onSnapshot((querySnapshot) => {
                let data = [];
                querySnapshot.forEach((doc) => {
                    data.push({ id: doc.id, ...doc.data() });
                });

                // ترتيب: الأحدث في الأعلى (حسب الـ timestamp أو الـ id)
                cloudReports = data.sort((a, b) => (b.timestamp || b.id) - (a.timestamp || a.id));

                updateUI();
                document.getElementById('loadingOverlay').classList.add('hidden');
            });
        }

        function updateUI() {
            document.getElementById('reportCount').innerText = fixNumbers(cloudReports.length);
            if(cloudReports.length > 0) {
                let avg = Math.round(cloudReports.reduce((acc, curr) => acc + (curr.score || 0), 0) / cloudReports.length);
                document.getElementById('totalScore').innerText = fixNumbers(avg) + "%";
            }
            if(!document.getElementById('reportsPage').classList.contains('hidden')) renderList();
        }

        function renderList() {
            const list = document.getElementById('reportsList');
            list.innerHTML = cloudReports.map((r, i) => `
                <div onclick="viewDetail(${i})" class="verra-card p-6 border-r-8 ${r.score < 70 ? 'border-red-500' : 'border-green-500'} active:scale-95 transition-transform mb-4">
                    <div class="flex justify-between items-start">
                        <h4 class="font-black text-gray-800 text-lg">${r.branch}</h4>
                        <span class="text-xs font-black bg-gray-50 px-3 py-1 rounded-full">${fixNumbers(r.score)}%</span>
                    </div>
                    <p class="text-[11px] text-gray-400 font-bold mt-2 text-right italic">
                        📅 ${fixNumbers(r.date)} | 👤 ${r.inspector ? r.inspector.split('@')[0] : '---'}
                    </p>
                </div>
            `).join('');
        }

        function viewDetail(idx) {
            const r = cloudReports[idx];
            document.getElementById('detailBody').innerHTML = `
                <div class="verra-card p-6 border border-gray-100 text-center mb-4">
                    <h2 class="text-2xl font-black text-[#004b47] mb-2">${r.branch}</h2>
                    <p class="text-xs text-gray-400 font-bold border-t pt-4">المفتش: ${r.inspector}</p>
                    <p class="text-xs text-gray-400 font-bold pb-4">التاريخ: ${fixNumbers(r.date)}</p>
                    <div class="flex justify-between px-10 border-t pt-4">
                        <span class="font-bold text-gray-500 italic">معدل الامتثال:</span>
                        <span class="text-3xl font-black ${r.score < 70 ? 'text-red-500' : 'text-green-600'}">${fixNumbers(r.score)}%</span>
                    </div>
                </div>
            `;
            document.getElementById('reportDetailModal').classList.add('active');
        }

        function navigateTo(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if(id === 'reportsPage') renderList();
        }
        function closeModal() { document.getElementById('reportDetailModal').classList.remove('active'); }

        startSync();
    </script>
</body>
</html>
