<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERRA Pro - النظام المتكامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .page { transition: all 0.3s ease-in-out; }
        .hidden { display: none; }
        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slide-up 0.3s ease-out; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-24">

    <!-- صفحة لوحة التحكم (الرئيسية) -->
    <div id="dashboardPage" class="page">
        <header class="bg-[#004d40] p-8 pb-24 rounded-b-[45px] shadow-lg text-white relative">
            <div class="flex justify-between items-center relative z-10">
                <div>
                    <h1 class="text-2xl font-bold">VERRA <span class="text-green-400 text-xs">PRO</span></h1>
                    <p class="text-[10px] opacity-70">لوحة التحكم الرئيسية</p>
                </div>
                <div class="w-12 h-12 bg-green-500 rounded-full border-2 border-white/30 flex items-center justify-center font-bold shadow-xl">R</div>
            </div>
        </header>

        <main class="px-5 -mt-16 relative z-10">
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-white p-5 rounded-[30px] shadow-sm border-b-4 border-green-500">
                    <p class="text-gray-400 text-[10px] mb-1 font-bold">معدل الامتثال</p>
                    <h2 id="overallQuality" class="text-3xl font-bold text-green-600">88%</h2>
                </div>
                <div class="bg-white p-5 rounded-[30px] shadow-sm border-b-4 border-orange-500">
                    <p class="text-gray-400 text-[10px] mb-1 font-bold">تقارير اليوم</p>
                    <h2 id="reportCount" class="text-3xl font-bold text-orange-600">0</h2>
                </div>
            </div>

            <h3 class="font-bold text-lg text-gray-700 mb-4 mr-1 flex justify-between items-center">
                <span>العمليات الميدانية</span>
                <button onclick="navigateTo('reportsPage')" class="text-xs text-green-600 font-bold bg-green-50 px-3 py-1 rounded-lg italic">عرض السجل ⮕</button>
            </h3>
            
            <div class="space-y-4 mb-10">
                <div class="bg-white p-5 rounded-3xl flex items-center justify-between shadow-sm border-r-[10px] border-blue-500">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center text-2xl">🌡️</div>
                        <div><p class="font-bold text-sm">سجل الحرارة</p><p class="text-[10px] text-gray-400 font-bold">نقطة تحكم حرجة</p></div>
                    </div>
                    <button onclick="openModal('سجل الحرارة')" class="bg-blue-600 text-white text-xs px-5 py-2.5 rounded-xl font-bold">بدء</button>
                </div>
            </div>
        </main>
    </div>

    <!-- صفحة سجل التقارير (المستقلة برمجياً) -->
    <div id="reportsPage" class="page hidden px-5 pt-8">
        <div class="flex items-center gap-4 mb-8">
            <button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-2xl shadow-sm text-xl">⬅</button>
            <h2 class="text-2xl font-bold text-gray-800">سجل التقارير</h2>
        </div>

        <div id="reportsList" class="space-y-4">
            <!-- التقارير ستظهر هنا برمجياً -->
            <div class="text-center py-20 text-gray-400 italic">لا توجد تقارير مسجلة بعد..</div>
        </div>
    </div>

    <!-- القائمة السفلية للتنقل -->
    <nav class="fixed bottom-0 w-full bg-[#004d40] text-white flex justify-around p-4 z-50 rounded-t-[40px] shadow-2xl">
        <button onclick="navigateTo('dashboardPage')" id="nav-home" class="flex flex-col items-center text-green-400"><span class="text-xl">🏠</span><span class="text-[9px] font-bold">الرئيسية</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-xl">📊</span><span class="text-[9px] font-bold">التقارير</span></button>
    </nav>

    <!-- النافذة المنبثقة (Modal) كما هي مع تحسين الحفظ -->
    <div id="logModal" class="fixed inset-0 bg-black/70 z-[60] hidden flex items-end">
        <div class="bg-white w-full rounded-t-[45px] p-8 animate-slide-up shadow-2xl">
            <div class="w-16 h-1.5 bg-gray-200 rounded-full mx-auto mb-8"></div>
            <h3 id="modalTitle" class="text-2xl font-bold mb-8 text-gray-800 text-center italic underline decoration-green-500">سجل البيانات</h3>
            
            <div class="space-y-6 mb-10">
                <input type="number" id="tempInput" placeholder="أدخل القراءة هنا (°C)" class="w-full bg-gray-50 p-5 rounded-3xl outline-none border-2 border-gray-100 text-3xl font-bold text-center focus:border-green-500">
                
                <div class="bg-blue-50 p-5 rounded-3xl flex items-center justify-between border-2 border-blue-100 relative overflow-hidden">
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleImage(this)">
                    <div id="previewContainer" class="hidden absolute inset-0 bg-white z-10 flex items-center justify-between p-2">
                         <img id="imagePreview" src="#" class="h-full rounded-xl object-cover">
                         <button onclick="resetCamera()" class="text-xs bg-red-100 text-red-600 px-4 py-2 rounded-full font-bold">حذف</button>
                    </div>
                    <p id="cameraStatus" class="text-xs font-bold text-blue-900">يجب التوثيق بالصورة 📸</p>
                    <button onclick="document.getElementById('cameraInput').click()" class="bg-blue-600 text-white p-4 rounded-2xl">📷</button>
                </div>
            </div>

            <div class="flex gap-4">
                <button onclick="closeModal()" class="flex-1 p-5 rounded-3xl bg-gray-100 text-gray-500 font-bold">إلغاء</button>
                <button onclick="submitData()" class="flex-1 p-5 rounded-3xl bg-green-600 text-white font-bold shadow-lg">إرسال التقرير</button>
            </div>
        </div>
    </div>

    <script>
        let reports = JSON.parse(localStorage.getItem('verra_reports')) || [];

        function navigateTo(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
            
            // تحديث ألوان القائمة السفلية
            const isHome = pageId === 'dashboardPage';
            document.getElementById('nav-home').className = isHome ? "flex flex-col items-center text-green-400" : "flex flex-col items-center text-white/40";
            document.getElementById('nav-reports').className = !isHome ? "flex flex-col items-center text-green-400" : "flex flex-col items-center text-white/40";
            
            if(pageId === 'reportsPage') renderReports();
        }

        function openModal(title) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('logModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('logModal').classList.add('hidden');
            resetCamera();
        }

        function handleImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('previewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function resetCamera() {
            document.getElementById('cameraInput').value = "";
            document.getElementById('previewContainer').classList.add('hidden');
        }

        function submitData() {
            const temp = document.getElementById('tempInput').value;
            const photo = document.getElementById('imagePreview').src;

            if(!temp || photo.includes('#')) { alert('أكمل البيانات والصورة أولاً!'); return; }

            const newReport = {
                id: Date.now(),
                title: document.getElementById('modalTitle').innerText,
                value: temp,
                image: photo,
                date: new Date().toLocaleDateString('ar-SA'),
                time: new Date().toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit'}),
                status: parseFloat(temp) <= 5 ? 'آمن' : 'خطر'
            };

            reports.unshift(newReport);
            localStorage.setItem('verra_reports', JSON.stringify(reports));
            
            alert('تم الحفظ بنجاح! انتقل للسجل لرؤية التقرير.');
            updateDashboard();
            closeModal();
        }

        function renderReports() {
            const list = document.getElementById('reportsList');
            if (reports.length === 0) return;

            list.innerHTML = reports.map(r => `
                <div class="bg-white p-4 rounded-[25px] shadow-sm flex items-center gap-4 border-r-8 ${r.status === 'آمن' ? 'border-green-500' : 'border-red-500'}">
                    <img src="${r.image}" class="w-16 h-16 rounded-2xl object-cover border">
                    <div class="flex-1">
                        <p class="font-bold text-sm">${r.title}</p>
                        <p class="text-[10px] text-gray-400">${r.date} | ${r.time}</p>
                        <p class="text-xs font-bold mt-1 ${r.status === 'آمن' ? 'text-green-600' : 'text-red-600'}">القراءة: ${r.value}°C (${r.status})</p>
                    </div>
                    <button class="bg-gray-50 p-2 rounded-xl text-lg">📄</button>
                </div>
            `).join('');
        }

        function updateDashboard() {
            document.getElementById('reportCount').innerText = reports.length;
        }

        // تشغيل أولي
        updateDashboard();
    </script>
</body>
</html>
