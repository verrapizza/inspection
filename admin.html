<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERRA PRO - لوحة الإدارة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background: #f4f7f6; margin: 0; }
    .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    .card { background: white; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .report-card { border-right: 8px solid #004b47; }
    .nav-tab { padding: 12px 20px; border-radius: 15px; font-weight: bold; cursor: pointer; }
    .nav-tab.active { background: #004b47; color: white; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const firebaseConfig = {
      apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
      authDomain: "verra-system-828f2.firebaseapp.com",
      projectId: "verra-system-828f2",
      storageBucket: "verra-system-828f2.firebasestorage.app",
      messagingSenderId: "961104891607",
      appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";

    // البنود (نفس النسخة لضمان الـ PDF)
    const sectionsData = [{ title: "الاستلام والتخزين", items: [{id:1,q:"فحص درجات حرارة المواد الغذائية الواردة"},{id:2,q:"درجة حرارة المجمدات ≤ -18°م"},{id:3,q:"درجة حرارة المبردات ≤ 4°م"}]}];

    const buildReportHTML = (branch, email, location, score, answers, notes, photos, signature) => {
        return `<div style="width:750px; padding:40px; direction:rtl; text-align:right;"><img src="${LOGO_URL}" style="height:120px; display:block; margin:0 auto;" /><h1 style="text-align:center; color:#004b47; font-weight:900;">تقرير الجودة</h1><div style="background:#f8fafc; padding:20px; border-radius:15px; border:1px solid #ddd;"><p><b>🏢 المنشأة:</b> ${branch}</p><p><b>👤 المفتش:</b> ${email}</p><p><b>📈 النتيجة:</b> ${score}%</p></div><img src="${signature}" style="width:250px; border-bottom:2px solid #004b47; margin-top:20px" /></div>`;
    };

    function App() {
      const [reports, setReports] = useState([]);
      const [branches, setBranches] = useState([]);
      const [activeView, setActiveView] = useState("reports");
      const [newBranch, setNewBranch] = useState("");
      const chartInstance = useRef(null);

      useEffect(() => {
        db.collection("inspections").orderBy("timestamp", "desc").onSnapshot(snap => setReports(snap.docs.map(d => ({id: d.id, ...d.data()}))));
        db.collection("branches").onSnapshot(snap => setBranches(snap.docs.map(d => ({id: d.id, ...d.data()}))));
      }, []);

      useEffect(() => {
        if (activeView === "reports" && reports.length > 0) {
          const ctx = document.getElementById('complianceChart');
          if (ctx) {
            if (chartInstance.current) chartInstance.current.destroy();
            chartInstance.current = new Chart(ctx, { type: 'bar', data: { labels: reports.slice(0, 5).map(r => r.branch), datasets: [{ data: reports.slice(0, 5).map(r => r.score), backgroundColor: '#004b47' }] }, options: { responsive: true, maintainAspectRatio: false } });
          }
        }
      }, [reports, activeView]);

      return (
        <div className="pb-40">
           <header className="verra-gradient p-10 text-center shadow-xl rounded-b-[3.5rem]">
              <img src={LOGO_URL} className="h-24 mx-auto mb-4" />
              <h1 className="text-xl font-bold text-white uppercase">مركز الإدارة العليا</h1>
              <a href="index.html" className="mt-4 inline-block bg-white/10 text-white px-5 py-2 rounded-2xl text-xs font-bold border border-white/20">الميدان ⬅️</a>
           </header>
           <main className="p-4 max-w-2xl mx-auto -mt-10">
              <div className="flex bg-white p-2 rounded-2xl shadow-lg mb-8 gap-2">
                 <div onClick={()=>setActiveView("reports")} className={`nav-tab flex-1 text-center ${activeView==="reports"?"active":""}`}>سجل التقارير</div>
                 <div onClick={()=>setActiveView("settings")} className={`nav-tab flex-1 text-center ${activeView==="settings"?"active":""}`}>إدارة الفروع</div>
              </div>
              {activeView === "reports" ? (
                <div>
                   <div className="card p-5 mb-8"><canvas id="complianceChart" height="200"></canvas></div>
                   {reports.map(rep => (
                     <div key={rep.id} className="card p-4 flex flex-row items-center bg-white gap-3 report-card mb-4 text-right">
                        <div className="text-left flex-1 min-w-0 pr-1">
                           <p className="font-bold text-green-950 text-[13px] mb-1 truncate">{rep.branch}</p>
                           <p className="text-[9px] text-gray-400 font-bold">📅 ${rep.date} | 👤 ${rep.inspector.split('@')[0]}</p>
                        </div>
                        <span className="text-lg font-black text-green-700">${rep.score}%</span>
                        <button onClick={() => {
                           const signature = rep.signature || "";
                           const html = buildReportHTML(rep.branch, rep.inspector, rep.location, rep.score, rep.answers, rep.notes, rep.photos, signature);
                           html2pdf().from(html).set({margin:0, filename:`Rep_${rep.branch}.pdf`, html2canvas:{scale:2, useCORS:true, scrollY:0}, jsPDF:{unit:'mm', format:'a4'}}).save();
                        }} className="bg-blue-50 p-2.5 rounded-xl text-blue-600 shadow-sm font-bold">📥 تحميل</button>
                     </div>
                   ))}
                </div>
              ) : (
                <div>
                  <div className="card p-6 mb-8 border-t-8 border-green-800 text-right">
                    <input value={newBranch} onChange={e=>setNewBranch(e.target.value)} className="w-full border-2 p-3 rounded-xl mb-4 text-right" placeholder="اسم الفرع..." />
                    <button onClick={()=>{ db.collection("branches").add({name:newBranch}); setNewBranch(""); alert("تم!"); }} className="verra-gradient text-white px-6 py-2 rounded-xl font-bold w-full">إضافة فرع</button>
                  </div>
                  {branches.map(b => (
                     <div key={b.id} className="card p-4 flex justify-between items-center mb-3">
                        <p className="font-bold">{b.name}</p>
                        <button onClick={()=>db.collection("branches").doc(b.id).delete()} className="text-red-500 font-bold">حذف 🗑</button>
                     </div>
                  ))}
                </div>
              )}
           </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
