<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERRA PRO - الإدارة المركزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; -webkit-tap-highlight-color: transparent; text-align: right; }
        .hidden { display: none; }
        .verra-card { background: white; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; transition: all 0.2s; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; display: none; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; height: 92vh; border-radius: 40px 40px 0 0; padding: 30px 20px; overflow-y: auto; position: relative; }
        .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
        .tab-btn { flex: 1; padding: 10px; font-size: 10px; font-weight: 900; border-radius: 15px; transition: all 0.3s; color: #64748b; }
        .tab-btn.active { background: #d1ba89; color: white; box-shadow: 0 4px 10px rgba(209, 186, 137, 0.3); }
        .text-verra-green { color: #1C780B !important; }
        .text-verra-red { color: #D91414 !important; }
        .border-verra-green { border-color: #1C780B !important; }
        .border-verra-red { border-color: #D91414 !important; }

        /* تأثير الوميض للتنبيهات */
        @keyframes blinker { 50% { opacity: 0; } }
        .blink-alert { animation: blinker 0.8s linear infinite; color: #D91414; font-weight: 900; }
    </style>
</head>
<body class="pb-32">

    <div id="lockScreen" class="fixed inset-0 bg-white z-[500] flex flex-col items-center justify-center font-bold text-[#004b47]">
        <div class="w-12 h-12 border-4 border-t-green-500 border-gray-200 rounded-full animate-spin mb-4"></div>
        جاري مزامنة بيانات الرقابة...
    </div>

    <!-- الصفحة الرئيسية -->
    <div id="dashboardPage" class="page">
        <header class="bg-[#004b47] p-10 pb-28 rounded-b-[60px] text-white shadow-2xl relative text-right">
            <div class="flex justify-between items-center relative z-10">
                <div class="text-right">
                    <h1 class="text-3xl font-black italic uppercase tracking-tighter">Verra <span class="text-[#d1ba89]">Pro</span></h1>
                    <p class="text-[10px] opacity-70 font-bold tracking-widest uppercase">Visual Analytics Dashboard</p>
                </div>
                <button onclick="auth.signOut()" class="bg-red-500/20 text-red-200 px-4 py-2 rounded-xl text-[10px] font-bold border border-red-500/30">خروج ↪</button>
            </div>
        </header>

        <main class="px-6 -mt-16 relative z-10 text-right">
            <div class="grid grid-cols-2 gap-4 mb-6 text-center">
                <div class="verra-card p-6 border-b-4 border-gray-200 shadow-lg"><p class="text-gray-400 text-[10px] font-bold mb-1 uppercase">متوسط الامتثال</p><h2 id="totalScore" class="text-3xl font-black">--</h2></div>
                <div onclick="navigateTo('reportsPage')" class="verra-card p-6 border-b-4 border-blue-600 shadow-lg"><p class="text-gray-400 text-[10px] font-bold mb-1 uppercase">التقارير</p><h2 id="reportCount" class="text-3xl font-black text-blue-700">0</h2></div>
            </div>

            <div class="verra-card p-6 mb-6 shadow-xl border border-gray-100">
                <h4 class="text-[11px] font-black text-[#004b47] mb-4">📊 مؤشر أداء الفروع اللحظي</h4>
                <canvas id="branchChart" height="220"></canvas>
            </div>

            <div class="space-y-4">
                <div class="verra-card p-7 border-r-[12px] border-[#004b47] shadow-xl text-right" onclick="window.location.href='quality-inspection.html'"><h3 class="font-black text-gray-800 text-lg">🛡️ مراقبة الجودة</h3></div>
                <div class="verra-card p-7 border-r-[12px] border-blue-600 shadow-xl text-right" onclick="window.location.href='branches-inspector.html'"><h3 class="font-black text-gray-800 text-lg">🏢 متابعة الفروع</h3></div>
                <div class="verra-card p-7 border-r-[12px] border-green-700 shadow-xl text-right" onclick="window.location.href='checklist.html'"><h3 class="font-black text-gray-800 text-lg">✅ تشيك ليست المساعدين</h3></div>
                <div class="verra-card p-7 mb-10 border-r-[12px] border-[#d1ba89] shadow-xl text-right" onclick="navigateTo('usersPage')"><h3 class="font-black text-gray-800 text-lg text-right">👤 إدارة الصلاحيات</h3></div>
            </div>
        </main>
    </div>

    <!-- سجل التقارير -->
    <div id="reportsPage" class="page hidden px-4 pt-6 text-right">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-[#004b47]">📋 سجل التقارير</h2>
            <button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full text-xs font-black shadow-sm border">رجوع</button>
        </div>
        
        <div class="flex bg-gray-200/50 p-1 rounded-2xl mb-6">
            <button onclick="setReportTab('all')" id="tab-all" class="tab-btn active">الكل</button>
            <button onclick="setReportTab('quality')" id="tab-quality" class="tab-btn">الجودة</button>
            <button onclick="setReportTab('branches')" id="tab-branches" class="tab-btn">الفروع</button>
            <button onclick="setReportTab('checklist')" id="tab-checklist" class="tab-btn">المساعدين</button>
        </div>

        <div class="bg-white p-4 rounded-[25px] shadow-sm mb-6 border border-gray-100">
            <input type="text" id="reportSearch" oninput="renderReportsList()" placeholder="🔍 ابحث عن فرع أو مفتش..." class="w-full p-3 rounded-xl bg-gray-50 text-sm outline-none">
        </div>

        <div id="logsSummary" class="flex justify-around mb-6 text-center bg-[#004b47] text-white p-4 rounded-[25px] shadow-lg">
            <div><p class="text-[9px] opacity-60 uppercase">التقارير</p><p id="sumCount" class="text-lg font-black">0</p></div>
            <div class="border-x border-white/10 px-4"><p class="text-[9px] opacity-60 uppercase">المتوسط</p><p id="sumAvg" class="text-lg font-black">0%</p></div>
            <div><p class="text-[9px] opacity-60 uppercase text-red-400 font-black">تنبيهات 🚨</p><p id="sumAlerts" class="text-lg font-black text-red-500">0</p></div>
        </div>

        <div id="reportsList" class="space-y-4 pb-32"></div>
    </div>

    <!-- إدارة المستخدمين -->
    <div id="usersPage" class="page hidden px-4 pt-6 text-right">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-[#004b47]">👥 الصلاحيات</h2>
            <button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full text-xs border text-right">رجوع</button>
        </div>
        <div id="activeUsersList" class="space-y-3 pb-32"></div>
    </div>

    <!-- نافذة المعاينة -->
    <div id="reportDetailModal" class="modal">
        <div class="modal-content text-right">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <button onclick="closeModal()" class="bg-red-50 text-red-500 w-10 h-10 rounded-full font-black">X</button>
                <h3 class="text-2xl font-black text-green-950 italic">تفاصيل التقرير</h3>
            </div>
            <div id="detailBody" class="space-y-5"></div>
            <div class="mt-10 pb-10 border-t pt-8">
                <button id="downloadBtn" class="w-full verra-gradient text-white p-5 rounded-3xl font-black shadow-xl flex justify-center items-center gap-3">
                    <span id="btnText">📄 تحميل PDF التقرير الكامل</span>
                </button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-[#004b47] text-white flex justify-around p-5 z-50 rounded-t-[45px] shadow-2xl border-t border-white/10">
        <button onclick="navigateTo('dashboardPage')" id="nav-dashboard" class="flex flex-col items-center text-[#d1ba89]"><span class="text-2xl">🏠</span><span class="text-[9px] font-black mt-1 uppercase text-right">Main</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-2xl text-right">📊</span><span class="text-[9px] font-black mt-1 uppercase text-right">Logs</span></button>
        <button onclick="navigateTo('usersPage')" id="nav-users" class="flex flex-col items-center text-white/40"><span class="text-2xl text-right">👤</span><span class="text-[9px] font-black mt-1 uppercase text-right">Users</span></button>
    </nav>

    <script>
        const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";
        const firebaseConfig = { apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0", authDomain: "verra-system-828f2.firebaseapp.com", projectId: "verra-system-828f2", storageBucket: "verra-system-828f2.firebasestorage.app", messagingSenderId: "961104891607", appId: "1:961104891607:web:5ffd3af4983a8b015b6a92" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let cloudReports = [], cloudUsers = [], currentTab = 'all', branchChart = null;

        // القواميس الكاملة (محفوظة لدقة الـ PDF)
        const sectionsAssistant = [{ title: "الواجهة والصالات", items: [{id:1, ar:"تشيك قسم واجهة المطعم..."},{id:2, ar:"تشيك قسم صالة 1..."},{id:3, ar:"تشيك الحمام صالة 1..."},{id:9, ar:"تشيك قسم صالة 2..."},{id:10, ar:"تشيك الحمام صالة 2..."},{id:11, ar:"تشيك على الأشجار..."}] }];
        const sectionsQuality = [{ title: "الجودة", items: [{id:1,q:"فحص الحرارة..."},{id:11,q:"تحضير العجين..."},{id:34,q:"التنظيف والتعقيم..."}] }];
        const sectionsBranches = [{ title: "متابعة الفروع", items: [{id:301, ar:"تشيك عام على تشغيل الفرع"}] }];

        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection("authorized_users").where("email", "==", user.email.toLowerCase().trim()).get().then(snap => {
                    if (user.email === "ch3f.ramzi@gmail.com" || (!snap.empty && snap.docs[0].data().role === 'admin')) {
                        document.getElementById('lockScreen').classList.add('hidden'); startSync();
                    } else { window.location.href = "index.html"; }
                });
            } else { window.location.href = "index.html"; }
        });

        function fixNums(str) { return str ? str.toString().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)) : "0"; }

        function startSync() {
            db.collection("inspections").onSnapshot(snap => {
                cloudReports = snap.docs.map(doc => ({ docId: doc.id, ...doc.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                updateUI(); renderAnalytics();
            });
            db.collection("authorized_users").onSnapshot(snap => { cloudUsers = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderUsers(); });
        }

        // دالة فحص المخالفات: أي إجابة بـ "لا" تعتبر مخالفة حرجة
        function hasAnyNo(report) {
            if (!report.answers) return false;
            return Object.values(report.answers).some(a => a === 'no');
        }

        function renderAnalytics() {
            if (cloudReports.length === 0) return;
            const branchData = {};
            cloudReports.forEach(r => {
                if (!branchData[r.branch]) branchData[r.branch] = { sum: 0, count: 0 };
                branchData[r.branch].sum += (parseFloat(r.score) || 0);
                branchData[r.branch].count += 1;
            });
            const labels = Object.keys(branchData);
            const averages = labels.map(l => Math.round(branchData[l].sum / branchData[l].count));
            const colors = averages.map(v => v >= 50 ? '#1C780B' : '#D91414');
            const ctx = document.getElementById('branchChart').getContext('2d');
            if (branchChart) branchChart.destroy();
            branchChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ data: averages, backgroundColor: colors, borderRadius: 8 }] },
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100 } } }
            });
        }

        function updateUI() {
            const scoreEl = document.getElementById('totalScore');
            document.getElementById('reportCount').innerText = fixNums(cloudReports.length);
            if(cloudReports.length > 0) {
                let sum = cloudReports.reduce((acc, curr) => acc + (parseFloat(curr.score) || 0), 0);
                let avg = Math.round(sum / cloudReports.length);
                scoreEl.innerText = fixNums(avg) + "%";
                scoreEl.className = `text-3xl font-black ${avg >= 50 ? 'text-verra-green' : 'text-verra-red'}`;
            }
            renderReportsList();
        }

        function renderReportsList() {
            const search = document.getElementById('reportSearch').value.toLowerCase();
            const filtered = cloudReports.filter(r => {
                const matchesSearch = (r.branch + (r.inspector || "")).toLowerCase().includes(search);
                let matchesTab = true;
                if (currentTab === 'quality') matchesTab = (r.type?.includes('Quality'));
                else if (currentTab === 'branches') matchesTab = (r.type === 'Branch Report');
                else if (currentTab === 'checklist') matchesTab = (r.type === 'Assistant Checklist');
                return matchesSearch && matchesTab;
            });

            // حساب التنبيهات بناءً على وجود أي "لا"
            const alertCount = filtered.filter(r => hasAnyNo(r)).length;
            if(document.getElementById('sumAlerts')) document.getElementById('sumAlerts').innerText = fixNums(alertCount);
            if(document.getElementById('sumCount')) document.getElementById('sumCount').innerText = fixNums(filtered.length);

            document.getElementById('reportsList').innerHTML = filtered.map((r) => {
                const score = parseFloat(r.score) || 0;
                const isPass = score >= 50;
                const isCritical = hasAnyNo(r); // هل يوجد أي بند رسب فيه؟
                const borderC = isPass ? 'border-verra-green' : 'border-verra-red';

                return `
                <div onclick="viewDetail('${r.docId}')" class="verra-card p-5 border-r-8 ${borderC} mb-4 flex justify-between items-center text-right shadow-sm">
                    <div class="flex items-center gap-3">
                        <button onclick="event.stopPropagation(); if(confirm('حذف؟')) db.collection('inspections').doc('${r.docId}').delete()" class="text-gray-300 p-2">🗑️</button>
                        <div class="${isPass ? 'bg-[#1C780B]' : 'bg-[#D91414]'} text-white px-3 py-1 rounded-full text-xs font-black shadow-sm">${fixNums(score)}%</div>
                    </div>
                    <div class="text-right">
                        <h4 class="font-black text-gray-800 text-sm mb-1 flex items-center gap-2 justify-end">
                            ${isCritical ? '<span class="blink-alert text-right">🚨</span>' : ''} 
                            ${r.branch}
                        </h4>
                        <div class="text-[10px] text-gray-400 font-bold uppercase">📅 ${fixNums(r.date)} | 👤 ${r.inspector?.split('@')[0]}</div>
                    </div>
                </div>`;
            }).join('') || '<p class="text-center py-10 text-gray-400 text-xs font-bold text-right text-right text-right">لا توجد نتائج</p>';
        }

        function viewDetail(docId) {
            const r = cloudReports.find(x => x.docId === docId);
            const isCritical = hasAnyNo(r);
            document.getElementById('detailBody').innerHTML = `
                <div class="bg-gray-50 p-6 rounded-3xl text-center border shadow-sm">
                    ${isCritical ? '<p class="text-red-600 font-black text-xs mb-2 blink-alert">🚨 تنبيه: يوجد بنود غير مطابقة في هذا التقرير!</p>' : ''}
                    <h2 class="text-2xl font-black text-[#004b47] mb-2 uppercase">${r.branch}</h2>
                    <p class="text-xs font-bold text-gray-400 mb-4">📅 ${fixNums(r.date)} | 👤 ${r.inspector}</p>
                    <div class="text-6xl font-black ${r.score >= 50 ? 'text-verra-green' : 'text-verra-red'}">${fixNums(r.score)}%</div>
                </div>`;
            document.getElementById('downloadBtn').onclick = () => generateFullPDF(r);
            document.getElementById('reportDetailModal').classList.add('active');
        }

        async function generateFullPDF(r) {
            document.getElementById('btnText').innerText = "جاري بناء الملف... ⏳";
            const html = `<div style="width:750px; padding:40px; direction:rtl; text-align:right; font-family:sans-serif;">
                <div style="text-align:center;"><img src="${LOGO_URL}" style="height:100px;"/>
                <h1 style="color:#004b47; border-bottom:5px solid #d1ba89; display:inline-block; padding-bottom:10px;">تقرير التدقيق الرسمي لـ فيرا برو</h1></div>
                <div style="background:#f8fafc; padding:25px; border-radius:20px; margin:30px 0; display:table; width:100%;">
                    <div style="display:table-cell; width:70%; line-height:2.2;"><b>🏢 المنشأة:</b> ${r.branch}<br><b>👤 المسؤول:</b> ${r.inspector}<br><b>📅 التاريخ:</b> ${fixNums(r.date)}</div>
                    <div style="display:table-cell; width:30%; text-align:center; border-right:4px solid #004b47; vertical-align:middle;">
                        <div style="font-size:50px; font-weight:900; color:${r.score>=50?'#1C780B':'#D91414'};">${fixNums(r.score)}%</div>
                    </div>
                </div>
                <div style="margin-top:60px; text-align:right;"><p style="font-weight:900;">التوقيع:</p><img src="${r.signature}" style="width:300px; height:100px; object-fit:contain;"/></div>
            </div>`;
            html2pdf().from(html).set({ margin:10, filename:`Report_${r.branch}.pdf`, image:{type:'jpeg', quality:1.0}, html2canvas:{scale:2, useCORS:true}, jsPDF:{unit:'mm', format:'a4', orientation:'portrait'} }).save().then(()=> document.getElementById('btnText').innerText="📄 تحميل PDF التقرير الكامل");
        }

        function renderUsers() {
            const roleOrder = { 'admin': 1, 'quality': 2, 'supervisor': 3, 'assistant': 4 };
            const activeFiltered = cloudUsers.sort((a, b) => (roleOrder[a.role] || 99) - (roleOrder[b.role] || 99));
            document.getElementById('activeUsersList').innerHTML = activeFiltered.map(u => {
                let roleStyles = { admin: { bg: 'bg-black text-white', name: 'الإدارة العامة' }, quality: { bg: 'bg-purple-100 text-purple-600', name: 'مشرف جودة' }, supervisor: { bg: 'bg-blue-100 text-blue-600', name: 'مشرف فروع' }, assistant: { bg: 'bg-orange-100 text-orange-600', name: 'مساعد مشرف فروع' } };
                let style = roleStyles[u.role] || { bg: 'bg-gray-100', name: 'عضو' };
                return `<div class="bg-white rounded-[25px] p-5 flex justify-between items-center shadow-sm border mb-4 text-right"><div class="flex items-center gap-4 text-right"><div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-xl text-right">👤</div><div class="text-right text-right"><h5 class="font-black text-gray-800 text-sm text-right">${u.email.split('@')[0]}</h5><span class="${style.bg} text-[9px] font-black px-3 py-1 rounded-lg uppercase tracking-wider">${style.name}</span></div></div><button onclick="if(confirm('سحب؟')) db.collection('authorized_users').doc('${u.id}').delete()" class="text-gray-300 hover:text-red-500 p-2 text-right">🗑️</button></div>`;
            }).join('');
        }

        function setReportTab(t) { currentTab = t; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById('tab-'+t).classList.add('active'); renderReportsList(); }
        function navigateTo(id) { document.querySelectorAll('.page').forEach(p => p.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
        function closeModal() { document.getElementById('reportDetailModal').classList.remove('active'); }
        
        startSync();
    </script>
</body>
</html>
