<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERRA Pro - المزامنة الشاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        .page { transition: 0.3s; }
        .hidden { display: none; }
        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slide-up 0.3s ease-out; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-32">

    <!-- الصفحة الرئيسية -->
    <div id="dashboardPage" class="page">
        <header class="bg-[#004d40] p-10 pb-28 rounded-b-[60px] text-white shadow-2xl relative overflow-hidden">
            <div class="flex justify-between items-center relative z-10">
                <div>
                    <h1 class="text-3xl font-bold italic tracking-tighter">VERRA <span class="text-green-400 text-xs font-bold border px-1 rounded">SYNC</span></h1>
                    <p class="text-[10px] mt-1 opacity-80 font-bold italic font-mono uppercase">Food Safety Smart Hub</p>
                </div>
                <div class="w-14 h-14 bg-green-500 rounded-[20px] flex items-center justify-center font-bold shadow-2xl border-2 border-white/20">R</div>
            </div>
        </header>

        <main class="px-6 -mt-16 relative z-10">
            <!-- عدادات المزامنة -->
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-white p-6 rounded-[35px] shadow-sm border-b-4 border-green-500">
                    <p class="text-gray-400 text-[10px] font-bold">حالة المزامنة</p>
                    <h2 id="syncStatus" class="text-sm font-bold text-green-600 italic">متصل ✅</h2>
                </div>
                <div onclick="navigateTo('reportsPage')" class="bg-white p-6 rounded-[35px] shadow-sm border-b-4 border-blue-500">
                    <p class="text-gray-400 text-[10px] font-bold">إجمالي التقارير</p>
                    <h2 id="totalReports" class="text-3xl font-bold text-blue-600 font-mono">0</h2>
                </div>
            </div>

            <!-- بطاقة المشرف المحدثة -->
            <div class="bg-white p-6 rounded-[40px] shadow-sm mb-8 border-r-[12px] border-[#004d40]">
                <h3 class="font-bold text-gray-700 text-lg mb-2">تفتيش مشرف الجودة</h3>
                <p class="text-[10px] text-gray-400 mb-6 font-bold leading-relaxed">عند الانتهاء من التقرير في الأداة الخارجية، اضغط "حفظ" ثم عُد هنا لرؤيته تلقائياً.</p>
                
                <a href="https://verrapizza.github.io/inspection/" class="w-full bg-[#004d40] text-white p-5 rounded-[25px] font-bold shadow-lg flex justify-between items-center active:scale-95 transition-transform">
                    <span>دخول أداة التفتيش</span>
                    <span class="text-xl">⮕</span>
                </a>
            </div>

            <button onclick="refreshData()" class="w-full text-xs text-gray-400 font-bold underline mb-10">تحديث البيانات يدوياً 🔄</button>
        </main>
    </div>

    <!-- صفحة سجل التقارير -->
    <div id="reportsPage" class="page hidden px-6 pt-10">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-gray-800 italic underline decoration-green-500 underline-offset-8">سجل التقارير</h2>
            <button onclick="navigateTo('dashboardPage')" class="bg-gray-200 p-3 rounded-full text-sm font-bold">⬅</button>
        </div>
        <div id="reportsList" class="space-y-4">
            <!-- التقارير تظهر هنا -->
        </div>
    </div>

    <!-- إدارة الفروع -->
    <div id="branchesPage" class="page hidden px-6 pt-10">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold italic">الفروع</h2>
            <button onclick="addBranch()" class="bg-[#004d40] text-white px-4 py-2 rounded-xl text-xs font-bold">+ فرع</button>
        </div>
        <div id="branchesList" class="space-y-4"></div>
    </div>

    <!-- القائمة السفلية -->
    <nav class="fixed bottom-0 w-full bg-[#004d40] text-white flex justify-around p-5 z-50 rounded-t-[45px] shadow-2xl">
        <button onclick="navigateTo('dashboardPage')" id="nav-dashboard" class="flex flex-col items-center text-green-400"><span class="text-2xl">🏠</span><span class="text-[9px] font-bold mt-1">الرئيسية</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-2xl">📊</span><span class="text-[9px] font-bold mt-1">التقارير</span></button>
        <button onclick="navigateTo('branchesPage')" id="nav-branches" class="flex flex-col items-center text-white/40"><span class="text-2xl">🏢</span><span class="text-[9px] font-bold mt-1">الفروع</span></button>
    </nav>

    <script>
        // تعريف الأسماء المحتملة للمفاتيح في أداة التفتيش
        const POSSIBLE_KEYS = ['v2_reports', 'reports', 'inspection_reports', 'saved_reports', 'inspection_data'];
        let allReports = [];

        // وظيفة البحث الذكي عن البيانات
        function refreshData() {
            allReports = [];
            
            // 1. البحث في الأسماء الشائعة
            POSSIBLE_KEYS.forEach(key => {
                let data = localStorage.getItem(key);
                if (data) {
                    try {
                        let parsed = JSON.parse(data);
                        if (Array.isArray(parsed)) {
                            allReports = [...allReports, ...parsed];
                        } else if (typeof parsed === 'object') {
                            allReports.push(parsed); // لو كان تقرير واحد فقط
                        }
                    } catch (e) { console.error("Error parsing key: " + key); }
                }
            });

            // 2. إزالة التكرار بناءً على التاريخ أو الـ ID لو وجد
            allReports = allReports.filter((v, i, a) => a.findIndex(t => (t.id === v.id || JSON.stringify(t) === JSON.stringify(v))) === i);
            
            // ترتيب من الأحدث للأقدم
            allReports.sort((a, b) => new Date(b.date || b.timestamp) - new Date(a.date || a.timestamp));

            updateStats();
            if(!document.getElementById('reportsPage').classList.contains('hidden')) renderReports();
        }

        function navigateTo(id) {
            refreshData();
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-green-400', 'text-white/40'));
            const shortId = id.replace('Page','');
            document.getElementById('nav-' + shortId).classList.replace('text-white/40', 'text-green-400');
        }

        function renderReports() {
            const list = document.getElementById('reportsList');
            if(allReports.length === 0) {
                list.innerHTML = '<div class="text-center py-20 text-gray-400 italic">لا توجد تقارير في الذاكرة. تأكد من ضغط "حفظ" في أداة التفتيش.</div>';
                return;
            }
            list.innerHTML = allReports.map(r => `
                <div class="bg-white p-5 rounded-[30px] shadow-sm border-r-[10px] ${r.status === 'خطر' || r.isCrit ? 'border-red-500' : 'border-green-500'}">
                    <p class="font-bold text-gray-800">${r.branch || r.title || 'تقرير تفتيش'}</p>
                    <p class="text-[9px] text-gray-400 mb-2">${r.date || 'تاريخ غير معروف'}</p>
                    <div class="flex justify-between items-center">
                        <p class="text-xs font-bold text-gray-600 italic">النتيجة: ${r.value || r.score || 'تم الفحص'}</p>
                        <span class="text-[10px] font-bold px-2 py-1 rounded-lg ${r.isCrit ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'}">
                            ${r.isCrit ? 'غير مطابق ⚠️' : 'مطابق ✅'}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('totalReports').innerText = allReports.length;
        }

        // ميزة ذكية: تحديث البيانات تلقائياً بمجرد عودة المستخدم للتطبيق (دون عمل ريفريش)
        window.addEventListener('focus', () => {
            console.log("Welcome back! Refreshing reports...");
            refreshData();
        });

        // تشغيل أولي
        refreshData();
    </script>
</body>
</html>
