<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERRA PRO - الإدارة المركزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; -webkit-tap-highlight-color: transparent; text-align: right; }
        .hidden { display: none; }
        .verra-card { background: white; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; transition: all 0.2s; }
        .verra-card:active { scale: 0.97; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; display: none; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; height: 92vh; border-radius: 40px 40px 0 0; padding: 30px 20px; overflow-y: auto; position: relative; }
        .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
        .tab-btn { flex: 1; padding: 10px; font-size: 10px; font-weight: 900; border-radius: 15px; transition: all 0.3s; color: #64748b; }
        .tab-btn.active { background: #d1ba89; color: white; box-shadow: 0 4px 10px rgba(209, 186, 137, 0.3); }
        canvas { max-width: 100% !important; height: auto !important; }
        
        /* تعريف الألوان الفاقعة */
        .text-neon-green { color: #00ff00 !important; text-shadow: 0 0 5px rgba(0,255,0,0.2); }
        .text-neon-red { color: #ff0000 !important; text-shadow: 0 0 5px rgba(255,0,0,0.2); }
        .bg-neon-green { background-color: #00ff00 !important; }
        .bg-neon-red { background-color: #ff0000 !important; }
    </style>
</head>
<body class="pb-32">

    <div id="lockScreen" class="fixed inset-0 bg-white z-[500] flex flex-col items-center justify-center font-bold text-[#004b47]">
        <div class="w-12 h-12 border-4 border-t-green-500 border-gray-200 rounded-full animate-spin mb-4"></div>
        <div id="lockStatus">جاري التحقق من صلاحيات الإدارة...</div>
    </div>

    <div id="dashboardPage" class="page">
        <header class="bg-[#004b47] p-10 pb-28 rounded-b-[60px] text-white shadow-2xl relative">
            <div class="flex justify-between items-center relative z-10">
                <div class="text-right">
                    <h1 class="text-3xl font-black italic uppercase tracking-tighter">Verra <span class="text-[#d1ba89]">Pro</span></h1>
                    <p class="text-[10px] opacity-70 font-bold tracking-widest uppercase">Visual Intelligence Dashboard</p>
                </div>
                <button onclick="auth.signOut()" class="bg-red-500/20 text-red-200 px-4 py-2 rounded-xl text-[10px] font-bold border border-red-500/30">خروج ↪</button>
            </div>
        </header>

        <main class="px-6 -mt-16 relative z-10">
            <div class="grid grid-cols-2 gap-4 mb-6 text-center">
                <!-- متوسط الامتثال بالألوان الفاقعة -->
                <div class="verra-card p-6 border-b-4 border-gray-200 shadow-lg">
                    <p class="text-gray-400 text-[10px] font-bold mb-1 uppercase">متوسط الامتثال</p>
                    <h2 id="totalScore" class="text-3xl font-black">--</h2>
                </div>
                <div onclick="navigateTo('reportsPage')" class="verra-card p-6 border-b-4 border-blue-600 shadow-lg">
                    <p class="text-gray-400 text-[10px] font-bold mb-1 uppercase">إجمالي التقارير</p>
                    <h2 id="reportCount" class="text-3xl font-black text-blue-700">0</h2>
                </div>
            </div>

            <!-- الرسم البياني الملون -->
            <div class="verra-card p-6 mb-6 shadow-xl border border-gray-100">
                <h4 class="text-[11px] font-black text-[#004b47] mb-4">📊 أداء الفروع اللحظي</h4>
                <canvas id="branchChart" height="220"></canvas>
            </div>

            <div class="space-y-4">
                <div class="verra-card p-7 border-r-[12px] border-[#004b47] shadow-xl text-right" onclick="window.location.href='quality-inspection.html'"><h3 class="font-black text-gray-800 text-lg">🛡️ مراقبة الجودة</h3></div>
                <div class="verra-card p-7 border-r-[12px] border-blue-600 shadow-xl text-right" onclick="window.location.href='branches-inspector.html'"><h3 class="font-black text-gray-800 text-lg">🏢 متابعة الفروع</h3></div>
                <div class="verra-card p-7 border-r-[12px] border-green-700 shadow-xl text-right" onclick="window.location.href='checklist.html'"><h3 class="font-black text-gray-800 text-lg">✅ تشيك ليست المساعدين</h3></div>
                <div class="verra-card p-7 mb-10 border-r-[12px] border-[#d1ba89] shadow-xl text-right" onclick="navigateTo('usersPage')"><h3 class="font-black text-gray-800 text-lg">👤 إدارة المستخدمين</h3><p id="pendingBadge" class="text-[9px] text-red-500 font-bold hidden mt-1">طلبات جديدة ⚠️</p></div>
            </div>
        </main>
    </div>

    <!-- سجل التقارير -->
    <div id="reportsPage" class="page hidden px-4 pt-6">
        <div class="flex justify-between items-center mb-6 text-right">
            <h2 class="text-2xl font-black text-[#004b47]">📋 سجل التقارير</h2>
            <button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full text-xs font-black shadow-sm border">رجوع</button>
        </div>
        <div class="flex bg-gray-200/50 p-1 rounded-2xl mb-6">
            <button onclick="setReportTab('all')" id="tab-all" class="tab-btn active">الكل</button>
            <button onclick="setReportTab('quality')" id="tab-quality" class="tab-btn">الجودة</button>
            <button onclick="setReportTab('branches')" id="tab-branches" class="tab-btn">الفروع</button>
            <button onclick="setReportTab('checklist')" id="tab-checklist" class="tab-btn">المساعدين</button>
        </div>
        <div id="reportsList" class="space-y-4 pb-32"></div>
    </div>

    <!-- إدارة المستخدمين -->
    <div id="usersPage" class="page hidden px-4 pt-6 text-right">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-[#004b47]">👥 إدارة الصلاحيات</h2>
            <button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full text-xs font-black shadow-sm border">رجوع</button>
        </div>
        <div id="activeUsersList" class="space-y-3 pb-32"></div>
    </div>

    <!-- نافذة المعاينة -->
    <div id="reportDetailModal" class="modal">
        <div class="modal-content text-right">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <button onclick="closeModal()" class="bg-red-50 text-red-500 w-10 h-10 rounded-full font-black">X</button>
                <h3 class="text-2xl font-black text-green-950 italic">تفاصيل التقرير</h3>
            </div>
            <div id="detailBody" class="space-y-5"></div>
            <div class="mt-10 pb-10 border-t pt-8">
                <button id="downloadBtn" class="w-full verra-gradient text-white p-5 rounded-3xl font-black shadow-xl flex justify-center items-center gap-3">📄 تحميل PDF التقرير الكامل</button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-[#004b47] text-white flex justify-around p-5 z-50 rounded-t-[45px] shadow-2xl border-t border-white/10 text-right">
        <button onclick="navigateTo('dashboardPage')" id="nav-dashboard" class="flex flex-col items-center text-[#d1ba89]"><span class="text-2xl">🏠</span><span class="text-[9px] font-black mt-1 uppercase">Main</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-2xl text-right">📊</span><span class="text-[9px] font-black mt-1 uppercase text-right">Logs</span></button>
        <button onclick="navigateTo('usersPage')" id="nav-users" class="flex flex-col items-center text-white/40"><span class="text-2xl text-right">👤</span><span class="text-[9px] font-black mt-1 uppercase text-right">Users</span></button>
    </nav>

    <script>
        const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";
        const firebaseConfig = { apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0", authDomain: "verra-system-828f2.firebaseapp.com", projectId: "verra-system-828f2", storageBucket: "verra-system-828f2.firebasestorage.app", messagingSenderId: "961104891607", appId: "1:961104891607:web:5ffd3af4983a8b015b6a92" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let cloudReports = [], cloudUsers = [], currentTab = 'all', branchChart = null;

        const ADMIN_MAIN = "ch3f.ramzi@gmail.com";

        // منطق التحقق من الصلاحية
        auth.onAuthStateChanged(user => {
            if (user) {
                if(user.email === ADMIN_MAIN) unlockAdmin();
                else {
                    db.collection("authorized_users").where("email", "==", user.email.toLowerCase().trim()).get().then(snap => {
                        if (!snap.empty && snap.docs[0].data().role === 'admin') unlockAdmin();
                        else window.location.href = "index.html";
                    });
                }
            } else window.location.href = "index.html";
        });

        function unlockAdmin() { document.getElementById('lockScreen').classList.add('hidden'); startSync(); }
        function fixNums(str) { return str ? str.toString().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)) : "0"; }

        function startSync() {
            db.collection("inspections").onSnapshot(snap => {
                cloudReports = snap.docs.map(doc => ({ docId: doc.id, ...doc.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                updateUI();
                renderAnalytics();
            });
            db.collection("authorized_users").onSnapshot(snap => { cloudUsers = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderUsers(); });
        }

        // دالة الرسم البياني مع منطق الألوان الفاقعة
        function renderAnalytics() {
            if (cloudReports.length === 0) return;
            const branchData = {};
            cloudReports.forEach(r => {
                if (!branchData[r.branch]) branchData[r.branch] = { sum: 0, count: 0 };
                branchData[r.branch].sum += (parseFloat(r.score) || 0);
                branchData[r.branch].count += 1;
            });

            const labels = Object.keys(branchData);
            const averages = labels.map(l => Math.round(branchData[l].sum / branchData[l].count));
            
            // تحديد لون كل عمود: أخضر فاقع فوق 50، أحمر فاقع تحت 50
            const colors = averages.map(v => v >= 50 ? '#00FF00' : '#FF0000');

            const ctx = document.getElementById('branchChart').getContext('2d');
            if (branchChart) branchChart.destroy();

            branchChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data: averages,
                        backgroundColor: colors,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, max: 100, ticks: { font: { family: 'Cairo', weight: 'bold' } } },
                        x: { ticks: { font: { family: 'Cairo', weight: 'bold', size: 9 } } }
                    }
                }
            });
        }

        function updateUI() {
            const scoreEl = document.getElementById('totalScore');
            document.getElementById('reportCount').innerText = fixNums(cloudReports.length);
            
            if(cloudReports.length > 0) {
                let sum = cloudReports.reduce((acc, curr) => acc + (parseFloat(curr.score) || 0), 0);
                let avg = Math.round(sum / cloudReports.length);
                scoreEl.innerText = fixNums(avg) + "%";
                
                // تطبيق الألوان الفاقعة على الرقم الرئيسي
                scoreEl.className = `text-3xl font-black ${avg >= 50 ? 'text-neon-green' : 'text-neon-red'}`;
            }
            renderReportsList();
        }

        function renderReportsList() {
            const filtered = cloudReports.filter(r => {
                if (currentTab === 'quality') return r.type?.includes('Quality');
                if (currentTab === 'branches') return r.type === 'Branch Report';
                if (currentTab === 'checklist') return r.type === 'Assistant Checklist';
                return true;
            });

            document.getElementById('reportsList').innerHTML = filtered.map((r) => {
                const score = parseFloat(r.score) || 0;
                const isPass = score >= 50;
                const neonColor = isPass ? 'border-[#00ff00]' : 'border-[#ff0000]';
                const badgeColor = isPass ? 'bg-[#00ff00] text-black' : 'bg-[#ff0000] text-white';

                return `
                <div onclick="viewDetail(${cloudReports.indexOf(r)})" class="verra-card p-5 border-r-8 ${neonColor} mb-4 flex justify-between items-center text-right">
                    <div class="flex items-center gap-3">
                        <button onclick="event.stopPropagation(); if(confirm('حذف؟')) db.collection('inspections').doc('${r.docId}').delete()" class="text-red-400 p-2 text-right text-right text-right text-right">🗑️</button>
                        <div class="${badgeColor} px-3 py-1 rounded-full text-xs font-black shadow-sm">${fixNums(score)}%</div>
                    </div>
                    <div class="text-right text-right text-right text-right text-right text-right text-right text-right text-right text-right text-right text-right">
                        <h4 class="font-black text-gray-800 text-sm mb-1 text-right text-right text-right text-right text-right text-right text-right text-right text-right text-right text-right text-right">${r.branch}</h4>
                        <div class="text-[10px] text-gray-400 font-bold uppercase text-right text-right text-right text-right text-right text-right text-right text-right text-right text-right text-right text-right">📅 ${fixNums(r.date)} | 👤 ${r.inspector?.split('@')[0]}</div>
                    </div>
                </div>`;
            }).join('');
        }

        // دوال الملاحة والتحكم
        function setReportTab(t) { currentTab = t; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById('tab-'+t).classList.add('active'); renderReportsList(); }
        function navigateTo(id) { document.querySelectorAll('.page').forEach(p => p.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
        function closeModal() { document.getElementById('reportDetailModal').classList.remove('active'); }
        function viewDetail(idx) {
            const r = cloudReports[idx];
            document.getElementById('detailBody').innerHTML = `<div class="bg-gray-50 p-6 rounded-3xl text-center border shadow-sm text-right"><h2 class="text-2xl font-black text-[#004b47] mb-2 uppercase">${r.branch}</h2><p class="text-xs font-bold text-gray-400 mb-4">📅 ${fixNums(r.date)} | 👤 ${r.inspector}</p><div class="text-5xl font-black ${r.score >= 50 ? 'text-neon-green' : 'text-neon-red'}">${fixNums(r.score)}%</div></div>`;
            document.getElementById('reportDetailModal').classList.add('active');
        }

        startSync();
    </script>
</body>
</html>
