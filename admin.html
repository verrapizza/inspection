<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERRA Pro - النظام الشامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        .page { transition: 0.3s; }
        .hidden { display: none; }
        @keyframes bounce-in { 0% { transform: scale(0.9); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .task-done { background: #dcfce7; border-color: #22c55e; transition: 0.3s; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-32">

    <!-- الصفحة الرئيسية -->
    <div id="dashboardPage" class="page">
        <header class="bg-[#004d40] p-8 pb-20 rounded-b-[45px] text-white shadow-lg relative">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold">VERRA <span class="text-green-400 text-xs italic underline">ULTRA</span></h1>
                    <p class="text-[10px] opacity-80">نظام إدارة سلامة الغذاء</p>
                </div>
                <div class="w-12 h-12 bg-green-500 rounded-full flex items-center justify-center font-bold border-2 border-white/20">R</div>
            </div>
        </header>

        <main class="px-5 -mt-12 relative z-10">
            <!-- كروت الإحصائيات -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-white p-5 rounded-[30px] shadow-sm border-b-4 border-green-500 text-center">
                    <p class="text-gray-400 text-[10px] font-bold">إنجاز النظافة</p>
                    <h2 id="cleaningStats" class="text-3xl font-bold text-green-600">0%</h2>
                </div>
                <div class="bg-white p-5 rounded-[30px] shadow-sm border-b-4 border-blue-500 text-center">
                    <p class="text-gray-400 text-[10px] font-bold">تقارير اليوم</p>
                    <h2 id="reportCount" class="text-3xl font-bold text-blue-600">0</h2>
                </div>
            </div>

            <!-- مهام اليوم السريعة -->
            <h3 class="font-bold text-gray-700 mb-4 px-1 flex justify-between">
                <span>المهام اليومية</span>
                <span class="text-xs text-blue-500" onclick="navigateTo('tasksPage')">عرض القائمة ⮕</span>
            </h3>
            
            <div class="space-y-4">
                <div class="bg-white p-5 rounded-3xl flex items-center justify-between shadow-sm border-r-[10px] border-blue-500">
                    <div class="flex items-center gap-4">
                        <span class="text-2xl">🌡️</span>
                        <div><p class="font-bold text-sm">فحص الحرارة</p><p class="text-[9px] text-gray-400">نقطة CCP</p></div>
                    </div>
                    <button onclick="openModal('سجل الحرارة')" class="bg-blue-600 text-white text-[10px] px-5 py-2 rounded-xl font-bold">بدء</button>
                </div>
                <div class="bg-white p-5 rounded-3xl flex items-center justify-between shadow-sm border-r-[10px] border-orange-500">
                    <div class="flex items-center gap-4">
                        <span class="text-2xl">📦</span>
                        <div><p class="font-bold text-sm">تتبع شحنة</p><p class="text-[9px] text-gray-400">وحدة التتبع</p></div>
                    </div>
                    <button onclick="openModal('تتبع شحنة')" class="bg-orange-600 text-white text-[10px] px-5 py-2 rounded-xl font-bold">استلام</button>
                </div>
            </div>
        </main>
    </div>

    <!-- صفحة مهام النظافة (جديدة) -->
    <div id="tasksPage" class="page hidden px-5 pt-10">
        <h2 class="text-2xl font-bold mb-2">قائمة النظافة</h2>
        <p class="text-xs text-gray-400 mb-8 italic">يرجى الضغط على المهمة بعد إتمامها</p>
        
        <div id="cleaningList" class="space-y-4">
            <!-- المهام ستظهر هنا -->
        </div>
        
        <button onclick="resetTasks()" class="mt-10 w-full p-4 text-gray-400 text-xs font-bold border-2 border-dashed border-gray-200 rounded-2xl">إعادة تعيين المهام ليوم جديد</button>
    </div>

    <!-- بقية الصفحات -->
    <div id="tracePage" class="page hidden px-5 pt-10"><h2 class="text-2xl font-bold mb-6">المخزن والتتبع</h2><div id="traceList" class="space-y-4"></div></div>
    <div id="reportsPage" class="page hidden px-5 pt-10"><h2 class="text-2xl font-bold mb-6">سجل العمليات</h2><div id="reportsList" class="space-y-4"></div></div>
    <div id="branchesPage" class="page hidden px-5 pt-10"><div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold">الفروع</h2><button onclick="addB()" class="bg-[#004d40] text-white px-4 py-2 rounded-xl text-xs font-bold">+ إضافة</button></div><div id="branchesList" class="space-y-4"></div></div>

    <!-- القائمة السفلية -->
    <nav class="fixed bottom-0 w-full bg-[#004d40] text-white flex justify-around p-4 z-50 rounded-t-[40px] shadow-2xl">
        <button onclick="navigateTo('dashboardPage')" id="nav-dashboard" class="flex flex-col items-center text-green-400"><span class="text-xl">🏠</span><span class="text-[9px] font-bold">الرئيسية</span></button>
        <button onclick="navigateTo('tasksPage')" id="nav-tasks" class="flex flex-col items-center text-white/40"><span class="text-xl">🧹</span><span class="text-[9px] font-bold">النظافة</span></button>
        <button onclick="navigateTo('tracePage')" id="nav-trace" class="flex flex-col items-center text-white/40"><span class="text-xl">📦</span><span class="text-[9px] font-bold">التتبع</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-xl">📊</span><span class="text-[9px] font-bold">السجل</span></button>
    </nav>

    <!-- النافذة المنبثقة -->
    <div id="logModal" class="fixed inset-0 bg-black/70 z-[60] hidden flex items-end">
        <div class="bg-white w-full rounded-t-[45px] p-8 animate-slide-up shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="w-16 h-1 bg-gray-200 rounded-full mx-auto mb-8"></div>
            <h3 class="text-xl font-bold mb-8 text-center" id="modalTitle">تسجيل بيانات</h3>
            <div id="modalContent" class="space-y-5 mb-8"></div>
            <div class="flex gap-4">
                <button onclick="closeModal()" class="flex-1 p-5 rounded-3xl bg-gray-100 text-gray-400 font-bold">إلغاء</button>
                <button onclick="saveEntry()" class="flex-1 p-5 rounded-3xl bg-green-600 text-white font-bold shadow-lg">حفظ</button>
            </div>
        </div>
    </div>

    <script>
        let branches = JSON.parse(localStorage.getItem('v_branches')) || [];
        let reports = JSON.parse(localStorage.getItem('v_reports')) || [];
        let items = JSON.parse(localStorage.getItem('v_items')) || [];
        
        // قائمة مهام النظافة الأساسية
        let defaultTasks = [
            { id: 1, name: "تعقيم أسطح التحضير", done: false },
            { id: 2, name: "تنظيف فلاتر المدخنة", done: false },
            { id: 3, name: "غسل وتطهير الأرضيات", done: false },
            { id: 4, name: "تنظيف مقابض الثلاجات", done: false }
        ];
        let tasks = JSON.parse(localStorage.getItem('v_tasks')) || defaultTasks;

        function navigateTo(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-green-400', 'text-white/40'));
            document.getElementById('nav-' + id.replace('Page','')).classList.replace('text-white/40', 'text-green-400');
            if(id === 'tasksPage') renderTasks();
            if(id === 'tracePage') renderTrace();
            if(id === 'branchesPage') renderBranches();
            if(id === 'reportsPage') renderReports();
        }

        function renderTasks() {
            const list = document.getElementById('cleaningList');
            list.innerHTML = tasks.map(t => `
                <div onclick="toggleTask(${t.id})" class="p-5 rounded-3xl border-2 flex justify-between items-center transition-all ${t.done ? 'task-done shadow-none' : 'bg-white shadow-sm border-gray-100'}">
                    <span class="font-bold ${t.done ? 'text-green-700 line-through' : 'text-gray-700'}">${t.name}</span>
                    <span class="text-xl">${t.done ? '✅' : '⭕'}</span>
                </div>
            `).join('');
            updateStats();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? {...t, done: !t.done} : t);
            localStorage.setItem('v_tasks', JSON.stringify(tasks));
            renderTasks();
            if(tasks.find(t => t.id === id).done) {
                // إضافة سجل تنظيف تلقائي
                reports.unshift({branch: "مهام عامة", value: "تنظيف مكتمل", date: new Date().toLocaleString('ar-SA')});
                localStorage.setItem('v_reports', JSON.stringify(reports));
            }
        }

        function resetTasks() {
            if(confirm("هل تريد تصفير قائمة النظافة ليوم جديد؟")) {
                tasks = defaultTasks.map(t => ({...t, done: false}));
                localStorage.setItem('v_tasks', JSON.stringify(tasks));
                renderTasks();
            }
        }

        function openModal(type) {
            const content = document.getElementById('modalContent');
            document.getElementById('modalTitle').innerText = type;
            if(type === 'تتبع شحنة') {
                content.innerHTML = `<input type="text" id="itemName" placeholder="المنتج" class="w-full bg-gray-50 p-4 rounded-2xl border-2 border-gray-100 font-bold"><input type="date" id="expDate" class="w-full bg-gray-50 p-4 rounded-2xl border-2 border-gray-100 font-bold">`;
            } else {
                content.innerHTML = `<select id="bSel" class="w-full bg-gray-50 p-4 rounded-2xl border-2 border-gray-100 font-bold">${branches.map(b => `<option>${b.name}</option>`).join('')}</select><input type="number" id="tVal" placeholder="القراءة" class="w-full bg-gray-50 p-5 rounded-3xl text-3xl font-bold text-center border-2 border-gray-100">`;
            }
            document.getElementById('logModal').classList.remove('hidden');
        }

        function saveEntry() {
            const type = document.getElementById('modalTitle').innerText;
            if(type === 'تتبع شحنة') {
                const n = document.getElementById('itemName').value;
                const d = document.getElementById('expDate').value;
                if(!n || !d) return alert("أكمل البيانات!");
                items.unshift({name: n, expiry: d, id: Date.now()});
                localStorage.setItem('v_items', JSON.stringify(items));
            } else {
                const v = document.getElementById('tVal').value;
                const b = document.getElementById('bSel').value;
                if(!v) return alert("أدخل القيمة!");
                reports.unshift({branch: b, value: v, date: new Date().toLocaleString('ar-SA')});
                localStorage.setItem('v_reports', JSON.stringify(reports));
            }
            closeModal(); updateStats();
        }

        function updateStats() {
            const doneCount = tasks.filter(t => t.done).length;
            const percent = Math.round((doneCount / tasks.length) * 100);
            document.getElementById('cleaningStats').innerText = percent + "%";
            document.getElementById('reportCount').innerText = reports.length;
        }

        function closeModal() { document.getElementById('logModal').classList.add('hidden'); }
        function renderTrace() { document.getElementById('traceList').innerHTML = items.map(i => `<div class="bg-white p-4 rounded-2xl shadow-sm border-r-4 border-orange-500 font-bold">${i.name} - ينتهي: ${i.expiry}</div>`).join(''); }
        function renderBranches() { document.getElementById('branchesList').innerHTML = branches.map(b => `<div class="bg-white p-4 rounded-2xl shadow-sm border-r-4 border-[#004d40] font-bold">${b.name}</div>`).join(''); }
        function addB() { let n = prompt("الفرع:"); if(n) { branches.push({name: n}); localStorage.setItem('v_branches', JSON.stringify(branches)); updateStats(); } }
        function renderReports() { document.getElementById('reportsList').innerHTML = reports.map(r => `<div class="bg-white p-3 rounded-xl border font-bold text-xs mb-2">${r.branch}: ${r.value} (${r.date})</div>`).join(''); }

        updateStats();
    </script>
</body>
</html>
