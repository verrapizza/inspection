<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERRA Pro - نظام إدارة الجودة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; bg-gray-50; }
        .sidebar-active { border-right: 4px solid #10b981; background: rgba(16, 185, 129, 0.1); }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- القائمة الجانبية للهاتف (Bottom Navigation) -->
    <nav class="fixed bottom-0 w-full bg-[#004d40] text-white flex justify-around p-3 md:hidden z-50 rounded-t-2xl shadow-2xl">
        <button class="flex flex-col items-center text-green-400">
            <span>🏠</span>
            <span class="text-[10px]">الرئيسية</span>
        </button>
        <button class="flex flex-col items-center text-gray-400">
            <span>📋</span>
            <span class="text-[10px]">المهام</span>
        </button>
        <button class="flex flex-col items-center text-gray-400">
            <span>⚠️</span>
            <span class="text-[10px]">بلاغات</span>
        </button>
        <button class="flex flex-col items-center text-gray-400">
            <span>📊</span>
            <span class="text-[10px]">تقارير</span>
        </button>
    </nav>

    <!-- الهيدر العلوي -->
    <header class="bg-[#004d40] p-6 pb-20 rounded-b-[40px] shadow-lg text-white">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h1 class="text-2xl font-bold">VERRA <span class="text-green-400 text-sm">PRO</span></h1>
                <p class="text-xs opacity-70">أهلاً، رمزي الشريف</p>
            </div>
            <div class="w-10 h-10 bg-green-500 rounded-full border-2 border-white flex items-center justify-center font-bold">R</div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="px-4 -mt-12 mb-24">
        
        <!-- كروت الملخص السريع -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-white p-4 rounded-3xl shadow-sm border-b-4 border-green-500">
                <p class="text-gray-400 text-xs">نسبة الجودة</p>
                <h2 class="text-2xl font-bold text-green-600">88%</h2>
            </div>
            <div class="bg-white p-4 rounded-3xl shadow-sm border-b-4 border-orange-500">
                <p class="text-gray-400 text-xs">مهام معلقة</p>
                <h2 class="text-2xl font-bold text-orange-600">5</h2>
            </div>
        </div>

        <!-- قسم العمليات اليومية (الجديد) -->
        <h3 class="font-bold mb-3 flex justify-between items-center px-1">
            <span>العمليات الميدانية</span>
            <span class="text-xs text-green-600">عرض الكل</span>
        </h3>
        
        <div class="space-y-3">
            <!-- مهمة 1 -->
            <div class="bg-white p-4 rounded-2xl flex items-center justify-between shadow-sm border-r-4 border-blue-500">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">🌡️</span>
                    <div>
                        <p class="font-bold text-sm">سجل درجات الحرارة</p>
                        <p class="text-[10px] text-gray-400">فرع مكة - منذ ساعتين</p>
                    </div>
                </div>
                <button class="bg-blue-100 text-blue-600 text-[10px] px-3 py-1 rounded-full font-bold">بدء الآن</button>
            </div>

            <!-- مهمة 2 -->
            <div class="bg-white p-4 rounded-2xl flex items-center justify-between shadow-sm border-r-4 border-purple-500">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">🧹</span>
                    <div>
                        <p class="font-bold text-sm">جدول التنظيف الدوري</p>
                        <p class="text-[10px] text-gray-400">فرع أبحر - لم يكتمل</p>
                    </div>
                </div>
                <button class="bg-purple-100 text-purple-600 text-[10px] px-3 py-1 rounded-full font-bold">بدء الآن</button>
            </div>
        </div>

        <!-- قسم التحليل -->
        <div class="mt-8 bg-white p-4 rounded-3xl shadow-sm">
            <h3 class="font-bold mb-4">أداء الفروع الأسبوعي</h3>
            <div class="flex items-end justify-between h-32 gap-2 px-2">
                <div class="bg-green-500 w-full rounded-t-lg" style="height: 80%"></div>
                <div class="bg-green-600 w-full rounded-t-lg" style="height: 50%"></div>
                <div class="bg-green-400 w-full rounded-t-lg" style="height: 95%"></div>
                <div class="bg-green-700 w-full rounded-t-lg" style="height: 40%"></div>
            </div>
            <div class="flex justify-between text-[10px] mt-2 text-gray-400 text-center">
                <span class="w-full">مكة</span>
                <span class="w-full">أبحر</span>
                <span class="w-full">التحلية</span>
                <span class="w-full">الخالدية</span>
            </div>
        </div>

    </main>

</body>
</html>
