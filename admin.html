<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERRA Pro - نظام إدارة الفروع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        .page { transition: transform 0.3s ease; }
        .hidden { display: none; }
        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slide-up 0.3s ease-out; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-24">

    <!-- الصفحة 1: لوحة التحكم -->
    <div id="dashboardPage" class="page px-5 pt-8">
        <header class="flex justify-between items-center mb-8 bg-[#004d40] -mx-5 -mt-8 p-8 rounded-b-[40px] text-white shadow-lg">
            <div>
                <h1 class="text-2xl font-bold">VERRA <span class="text-green-400 text-xs">PRO</span></h1>
                <p class="text-[10px] opacity-70">إدارة الجودة المتكاملة</p>
            </div>
            <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center font-bold border-2 border-white/20">R</div>
        </header>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-white p-5 rounded-[30px] shadow-sm border-b-4 border-green-500">
                <p class="text-gray-400 text-[10px] mb-1 font-bold">الفروع النشطة</p>
                <h2 id="branchStats" class="text-3xl font-bold text-green-600">0</h2>
            </div>
            <div class="bg-white p-5 rounded-[30px] shadow-sm border-b-4 border-blue-500">
                <p class="text-gray-400 text-[10px] mb-1 font-bold">تقارير اليوم</p>
                <h2 id="reportCount" class="text-3xl font-bold text-blue-600">0</h2>
            </div>
        </div>

        <h3 class="font-bold mb-4 flex justify-between items-center">
            <span>العمليات الميدانية</span>
            <button onclick="openModal('سجل حرارة')" class="bg-blue-600 text-white text-[10px] px-4 py-2 rounded-xl">تسجيل جديد +</button>
        </h3>

        <div id="recentActivity" class="space-y-3">
             <div class="bg-white p-4 rounded-2xl shadow-sm text-center text-gray-400 text-xs italic">ابدأ بإضافة الفروع أولاً..</div>
        </div>
    </div>

    <!-- الصفحة 2: سجل التقارير -->
    <div id="reportsPage" class="page hidden px-5 pt-8">
        <h2 class="text-2xl font-bold mb-6">سجل التقارير التاريخي</h2>
        <div id="reportsList" class="space-y-4"></div>
    </div>

    <!-- الصفحة 3: إدارة الفروع -->
    <div id="branchesPage" class="page hidden px-5 pt-8">
        <div class="flex justify-between items-center mb-6 text-right">
            <h2 class="text-2xl font-bold">إدارة الفروع</h2>
            <button onclick="addNewBranch()" class="bg-[#004d40] text-white px-4 py-2 rounded-xl text-xs font-bold">+ فرع جديد</button>
        </div>
        <div id="branchesList" class="space-y-4">
            <!-- قائمة الفروع تظهر هنا -->
        </div>
    </div>

    <!-- القائمة السفلية -->
    <nav class="fixed bottom-0 w-full bg-[#004d40] text-white flex justify-around p-4 z-50 rounded-t-[35px] shadow-2xl font-bold">
        <button onclick="navigateTo('dashboardPage')" id="nav-dashboard" class="flex flex-col items-center text-green-400"><span class="text-xl">🏠</span><span class="text-[9px]">الرئيسية</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-xl">📊</span><span class="text-[9px]">التقارير</span></button>
        <button onclick="navigateTo('branchesPage')" id="nav-branches" class="flex flex-col items-center text-white/40"><span class="text-xl">🏢</span><span class="text-[9px]">الفروع</span></button>
    </nav>

    <!-- Modal تسجيل تقرير -->
    <div id="logModal" class="fixed inset-0 bg-black/70 z-[60] hidden flex items-end">
        <div class="bg-white w-full rounded-t-[40px] p-8 animate-slide-up shadow-2xl">
            <div class="w-16 h-1 bg-gray-200 rounded-full mx-auto mb-8"></div>
            <h3 class="text-xl font-bold mb-6 text-center" id="modalTitle">تسجيل بيانات</h3>
            
            <div class="space-y-5 mb-8 text-right">
                <div>
                    <label class="text-xs font-bold text-gray-400 block mb-2">اختر الفرع</label>
                    <select id="branchSelect" class="w-full bg-gray-50 p-4 rounded-2xl outline-none border-2 border-gray-100 font-bold">
                        <!-- خيارات الفروع ستظهر هنا -->
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-400 block mb-2">القراءة الرقمية</label>
                    <input type="number" id="tempInput" placeholder="أدخل الرقم هنا" class="w-full bg-gray-50 p-4 rounded-2xl text-2xl font-bold text-center outline-none border-2 border-gray-100">
                </div>
                <div class="bg-blue-50 p-4 rounded-2xl flex items-center justify-between border border-blue-100">
                     <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleImage(this)">
                     <p class="text-xs text-blue-800 font-bold">صورة التوثيق</p>
                     <button onclick="document.getElementById('cameraInput').click()" class="bg-blue-600 text-white p-3 rounded-xl">📷</button>
                </div>
            </div>

            <div class="flex gap-4">
                <button onclick="closeModal()" class="flex-1 p-5 rounded-3xl bg-gray-100 text-gray-400 font-bold">إلغاء</button>
                <button onclick="submitData()" class="flex-1 p-5 rounded-3xl bg-green-600 text-white font-bold">حفظ</button>
            </div>
        </div>
    </div>

    <script>
        // مصفوفات البيانات
        let branches = JSON.parse(localStorage.getItem('verra_branches')) || [];
        let reports = JSON.parse(localStorage.getItem('verra_reports')) || [];

        function navigateTo(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
            
            // تحديث ألوان التنقل
            document.querySelectorAll('nav button').forEach(btn => btn.classList.replace('text-green-400', 'text-white/40'));
            document.getElementById('nav-' + pageId.replace('Page', '')).classList.replace('text-white/40', 'text-green-400');
            
            if(pageId === 'branchesPage') renderBranches();
            if(pageId === 'reportsPage') renderReports();
        }

        // --- إدارة الفروع ---
        function addNewBranch() {
            const name = prompt("أدخل اسم الفرع الجديد:");
            if(name) {
                branches.push({ id: Date.now(), name: name, city: "جدة" });
                localStorage.setItem('verra_branches', JSON.stringify(branches));
                renderBranches();
                updateStats();
            }
        }

        function deleteBranch(id) {
            if(confirm("هل أنت متأكد من حذف هذا الفرع؟")) {
                branches = branches.filter(b => b.id !== id);
                localStorage.setItem('verra_branches', JSON.stringify(branches));
                renderBranches();
                updateStats();
            }
        }

        function renderBranches() {
            const list = document.getElementById('branchesList');
            list.innerHTML = branches.length === 0 ? '<p class="text-center text-gray-400 italic mt-20">لا توجد فروع مضافة..</p>' : 
            branches.map(b => `
                <div class="bg-white p-5 rounded-3xl shadow-sm flex justify-between items-center border-r-8 border-[#004d40]">
                    <div>
                        <p class="font-bold text-gray-800">${b.name}</p>
                        <p class="text-[10px] text-gray-400 italic">${b.city}</p>
                    </div>
                    <button onclick="deleteBranch(${b.id})" class="bg-red-50 text-red-500 p-2 rounded-xl text-sm">🗑️</button>
                </div>
            `).join('');
        }

        // --- إدارة التقارير ---
        function openModal(title) {
            if(branches.length === 0) { alert("يرجى إضافة فرع أولاً من قائمة الفروع!"); return; }
            document.getElementById('modalTitle').innerText = title;
            const select = document.getElementById('branchSelect');
            select.innerHTML = branches.map(b => `<option value="${b.name}">${b.name}</option>`).join('');
            document.getElementById('logModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('logModal').classList.add('hidden'); }

        function submitData() {
            const branch = document.getElementById('branchSelect').value;
            const value = document.getElementById('tempInput').value;
            if(!value) { alert("أدخل القيمة!"); return; }

            const newReport = {
                id: Date.now(),
                branch: branch,
                value: value,
                date: new Date().toLocaleDateString('ar-SA'),
                time: new Date().toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit'})
            };
            reports.unshift(newReport);
            localStorage.setItem('verra_reports', JSON.stringify(reports));
            alert("تم الحفظ بنجاح!");
            closeModal();
            updateStats();
        }

        function renderReports() {
            const list = document.getElementById('reportsList');
            list.innerHTML = reports.map(r => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border-r-4 border-blue-500">
                    <p class="font-bold text-sm text-gray-700">${r.branch}</p>
                    <p class="text-[10px] text-gray-400">${r.date} | ${r.time}</p>
                    <p class="text-xs font-bold text-blue-600 mt-1">القراءة المسجلة: ${r.value}</p>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('branchStats').innerText = branches.length;
            document.getElementById('reportCount').innerText = reports.length;
        }

        // تشغيل أولي
        updateStats();
    </script>
</body>
</html>
