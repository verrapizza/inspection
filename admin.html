<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERRA PRO - لوحة الإدارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f8fafc; }
        .page { transition: 0.3s ease-in-out; }
        .hidden { display: none; }
        .verra-card { background: white; border-radius: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); }
        .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    </style>
</head>
<body class="pb-32">

    <!-- الصفحة الرئيسية -->
    <div id="dashboardPage" class="page text-right">
        <header class="bg-[#004b47] p-10 pb-28 rounded-b-[60px] text-white shadow-2xl relative overflow-hidden">
            <div class="flex justify-between items-center relative z-10">
                <div>
                    <h1 class="text-3xl font-black italic tracking-tighter">VERRA <span class="text-[#d1ba89]">PRO</span></h1>
                    <p class="text-[10px] mt-1 font-bold opacity-80 uppercase italic">Quality Control Center</p>
                </div>
                <div class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center border border-white/20 shadow-xl font-black">R</div>
            </div>
        </header>

        <main class="px-6 -mt-16 relative z-10">
            <!-- الإحصائيات -->
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="verra-card p-6 border-b-4 border-green-600 text-center shadow-lg">
                    <p class="text-gray-400 text-[10px] font-bold mb-1 uppercase">الامتثال العام</p>
                    <h2 id="totalScore" class="text-3xl font-black text-green-700">100%</h2>
                </div>
                <div onclick="navigateTo('reportsPage')" class="verra-card p-6 border-b-4 border-blue-600 text-center shadow-lg">
                    <p class="text-gray-400 text-[10px] font-bold mb-1 uppercase">التقارير</p>
                    <h2 id="reportCount" class="text-3xl font-black text-blue-700">0</h2>
                </div>
            </div>

            <!-- بطاقة مشرف الجودة المطلبوبة -->
            <div class="verra-card p-8 mb-10 border-r-[12px] border-[#004b47] shadow-xl">
                <div class="flex items-center gap-3 mb-4">
                    <span class="text-3xl">📋</span>
                    <h3 class="font-black text-gray-800 text-xl">تقرير مشرف الجودة</h3>
                </div>
                <p class="text-[11px] text-gray-500 mb-8 font-bold leading-relaxed">بوابة المشرف الرسمية لإجراء عمليات التفتيش الميداني، فحص المعايير، وإصدار تقارير الجودة المعتمدة.</p>
                
                <a href="https://verrapizza.github.io/inspection/" class="w-full verra-gradient text-white p-5 rounded-[22px] font-black shadow-lg flex justify-between items-center active:scale-95 transition-all">
                    <span class="text-sm">دخول أداة إنشاء التقارير</span>
                    <span class="text-xl">⬅</span>
                </a>
            </div>
        </main>
    </div>

    <!-- صفحة سجل التقارير -->
    <div id="reportsPage" class="page hidden px-6 pt-10 text-right">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-2xl font-black text-[#004b47] italic underline decoration-[#d1ba89] underline-offset-8">سجل تقارير الميدان</h2>
            <button onclick="navigateTo('dashboardPage')" class="bg-gray-100 p-3 rounded-full text-xs font-black">إغلاق</button>
        </div>
        <div id="reportsList" class="space-y-4">
            <!-- التقارير تظهر هنا -->
        </div>
    </div>

    <!-- القائمة السفلية -->
    <nav class="fixed bottom-0 w-full bg-[#004b47] text-white flex justify-around p-5 z-50 rounded-t-[45px] shadow-2xl">
        <button onclick="navigateTo('dashboardPage')" id="nav-dashboard" class="flex flex-col items-center text-[#d1ba89]"><span class="text-2xl">🏠</span><span class="text-[9px] font-black mt-1">الرئيسية</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-2xl">📊</span><span class="text-[9px] font-black mt-1">السجل</span></button>
    </nav>

    <script>
        // وظيفة تحديث البيانات من الذاكرة المشتركة
        function syncData() {
            const data = localStorage.getItem('v2_reports');
            const reports = data ? JSON.parse(data) : [];
            
            // تحديث الأرقام في الرئيسية
            document.getElementById('reportCount').innerText = reports.length;
            
            if (reports.length > 0) {
                const avg = Math.round(reports.reduce((s, r) => s + r.score, 0) / reports.length);
                document.getElementById('totalScore').innerText = avg + "%";
            } else {
                document.getElementById('totalScore').innerText = "100%";
            }

            // عرض القائمة في صفحة السجل
            const list = document.getElementById('reportsList');
            if (reports.length === 0) {
                list.innerHTML = '<div class="text-center py-20 text-gray-400 italic font-bold">لا توجد تقارير ميدانية بعد..</div>';
                return;
            }

            list.innerHTML = reports.map(r => `
                <div class="bg-white p-6 rounded-[30px] shadow-md border-r-8 ${r.score < 70 ? 'border-red-500' : 'border-green-600'}">
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-black text-gray-800 text-lg">${r.branch}</h4>
                        <span class="text-xs font-black px-3 py-1 rounded-full ${r.score < 70 ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'}">${r.score}%</span>
                    </div>
                    <p class="text-[10px] text-gray-400 font-bold mb-1">📅 التاريخ: ${r.date}</p>
                    <p class="text-[10px] text-gray-400 font-bold italic">👤 المشرف: ${r.inspector ? r.inspector.split('@')[0] : 'غير معروف'}</p>
                </div>
            `).join('');
        }

        function navigateTo(id) {
            syncData(); // مزامنة قبل الانتقال
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            
            document.querySelectorAll('nav button').forEach(btn => btn.classList.replace('text-[#d1ba89]', 'text-white/40'));
            document.getElementById('nav-' + id.replace('Page','')).classList.replace('text-white/40', 'text-[#d1ba89]');
        }

        // تحديث تلقائي عند العودة للتبويب
        window.addEventListener('focus', syncData);
        syncData();
    </script>
</body>
</html>
