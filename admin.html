<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERRA Pro - نظام إدارة الجودة الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slide-up 0.3s ease-out; }
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-24">

    <!-- الهيدر العلوي -->
    <header class="bg-[#004d40] p-8 pb-24 rounded-b-[45px] shadow-lg text-white relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-white/5 rounded-full -mr-16 -mt-16"></div>
        <div class="flex justify-between items-center relative z-10">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">VERRA <span class="text-green-400 text-xs">PRO</span></h1>
                <p class="text-[10px] opacity-70">أهلاً بك، رمزي الشريف 👋</p>
            </div>
            <div class="w-12 h-12 bg-green-500 rounded-full border-2 border-white/30 flex items-center justify-center font-bold text-lg shadow-xl">R</div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="px-5 -mt-16 relative z-10">
        
        <!-- كروت الملخص السريع -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div id="qualityCard" class="bg-white p-5 rounded-[30px] shadow-sm border-b-4 border-green-500 transition-all duration-500">
                <p class="text-gray-400 text-[10px] mb-1 font-bold">معدل الامتثال</p>
                <h2 id="overallQuality" class="text-3xl font-bold text-green-600 transition-all">88%</h2>
            </div>
            <div class="bg-white p-5 rounded-[30px] shadow-sm border-b-4 border-orange-500">
                <p class="text-gray-400 text-[10px] mb-1 font-bold">مهام عاجلة</p>
                <h2 id="taskCount" class="text-3xl font-bold text-orange-600">5</h2>
            </div>
        </div>

        <!-- قسم العمليات -->
        <h3 class="font-bold text-lg text-gray-700 mb-4 mr-1">العمليات الميدانية</h3>
        
        <div class="space-y-4 mb-10">
            <div class="bg-white p-5 rounded-3xl flex items-center justify-between shadow-sm border-r-[10px] border-blue-500">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center text-2xl">🌡️</div>
                    <div>
                        <p class="font-bold text-sm">سجل درجات الحرارة</p>
                        <p class="text-[10px] text-gray-400 font-bold">نقطة التحكم حرجة (CCP)</p>
                    </div>
                </div>
                <button onclick="openModal('سجل درجات الحرارة')" class="bg-blue-600 text-white text-xs px-5 py-2.5 rounded-xl font-bold shadow-md active:scale-90 transition-transform">بدء</button>
            </div>

            <div class="bg-white p-5 rounded-3xl flex items-center justify-between shadow-sm border-r-[10px] border-purple-500">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-purple-50 rounded-2xl flex items-center justify-center text-2xl">🧹</div>
                    <div>
                        <p class="font-bold text-sm">النظافة والتعقيم</p>
                        <p class="text-[10px] text-gray-400 font-bold">جدول التنظيف الدوري</p>
                    </div>
                </div>
                <button onclick="openModal('جدول النظافة والتعقيم')" class="bg-purple-600 text-white text-xs px-5 py-2.5 rounded-xl font-bold shadow-md active:scale-90 transition-transform">بدء</button>
            </div>
        </div>
    </main>

    <!-- القائمة السفلية -->
    <nav class="fixed bottom-0 w-full bg-[#004d40] text-white flex justify-around items-center p-4 z-50 rounded-t-[40px] shadow-2xl">
        <button class="flex flex-col items-center text-green-400"><span class="text-xl">🏠</span><span class="text-[9px] font-bold">الرئيسية</span></button>
        <button class="flex flex-col items-center text-white/40"><span class="text-xl">📋</span><span class="text-[9px] font-bold">المهام</span></button>
        <button class="flex flex-col items-center text-white/40"><span class="text-xl">📊</span><span class="text-[9px] font-bold">تقارير</span></button>
    </nav>

    <!-- النافذة المنبثقة (Modal) -->
    <div id="logModal" class="fixed inset-0 bg-black/70 z-[60] hidden flex items-end">
        <div class="bg-white w-full rounded-t-[45px] p-8 animate-slide-up shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="w-16 h-1.5 bg-gray-200 rounded-full mx-auto mb-8"></div>
            
            <h3 id="modalTitle" class="text-2xl font-bold mb-8 text-gray-800 text-center">سجل الحرارة</h3>
            
            <div class="space-y-6 mb-10">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 mr-1">وحدة التبريد</label>
                    <select class="w-full bg-gray-50 p-4 rounded-2xl outline-none border-2 border-gray-100 font-bold">
                        <option>ثلاجة التحضير - 01</option>
                        <option>مستودع التجميد الرئيسي</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 mr-1">القراءة المباشرة (°C)</label>
                    <input type="number" id="tempInput" placeholder="مثلاً: 4" class="w-full bg-gray-50 p-5 rounded-2xl outline-none border-2 border-gray-100 text-3xl font-bold text-center focus:border-green-500">
                </div>

                <!-- التوثيق البصري -->
                <div class="bg-blue-50 p-5 rounded-3xl flex items-center gap-4 border-2 border-blue-100 relative overflow-hidden">
                    <div id="previewContainer" class="hidden absolute inset-0 bg-white z-10 flex items-center justify-between p-2">
                         <img id="imagePreview" src="#" class="h-full rounded-xl object-cover border shadow-sm">
                         <button onclick="resetCamera()" class="text-xs bg-red-100 text-red-600 px-4 py-2 rounded-full font-bold">إعادة تصوير</button>
                    </div>
                    <span class="text-3xl">📸</span>
                    <div class="flex-1">
                        <p class="text-xs font-bold text-blue-900">التوثيق الإلزامي</p>
                        <p id="cameraStatus" class="text-[9px] text-blue-600 font-bold italic">صور شاشة الثلاجة الآن</p>
                    </div>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleImage(this)">
                    <button onclick="document.getElementById('cameraInput').click()" class="bg-blue-600 text-white p-4 rounded-2xl shadow-lg">📷</button>
                </div>
            </div>

            <div class="flex gap-4">
                <button onclick="closeModal()" class="flex-1 p-5 rounded-3xl bg-gray-100 text-gray-500 font-bold">إلغاء</button>
                <button onclick="submitData()" class="flex-1 p-5 rounded-3xl bg-green-600 text-white font-bold shadow-lg shadow-green-100 active:scale-95 transition-all">إرسال التقرير</button>
            </div>
        </div>
    </div>

    <script>
        function openModal(title) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('logModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('logModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
            resetCamera();
        }

        function handleImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('previewContainer').classList.remove('hidden');
                    document.getElementById('cameraStatus').innerText = "تم التوثيق ✅";
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function resetCamera() {
            document.getElementById('cameraInput').value = "";
            document.getElementById('previewContainer').classList.add('hidden');
            document.getElementById('cameraStatus').innerText = "صور شاشة الثلاجة الآن";
        }

        function submitData() {
            const temp = parseFloat(document.getElementById('tempInput').value);
            const photo = document.getElementById('cameraInput').files.length;

            if (isNaN(temp)) { alert('يرجى إدخال القراءة أولاً'); return; }
            if (photo === 0) { alert('التوثيق بالصورة إلزامي'); return; }

            const qualityEl = document.getElementById('overallQuality');
            const cardEl = document.getElementById('qualityCard');

            // المنطق الذكي (Smart Alert Logic)
            if (temp > 5) {
                alert('⚠️ خطر! درجة الحرارة ( ' + temp + '° ) خارج الحدود الآمنة. تم فتح بلاغ طارئ وسيتم إخطار الإدارة فوراً.');
                qualityEl.innerText = "64%";
                qualityEl.className = "text-3xl font-bold text-red-600 transition-all";
                cardEl.className = "bg-white p-5 rounded-[30px] shadow-sm border-b-4 border-red-500 shake";
                document.getElementById('taskCount').innerText = "6"; // زيادة المهام بسبب المخالفة
            } else {
                alert('ممتاز! القراءة آمنة. تم تحديث سجل الامتثال بنجاح.');
                qualityEl.innerText = "98%";
                qualityEl.className = "text-3xl font-bold text-green-600 transition-all";
                cardEl.className = "bg-white p-5 rounded-[30px] shadow-sm border-b-4 border-green-500 scale-105";
                setTimeout(() => cardEl.classList.remove('scale-105'), 500);
            }
            
            closeModal();
        }
    </script>
</body>
</html>
