<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERRA PRO - لوحة الإدارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none; }
        .verra-card { background: white; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; display: none; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; height: 92vh; border-radius: 40px 40px 0 0; padding: 25px; overflow-y: auto; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; position: sticky; top: -10px; background: white; z-index: 20; }
        .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
        .delete-btn { color: #ef4444; padding: 10px; border-radius: 12px; background: #fff1f2; border: 1px solid #ffe4e6; z-index: 30; }
        .delete-btn:active { background: #ef4444; color: white; transform: scale(0.9); }
    </style>
</head>
<body class="pb-32">

    <div id="loadingOverlay" class="fixed inset-0 bg-white z-[200] flex flex-col items-center justify-center font-bold text-[#004b47]">
        <div class="w-12 h-12 border-4 border-t-green-500 border-gray-200 rounded-full animate-spin mb-4"></div>
        جاري تحديث السجل السحابي...
    </div>

    <!-- الصفحة الرئيسية -->
    <div id="dashboardPage" class="page">
        <header class="bg-[#004b47] p-10 pb-28 rounded-b-[60px] text-white shadow-2xl relative text-right">
            <h1 class="text-3xl font-black italic uppercase tracking-tighter">VERRA <span class="text-[#d1ba89]">PRO</span></h1>
            <p class="text-[10px] opacity-70 font-bold tracking-widest uppercase">Management Hub</p>
        </header>

        <main class="px-6 -mt-16 relative z-10 text-right">
            <div class="grid grid-cols-2 gap-4 mb-8 text-center">
                <div class="verra-card p-6 border-b-4 border-green-600 shadow-lg"><p class="text-gray-400 text-[10px] font-bold uppercase tracking-widest">الامتثال</p><h2 id="totalScore" class="text-3xl font-black text-green-700">--</h2></div>
                <div onclick="navigateTo('reportsPage')" class="verra-card p-6 border-b-4 border-blue-600 shadow-lg"><p class="text-gray-400 text-[10px] font-bold uppercase tracking-widest">التقارير</p><h2 id="reportCount" class="text-3xl font-black text-blue-700">0</h2></div>
            </div>

            <div class="verra-card p-8 mb-6 border-r-[12px] border-[#004b47] shadow-xl italic">
                <h3 class="font-black text-gray-800 text-lg mb-2">🛡️ تفتيش مشرف الجودة</h3>
                <a href="https://verrapizza.github.io/inspection/" class="w-full bg-[#004b47] text-white p-4 rounded-[20px] font-black text-sm active:scale-95 block text-center shadow-md">دخول الأداة ←</a>
            </div>

            <div class="verra-card p-8 mb-6 border-r-[12px] border-blue-600 shadow-xl italic">
                <h3 class="font-black text-gray-800 text-lg mb-2">🏢 تفتيش مشرف الفروع</h3>
                <a href="branches-inspector.html" class="w-full bg-blue-600 text-white p-4 rounded-[20px] font-black text-sm active:scale-95 block text-center shadow-md">دخول الأداة ←</a>
            </div>

            <div class="verra-card p-8 mb-10 border-r-[12px] border-[#d1ba89] shadow-xl italic">
                <h3 class="font-black text-gray-800 text-lg mb-2 text-[#004b47]">إدارة الفروع</h3>
                <button onclick="navigateTo('branchesPage')" class="w-full bg-[#d1ba89] text-[#004b47] p-4 rounded-[20px] font-black text-sm active:scale-95 shadow-md">فتح قائمة الفروع</button>
            </div>
        </main>
    </div>

    <!-- سجل التقارير -->
    <div id="reportsPage" class="page hidden px-6 pt-10 text-right">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-black text-[#004b47] italic underline decoration-[#d1ba89] underline-offset-8">سجل الميدان</h2>
            <button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full text-xs font-black border shadow-sm">رجوع</button>
        </div>
        <div id="reportsList" class="space-y-4 pb-24 text-right">
            <!-- التقارير ستظهر هنا -->
        </div>
    </div>

    <!-- إدارة الفروع -->
    <div id="branchesPage" class="page hidden px-6 pt-10 text-right">
        <div class="flex justify-between items-center mb-8"><h2 class="text-2xl font-black text-[#004b47]">الفروع</h2><button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full text-xs font-black border shadow-sm">إغلاق</button></div>
        <div class="bg-white p-6 rounded-[30px] shadow-sm mb-6">
            <input type="text" id="newBranchInput" placeholder="اسم الفرع الجديد" class="w-full bg-gray-50 p-4 rounded-2xl outline-none border border-gray-100 font-bold mb-3">
            <button onclick="addBranchToCloud()" class="w-full bg-green-600 text-white p-4 rounded-2xl font-black">إضافة للسحابة +</button>
        </div>
        <div id="branchesList" class="space-y-3 pb-24 text-right"></div>
    </div>

    <!-- نافذة المعاينة والتحميل -->
    <div id="reportDetailModal" class="modal">
        <div class="modal-content text-right">
            <div class="modal-header">
                <button onclick="closeModal()" class="bg-red-50 text-red-500 w-10 h-10 rounded-full font-black flex items-center justify-center shadow-sm">X</button>
                <h3 class="text-2xl font-black text-green-950 italic">تفاصيل التقرير</h3>
            </div>
            <div id="detailBody" class="space-y-5"></div>
            <div class="mt-10 pb-10 border-t pt-8">
                <button id="downloadBtn" class="w-full verra-gradient text-white p-5 rounded-3xl font-black shadow-xl flex justify-center items-center gap-3">
                    <span id="btnText">📄 تحميل PDF التقرير الكامل</span>
                </button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-[#004b47] text-white flex justify-around p-5 z-50 rounded-t-[45px] shadow-2xl border-t border-white/10">
        <button onclick="navigateTo('dashboardPage')" id="nav-dashboard" class="flex flex-col items-center text-[#d1ba89]"><span class="text-2xl">🏠</span><span class="text-[9px] font-black mt-1 uppercase">Main</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-2xl">📊</span><span class="text-[9px] font-black mt-1 uppercase">Logs</span></button>
        <button onclick="navigateTo('branchesPage')" id="nav-branches" class="flex flex-col items-center text-white/40"><span class="text-2xl">🏢</span><span class="text-[9px] font-black mt-1 uppercase">Branches</span></button>
    </nav>

    <script>
        const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";
        const firebaseConfig = { apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0", authDomain: "verra-system-828f2.firebaseapp.com", projectId: "verra-system-828f2", storageBucket: "verra-system-828f2.firebasestorage.app", messagingSenderId: "961104891607", appId: "1:961104891607:web:5ffd3af4983a8b015b6a92" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let cloudReports = []; let cloudBranches = [];

        function fixNums(str) { 
            if (!str) return "0";
            return str.toString().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)); 
        }

        const sectionsQuality = [{ title: "الاستلام والتخزين", items: [{id:1,q:"فحص درجات حرارة المواد الغذائية الواردة عند التسليم"}] }]; // تم اختصارها هنا لتسريع الرد، ابقها كاملة عندك
        const sectionsBranches = [{ title: "قسم الواجهة والصالات", items: [{id:1,q:"check the restaurant front section"}] }]; // تم اختصارها هنا لتسريع الرد، ابقها كاملة عندك

        function startSync() {
            // مزامنة التقارير
            db.collection("inspections").onSnapshot((snap) => {
                cloudReports = snap.docs.map(doc => ({ docId: doc.id, ...doc.data() }));
                // ترتيب محلي: الأحدث فوق
                cloudReports.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                updateUI();
                document.getElementById('loadingOverlay').classList.add('hidden');
            });
            // مزامنة الفروع
            db.collection("branches").orderBy("name").onSnapshot((snap) => {
                cloudBranches = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderBranches();
            });
        }

        function updateUI() {
            document.getElementById('reportCount').innerText = fixNums(cloudReports.length);
            if(cloudReports.length > 0) {
                let sum = cloudReports.reduce((acc, curr) => acc + (parseFloat(curr.score) || 0), 0);
                let avg = Math.round(sum / cloudReports.length);
                document.getElementById('totalScore').innerText = fixNums(avg) + "%";
            } else {
                document.getElementById('totalScore').innerText = "100%";
            }
            if(!document.getElementById('reportsPage').classList.contains('hidden')) renderList();
        }

        function renderList() {
            const list = document.getElementById('reportsList');
            if (cloudReports.length === 0) {
                list.innerHTML = '<div class="text-center py-20 text-gray-400 italic font-bold">لا توجد تقارير في السحابة..</div>';
                return;
            }
            list.innerHTML = cloudReports.map((r, i) => `
                <div onclick="viewDetail(${i})" class="verra-card p-6 border-r-8 ${r.score < 70 ? 'border-red-500' : 'border-green-500'} mb-4 active:scale-95 transition-transform shadow-md">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex-1">
                            <h4 class="font-black text-gray-800 text-lg">${r.branch || 'تقرير تفتيش'}</h4>
                            <p class="text-[10px] text-blue-600 font-bold uppercase tracking-wider">${r.type || 'Quality Audit'}</p>
                        </div>
                        <button onclick="confirmDelete(event, '${r.docId}')" class="delete-btn">🗑️</button>
                    </div>
                    <div class="flex justify-between items-center mt-2 border-t pt-2 border-gray-50">
                        <p class="text-[11px] text-gray-400 font-bold">📅 ${fixNums(r.date)} | المشرف: ${r.inspector ? r.inspector.split('@')[0] : '---'}</p>
                        <span class="text-xs font-black bg-gray-50 px-3 py-1 rounded-full text-[#004b47]">${fixNums(r.score)}%</span>
                    </div>
                </div>`).join('');
        }

        async function confirmDelete(event, docId) {
            event.stopPropagation(); // منع فتح نافذة التفاصيل
            if (confirm("⚠️ هل أنت متأكد من حذف هذا التقرير نهائياً؟")) {
                try {
                    await db.collection("inspections").doc(docId).delete();
                    alert("✅ تم الحذف بنجاح");
                } catch (e) {
                    alert("❌ فشل الحذف: " + e.message);
                }
            }
        }

        function viewDetail(idx) {
            const r = cloudReports[idx];
            const isBranchReport = r.type && (r.type.includes("Branch") || r.type.includes("Operation"));
            document.getElementById('detailBody').innerHTML = `
                <div class="verra-card p-6 border border-gray-100 text-center mb-4 shadow-sm">
                    <p class="text-gray-400 text-[10px] font-bold uppercase mb-1 tracking-widest">المنشأة</p>
                    <h2 class="text-2xl font-black text-[#004b47] mb-2 uppercase">${r.branch}</h2>
                    <p class="text-[10px] text-blue-600 font-bold uppercase mb-4">${isBranchReport ? 'تقرير إشراف فروع' : 'تقرير جودة وسلامة'}</p>
                    <div class="grid grid-cols-2 gap-4 text-xs font-bold py-4 border-t border-b my-4">
                        <div><p class="text-gray-400 mb-1">📅 التاريخ</p><p>${fixNums(r.date)}</p></div>
                        <div><p class="text-gray-400 mb-1">👤 المفتش</p><p>${r.inspector}</p></div>
                    </div>
                    <div class="flex justify-between px-10">
                        <span class="font-bold text-gray-500 italic">معدل الامتثال:</span>
                        <span class="text-3xl font-black ${r.score < 70 ? 'text-red-500' : 'text-green-600'}">${fixNums(r.score)}%</span>
                    </div>
                </div>`;
            document.getElementById('downloadBtn').onclick = () => generateFullPDF(r);
            document.getElementById('reportDetailModal').classList.add('active');
        }

        function generateFullPDF(r) {
            alert("جاري بناء التقرير.. يرجى الانتظار");
            // هنا تضع محرك الـ PDF الكامل ( sectionsData + html2pdf ) الذي برمجناه سابقاً
        }

        function addBranchToCloud() {
            const n = document.getElementById('newBranchInput').value; if(!n) return;
            db.collection("branches").add({name: n}).then(() => document.getElementById('newBranchInput').value = "");
        }

        function renderBranches() {
            document.getElementById('branchesList').innerHTML = cloudBranches.map(b => `
                <div class="bg-white p-5 rounded-2xl flex justify-between items-center shadow-sm border-r-8 border-[#d1ba89] font-black">
                    <span>${b.name}</span>
                    <button onclick="db.collection('branches').doc('${b.id}').delete()" class="text-red-400 text-xs font-bold">🗑️ حذف</button>
                </div>`).join('');
        }

        function navigateTo(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-[#d1ba89]', 'text-white/40'));
            const btnId = 'nav-' + id.replace('Page','');
            if(document.getElementById(btnId)) document.getElementById(btnId).classList.replace('text-white/40', 'text-[#d1ba89]');
            if(id === 'reportsPage') renderList();
        }
        function closeModal() { document.getElementById('reportDetailModal').classList.remove('active'); }
        
        startSync();
    </script>
</body>
</html>
