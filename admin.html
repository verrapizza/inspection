<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VERRA PRO - مركز القيادة</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f4f7f6; margin: 0; padding: 0; overflow-x: hidden; }
    .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    
    /* القائمة الجانبية للجوال (Slide-in Menu) */
    .sidebar { 
      position: fixed; top: 0; right: -280px; width: 280px; height: 100vh; 
      background: #004b47; color: white; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
      z-index: 2000; padding: 25px; box-shadow: -10px 0 30px rgba(0,0,0,0.3);
    }
    .sidebar.open { right: 0; }
    
    /* غطاء الشاشة عند فتح المنيو */
    .overlay { 
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); 
      display: none; z-index: 1500; backdrop-filter: blur(4px); 
    }
    .overlay.show { display: block; }

    .card { background: white; border-radius: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    .report-card { border-right: 8px solid #004b47; }
    .nav-btn { 
      padding: 14px 18px; border-radius: 12px; cursor: pointer; margin-bottom: 8px; 
      display: flex; align-items: center; gap: 12px; font-weight: 700; color: rgba(255,255,255,0.7); 
    }
    .nav-btn.active { background: #10b981; color: white; }
    
    .menu-trigger { background: white; padding: 10px; border-radius: 12px; shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
      authDomain: "verra-system-828f2.firebaseapp.com",
      projectId: "verra-system-828f2",
      storageBucket: "verra-system-828f2.firebasestorage.app",
      messagingSenderId: "961104891607",
      appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";

    // دالة بناء الـ PDF (نفس التنسيق الموسط المعتمد)
    const buildReportHTML = (branch, email, location, score, answers, notes, photos, signature) => {
        const scoreColor = score >= 70 ? '#10b981' : '#ef4444';
        return `<div style="width:750px; padding:40px; direction:rtl; text-align:right;"><img src="${LOGO_URL}" style="height:100px; display:block; margin:0 auto;" /><h1 style="text-align:center; color:#004b47;">تقرير الجودة</h1><div style="background:#f8fafc; padding:20px; border-radius:15px;"><p><b>🏢 المنشأة:</b> ${branch}</p><p><b>👤 المفتش:</b> ${email}</p><p><b>📈 النتيجة:</b> ${score}%</p></div><img src="${signature}" style="width:200px; border-bottom:2px solid #004b47; margin-top:20px" /></div>`;
    };

    function App() {
      const [reports, setReports] = useState([]);
      const [branches, setBranches] = useState([]);
      const [activeTab, setActiveTab] = useState("overview");
      const [menuOpen, setMenuOpen] = useState(false);
      const [loading, setLoading] = useState(true);
      const [newBranch, setNewBranch] = useState("");
      const chartRef = useRef(null);

      useEffect(() => {
        db.collection("inspections").orderBy("timestamp", "desc").onSnapshot(snap => setReports(snap.docs.map(d => ({id: d.id, ...d.data()}))));
        db.collection("branches").onSnapshot(snap => {
            setBranches(snap.docs.map(d => ({id: d.id, ...d.data()})));
            setLoading(false);
        });
      }, []);

      // رسم البياني
      useEffect(() => {
        if (activeTab === "overview" && reports.length > 0) {
          const ctx = document.getElementById('complianceChart');
          if (ctx) {
            new Chart(ctx, { type: 'bar', data: { labels: reports.slice(0, 3).map(r => r.branch), datasets: [{ data: reports.slice(0, 3).map(r => r.score), backgroundColor: '#004b47', borderRadius: 8 }] }, options: { responsive: true, maintainAspectRatio: false } });
          }
        }
      }, [reports, activeTab]);

      if (loading) return <div className="h-screen flex items-center justify-center font-black text-green-900 animate-pulse text-2xl">VERRA DASHBOARD...</div>;

      return (
        <div className="min-h-screen">
           {/* القائمة الجانبية المنزلقة للجوال */}
           <div className={`overlay ${menuOpen?'show':''}`} onClick={()=>setMenuOpen(false)}></div>
           <aside className={`sidebar ${menuOpen?'open':''}`}>
              <div className="flex justify-between items-center mb-10">
                 <img src={LOGO_URL} className="h-14" />
                 <button onClick={()=>setMenuOpen(false)} className="text-white text-2xl">✕</button>
              </div>
              <nav>
                 <div onClick={()=>{setActiveTab("overview"); setMenuOpen(false);}} className={`nav-btn ${activeTab==='overview'?'active':''}`}>🏠 نظرة عامة</div>
                 <div onClick={()=>{setActiveTab("reports"); setMenuOpen(false);}} className={`nav-btn ${activeTab==='reports'?'active':''}`}>📋 سجل التقارير</div>
                 <div onClick={()=>{setActiveTab("setup"); setMenuOpen(false);}} className={`nav-btn ${activeTab==='setup'?'active':''}`}>🏢 إدارة الفروع</div>
              </nav>
              <div className="absolute bottom-10 right-6 left-6 border-t border-white/10 pt-6">
                 <a href="index.html" className="flex items-center gap-2 text-gold-text font-bold uppercase tracking-widest text-[11px]">⬅️ العودة للميدان</a>
              </div>
           </aside>

           {/* الشريط العلوي مع زر المنيو (☰) */}
           <header className="verra-gradient p-6 flex justify-between items-center shadow-xl rounded-b-[2.5rem]">
              <button onClick={()=>setMenuOpen(true)} className="menu-trigger">
                 <svg className="w-7 h-7 text-green-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
              </button>
              <img src={LOGO_URL} className="h-14" />
              <div className="w-10"></div> {/* موازن مساحة */}
           </header>

           <main className="p-4 max-w-2xl mx-auto -mt-6">
              {activeTab === "overview" && (
                <div className="animate-in fade-in duration-500">
                   <div className="grid grid-cols-2 gap-4 mb-6 text-right">
                      <div className="card p-5 border-r-8 border-blue-500"><p className="text-gray-400 font-bold text-[10px] uppercase">الزيارات</p><p className="text-3xl font-black">{reports.length}</p></div>
                      <div className="card p-5 border-r-8 border-green-500"><p className="text-gray-400 font-bold text-[10px] uppercase">الجودة</p><p className="text-3xl font-black text-green-600">{reports.length > 0 ? Math.round(reports.reduce((acc, r) => acc + r.score, 0) / reports.length) : 0}%</p></div>
                   </div>
                   <div className="card p-5 mb-8 text-right">
                      <h3 className="font-bold text-xs text-gray-500 mb-4">أداء الوحدات الميدانية</h3>
                      <div style={{height: '200px'}}><canvas id="complianceChart"></canvas></div>
                   </div>
                   <h2 className="font-black text-lg text-green-950 mb-4 px-2">الوحدات النشطة:</h2>
                   <div className="grid grid-cols-2 gap-4">
                      {branches.map(b => (
                        <div key={b.id} className="card p-4 text-center border-b-4 border-gold-text">
                           <p className="font-black text-green-900 text-sm truncate">{b.name}</p>
                           <p className="text-[10px] text-gray-400 font-bold mt-2">Unit Active ✅</p>
                        </div>
                      ))}
                   </div>
                </div>
              )}

              {activeTab === "reports" && (
                <div className="animate-in slide-in-from-left duration-500">
                   <h2 className="font-black text-lg text-green-950 mb-5 px-2">سجل التقارير السحابي:</h2>
                   {reports.map(rep => (
                     <div key={rep.id} className="card p-4 flex flex-row items-center bg-white gap-3 report-card mb-4">
                        <div className="text-left flex-1 min-w-0 pr-1">
                           <p className="font-bold text-green-950 text-[13px] mb-1 truncate">{rep.branch}</p>
                           <p className="text-[9px] text-gray-400 font-bold">📅 {rep.date} | 👤 {rep.inspector.split('@')[0]}</p>
                        </div>
                        <span className="text-lg font-black text-green-700">{rep.score}%</span>
                        <button onClick={() => {
                           const html = buildReportHTML(rep.branch, rep.inspector, rep.location, rep.score, rep.answers, rep.notes, rep.photos, rep.signature);
                           html2pdf().from(html).set({margin:0, filename:`Rep_${rep.branch}.pdf`, html2canvas:{scale:2, useCORS:true, scrollY:0}, jsPDF:{unit:'mm', format:'a4'}}).save();
                        }} className="bg-blue-50 p-2.5 rounded-xl text-blue-600">📥</button>
                     </div>
                   ))}
                </div>
              )}

              {activeTab === "setup" && (
                <div className="animate-in fade-in">
                   <div className="card p-6 mb-8 border-t-8 border-green-800 text-right">
                    <input value={newBranch} onChange={e=>setNewBranch(e.target.value)} className="w-full border-2 p-3 rounded-xl mb-4 text-right" placeholder="اسم الفرع الجديد..." />
                    <button onClick={()=>{ db.collection("branches").add({name:newBranch}); setNewBranch(""); alert("تم!"); }} className="verra-gradient text-white px-6 py-3 rounded-xl font-bold w-full shadow-lg">حفظ</button>
                  </div>
                  {branches.map(b => (
                     <div key={b.id} className="card p-4 flex justify-between items-center mb-3">
                        <p className="font-bold">{b.name}</p>
                        <button onClick={()=>db.collection("branches").doc(b.id).delete()} className="text-red-500 font-bold">حذف 🗑</button>
                     </div>
                  ))}
                </div>
              )}
           </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
