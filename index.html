<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERRA PRO - Full System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .verra-bg { background-color: #004b47; }
        .gold-border { border-right: 5px solid #d1ba89; }
        .sticky-score { position: sticky; top: 70px; z-index: 40; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 1. إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
            authDomain: "verra-system-828f2.firebaseapp.com",
            projectId: "verra-system-828f2",
            storageBucket: "verra-system-828f2.firebasestorage.app",
            messagingSenderId: "961104891607",
            appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // 2. مصفوفة البيانات الضخمة (الـ 74 بنداً)
        const categories = [
            { title: "الاستلام والتخزين", items: [
                "فحص درجات حرارة المواد الموردة عند الاستلام",
                "المجمدات لا تتجاوز -18 درجة مئوية",
                "المبردات لا تتجاوز 4 درجات مئوية",
                "استخدام مقياس حرارة معاير للأغذية عالية الخطورة",
                "نقل المواد للمخازن خلال أقل من 20 دقيقة",
                "مطابقة المنتجات للمواصفات السعودية",
                "اللحوم الطازجة من مسالخ معتمدة ومختومة",
                "التعبئة سليمة وخالية من الآفات",
                "التحقق من تواريخ الصلاحية وتسجيلها",
                "نظافة وتهوية أماكن التخزين"
            ]},
            { title: "تحضير الأغذية", items: [
                "متابعة عملية تحضير العجين",
                "متابعة عملية تكوير العجين",
                "مراجعة تحضير الصوصات",
                "فصل مناطق تحضير الخام عن المطبوخ",
                "منع التلوث الخلطي أثناء التحضير",
                "إذابة الأغذية (Defrost) بطريقة آمنة",
                "عدم ترك الغذاء في حرارة الغرفة > ساعتين",
                "وصول حرارة الطهي لـ 75 درجة مئوية",
                "استخدام ألواح تقطيع ملونة (Color Coded)",
                "ارتداء القفازات عند ملامسة الغذاء الجاهز"
            ]},
            // ... (باقي الأقسام سيتم عرضها ديناميكياً)
        ];

        const App = () => {
            const [user, setUser] = React.useState(null);
            const [view, setView] = React.useState('dashboard'); // dashboard, audit, history
            const [answers, setAnswers] = React.useState({});
            const [branch, setBranch] = React.useState("");
            const [uploading, setUploading] = React.useState(false);

            React.useEffect(() => {
                auth.onAuthStateChanged(u => setUser(u));
            }, []);

            // حساب النتيجة تلقائياً
            const calculateScore = () => {
                const vals = Object.values(answers);
                const yesCount = vals.filter(v => v === 'yes').length;
                const totalAnswered = vals.filter(v => v !== 'na').length;
                return totalAnswered > 0 ? Math.round((yesCount / totalAnswered) * 100) : 0;
            };

            const submitAudit = async () => {
                if(!branch) return alert("يرجى كتابة اسم الفرع");
                setUploading(true);
                try {
                    await db.collection("inspections").add({
                        branchName: branch,
                        score: calculateScore(),
                        answers: answers,
                        inspector: user.email,
                        date: new Date().toLocaleString('ar-EG'),
                        reportID: "VER-" + Math.random().toString(36).substr(2, 9).toUpperCase(),
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert("تم إرسال التقرير النهائي للسحابة بنجاح!");
                    location.reload();
                } catch (e) {
                    alert("خطأ: " + e.message);
                }
                setUploading(false);
            };

            if (!user) return <LoginPage auth={auth} />;

            return (
                <div className="min-h-screen pb-20">
                    {/* Header */}
                    <nav className="verra-bg p-4 text-white flex justify-between items-center sticky top-0 z-50">
                        <span className="font-bold text-xl gold-text italic">VERRA PRO</span>
                        <button onClick={() => auth.signOut()} className="text-xs bg-red-500 px-3 py-1 rounded">خروج</button>
                    </nav>

                    {view === 'dashboard' ? (
                        <div className="p-4">
                            <div className="bg-white rounded-3xl p-6 shadow-lg mb-6 border-b-4 border-green-800">
                                <h1 className="text-xl font-bold text-green-900 mb-2">أهلاً بك، شيف {user.email.split('@')[0]}</h1>
                                <p className="text-sm text-gray-500">لديك 0 تقارير معلقة لليوم</p>
                            </div>
                            <button onClick={() => setView('audit')} className="w-full bg-green-800 text-white font-bold py-5 rounded-2xl shadow-xl flex items-center justify-center gap-2">
                                <i data-lucide="plus-circle"></i> بدء تفتيش ميداني جديد
                            </button>
                        </div>
                    ) : (
                        <div className="p-4 max-w-2xl mx-auto">
                            <div className="bg-white p-4 rounded-2xl shadow-sm mb-4 sticky-score border-2 border-green-800 flex justify-between items-center">
                                <span className="font-bold">درجة الامتثال:</span>
                                <span className="text-3xl font-black text-green-700">{calculateScore()}%</span>
                            </div>

                            <input 
                                placeholder="اسم المنشأة / الفرع" 
                                className="w-full p-4 rounded-2xl border-2 mb-6 outline-none focus:border-green-600 font-bold"
                                onChange={(e) => setBranch(e.target.value)}
                            />

                            {categories.map((cat, cIdx) => (
                                <div key={cIdx} className="mb-8">
                                    <h3 className="font-bold text-green-900 mb-4 border-b-2 border-green-100 pb-2">{cat.title}</h3>
                                    {cat.items.map((item, iIdx) => {
                                        const id = `${cIdx}-${iIdx}`;
                                        return (
                                            <div key={id} className="bg-white p-4 rounded-xl shadow-sm mb-3 gold-border">
                                                <p className="text-sm font-bold mb-3">{item}</p>
                                                <div className="flex gap-2">
                                                    <button onClick={() => setAnswers({...answers, [id]: 'yes'})} className={`flex-1 py-2 rounded-lg text-xs font-bold ${answers[id] === 'yes' ? 'bg-green-600 text-white' : 'bg-gray-100 text-gray-400'}`}>مطابق</button>
                                                    <button onClick={() => setAnswers({...answers, [id]: 'no'})} className={`flex-1 py-2 rounded-lg text-xs font-bold ${answers[id] === 'no' ? 'bg-red-600 text-white' : 'bg-gray-100 text-gray-400'}`}>مخالف</button>
                                                    <button onClick={() => setAnswers({...answers, [id]: 'na'})} className={`flex-1 py-2 rounded-lg text-xs font-bold ${answers[id] === 'na' ? 'bg-gray-600 text-white' : 'bg-gray-100 text-gray-400'}`}>N/A</button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            ))}

                            <button 
                                disabled={uploading}
                                onClick={submitAudit}
                                className="w-full bg-green-800 text-white font-bold py-5 rounded-2xl shadow-2xl mb-10"
                            >
                                {uploading ? 'جاري الحفظ بالسحابة...' : 'إرسال التقرير النهائي'}
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const LoginPage = ({ auth }) => {
            const handleLogin = async (e) => {
                e.preventDefault();
                try {
                    await auth.signInWithEmailAndPassword(e.target.email.value, e.target.password.value);
                } catch (err) { alert("خطأ: " + err.message); }
            };
            return (
                <div className="h-screen verra-bg flex items-center justify-center p-4">
                    <form onSubmit={handleLogin} className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center">
                        <h1 className="text-3xl font-bold text-green-900 mb-6">VERRA PRO</h1>
                        <input name="email" type="email" placeholder="البريد الإلكتروني" className="w-full border-2 p-3 rounded-xl mb-4 outline-none focus:border-green-600" required />
                        <input name="password" type="password" placeholder="كلمة المرور" className="w-full border-2 p-3 rounded-xl mb-6 outline-none focus:border-green-600" required />
                        <button className="w-full bg-green-800 text-white font-bold py-4 rounded-xl shadow-lg">دخول النظام</button>
                    </form>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
