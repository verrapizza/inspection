<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERRA PRO - الإدارة والصلاحيات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none; }
        .verra-card { background: white; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; display: none; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; height: 92vh; border-radius: 40px 40px 0 0; padding: 25px; overflow-y: auto; position: relative; }
        .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
        .user-row { background: white; padding: 15px; border-radius: 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-right: 6px solid #d1ba89; }
    </style>
</head>
<body class="pb-32">

    <!-- حارس البوابة (Security Lock) -->
    <div id="lockScreen" class="fixed inset-0 bg-white z-[500] flex flex-col items-center justify-center font-bold text-[#004b47]">
        <div class="w-12 h-12 border-4 border-t-green-500 border-gray-200 rounded-full animate-spin mb-4"></div>
        جاري التحقق من الهوية...
    </div>

    <!-- الصفحة الرئيسية -->
    <div id="dashboardPage" class="page">
        <header class="bg-[#004b47] p-10 pb-28 rounded-b-[60px] text-white shadow-2xl relative text-right">
            <h1 class="text-3xl font-black italic uppercase">Verra <span class="text-[#d1ba89]">Pro</span></h1>
            <p class="text-[10px] opacity-70 font-bold tracking-widest uppercase">Central Command</p>
        </header>
        <main class="px-6 -mt-16 relative z-10 text-right">
            <div class="grid grid-cols-2 gap-4 mb-8 text-center">
                <div class="verra-card p-6 border-b-4 border-green-600 shadow-lg"><p class="text-gray-400 text-[10px] font-bold mb-1">الامتثال</p><h2 id="totalScore" class="text-3xl font-black text-green-700">--</h2></div>
                <div onclick="navigateTo('reportsPage')" class="verra-card p-6 border-b-4 border-blue-600 shadow-lg"><p class="text-gray-400 text-[10px] font-bold mb-1">التقارير</p><h2 id="reportCount" class="text-3xl font-black text-blue-700">0</h2></div>
            </div>

            <div class="verra-card p-8 mb-6 border-r-[12px] border-[#004b47] shadow-xl italic" onclick="window.location.href='inspection.html'">
                <h3 class="font-black text-gray-800 text-lg">🛡️ تفتيش الجودة</h3>
            </div>

            <div class="verra-card p-8 mb-6 border-r-[12px] border-blue-600 shadow-xl italic" onclick="window.location.href='branches-inspector.html'">
                <h3 class="font-black text-gray-800 text-lg">🏢 تفتيش الفروع</h3>
            </div>

            <div class="verra-card p-8 mb-10 border-r-[12px] border-[#d1ba89] shadow-xl italic" onclick="navigateTo('usersPage')">
                <h3 class="font-black text-gray-800 text-lg">👥 إدارة المستخدمين</h3>
                <p class="text-[10px] text-gray-400 font-bold mt-1">إضافة وحذف صلاحيات المشرفين</p>
            </div>
        </main>
    </div>

    <!-- صفحة إدارة المستخدمين (الجديدة) -->
    <div id="usersPage" class="page hidden px-6 pt-10 text-right">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-black text-[#004b47]">إدارة المشرفين</h2>
            <button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full shadow-sm border">إغلاق</button>
        </div>
        <div class="bg-white p-6 rounded-[30px] shadow-sm mb-6">
            <p class="text-xs font-bold text-gray-400 mb-3 italic text-right">إضافة إيميل مشرف جديد:</p>
            <div class="flex gap-2">
                <input type="email" id="newUserEmail" placeholder="example@gmail.com" class="flex-1 bg-gray-50 p-4 rounded-2xl outline-none border font-bold text-left">
                <button onclick="addUserRole()" class="bg-green-600 text-white px-6 rounded-2xl font-black">+</button>
            </div>
            <p class="text-[9px] text-red-500 mt-3 font-bold">* يجب أن يكون الإيميل مسجلاً مسبقاً في Firebase Auth</p>
        </div>
        <div id="usersList" class="space-y-3 pb-24"></div>
    </div>

    <!-- صفحة السجل (بقية الصفحات تبقى كما هي) -->
    <div id="reportsPage" class="page hidden px-6 pt-10 text-right">
        <div class="flex justify-between items-center mb-8"><h2 class="text-2xl font-black text-[#004b47] italic underline decoration-[#d1ba89]">السجل السحابي</h2><button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full shadow-sm border text-xs font-bold">رجوع</button></div>
        <div id="reportsList" class="space-y-4 pb-24 text-right"></div>
    </div>

    <!-- المنيو السفلي -->
    <nav class="fixed bottom-0 w-full bg-[#004b47] text-white flex justify-around p-5 z-50 rounded-t-[45px] shadow-2xl">
        <button onclick="navigateTo('dashboardPage')" id="nav-dashboard" class="flex flex-col items-center text-[#d1ba89]"><span class="text-2xl">🏠</span><span class="text-[9px] font-black mt-1 uppercase">Main</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-2xl">📊</span><span class="text-[9px] font-black mt-1 uppercase">Logs</span></button>
        <button onclick="navigateTo('usersPage')" id="nav-users" class="flex flex-col items-center text-white/40"><span class="text-2xl">👥</span><span class="text-[9px] font-black mt-1 uppercase">Users</span></button>
    </nav>

    <!-- Modal التفاصيل -->
    <div id="reportDetailModal" class="modal"><div class="modal-content text-right"><div class="flex justify-between items-center mb-6 border-b pb-4"><button onclick="closeModal()" class="bg-red-50 text-red-500 w-10 h-10 rounded-full font-black">X</button><h3 class="text-xl font-black text-green-950">المعاينة</h3></div><div id="detailBody" class="space-y-4"></div><div class="mt-8 pb-10"><button id="downloadBtn" class="w-full verra-gradient text-white p-5 rounded-3xl font-black shadow-xl">📄 تحميل PDF</button></div></div></div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0", authDomain: "verra-system-828f2.firebaseapp.com", projectId: "verra-system-828f2", storageBucket: "verra-system-828f2.firebasestorage.app", messagingSenderId: "961104891607", appId: "1:961104891607:web:5ffd3af4983a8b015b6a92" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const ADMIN_EMAIL = "ch3f.ramzi@gmail.com";

        // --- 1. حماية الدخول والتحقق من الصلاحيات ---
        auth.onAuthStateChanged(user => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('lockScreen').classList.add('hidden');
                startSync();
            } else {
                alert("⚠️ غير مصرح لك بدخول لوحة الإدارة.");
                window.location.href = "branches-inspector.html";
            }
        });

        function startSync() {
            // مزامنة التقارير
            db.collection("inspections").onSnapshot(snap => {
                const reports = snap.docs.map(doc => ({ docId: doc.id, ...doc.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                renderReports(reports);
            });
            // مزامنة قائمة المشرفين
            db.collection("users_roles").onSnapshot(snap => {
                const users = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderUsers(users);
            });
        }

        // --- 2. إدارة المستخدمين ---
        function addUserRole() {
            const email = document.getElementById('newUserEmail').value.toLowerCase().trim();
            if(!email) return;
            db.collection("users_roles").add({ email: email, role: "supervisor" }).then(() => {
                document.getElementById('newUserEmail').value = "";
                alert("✅ تم تفعيل صلاحية المشرف لهذا الإيميل.");
            });
        }

        function deleteUserRole(id) {
            if(confirm("حذف هذا المستخدم من قائمة المشرفين؟")) {
                db.collection("users_roles").doc(id).delete();
            }
        }

        function renderUsers(users) {
            document.getElementById('usersList').innerHTML = users.map(u => `
                <div class="user-row">
                    <span class="font-bold text-xs text-gray-700">${u.email}</span>
                    <button onclick="deleteUserRole('${u.id}')" class="text-red-500 font-bold text-[10px] bg-red-50 px-3 py-1 rounded-lg">سحب الصلاحية</button>
                </div>
            `).join('');
        }

        // بقية الدوال (renderReports, viewDetail, navigateTo, etc)
        function fixNums(s) { return s ? s.toString().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)) : "0"; }

        function renderReports(reports) {
            document.getElementById('reportCount').innerText = fixNums(reports.length);
            if(reports.length > 0) {
                let sum = reports.reduce((acc, curr) => acc + (parseFloat(curr.score) || 0), 0);
                document.getElementById('totalScore').innerText = fixNums(Math.round(sum / reports.length)) + "%";
            }
            document.getElementById('reportsList').innerHTML = reports.map((r, i) => `
                <div onclick='openReport(${JSON.stringify(r)})' class="verra-card p-6 border-r-8 ${r.score < 70 ? 'border-red-500' : 'border-green-500'} mb-4 active:scale-95 transition-transform shadow-md">
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-black text-gray-800 text-lg">${r.branch || 'تقرير'}</h4>
                        <button onclick="event.stopPropagation(); db.collection('inspections').doc('${r.docId}').delete()" class="text-red-400 text-sm">🗑️</button>
                    </div>
                    <p class="text-[10px] text-gray-400 font-bold italic">📅 ${fixNums(r.date)} | المشرف: ${r.inspector ? r.inspector.split('@')[0] : '---'}</p>
                </div>`).join('');
        }

        function navigateTo(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-[#d1ba89]', 'text-white/40'));
            const btnId = 'nav-' + id.replace('Page','');
            if(document.getElementById(btnId)) document.getElementById(btnId).classList.replace('text-white/40', 'text-[#d1ba89]');
        }

        // تفعيل الإغلاق
        function closeModal() { document.getElementById('reportDetailModal').classList.remove('active'); }
    </script>
</body>
</html>
