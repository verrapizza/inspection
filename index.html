<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VERRA PRO - Ultimate Inspection System</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Inter', 'Noto Naskh Arabic', sans-serif; background: #f0f7f4; color: #1a4d36; }
    .header-grad { background: linear-gradient(135deg, #004b47 0%, #003d3a 100%); color: white; }
    .progress-sticky { position: sticky; top: 0; z-index: 50; background: white; border-bottom: 2px solid #d1ba89; padding: 15px; }
    .item-card { background: white; border-radius: 15px; margin-bottom: 15px; padding: 20px; border: 1px solid #c8ddd3; }
    .answer-btn { width: 50px; height: 38px; border-radius: 10px; font-size: 11px; font-weight: bold; background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; }
    .btn-yes.active { background: #22c55e !important; color: white; border-color: #16a34a; }
    .btn-no.active { background: #ef4444 !important; color: white; border-color: #dc2626; }
    .btn-na.active { background: #64748b !important; color: white; }
    .notes-area { width: 100%; margin-top: 10px; padding: 12px; border-radius: 10px; border: 1px solid #fde68a; background: #fffbeb; font-size: 13px; outline: none; }
    .photo-box { position: relative; display: inline-block; margin: 5px; }
    .photo-img { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; border: 2px solid white; shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .btn-del { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white; font-weight: bold; cursor: pointer; }
    .upload-btn { background: #e8f5ee; color: #004b47; padding: 8px 12px; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
      authDomain: "verra-system-828f2.firebaseapp.com",
      projectId: "verra-system-828f2",
      storageBucket: "verra-system-828f2.firebasestorage.app",
      messagingSenderId: "961104891607",
      appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const fullChecklist = [
      { id: 'sec1', title: 'الاستلام والتخزين', items: [
        { id: 1, q: 'فحص درجة حرارة المواد عند الاستلام' },
        { id: 2, q: 'المجمدات لا تتجاوز -18°م' },
        { id: 3, q: 'المبردات لا تتجاوز 4°م' },
        { id: 4, q: 'استخدام مقياس حرارة معاير' },
        { id: 5, q: 'نقل المواد للمخازن < 20 دقيقة' },
        { id: 6, q: 'مطابقة المواصفات القياسية السعودية' },
        { id: 7, q: 'اللحوم من مسالخ معتمدة ومختومة' },
        { id: 8, q: 'التعبئة سليمة وخالية من التلف' },
        { id: 9, q: 'التحقق من تواريخ الصلاحية' },
        { id: 10, q: 'نظافة وتهوية أماكن التخزين' }
      ]},
      { id: 'sec2', title: 'تحضير الأغذية', items: [
        { id: 11, q: 'مراجعة ومتابعة تحضير العجين' },
        { id: 12, q: 'متابعة عملية تكوير العجين' },
        { id: 13, q: 'مراجعة تحضير الصوصات' },
        { id: 14, q: 'فصل الأغذية النيئة عن المطبوخة' },
        { id: 15, q: 'منع التلوث الخلطي أثناء التحضير' },
        { id: 16, q: 'إذابة الأغذية بطريقة آمنة' },
        { id: 17, q: 'عدم ترك الغذاء في الغرفة > ساعتين' },
        { id: 18, q: 'وصول حرارة الطهي لـ 75°م' },
        { id: 19, q: 'إعادة التسخين لدرجة حرارة آمنة' },
        { id: 20, q: 'استخدام ألواح تقطيع ملونة' },
        { id: 21, q: 'ارتداء القفازات عند اللمس المباشر' }
      ]},
      // ... سيتم تكرار الباقي بنفس النمط للوصول لـ 74 بند
    ];

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [branch, setBranch] = useState("");
      const [answers, setAnswers] = useState({});
      const [notes, setNotes] = useState({});
      const [photos, setPhotos] = useState({});
      const [expanded, setExpanded] = useState(new Set(['sec1']));

      useEffect(() => {
        auth.onAuthStateChanged(u => { setUser(u); setLoading(false); });
      }, []);

      const getScore = () => {
        const yes = Object.values(answers).filter(v => v === 'yes').length;
        const na = Object.values(answers).filter(v => v === 'na').length;
        const answered = Object.keys(answers).length - na;
        return answered > 0 ? Math.round((yes / answered) * 100) : 0;
      };

      const handleImage = (id, e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setPhotos(prev => ({...prev, [id]: [...(prev[id] || []), ev.target.result]}));
        };
        reader.readAsDataURL(file);
      };

      const removeImg = (id, idx) => {
        setPhotos(prev => ({...prev, [id]: prev[id].filter((_, i) => i !== idx)}));
      };

      const resetAll = () => {
        if(confirm("هل تريد مسح كل البيانات والبدء من جديد؟")) {
          setAnswers({}); setNotes({}); setPhotos({}); setBranch("");
        }
      };

      const generateReport = () => {
        const element = document.createElement('div');
        element.style.padding = '20px';
        element.style.direction = 'rtl';
        element.innerHTML = `<h1 style="color:#004b47">تقرير تفتيش VERRA - ${branch}</h1><p>المفتش: ${user.email}</p><p>الدرجة: ${getScore()}%</p><hr/>`;
        html2pdf().from(element).save(`Report_${branch}.pdf`);
      };

      if (loading) return <div className="h-screen flex items-center justify-center">جاري الاتصال بالسحابة...</div>;
      if (!user) return <LoginPage auth={auth} />;

      return (
        <div className="pb-40">
          <header className="header-grad p-6 text-center shadow-lg">
             <h1 className="text-2xl font-black italic tracking-tighter">VERRA PRO CLOUD</h1>
             <p className="text-[10px] opacity-70 uppercase">Food Safety Professional Dashboard</p>
          </header>

          <div className="progress-sticky shadow-xl flex justify-between items-center">
             <div>
                <p className="text-[10px] font-bold text-gray-400">التقدم: {Object.keys(answers).length}/74</p>
                <p className="text-2xl font-black text-green-700">{getScore()}%</p>
             </div>
             <div className="flex gap-2">
                <button onClick={resetAll} className="bg-red-100 text-red-600 px-3 py-2 rounded-xl text-xs font-bold border border-red-200">Reset</button>
                <button onClick={generateReport} className="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg">View Report</button>
                <button onClick={() => auth.signOut()} className="text-gray-400 text-[10px] font-bold">خروج</button>
             </div>
          </div>

          <main className="p-4 max-w-2xl mx-auto">
             <div className="bg-white p-5 rounded-2xl shadow-sm mb-6 border-b-4 border-green-800">
                <input className="w-full text-lg font-bold outline-none" placeholder="اكتب اسم الفرع هنا..." value={branch} onChange={e=>setBranch(e.target.value)} />
             </div>

             {fullChecklist.map(s => (
               <div key={s.id} className="mb-4">
                  <div className="section-header rounded-xl" onClick={()=>{
                    const n = new Set(expanded); n.has(s.id)?n.delete(s.id):n.add(s.id); setExpanded(n);
                  }}>
                    <span className="font-bold text-green-900">{s.title}</span>
                    <span>{expanded.has(s.id)?'▲':'▼'}</span>
                  </div>

                  {expanded.has(s.id) && s.items.map(i => (
                    <div key={i.id} className="item-card mt-2">
                       <div className="flex justify-between items-start mb-4">
                          <p className="text-sm font-bold text-green-950 ml-4">{i.id}. {i.q}</p>
                          <div className="flex gap-1">
                             <button onClick={()=>setAnswers({...answers, [i.id]:'yes'})} className={`answer-btn btn-yes ${answers[i.id]==='yes'?'active':''}`}>نعم</button>
                             <button onClick={()=>setAnswers({...answers, [i.id]:'no'})} className={`answer-btn btn-no ${answers[i.id]==='no'?'active':''}`}>لا</button>
                             <button onClick={()=>setAnswers({...answers, [i.id]:'na'})} className={`answer-btn btn-na ${answers[i.id]==='na'?'active':''}`}>N/A</button>
                          </div>
                       </div>

                       <textarea className="notes-area" placeholder="أضف ملاحظاتك..." value={notes[i.id]||""} onChange={e=>setNotes({...notes, [i.id]:e.target.value})} />

                       <div className="mt-4 flex flex-wrap gap-2 items-center">
                          {/* زر الكاميرا الصريح */}
                          <label className="upload-btn">
                             📷 الكاميرا
                             <input type="file" className="hidden" accept="image/*" capture="environment" onChange={e=>handleImage(i.id, e)} />
                          </label>

                          {/* زر المعرض الصريح */}
                          <label className="upload-btn" style={{background:'#eff6ff', color:'#1e40af'}}>
                             🖼️ المعرض
                             <input type="file" className="hidden" accept="image/*" onChange={e=>handleImage(i.id, e)} />
                          </label>

                          <div className="flex flex-wrap">
                             {(photos[i.id] || []).map((img, idx) => (
                                <div key={idx} className="photo-box">
                                   <img src={img} className="photo-img" />
                                   <div className="btn-del" onClick={()=>removeImg(i.id, idx)}>×</div>
                                </div>
                             ))}
                          </div>
                       </div>
                    </div>
                  ))}
               </div>
             ))}
          </main>

          <button 
             onClick={async () => {
                if(!branch) return alert("يرجى إدخال اسم الفرع");
                await db.collection("reports").add({ branch, score: getScore(), inspector: user.email, date: new Date().toLocaleDateString() });
                alert("تم الإرسال للسحابة!");
             }}
             className="fixed bottom-6 left-6 right-6 bg-green-800 text-white font-bold py-5 rounded-2xl shadow-2xl z-50 text-xl"
          >
             إرسال للسحابة
          </button>
        </div>
      );
    }

    function LoginPage({ auth }) {
      const [e, setE] = useState(""); const [p, setP] = useState("");
      return (
        <div className="h-screen bg-[#004b47] flex items-center justify-center p-6">
           <div className="bg-white p-8 rounded-[40px] shadow-2xl w-full max-w-sm text-center">
              <h1 className="text-3xl font-black text-green-900 mb-8 italic">VERRA PRO</h1>
              <input className="w-full border-2 p-4 rounded-2xl mb-4 text-right" placeholder="البريد" onChange={v=>setE(v.target.value)} />
              <input className="w-full border-2 p-4 rounded-2xl mb-8 text-right" type="password" placeholder="كلمة السر" onChange={v=>setP(v.target.value)} />
              <button onClick={()=>auth.signInWithEmailAndPassword(e,p).catch(err=>alert("خطأ"))} className="w-full bg-green-800 text-white font-bold py-4 rounded-2xl">دخول</button>
           </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
