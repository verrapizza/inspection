<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VERRA PRO - النظام المتكامل</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f4f7f6; color: #1a4d36; margin: 0; }
    .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    .gold-text { color: #d1ba89; }
    .gold-border { border-color: #d1ba89; }
    .card { background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; }
    .section-title { background: #e8f5ee; border-right: 8px solid #d1ba89; padding: 15px; border-radius: 12px; font-weight: 900; color: #004b47; font-size: 1.1rem; margin-bottom: 15px; }
    .ans-btn { width: 55px; height: 40px; border-radius: 10px; font-weight: 700; font-size: 12px; transition: 0.3s; background: #f3f4f6; border: 1px solid #d1d5db; }
    .btn-yes.active { background: #10b981 !important; color: white; border-color: #059669; transform: scale(1.05); }
    .btn-no.active { background: #ef4444 !important; color: white; border-color: #dc2626; transform: scale(1.05); }
    .btn-na.active { background: #6b7280 !important; color: white; }
    .notes-input { width: 100%; margin-top: 10px; padding: 12px; border-radius: 12px; border: 1px solid #d1ba89; background: #fffdf5; font-size: 14px; outline: none; }
    .sig-canvas { border: 2px dashed #cbd5e1; border-radius: 15px; background: white; width: 100%; height: 200px; touch-action: none; }
    /* مخزن الصور */
    .photo-thumb { width: 75px; height: 75px; object-fit: cover; border-radius: 12px; border: 2px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    /* شريط التقدم */
    .sticky-header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-bottom: 2px solid #004b47; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
      authDomain: "verra-system-828f2.firebaseapp.com",
      projectId: "verra-system-828f2",
      storageBucket: "verra-system-828f2.firebasestorage.app",
      messagingSenderId: "961104891607",
      appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // القائمة الكاملة بـ 74 بنداً مقسمة باحترافية
    const sectionsData = [
      { title: "1. الاستلام والتخزين", items: [
        "فحص درجات حرارة المواد الغذائية الواردة عند التسليم", "درجة حرارة المجمدات لا تتجاوز -18°م عند الاستلام", "درجة حرارة المبردات لا تتجاوز 4°م عند الاستلام", "استخدام مقياس حرارة معاير للأغذية عالية الخطورة", "نقل الأغذية المبردة إلى التخزين خلال أقل من 20 دقيقة", "مطابقة المنتجات للمواصفات القياسية السعودية", "اللحوم الطازجة من مسالخ معتمدة ومختومة رسمياً", "التعبئة سليمة وخالية من الآفات أو التلف", "التحقق من تواريخ الصلاحية وتسجيلها عند الاستلام", "أماكن التخزين نظيفة وجافة وجيدة التهوية"
      ]},
      { title: "2. تحضير الأغذية", items: [
        "مراجعة ومتابعة بروسيس تحضير العجين", "متابعة بروسيس تكوير العجين", "مراجعة تحضير الصوصات", "فصل مناطق تحضير الأغذية النيئة عن المطبوخة", "منع التلوث الخلطي أثناء التحضير", "إذابة الأغذية في الثلاجة أو تحت ماء بارد جارٍ", "عدم ترك الأغذية المحضرة في حرارة الغرفة > ساعتين", "وصول درجات حرارة الطهي لـ (≥75°م)", "إعادة التسخين لدرجة حرارة لا تقل عن 75°م", "استخدام ألواح تقطيع ملونة لأنواع مختلفة", "ارتداء القفازات عند لمس الأغذية الجاهزة"
      ]},
      { title: "3. جودة المنتج", items: [
        "معاينة جودة المنتج النهائي (قسم الباستا)", "معاينة جودة المنتج النهائي (قسم البيتزا)", "رفع صورة المنتج النهائي على الواتساب في كل الفروع"
      ]},
      { title: "4. المنشأة والبيئة", items: [
        "المنشأة تقع بعيداً عن مصادر التلوث", "خلو الجدران والأرضيات والأسقف من التشققات", "الأبواب محكمة الإغلاق وتغلق تلقائياً", "النوافذ مزودة بشبكات معدنية سليمة", "ميل مناسب للصرف في جميع المناطق", "أجهزة التكييف فعالة وتعمل بشكل صحيح", "وجود شفاطات دخان فوق الأفران والشوايات", "إضاءة كافية في جميع مناطق التداول", "الأرضيات مقاومة للماء وغير زلقة وسهلة التنظيف"
      ]},
      { title: "5. التنظيف والتعقيم", items: [
        "جدول التنظيف موثق ويتم اتباعه بدقة", "المطهرات آمنة للأغذية وبالتركيزات الصحيحة", "تنظيف وتعقيم المعدات بعد كل استخدام", "التنظيف العميق يومياً لجميع الأسطح الملامسة", "حاويات النفايات تفتح بالقدم وتفرغ بانتظام", "التخلص من النفايات يمنع تلوث المياه أو الأغذية", "عقد مكافحة آفات ساري مع شركة متخصصة", "عدم وجود دلائل على القوارض أو الحشرات"
      ]},
      { title: "6. النظافة الشخصية", items: [
        "جميع العاملين يرتدون زياً نظيفاً وأغطية للشعر", "ارتداء الكمامات في مناطق الأغذية القابلة للتلف", "محطات غسل اليدين مزودة بالصابون والماء الساخن", "غسل اليدين قبل التعامل مع الأغذية وبعد الاستراحة", "عدم ارتداء المجوهرات أو طلاء الأظافر", "فحوصات طبية قبل التوظيف من جهات معتمدة", "فحوصات طبية روتينية سنوية لجميع العاملين", "استبعاد العاملين المصابين بالأمراض المعدية"
      ]},
      { title: "7. المعدات والأدوات", items: [
        "المعدات مصنوعة من مواد مقاومة للتآكل وآمنة", "مقاييس الحرارة معايرة وتعمل بشكل صحيح", "الثلاجات والمجمدات تحافظ على درجات الحرارة المطلوبة", "تسجيل سجلات درجة الحرارة مرتين يومياً على الأقل", "صيانة وتنظيف معدات الطهي بانتظام", "أسطح ملامسة للأغذية ناعمة وخالية من التشققات"
      ]},
      { title: "8. التتبع والتوثيق", items: [
        "الالتزام بسجلات مراقبة الجودة (ديفروست، تعقيم، زيت)", "رفع لوائح التشييك يومياً على مجموعة الواتساب", "دليل تتبع الأغذية متاح وكامل في المنشأة", "الاحتفاظ بسجلات التتبع 180 يوماً بعد الصلاحية", "ترميز المنتجات لتحديد كل دفعة وتاريخ الإنتاج", "سجلات اعتماد الموردين تشمل الشهادات والمواصفات", "جميع العاملين يحملون شهادات صحية سارية المفعول", "خطة HACCP موثقة ومعتمدة ومراجعتها بانتظام", "سجلات التنظيف والتعقيم كاملة ومحدثة", "الاحتفاظ بسجلات مراقبة درجة الحرارة وتوقيعها"
      ]},
      { title: "9. إمداد المياه والسباكة", items: [
        "إمداد مياه الشرب كافٍ ونظيف تماماً", "تركيب فلاتر المياه وتنظيفها وصيانتها", "عدم وجود تسربات في مواسير الصرف أو وصلاتها", "إغلاق فتحات الصرف أثناء ساعات العمل", "أحواض غسل اليدين مزودة بأجهزة تجفيف"
      ]},
      { title: "10. إدارة مسببات الحساسية", items: [
        "معلومات مسببات الحساسية كاملة على الملصقات", "مناطق تحضير منفصلة للأصناف الخالية من الحساسية", "أدوات مخصصة لتحضير الأغذية الخاصة", "تدريب الموظفين على التوعية بمسببات الحساسية"
      ]}
    ];

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [branch, setBranch] = useState("");
      const [location, setLocation] = useState("جاري تحديد الموقع...");
      const [answers, setAnswers] = useState({});
      const [notes, setNotes] = useState({});
      const [photos, setPhotos] = useState({});
      const [expanded, setExpanded] = useState(new Set([sectionsData[0].title]));
      const canvasRef = useRef(null);
      const sigPad = useRef(null);

      useEffect(() => {
        auth.onAuthStateChanged(u => { setUser(u); setLoading(false); });
        
        // ذكاء الموقع التلقائي
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(pos => {
            setLocation(`Lat: ${pos.coords.latitude.toFixed(4)}, Lng: ${pos.coords.longitude.toFixed(4)}`);
          }, () => setLocation("الموقع غير متاح"));
        }
      }, []);

      useEffect(() => {
        if (user && canvasRef.current) {
          sigPad.current = new SignaturePad(canvasRef.current);
        }
      }, [user, loading]);

      const getScore = () => {
        const vals = Object.values(answers);
        const yes = vals.filter(v => v === 'yes').length;
        const total = vals.filter(v => v !== 'na').length;
        return total > 0 ? Math.round((yes / total) * 100) : 0;
      };

      const handlePhoto = (id, e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setPhotos(prev => ({...prev, [id]: [...(prev[id] || []), ev.target.result].slice(0,3)}));
        };
        reader.readAsDataURL(file);
      };

      const generatePDF = () => {
        const score = getScore();
        const scoreColor = score >= 70 ? '#10b981' : '#ef4444';
        const signature = sigPad.current ? sigPad.current.toDataURL() : "";

        // بناء تقرير نظيف جداً في الذاكرة
        const pdfArea = document.createElement('div');
        pdfArea.style.cssText = "width: 800px; padding: 40px; background: white; direction: rtl; position: absolute; left: -9999px; top: 0;";
        
        pdfArea.innerHTML = `
          <div style="text-align: center; border-bottom: 4px solid #004b47; padding-bottom: 20px;">
            <img src="https://chef-ayo.github.io/verra-food-safety-inspector/logo.png" style="height: 100px; margin-bottom: 10px" />
            <h1 style="color: #004b47; font-size: 32px; margin: 0">تقرير فحص الجودة والسلامة الغذائية</h1>
            <p style="color: #666; font-size: 14px">نظام فيرا PRO السحابي</p>
          </div>

          <div style="display: flex; justify-content: space-between; margin-top: 30px; background: #f8fafc; padding: 20px; border-radius: 15px; border: 1px solid #e2e8f0;">
            <div style="line-height: 1.8">
              <p><b>👤 المفتش:</b> ${user.email.split('@')[0].toUpperCase()}</p>
              <p><b>🏢 المنشأة:</b> ${branch || 'غير محدد'}</p>
              <p><b>📍 الموقع:</b> ${location}</p>
              <p><b>📅 التاريخ:</b> ${new Date().toLocaleDateString('ar-EG')}</p>
            </div>
            <div style="text-align: center; border-right: 2px solid #ddd; padding-right: 40px">
              <p style="font-weight: bold; color: #64748b">درجة الامتثال</p>
              <div style="font-size: 48px; font-weight: 900; color: ${scoreColor}">${score}%</div>
            </div>
          </div>

          <div style="margin-top: 30px">
            ${sectionsData.map(sec => `
              <div style="background: #e8f5ee; padding: 10px; font-weight: 900; border-right: 6px solid #d1ba89; margin-top: 25px; font-size: 18px; color: #004b47">${sec.title}</div>
              ${sec.items.map((q, idx) => {
                const id = `${sec.title}-${idx}`;
                const ans = answers[id];
                const note = notes[id];
                const itemPhotos = photos[id] || [];
                return `
                  <div style="padding: 15px; border-bottom: 1px solid #eee; page-break-inside: avoid">
                    <p style="margin: 0; font-size: 15px"><b>${idx+1}. ${q}</b></p>
                    <p style="margin: 5px 0; font-size: 13px">الحالة: ${ans === 'yes' ? '<span style="color:green">✅ مطابق</span>' : ans === 'no' ? '<span style="color:red">❌ مخالف</span>' : '⚪ N/A'}</p>
                    ${note ? `<div style="background: #fffbeb; padding: 8px; border-radius: 8px; font-size: 12px; border: 1px solid #fde68a; margin: 10px 0"><b>الملاحظة:</b> ${note}</div>` : ''}
                    <div style="display: flex; gap: 10px; margin-top: 10px">
                      ${itemPhotos.map(p => `<img src="${p}" style="width: 180px; height: 130px; border-radius: 10px; object-fit: cover; border: 1px solid #ccc" />`).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            `).join('')}
          </div>

          <div style="margin-top: 60px; border-top: 2px solid #eee; padding-top: 30px; display: flex; justify-content: space-between; align-items: flex-end">
            <div style="text-align: center">
              <p style="font-weight: bold; margin-bottom: 10px">توقيع المفتش المعتمد</p>
              <img src="${signature}" style="width: 250px; border-bottom: 2px solid #004b47" />
              <p style="margin-top: 5px; font-size: 12px; color: #666">${user.email}</p>
            </div>
            <p style="color: #94a3b8; font-size: 10px">ID: VERRA-${Date.now()}</p>
          </div>
        `;

        document.body.appendChild(pdfArea);
        const opt = { margin: 0, filename: `VERRA_Report_${branch}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true, scrollY: 0 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
        
        html2pdf().set(opt).from(pdfArea).save().then(() => document.body.removeChild(pdfArea));
      };

      if (loading) return <div className="h-screen flex items-center justify-center font-bold text-green-900 animate-pulse text-3xl italic">VERRA PRO...</div>;
      if (!user) return <Login auth={auth} />;

      return (
        <div className="pb-40">
          {/* Header */}
          <div className="verra-gradient p-8 text-center shadow-2xl rounded-b-[3rem]">
            <img src="https://chef-ayo.github.io/verra-food-safety-inspector/logo.png" className="h-24 mx-auto mb-4 drop-shadow-lg" />
            <h1 className="text-3xl font-black gold-text italic tracking-tighter uppercase">Verra Pro</h1>
            <div className="mt-6 flex flex-wrap justify-center gap-3">
              <span className="bg-white/10 px-5 py-2 rounded-full text-xs font-bold border border-white/20 text-white">👤 {user.email.split('@')[0].toUpperCase()}</span>
              <span className="bg-white/10 px-5 py-2 rounded-full text-xs font-bold border border-white/20 text-white">📍 {location}</span>
            </div>
          </div>

          {/* Sticky Progress */}
          <div className="sticky-header px-6 py-4 flex justify-between items-center shadow-lg">
            <div>
              <p className="text-[10px] font-black text-gray-400 uppercase">Compliance Score</p>
              <p className="text-4xl font-black text-green-700">{getScore()}%</p>
            </div>
            <div className="flex gap-2">
              <button onClick={()=>location.reload()} className="bg-red-500 text-white p-3 rounded-2xl shadow-xl active:scale-90 transition"><svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg></button>
              <button onClick={downloadPDF} className="bg-blue-600 text-white px-8 py-3 rounded-2xl font-black shadow-2xl active:scale-95 transition tracking-widest">VIEW PDF</button>
            </div>
          </div>

          <main className="p-4 max-w-2xl mx-auto space-y-6">
            <div className="card p-6 border-r-[12px] border-green-800">
              <p className="text-xs font-black text-gray-400 mb-2 uppercase">اسم الفرع المستهدف</p>
              <input className="w-full text-2xl font-bold outline-none text-green-950 bg-transparent" placeholder="اكتب اسم المطعم هنا..." value={branch} onChange={e=>setBranch(e.target.value)} />
            </div>

            {sectionsData.map(sec => (
              <div key={sec.title}>
                <div className="section-title flex justify-between items-center" onClick={() => {
                  const n = new Set(expanded); n.has(sec.title) ? n.delete(sec.title) : n.add(sec.title); setExpanded(n);
                }}>
                  <span>{sec.title}</span>
                  <span className="text-xs opacity-50">{expanded.has(sec.title) ? 'إغفاء ▲' : 'عرض ▼'}</span>
                </div>

                {expanded.has(sec.title) && sec.items.map((q, idx) => {
                  const id = `${sec.title}-${idx}`;
                  return (
                    <div key={id} className="card p-6 mb-4">
                      <div className="flex justify-between items-start mb-5">
                        <p className="text-md font-bold text-green-950 ml-4 leading-relaxed">{idx+1}. {q}</p>
                        <div className="flex gap-1">
                          <button onClick={()=>setAnswers({...answers, [id]:'yes'})} className={`ans-btn btn-yes ${answers[id]==='yes'?'active':''}`}>نعم</button>
                          <button onClick={()=>setAnswers({...answers, [id]:'no'})} className={`ans-btn btn-no ${answers[id]==='no'?'active':''}`}>لا</button>
                          <button onClick={()=>setAnswers({...answers, [id]:'na'})} className={`ans-btn btn-na ${answers[id]==='na'?'active':''}`}>N/A</button>
                        </div>
                      </div>
                      <textarea className="notes-input" placeholder="اكتب ملاحظة أو مخالفة..." value={notes[id]||""} onChange={e=>setNotes({...notes, [id]:e.target.value})} />
                      <div className="mt-5 flex flex-wrap gap-3 items-center">
                        <label className="bg-green-50 text-green-700 px-4 py-2 rounded-xl font-bold text-xs cursor-pointer border border-green-200">📷 إضافة صورة
                          <input type="file" className="hidden" accept="image/*" onChange={e=>handlePhoto(id, e)} />
                        </label>
                        <div className="flex flex-wrap gap-2">
                          {(photos[id] || []).map((img, i) => (
                            <div key={i} className="relative">
                              <img src={img} className="photo-thumb" />
                              <div className="del-img-btn" onClick={()=>setPhotos({...photos, [id]: photos[id].filter((_,x)=>x!==i)})}>×</div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            ))}

            <div className="card p-8 border-2 border-dashed border-gray-300">
              <h3 className="font-black text-center text-green-900 mb-6 italic tracking-widest uppercase">توقيع المفتش المعتمد</h3>
              <canvas ref={canvasRef} className="sig-canvas"></canvas>
              <button onClick={()=>sigPad.current.clear()} className="text-red-500 text-sm font-bold mt-4 underline block mx-auto">مسح التوقيع</button>
            </div>

            <button onClick={async () => {
                if(!branch) return alert("يرجى إدخال اسم الفرع");
                await db.collection("inspections").add({ 
                  branch, score: getScore(), inspector: user.email, 
                  date: new Date().toLocaleDateString('ar-EG'), 
                  signature: sigPad.current.toDataURL(), 
                  location: location, timestamp: firebase.firestore.FieldValue.serverTimestamp() 
                });
                alert("تم الإرسال للسحابة بنجاح!");
                location.reload();
            }} className="w-full verra-gradient text-white font-black py-6 rounded-[2rem] shadow-2xl text-2xl tracking-tighter active:scale-95 transition"
            >إرسال التقرير النهائي</button>
          </main>
        </div>
      );
    }

    function Login({ auth }) {
      const [e, setE] = useState(""); const [p, setP] = useState("");
      return (
        <div className="h-screen verra-gradient flex items-center justify-center p-6 text-right">
           <form onSubmit={(ev)=>{ev.preventDefault(); auth.signInWithEmailAndPassword(e, p).catch(err=>alert(err.message))}} className="bg-white p-10 rounded-[3.5rem] shadow-2xl w-full max-w-sm text-center">
              <h1 className="text-4xl font-black text-green-900 mb-10 italic tracking-tighter">VERRA PRO</h1>
              <input className="w-full border-2 p-5 rounded-2xl mb-4 text-right outline-none focus:border-green-600" placeholder="البريد الإلكتروني" onChange={v=>setE(v.target.value)} />
              <input className="w-full border-2 p-5 rounded-2xl mb-8 text-right outline-none focus:border-green-600" type="password" placeholder="كلمة المرور" onChange={v=>setP(v.target.value)} />
              <button type="submit" className="w-full verra-gradient text-white font-black py-5 rounded-2xl shadow-lg">دخول النظام السحابي</button>
           </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
