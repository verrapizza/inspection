<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام VERRA PRO - مشرف الجودة</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
    .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    .section-title { background: #e8f5ee; border-right: 8px solid #d1ba89; padding: 12px; border-radius: 10px; font-weight: 900; color: #004b47; margin: 20px 0 10px; cursor: pointer; }
    .item-card { background: white; border-radius: 15px; padding: 18px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
    .ans-btn { width: 55px; height: 40px; border-radius: 8px; font-weight: 700; font-size: 11px; background: #f1f5f9; border: 1px solid #e2e8f0; transition: 0.2s; }
    .btn-yes.active { background: #10b981 !important; color: white; border-color: #059669; }
    .btn-no.active { background: #ef4444 !important; color: white; border-color: #dc2626; }
    .btn-na.active { background: #64748b !important; color: white; }
    .notes-input { width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid #d1ba89; background: #fffdf5; font-size: 13px; outline: none; }
    .photo-thumb { width: 75px; height: 75px; object-fit: cover; border-radius: 10px; border: 2px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .del-img { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; z-index: 50; }
    .upload-btn { background: #e8f5ee; color: #004b47; padding: 8px 12px; border-radius: 10px; font-size: 10px; font-weight: bold; cursor: pointer; border: 1px solid #c8ddd3; display: inline-flex; align-items: center; gap: 4px; }
    .upload-btn-gallery { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .sticky-header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.98); backdrop-filter: blur(10px); border-bottom: 2px solid #004b47; padding: 12px 15px; }
    
    .nav-btn { padding: 5px 14px; border-radius: 8px; font-size: 10px; font-weight: bold; transition: 0.3s; display: inline-flex; align-items: center; gap: 5px; }
    .logout-btn { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
    .home-btn { background: rgba(209, 186, 137, 0.2); color: #d1ba89; border: 1px solid rgba(209, 186, 137, 0.4); }
    .preview-btn { background: #d1ba89 !important; color: #004b47 !important; font-weight: 900 !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const firebaseConfig = {
      apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
      authDomain: "verra-system-828f2.firebaseapp.com",
      projectId: "verra-system-828f2",
      storageBucket: "verra-system-828f2.firebasestorage.app",
      messagingSenderId: "961104891607",
      appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";

    const sectionsData = [
      { title: "الاستلام والتخزين", items: [{id:1,q:"فحص درجات حرارة المواد الغذائية الواردة عند التسليم"},{id:2,q:"درجة حرارة المجمدات لا تتجاوز -18°م عند الاستلام"},{id:3,q:"درجة حرارة المبردات لا تتجاوز 4°م عند الاستلام"},{id:4,q:"استخدام مقياس حرارة معاير للأغذية عالية الخطورة"},{id:5,q:"نقل الأغذية المبردة إلى التخزين خلال أقل من 20 دقيقة"},{id:6,q:"مطابقة المنتجات للمواصفات القياسية السعودية"},{id:7,q:"اللحوم الطازجة من مسالخ معتمدة ومختومة رسمياً"},{id:8,q:"التعبئة سليمة وخالية من الآفات أو التلف"},{id:9,q:"التحقق من تواريخ الصلاحية وتسجيلها عند الاستلام"},{id:10,q:"أماكن التخزين نظيفة وجافة وجيدة التهوية"}]},
      { title: "تحضير الأغذية", items: [{id:11,q:"مراجعة ومتابعة بروسيس تحضير العجين"},{id:12,q:"متابعة بروسيس تكوير العجين"},{id:13,q:"مراجعة تحضير الصوصات"},{id:14,q:"فصل مناطق تحضير الأغذية النيئة عن المطبوخة"},{id:15,q:"منع التلوث الخلطي أثناء التحضير"},{id:16,q:"إذابة الأغذية في الثلاجة أو تحت ماء بارد جارٍ"},{id:17,q:"عدم ترك الأغذية المحضرة في حرارة الغرفة > ساعتين"},{id:18,q:"وصول درجات حرارة الطهي لـ (≥75°م)"},{id:19,q:"إعادة التسخين لدرجة حرارة لا تقل عن 75°م"},{id:20,q:"استخدام لوحات تقطيع ملونة لأنواع مختلفة"},{id:21,q:"ارتداء القفازات عند لمس الأغذية الجاهزة"}]},
      { title: "جودة المنتج", items: [{id:22,q:"معاينة جودة المنتج النهائي (قسم الباستا)"},{id:23,q:"معاينة جودة المنتج النهائي (قسم البيتزا)"},{id:24,q:"رفع صورة المنتج النهائي على الواتساب في كل الفروع"}]},
      { title: "المنشأة والبيئة", items: [{id:25,q:"المنشأة تقع بعيداً عن مصادر التلوث"},{id:26,q:"خلو الجدران والأرضيات والأسقف من التشققات"},{id:27,q:"الأبواب محكمة الإغلاق وتغلق تلقائياً"},{id:28,q:"النوافذ مزودة بشبكات معدنية سليمة"},{id:29,q:"ميل مناسب للصرف في جميع المناطق"},{id:30,q:"أجهزة التكييف فعالة وتعمل بشكل صحيح"},{id:31,q:"وجود شفاطات فوق الأفران والشوايات"},{id:32,q:"إضاءة كافية في جميع مناطق التعامل مع الأغذية"},{id:33,q:"الأرضيات مقاومة للماء وغير زلقة وسهلة التنظيف"}]},
      { title: "التنظيف والتعقيم", items: [{id:34,q:"جدول التنظيف موثق ويتم اتباعه بدقة"},{id:35,q:"المطهرات آمنة للأغذية وبالتركيزات الصحيحة"},{id:36,q:"تنظيف وتعقيم المعدات بعد كل استخدام"},{id:37,q:"التنظيف العميق يومياً لجميع الأسطح الملامسة"},{id:38,q:"حاويات النفايات تفتح بالقدم وتفرغ بانتظام"},{id:39,q:"التخلص من النفايات يمنع تلوث المياه أو الأغذية"},{id:40,q:"عقد مكافحة آفات ساري مع شركة متخصصة"},{id:41,q:"عدم وجود دلائل على القوارض أو الحشرات"}]},
      { title: "النظافة الشخصية", items: [{id:42,q:"جميع العاملين يرتدون زياً نظيفاً وأغطية للشعر"},{id:43,q:"ارتداء الكمامات في مناطق الأغذية القابلة للتلف"},{id:44,q:"محطات غسل اليدين مزودة بالصابون والماء الساخن"},{id:45,q:"غسل اليدين قبل التعامل مع الأغذية وبعد الاستراحة"},{id:46,q:"عدم ارتداء المجوهرات أو طلاء الأظافر"},{id:47,q:"فحوصات طبية قبل التوظيف من جهات معتمدة"},{id:48,q:"فحوصات طبية روتينية سنوية لجميع العاملين"},{id:49,q:"استبعاد العاملين المصابين بالأمراض المعدية"}]},
      { title: "المعدات والأدوات", items: [{id:50,q:"المعدات مصنوعة من مواد مقاومة للتآكل وآمنة"},{id:51,q:"مقاييس الحرارة معايرة وتعمل بشكل صحيح"},{id:52,q:"الثلاجات والمجمدات تحافظ على درجات الحرارة المطلوبة"},{id:53,q:"تسجيل سجلات درجة الحرارة مرتين يومياً على الأقل"},{id:54,q:"صيانة وتنظيف معدات الطهي بانتظام"},{id:55,q:"أسطح ملامسة للأغذية ناعمة وخالية من التشققات"}]},
      { title: "التتبع والتوثيق", items: [{id:56,q:"الالتزام بسجلات مراقبة الجودة (ديفروست، تعقيم، زيت)"},{id:57,q:"رفع لوائح التشييك يومياً على مجموعة الواتساب"},{id:58,q:"دليل تتبع الأغذية متاح وكامل في المنشأة"},{id:59,q:"الاحتفاظ بسجلات التتبع 180 يوماً"},{id:60,q:"ترميز المنتجات لتحديد كل دفعة وتاريخ الإنتاج"},{id:61,q:"سجلات اعتماد الموردين والشهادات"},{id:62,q:"جميع العاملين يحملون شهادات صحية سارية"},{id:63,q:"خطة HACCP موثقة ومعتمدة"},{id:64,q:"سجلات التنظيف والتعقيم كاملة ومحدثة"},{id:65,q:"الاحتفاظ بسجلات مراقبة درجة الحرارة"}]},
      { title: "إمداد المياه والسباكة", items: [{id:66,q:"إمداد مياه الشرب كافٍ ونظيف تماماً"},{id:67,q:"تركيب فلاتر المياه وتنظيفها وصيانتها"},{id:68,q:"عدم وجود تسربات في مواسير الصرف"},{id:69,q:"إغلاق فتحات الصرف أثناء ساعات العمل"},{id:70,q:"أحواض غسل اليدين مزودة بأجهزة تجفيف"}]},
      { title: "إدارة مسببات الحساسية", items: [{id:71,q:"معلومات مسببات الحساسية كاملة على الملصقات"},{id:72,q:"مناطق تحضير منفصلة للأصناف الخالية من الحساسية"},{id:73,q:"أدوات مخصصة لتحضير الأغذية الخاصة"},{id:74,q:"تدريب الموظفين على مسببات الحساسية"}]}
    ];

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [submitting, setSubmitting] = useState(false);
      const [branch, setBranch] = useState("");
      const [branches, setBranches] = useState([]);
      const [answers, setAnswers] = useState({});
      const [notes, setNotes] = useState({});
      const [photos, setPhotos] = useState({});
      const [expanded, setExpanded] = useState(new Set([sectionsData[0].title]));
      const canvasRef = useRef(null);
      const sigPad = useRef(null);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(u => { setUser(u); setLoading(false); });
        db.collection("branches").orderBy("name").onSnapshot(snap => setBranches(snap.docs.map(d => d.data().name)));
        return () => unsubscribe();
      }, []);

      useEffect(() => { if (user && canvasRef.current) sigPad.current = new SignaturePad(canvasRef.current); }, [user]);

      const handleLogout = () => { if(confirm("هل تريد تسجيل الخروج؟")) auth.signOut(); };

      const handlePhotoAction = (id, e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => setPhotos(prev => ({...prev, [id]: [...(prev[id] || []), ev.target.result].slice(0, 3)}));
        reader.readAsDataURL(file);
      };

      const getScore = () => {
        const vals = Object.values(answers);
        const yes = vals.filter(v => v === 'yes').length;
        const total = vals.filter(v => v !== 'na' && v !== undefined).length;
        return total > 0 ? Math.round((yes / total) * 100) : 0;
      };

      const handlePreview = () => {
        if (!branch) return alert("يرجى اختيار المنشأة أولاً");
        const score = getScore();
        const signatureImg = sigPad.current && !sigPad.current.isEmpty() ? sigPad.current.toDataURL() : "";
        const timestamp = new Date().toLocaleString('en-GB', { hour12: true });

        let reportContent = sectionsData.map(sec => {
          let items = sec.items.map(i => {
            const ans = answers[i.id]; const note = notes[i.id] || ""; const pics = photos[i.id] || [];
            let status = "N/A"; let color = "#64748b";
            if (ans === 'yes') { status = "مطابق ✅"; color = "#059669"; }
            if (ans === 'no') { status = "مخالفة ❌"; color = "#dc2626"; }
            return `
              <div style="padding: 12px; border-bottom: 1px solid #eee; page-break-inside: avoid;">
                <p style="margin: 0; font-size: 13px; font-weight: bold; color: #1e293b;">${i.id}. ${i.q}</p>
                <p style="font-size: 11px; margin: 5px 0; font-weight: bold; color: ${color}; text-align: right;">الحالة: ${status}</p>
                ${note ? `<div style="background: #fff9e6; padding: 6px; border-radius: 5px; font-size: 10px; border: 1px solid #fde68a;">ملاحظة: ${note}</div>` : ""}
                <div style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px;">
                    ${pics.map(p => `<img src="${p}" style="width: 140px; height: 100px; object-fit: cover; border-radius: 6px; border: 1px solid #eee;" />`).join('')}
                </div>
              </div>`;
          }).join("");
          return `<div style="background: #e8f5ee; padding: 10px; margin-top: 20px; border-right: 6px solid #d1ba89; color: #004b47; font-weight: 900; font-size: 15px;">${sec.title}</div>${items}`;
        }).join("");

        const fullTemplate = `
          <div style="width: 750px; margin: 0 auto; padding: 40px; background: white; direction: rtl; font-family: sans-serif; text-align: right; box-sizing: border-box;">
            <div style="text-align: center; border-bottom: 5px solid #004b47; padding-bottom: 15px; margin-bottom: 30px;">
                <img src="${LOGO_URL}" style="height: 100px;" />
                <h1 style="color: #004b47; font-size: 26px; font-weight: 900;">تقرير تدقيق الجودة الرسمي</h1>
            </div>
            <div style="background: #f8fafc; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center;">
                <div style="flex: 1; line-height: 2">
                    <p><b>🏢 المنشأة:</b> ${branch}</p>
                    <p><b>👤 المفتش:</b> ${user.email}</p>
                    <p><b>📅 التاريخ:</b> ${timestamp}</p>
                </div>
                <div style="width: 150px; text-align: center; border-right: 3px solid #004b47; padding-right: 15px;">
                    <p style="color: #64748b; font-size: 11px;">معدل الامتثال</p>
                    <div style="font-size: 40px; font-weight: 900; color: ${score >= 70 ? '#059669' : '#dc2626'}">${score}%</div>
                </div>
            </div>
            ${reportContent}
            <div style="margin-top: 50px; border-top: 4px solid #004b47; padding-top: 30px; page-break-inside: avoid;">
                <p style="font-weight: 900; color: #004b47; font-size: 16px; margin-bottom: 20px;">توقيع المفتش المعتمد:</p>
                <div style="text-align: right; width: 350px; height: 120px; border-bottom: 2px solid #004b47;">
                  ${signatureImg ? `<img src="${signatureImg}" style="width: 100%; height: 100%; object-fit: contain; display: block;" />` : "<p style='color:red'>لم يتم التوقيع</p>"}
                </div>
            </div>
          </div>`;

        alert("جاري تجهيز المعاينة...");
        html2pdf().from(fullTemplate).set({ margin:0, filename:`Inspection_${branch}.pdf`, image:{type:'jpeg', quality:0.98}, html2canvas:{scale:2, useCORS:true, scrollY:0}, jsPDF:{unit:'mm', format:'a4'} }).save();
      };

      const handleFinalSubmit = async () => {
          if(!branch) return alert("اختر المنشأة أولاً");
          if(submitting) return;
          setSubmitting(true);
          const score = getScore();
          const reportId = Date.now();
          const timestampStr = new Date().toLocaleString('en-GB', { hour12: true });

          try {
              let local = JSON.parse(localStorage.getItem('v2_reports')) || [];
              local.unshift({ id: reportId, branch, score, inspector: user.email, date: timestampStr, isCrit: score < 70 });
              localStorage.setItem('v2_reports', JSON.stringify(local.slice(0, 30)));

              await db.collection("inspections").add({ 
                  id: reportId, branch, score, inspector: user.email, date: timestampStr, timestamp: reportId, isCrit: score < 70,
                  signature: sigPad.current ? sigPad.current.toDataURL() : "", answers, notes, photos 
              });

              alert("✅ تم الإرسال والمزامنة بنجاح!");
              window.location.reload();
          } catch (e) { alert("⚠️ خطأ في السحابة."); }
          finally { setSubmitting(false); }
      };

      if (loading) return <div className="h-screen flex items-center justify-center font-bold text-[#004b47] animate-pulse">جاري تحميل النظام...</div>;
      if (!user) return <Login auth={auth} logo={LOGO_URL} />;

      return (
        <div className="pb-40 text-right">
          <div className="verra-gradient p-12 text-center shadow-xl rounded-b-[4rem] relative">
            <img src={LOGO_URL} className="h-32 mx-auto mb-4 drop-shadow-2xl" />
            <div className="flex flex-col items-center gap-3">
                <span className="bg-white/10 px-4 py-1 rounded-full text-[10px] text-white font-bold border border-white/10 uppercase tracking-tighter">👤 {user.email}</span>
                <div className="flex gap-2">
                    {user.email === "ch3f.ramzi@gmail.com" && (
                        <button onClick={() => window.location.href='admin.html'} className="nav-btn home-btn">🏠 الرئيسية</button>
                    )}
                    <button onClick={handleLogout} className="nav-btn logout-btn">تسجيل الخروج ↪</button>
                </div>
            </div>
          </div>

          <div className="sticky-header flex justify-between items-center shadow-lg">
            <div className="text-right">
              <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest leading-none">Score</p>
              <p className="text-4xl font-black text-green-700 leading-none mt-1">{getScore()}%</p>
            </div>
            <div className="flex gap-2">
                <button onClick={handlePreview} className="nav-btn preview-btn px-5 py-2.5 rounded-xl shadow transition">معاينة</button>
                <button onClick={handleFinalSubmit} disabled={submitting} className={`${submitting ? 'bg-gray-400':'verra-gradient'} text-white px-5 py-2.5 rounded-xl font-black shadow-lg text-xs active:scale-95 transition`}>{submitting ? '...' : 'إرسال'}</button>
            </div>
          </div>

          <main className="p-5 max-w-3xl mx-auto space-y-8 mt-4">
            <div className="card p-7 border-r-[15px] border-green-800 shadow-xl">
                <select className="w-full text-2xl font-black outline-none bg-transparent text-green-950 text-right" value={branch} onChange={e=>setBranch(e.target.value)}>
                    <option value="">-- اختر المنشأة --</option>
                    {branches.map(b => <option key={b} value={b}>{b}</option>)}
                </select>
            </div>

            {sectionsData.map(sec => (
              <div key={sec.title}>
                <div className="section-title flex justify-between items-center px-6 py-4 shadow-sm" onClick={() => {
                  const n = new Set(expanded); n.has(sec.title) ? n.delete(sec.title) : n.add(sec.title); setExpanded(n);
                }}>
                    <span className="text-lg">{sec.title}</span>
                    <span className="text-xs font-bold uppercase">{expanded.has(sec.title) ? 'Hide ▲' : 'Show ▼'}</span>
                </div>
                {expanded.has(sec.title) && sec.items.map((i) => (
                  <div key={i.id} className="item-card shadow-lg border border-gray-100">
                    <p className="text-md font-bold text-green-950 mb-5 leading-relaxed text-right">{i.id}. {i.q}</p>
                    <div className="flex gap-2 justify-end mb-6">
                      <button onClick={()=>setAnswers({...answers, [i.id]:'yes'})} className={`ans-btn ${answers[i.id]==='yes'?'active btn-yes':''}`}>نعم</button>
                      <button onClick={()=>setAnswers({...answers, [i.id]:'no'})} className={`ans-btn ${answers[i.id]==='no'?'active btn-no':''}`}>لا</button>
                      <button onClick={()=>setAnswers({...answers, [i.id]:'na'})} className={`ans-btn ${answers[i.id]==='na'?'active btn-na':''}`}>N/A</button>
                    </div>
                    <textarea className="notes-input shadow-inner text-right p-4 rounded-xl" placeholder="الملاحظة..." value={notes[i.id]||""} onChange={e=>setNotes({...notes, [i.id]:e.target.value})} />
                    
                    <div className="mt-5 flex flex-wrap gap-3 items-center justify-end">
                        <label className="upload-btn active:scale-95 shadow-md">📷 كاميرا<input type="file" className="hidden" accept="image/*" capture="environment" onChange={e => handlePhotoAction(i.id, e)} /></label>
                        <label className="upload-btn active:scale-95 shadow-md" style={{background:'#eff6ff', color:'#1e40af'}}>🖼️ معرض<input type="file" className="hidden" accept="image/*" onChange={e => handlePhotoAction(i.id, e)} /></label>
                        <div className="flex flex-wrap mr-auto">
                          {(photos[i.id] || []).map((img, px) => (
                            <div key={px} className="relative m-1">
                              <img src={img} className="photo-thumb" /><div className="del-img" onClick={()=>setPhotos({...photos, [i.id]: photos[i.id].filter((_,x)=>x!==px)})}>×</div>
                            </div>
                          ))}
                        </div>
                    </div>
                  </div>
                ))}
              </div>
            ))}
            
            <div className="card p-10 border-2 border-dashed border-gray-300 text-center shadow-inner">
              <h3 className="font-black text-green-900 mb-6 uppercase text-sm italic border-b pb-2 text-center underline decoration-green-300 underline-offset-8">توقيع المفتش المعتمد</h3>
              <canvas ref={canvasRef} className="sig-canvas w-full h-48 border border-gray-100 rounded-3xl bg-gray-50 shadow-inner"></canvas>
              <button onClick={()=>sigPad.current.clear()} className="text-red-500 text-xs font-bold mt-5 underline">مسح التوقيع</button>
            </div>
          </main>
        </div>
      );
    }

    function Login({ auth, logo }) {
      const [email, setEmail] = useState(""); 
      const [pass, setPass] = useState("");
      const [btnLoading, setBtnLoading] = useState(false);

      const handleLogin = (ev) => {
          ev.preventDefault();
          setBtnLoading(true);
          auth.signInWithEmailAndPassword(email, pass)
          .then(() => setBtnLoading(false))
          .catch((err) => {
              setBtnLoading(false);
              if (err.code === 'auth/user-not-found') alert("⚠️ المستخدم غير مسجل.");
              else if (err.code === 'auth/wrong-password') alert("⚠️ كلمة المرور خاطئة.");
              else alert("⚠️ خطأ: " + err.message);
          });
      };

      return (
        <div className="h-screen verra-gradient flex items-center justify-center p-6 text-right">
           <form onSubmit={handleLogin} className="bg-white p-12 rounded-[4rem] shadow-2xl w-full max-w-sm text-center">
              <img src={logo} className="h-24 mx-auto mb-6 shadow-2xl rounded-full" />
              <h1 className="text-2xl font-black text-green-900 mb-8 italic uppercase tracking-tighter">Login System</h1>
              <input className="w-full border-2 p-5 rounded-2xl mb-4 text-right outline-none focus:border-green-600 shadow-sm" placeholder="البريد الإلكتروني" value={email} onChange={v=>setEmail(v.target.value)} />
              <input className="w-full border-2 p-5 rounded-2xl mb-8 text-right outline-none focus:border-green-600 shadow-sm" type="password" placeholder="كلمة المرور" value={pass} onChange={v=>setPass(v.target.value)} />
              <button type="submit" disabled={btnLoading} className="w-full verra-gradient text-white font-black py-4 rounded-2xl shadow-xl active:scale-95 transition">
                {btnLoading ? "جاري التحقق..." : "دخول"}
              </button>
           </form>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
