<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERRA PRO - الإدارة المركزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none; }
        .verra-card { background: white; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; display: none; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; height: 94vh; border-radius: 40px 40px 0 0; padding: 25px; overflow-y: auto; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; position: sticky; top: -10px; background: white; z-index: 20; }
        .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
        .user-row { background: white; padding: 15px; border-radius: 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-right: 6px solid #d1ba89; }
        select.role-selector { font-size: 10px; padding: 4px; border-radius: 8px; border: 1px solid #ddd; outline: none; font-weight: bold; background: #f9fafb; margin-top: 5px; }
    </style>
</head>
<body class="pb-32 text-right">

    <div id="lockScreen" class="fixed inset-0 bg-white z-[500] flex flex-col items-center justify-center font-bold text-[#004b47]">
        <div class="w-12 h-12 border-4 border-t-green-500 border-gray-200 rounded-full animate-spin mb-4"></div>
        CONECTING TO VERRA SYSTEM...
    </div>

    <!-- الصفحة الرئيسية -->
    <div id="dashboardPage" class="page">
        <header class="bg-[#004b47] p-10 pb-28 rounded-b-[60px] text-white shadow-2xl relative text-right">
            <div class="flex justify-between items-center relative z-10">
                <div>
                    <h1 class="text-3xl font-black italic uppercase tracking-tighter">Verra <span class="text-[#d1ba89]">Pro</span></h1>
                    <p class="text-[10px] opacity-70 font-bold tracking-widest uppercase">Admin Command Center</p>
                </div>
                <button onclick="auth.signOut()" class="bg-red-500/20 text-red-200 px-4 py-2 rounded-xl text-[10px] font-bold border border-red-500/30 shadow-inner">خروج ↪</button>
            </div>
        </header>

        <main class="px-6 -mt-16 relative z-10">
            <div class="grid grid-cols-2 gap-4 mb-8 text-center">
                <div class="verra-card p-6 border-b-4 border-green-600 shadow-lg text-right"><p class="text-gray-400 text-[10px] font-bold mb-1 uppercase tracking-widest">الامتثال</p><h2 id="totalScore" class="text-3xl font-black text-green-700">--</h2></div>
                <div onclick="navigateTo('reportsPage')" class="verra-card p-6 border-b-4 border-blue-600 shadow-lg text-right"><p class="text-gray-400 text-[10px] font-bold mb-1">التقارير</p><h2 id="reportCount" class="text-3xl font-black text-blue-700">0</h2></div>
            </div>

            <div class="verra-card p-7 mb-4 border-r-[12px] border-[#004b47] shadow-xl italic" onclick="window.location.href='quality-inspection.html'"><h3 class="font-black text-gray-800 text-lg">🛡️ مراقبة الجودة</h3></div>
            <div class="verra-card p-7 mb-4 border-r-[12px] border-blue-600 shadow-xl italic" onclick="window.location.href='branches-inspector.html'"><h3 class="font-black text-gray-800 text-lg text-right">🏢 متابعة الفروع</h3></div>
            <div class="verra-card p-7 mb-4 border-r-[12px] border-green-700 shadow-xl italic" onclick="window.location.href='checklist.html'"><h3 class="font-black text-gray-800 text-lg text-right text-right text-right">✅ تشيك ليست المساعدين</h3></div>
            <div class="verra-card p-7 mb-10 border-r-[12px] border-[#d1ba89] shadow-xl italic text-right" onclick="navigateTo('usersPage')"><h3 class="font-black text-gray-800 text-lg text-right text-right">👤 إدارة المستخدمين</h3><p id="pendingBadge" class="text-[9px] text-red-500 font-bold hidden mt-1">طلبات تفعيل جديدة ⚠️</p></div>
        </main>
    </div>

    <!-- سجل التقارير -->
    <div id="reportsPage" class="page hidden px-6 pt-10 text-right">
        <div class="flex justify-between items-center mb-10 text-right"><h2 class="text-2xl font-black text-[#004b47] italic underline decoration-[#d1ba89] underline-offset-8">سجل التقارير</h2><button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full text-xs font-black shadow-sm border text-right">رجوع</button></div>
        <div id="reportsList" class="space-y-4 pb-24 text-right"></div>
    </div>

    <!-- إدارة المستخدمين -->
    <div id="usersPage" class="page hidden px-6 pt-10 text-right">
        <div class="flex justify-between items-center mb-8 text-right"><h2 class="text-2xl font-black text-[#004b47]">إدارة الصلاحيات</h2><button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full border shadow-sm">إغلاق</button></div>
        <div id="usersList" class="space-y-6 pb-24"></div>
    </div>

    <!-- نافذة تفاصيل التقرير والتحميل -->
    <div id="reportDetailModal" class="modal">
        <div class="modal-content text-right text-right text-right">
            <div class="modal-header"><button onclick="closeModal()" class="bg-red-50 text-red-500 w-10 h-10 rounded-full font-black flex items-center justify-center shadow-sm">X</button><h3 class="text-2xl font-black text-green-950 italic">تفاصيل التقرير</h3></div>
            <div id="detailBody" class="space-y-5 text-right"></div>
            <div class="mt-10 pb-10 border-t pt-8">
                <button id="downloadBtn" class="w-full verra-gradient text-white p-5 rounded-3xl font-black shadow-xl flex justify-center items-center gap-3">
                    <span id="btnText">📄 تحميل PDF التقرير الكامل</span>
                </button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-[#004b47] text-white flex justify-around p-5 z-50 rounded-t-[45px] shadow-2xl border-t border-white/10 text-right">
        <button onclick="navigateTo('dashboardPage')" id="nav-dashboard" class="flex flex-col items-center text-[#d1ba89]"><span class="text-2xl">🏠</span><span class="text-[9px] font-black mt-1">MAIN</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-2xl">📊</span><span class="text-[9px] font-black mt-1">LOGS</span></button>
        <button onclick="navigateTo('usersPage')" id="nav-users" class="flex flex-col items-center text-white/40"><span class="text-2xl">👤</span><span class="text-[9px] font-black mt-1">USERS</span></button>
    </nav>

    <script>
        const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";
        const firebaseConfig = { apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0", authDomain: "verra-system-828f2.firebaseapp.com", projectId: "verra-system-828f2", storageBucket: "verra-system-828f2.firebasestorage.app", messagingSenderId: "961104891607", appId: "1:961104891607:web:5ffd3af4983a8b015b6a92" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let cloudReports = []; let cloudUsers = []; let cloudPending = [];

        auth.onAuthStateChanged(user => {
            if (user && user.email === "ch3f.ramzi@gmail.com") { document.getElementById('lockScreen').classList.add('hidden'); startSync(); } 
            else { window.location.href = "checklist.html"; }
        });

        function fixNums(str) { return str ? str.toString().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)) : "0"; }

        // --- مصفوفة المساعدين (22 بنداً) ---
        const sectionsAssistant = [
            { title: "الواجهة والصالات | Front & Lounges", items: [{id:1, q:"check the restaurant front section (restaurant front + entrance floor + air curtain)\nتشيك قسم واجهة المطعم"},{id:2, q:"Check lounge section 1\nتشيك قسم صالة 1"},{id:3, q:"check bathroom hall 1\nتشيك الحمام صالة 1"},{id:9, q:"Check lounge section 2\nتشيك قسم صالة 2"},{id:10, q:"check bathroom hall 2\nتشيك الحمام صالة 2"},{id:11, q:"Check plants/trees\nتشيك على الأشجار"}]},
            { title: "المطبخ والإنتاج | Kitchen & Production", items: [{id:4, q:"Check pizza section (hygiene + dates)\nتشيك قسم البيتزا"},{id:12, q:"Check kitchen A (cleaning + air conditioning)\nتشيك المطبخ أ"},{id:13, q:"Check kitchen B (temperature + arrangement)\nتشيك المطبخ ب"},{id:14, q:"Check laundry section\nتشيك قسم الغسيل"},{id:15, q:"Check Restaurant back side\nتشيك القسم الخلفي"}]},
            { title: "التشغيل والعمال | Staff & Operations", items: [{id:5, q:"check cashier department\nتشيك قسم الكاشير"},{id:6, q:"Monitor Dashboard/Maps\nمتابعة لوحة التحكم"},{id:7, q:"Check juices section\nتشيك قسم العصائر"},{id:8, q:"Check store section\nتشيك قسم المستودع"},{id:17, q:"Send orders schedule\nرفع الطلبات"},{id:18, q:"check requests\nتشيك الطلبات"},{id:20, q:"Check attendance/covenant\nتشيك الحضور والعهدة"},{id:21, q:"Meeting today?\nالاجتماع اليومي"}]},
            { title: "الصيانة والإغلاق | Maintenance & Closing", items: [{id:19, q:"General check facilities/lamps\nتشيك عام للمرافق"},{id:22, q:"Check end-of-shift tasks\nتشيك مهام الإغلاق"}]}
        ];

        // مصفوفة الفروع (18 بنداً) ومصفوفة الجودة (74 بنداً) كما هي...
        const sectionsQuality = [ { title: "الاستلام والتخزين", items: [{id:1,q:"فحص درجات حرارة المواد الغذائية الواردة عند التسليم"},{id:2,q:"درجة حرارة المجمدات لا تتجاوز -18°م عند الاستلام"},{id:3,q:"درجة حرارة المبردات لا تتجاوز 4°م عند الاستلام"}] } ]; // استكملها في ملفك
        const sectionsBranches = [ { title: "قسم الواجهة والصالات", items: [{id:1,q:"check the restaurant front section"}] } ]; // استكملها في ملفك

        function startSync() {
            db.collection("inspections").onSnapshot(snap => {
                cloudReports = snap.docs.map(doc => ({ docId: doc.id, ...doc.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                updateUI();
                document.getElementById('loadingOverlay').classList.add('hidden');
            });
            db.collection("authorized_users").onSnapshot(snap => { cloudUsers = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderUsers(); });
            db.collection("pending_authorizations").onSnapshot(snap => { cloudPending = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); document.getElementById('pendingBadge').style.display = cloudPending.length > 0 ? 'block' : 'none'; renderUsers(); });
        }

        function updateUI() {
            document.getElementById('reportCount').innerText = fixNums(cloudReports.length);
            if(cloudReports.length > 0) {
                let sum = cloudReports.reduce((acc, curr) => acc + (parseFloat(curr.score) || 0), 0);
                document.getElementById('totalScore').innerText = fixNums(Math.round(sum / cloudReports.length)) + "%";
            } else { document.getElementById('totalScore').innerText = "100%"; }
            if(!document.getElementById('reportsPage').classList.contains('hidden')) renderReportsList();
        }

        function renderReportsList() {
            document.getElementById('reportsList').innerHTML = cloudReports.map((r, i) => `
                <div onclick="viewDetail(${i})" class="verra-card p-6 border-r-8 ${r.score < 70 ? 'border-red-500' : 'border-green-500'} mb-4 active:scale-95 transition-transform">
                    <div class="flex justify-between items-start">
                        <h4 class="font-black text-gray-800 text-lg">${r.branch || 'تقرير'}</h4>
                        <button onclick="event.stopPropagation(); if(confirm('حذف؟')) db.collection('inspections').doc('${r.docId}').delete()" class="text-red-400">🗑️</button>
                    </div>
                    <p class="text-[10px] text-blue-600 font-bold uppercase mb-1">${r.type || 'Audit'}</p>
                    <p class="text-[11px] text-gray-400 font-bold">📅 ${fixNums(r.date)} | المشرف: ${r.inspector ? r.inspector.split('@')[0] : '---'}</p>
                    <span class="text-xs font-black ${r.score < 70 ? 'text-red-600' : 'text-green-600'}">${fixNums(r.score)}% مطابق</span>
                </div>`).join('');
        }

        function viewDetail(idx) {
            const r = cloudReports[idx];
            document.getElementById('detailBody').innerHTML = `<div class="verra-card p-6 border border-gray-100 text-center mb-4"><h2 class="text-2xl font-black text-[#004b47] mb-2 uppercase">${r.branch || '---'}</h2><div class="grid grid-cols-2 gap-4 text-xs font-bold py-4 border-t border-b my-4 text-right"><div><p class="text-gray-400 mb-1">📅 التاريخ</p><p>${fixNums(r.date)}</p></div><div><p class="text-gray-400 mb-1">👤 المفتش</p><p>${r.inspector || '---'}</p></div></div><div class="flex justify-between px-10"><span class="font-bold text-gray-500 italic">الامتثال العام:</span><span class="text-3xl font-black ${r.score < 70 ? 'text-red-500' : 'text-green-600'}">${fixNums(r.score)}%</span></div></div><p class="text-center font-bold text-gray-400 text-[10px]">نوع التقرير: ${r.type || 'جودة'}</p>`;
            document.getElementById('downloadBtn').onclick = () => generateFullPDF(r);
            document.getElementById('reportDetailModal').classList.add('active');
        }

        function generateFullPDF(r) {
            document.getElementById('btnText').innerText = "جاري بناء الملف... ⏳";
            let targetSections;
            if(r.type === "Assistant Checklist") targetSections = sectionsAssistant;
            else if(r.type === "Branch Report" || r.type === "Branch Operation Report") targetSections = sectionsBranches;
            else targetSections = sectionsQuality;

            let contentHtml = targetSections.map(sec => {
                let itemsHtml = sec.items.map(i => {
                    const ans = r.answers ? r.answers[i.id] : 'na';
                    const note = r.notes ? r.notes[i.id] : '';
                    const pics = (r.photos && r.photos[i.id]) ? r.photos[i.id] : [];
                    let statusColor = ans === 'yes' ? '#059669' : ans === 'no' ? '#dc2626' : '#64748b';
                    return `<div style="padding: 15px; border-bottom: 1px solid #f1f5f9; text-align: right; page-break-inside: avoid; width: 100%; display: block;"><div style="font-weight: 900; font-size: 14px; color: #1e293b; line-height: 1.5; white-space: pre-line;">${fixNums(i.q)}</div><div style="margin-top: 10px;"><span style="font-size: 12px; color: ${statusColor}; font-weight: bold;">الحالة: ${ans === 'yes' ? 'مطابق ✅' : ans === 'no' ? 'مخالفة ❌' : 'N/A'}</span>${note ? `<div style="background: #fff9e6; padding: 10px; border-radius: 8px; font-size: 11px; margin-top: 10px; color: #92400e;">ملاحظة: ${note}</div>` : ''}<div style="display: block; margin-top: 15px;">${pics.map(p => `<img src="${p}" style="width: 250px; height: auto; max-height: 200px; border-radius: 12px; object-fit: cover; border: 2px solid #e2e8f0; margin-bottom: 10px; display: inline-block; margin-left: 10px;" />`).join('')}</div></div></div>`;
                }).join('');
                return `<div style="background: #e8f5ee; padding: 12px; border-right: 8px solid #d1ba89; color: #004b47; font-weight: 900; margin-top: 35px; text-align: right; font-size: 18px; width: 100%; box-sizing: border-box;">${sec.title}</div>${itemsHtml}`;
            }).join('');

            const html = `<div style="width: 800px; margin: 0 auto; padding: 40px; background: white; font-family: 'Cairo', sans-serif; direction: rtl; box-sizing: border-box; text-align: right;"><div style="text-align: center; border-bottom: 5px solid #004b47; padding-bottom: 25px; margin-bottom: 40px;"><img src="${LOGO_URL}" style="height: 110px; margin-bottom: 15px; display: inline-block;" /><h1 style="color: #004b47; margin: 0; font-size: 32px; font-weight: 900;">تقرير تدقيق VERRA PRO الرسمي</h1></div><div style="background: #f8fafc; padding: 30px; border-radius: 20px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; margin-bottom: 40px; text-align: right;"><div style="flex: 1; line-height: 2.2; text-align: right;"><p><b>🏢 الفرع:</b> ${r.branch}</p><p><b>👤 المشرف:</b> ${r.inspector}</p><p><b>📅 التاريخ:</b> ${fixNums(r.date)}</p></div><div style="width: 180px; text-align: center; border-right: 3px solid #004b47; padding-right: 25px;"><p style="font-size: 12px; font-weight: 900; color: #64748b;">الامتثال</p><div style="font-size: 55px; font-weight: 900; color: ${r.score >= 70 ? '#059669':'#dc2626'};">${fixNums(r.score)}%</div></div></div>${contentHtml}<div style="margin-top: 60px; border-top: 4px solid #004b47; padding-top: 30px; text-align: right;"><p style="font-weight: 900; color: #004b47; font-size: 18px;">التوقيع المعتمد:</p><img src="${r.signature}" style="width: 320px; height: 120px; border-bottom: 2px solid #004b47; object-fit: contain; display: block;" /></div></div>`;
            html2pdf().from(html).set({ margin: 0, filename: `Verra_Report_${r.branch}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true, scrollY: 0, letterRendering: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).save().then(() => { document.getElementById('btnText').innerText = "📄 تحميل PDF التقرير الكامل"; });
        }

        function renderUsers() {
            let pendingHtml = cloudPending.map(u => `<div class="user-row" style="border-right-color:#ef4444; background:#fff1f2;"><div class="flex flex-col text-right"><span class="font-bold text-xs">${u.email}</span><select id="role_${u.id}" class="role-selector text-right"><option value="assistant">مساعد مشرف (Checklist)</option><option value="supervisor">متابعة الفروع</option><option value="quality">مراقبة الجودة</option></select></div><div class="flex gap-2"><button onclick="rejectUser('${u.id}')" class="bg-red-50 text-red-600 font-bold text-[10px] px-4 py-2 rounded-xl">رفض</button><button onclick="approveUser('${u.id}', '${u.email}')" class="bg-green-600 text-white font-bold text-[10px] px-4 py-2 rounded-xl">موافقة</button></div></div>`).join('');
            let activeHtml = cloudUsers.map(u => `<div class="user-row"><div class="flex flex-col text-right"><span class="font-bold text-xs text-gray-700 text-right">${u.email}</span><span class="text-[8px] text-blue-500 font-bold uppercase tracking-widest">${u.role === 'assistant' ? 'مساعد مشرف' : u.role === 'quality' ? 'مشرف جودة' : 'مشرف فروع'}</span></div><button onclick="if(confirm('سحب؟')) db.collection('authorized_users').doc('${u.id}').delete()" class="text-red-400 font-bold text-[10px] bg-red-50 px-3 py-1 rounded-lg">سحب</button></div>`).join('');
            document.getElementById('usersList').innerHTML = `<div class="mb-10 text-right text-right text-right text-right text-right"><h4 class="text-[11px] font-bold text-red-500 mb-3 uppercase tracking-widest text-right">قيد الانتظار (${cloudPending.length})</h4>${pendingHtml || '<p class="text-[9px] text-gray-400 text-right">لا توجد طلبات.</p>'}</div><hr class="mb-10 border-gray-100"><div class="text-right text-right text-right text-right text-right"><h4 class="text-[11px] font-bold text-green-600 mb-3 uppercase tracking-widest text-right">المشرفين النشطين (${cloudUsers.length})</h4>${activeHtml}</div>`;
        }

        function approveUser(docId, email) { const role = document.getElementById('role_' + docId).value; db.collection("authorized_users").add({ email: email.toLowerCase().trim(), role: role }).then(() => db.collection("pending_authorizations").doc(docId).delete()); }
        function rejectUser(docId) { if(confirm("رفض؟")) db.collection("pending_authorizations").doc(docId).delete(); }
        function navigateTo(id) { document.querySelectorAll('.page').forEach(p => p.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-[#d1ba89]', 'text-white/40')); const btnId = 'nav-' + id.replace('Page',''); if(document.getElementById(btnId)) document.getElementById(btnId).classList.replace('text-white/40', 'text-[#d1ba89]'); if(id === 'reportsPage') renderReportsList(); }
        function closeModal() { document.getElementById('reportDetailModal').classList.remove('active'); }
        startSync();
    </script>
</body>
</html>
