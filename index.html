<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERRA PRO - الإدارة المركزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none; }
        .verra-card { background: white; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; display: none; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; height: 92vh; border-radius: 40px 40px 0 0; padding: 25px; overflow-y: auto; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; position: sticky; top: -10px; background: white; z-index: 20; }
        .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
        .delete-btn { color: #ef4444; padding: 8px; border-radius: 12px; background: #fff1f2; border: 1px solid #ffe4e6; }
    </style>
</head>
<body class="pb-32">

    <!-- حارس البوابة (Security Lock) -->

        جاري التحقق من صلاحيات الآدمن...

    <!-- الصفحة الرئيسية -->

            <p class="text-[10px] opacity-70 font-bold tracking-widest uppercase">Admin Command Hub</p>

            <div class="verra-card p-8 mb-10 border-r-[12px] border-[#d1ba89] shadow-xl italic" onclick="navigateTo('branchesPage')">

            </div>

    <!-- سجل التقارير -->

    <script>

        function fixNums(str) { return str ? str.toString().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)) : "0"; }

        // استعادة مصفوفات البيانات كاملة للـ PDF
        const sectionsQuality = [ { title: "الاستلام والتخزين", items: [{id:1,q:"فحص درجات حرارة المواد الغذائية الواردة عند التسليم"},{id:2,q:"درجة حرارة المجمدات لا تتجاوز -18°م عند الاستلام"},{id:3,q:"درجة حرارة المبردات لا تتجاوز 4°م عند الاستلام"},{id:4,q:"استخدام مقياس حرارة معاير للأغذية عالية الخطورة"},{id:5,q:"نقل الأغذية المبردة إلى التخزين خلال أقل من 20 دقيقة"},{id:6,q:"مطابقة المنتجات للمواصفات القياسية السعودية"},{id:7,q:"اللحوم الطازجة من مسالخ معتمدة ومختومة رسمياً"},{id:8,q:"التعبئة سليمة وخالية من الآفات أو التلف"},{id:9,q:"التحقق من تواريخ الصلاحية وتسجيلها عند الاستلام"},{id:10,q:"أماكن التخزين نظيفة وجافة وجيدة التهوية"}]},{ title: "تحضير الأغذية", items: [{id:11,q:"مراجعة ومتابعة بروسيس تحضير العجين"},{id:12,q:"متابعة بروسيس تكوير العجين"},{id:13,q:"مراجعة تحضير الصوصات"},{id:14,q:"فصل مناطق تحضير الأغذية النيئة عن المطبوخة"},{id:15,q:"منع التلوث الخلطي أثناء التحضير"},{id:16,q:"إذابة الأغذية في الثلاجة أو تحت ماء بارد جارٍ"},{id:17,q:"عدم ترك الأغذية المحضرة في حرارة الغرفة > ساعتين"},{id:18,q:"وصول درجات حرارة الطهي لـ (≥75°م)"},{id:19,q:"إعادة التسخين لدرجة حرارة لا تقل عن 75°م"},{id:20,q:"استخدام لوحات تقطيع ملونة لأنواع مختلفة"},{id:21,q:"ارتداء القفازات عند لمس الأغذية الجاهزة"}]},{ title: "جودة المنتج", items: [{id:22,q:"معاينة جودة المنتج النهائي (قسم الباستا)"},{id:23,q:"معاينة جودة المنتج النهائي (قسم البيتزا)"},{id:24,q:"رفع صورة المنتج النهائي على الواتساب في كل الفروع"}]},{ title: "المنشأة والبيئة", items: [{id:25,q:"المنشأة تقع بعيداً عن مصادر التلوث"},{id:26,q:"خلو الجدران والأرضيات والأسقف من التشققات"},{id:27,q:"الأبواب محكمة الإغلاق وتغلق تلقائياً"},{id:28,q:"النوافذ مزودة بشبكات معدنية سليمة"},{id:29,q:"ميل مناسب للصرف في جميع المناطق"},{id:30,q:"أجهزة التكييف فعالة وتعمل بشكل صحيح"},{id:31,q:"وجود شفاطات فوق الأفران والشوايات"},{id:32,q:"إضاءة كافية في جميع مناطق التعامل مع الأغذية"},{id:33,q:"الأرضيات مقاومة للماء وغير زلقة وسهلة التنظيف"}]},{ title: "التنظيف والتعقيم", items: [{id:34,q:"جدول التنظيف موثق ويتم اتباعه بدقة"},{id:35,q:"المطهرات آمنة للأغذية وبالتركيزات الصحيحة"},{id:36,q:"تنظيف وتعقيم المعدات بعد كل استخدام"},{id:37,q:"التنظيف العميق يومياً لجميع الأسطح الملامسة"},{id:38,q:"حاويات النفايات تفتح بالقدم وتفرغ بانتظام"},{id:39,q:"التخلص من النفايات يمنع تلوث المياه أو الأغذية"},{id:40,q:"عقد مكافحة آفات ساري مع شركة متخصصة"},{id:41,q:"عدم وجود دلائل على القوارض أو الحشرات"}]},{ title: "النظافة الشخصية", items: [{id:42,q:"جميع العاملين يرتدون زياً نظيفاً وأغطية للشعر"},{id:43,q:"ارتداء الكمامات في مناطق الأغذية القابلة للتلف"},{id:44,q:"محطات غسل اليدين مزودة بالصابون والماء الساخن"},{id:45,q:"غسل اليدين قبل التعامل مع الأغذية وبعد الاستراحة"},{id:46,q:"عدم ارتداء المجوهرات أو طلاء الأظافر"},{id:47,q:"فحوصات طبية قبل التوظيف من جهات معتمدة"},{id:48,q:"فحوصات طبية روتينية سنوية لجميع العاملين"},{id:49,q:"استبعاد العاملين المصابين بالأمراض المعدية"}]},{ title: "المعدات والأدوات", items: [{id:50,q:"المعدات مصنوعة من مواد مقاومة للتآكل وآمنة"},{id:51,q:"مقاييس الحرارة معايرة وتعمل بشكل صحيح"},{id:52,q:"الثلاجات والمجمدات تحافظ على درجات الحرارة المطلوبة"},{id:53,q:"تسجيل سجلات درجة الحرارة مرتين يومياً على الأقل"},{id:54,q:"صيانة وتنظيف معدات الطهي بانتظام"},{id:55,q:"أسطح ملامسة للأغذية ناعمة وخالية من التشققات"}]},{ title: "التتبيع والتوثيق", items: [{id:56,q:"الالتزام بسجلات مراقبة الجودة (ديفروست، تعقيم، زيت)"},{id:57,q:"رفع لوائح التشييك يومياً على مجموعة الواتساب"},{id:58,q:"دليل تتبع الأغذية متاح وكامل في المنشأة"},{id:59,q:"الاحتفاظ بسجلات التتبع 180 يوماً"},{id:60,q:"ترميز المنتجات لتحديد كل دفعة وتاريخ الإنتاج"},{id:61,q:"سجلات اعتماد الموردين والشهادات"},{id:62,q:"جميع العاملين يحملون شهادات صحية سارية"},{id:63,q:"خطة HACCP موثقة ومعتمدة"},{id:64,q:"سجلات التنظيف والتعقيم كاملة ومحدثة"},{id:65,q:"الاحتفاظ بسجلات مراقبة درجة الحرارة"}]},{ title: "إمداد المياه والسباكة", items: [{id:66,q:"إمداد مياه الشرب كافٍ ونظيف تماماً"},{id:67,q:"تركيب فلاتر المياه وتنظيفها وصيانتها"},{id:68,q:"عدم وجود تسربات في مواسير الصرف"},{id:69,q:"إغلاق فتحات الصرف أثناء ساعات العمل"},{id:70,q:"أحواض غسل اليدين مزودة بأجهزة تجفيف"}]},{ title: "إدارة مسببات الحساسية", items: [{id:71,q:"معلومات مسببات الحساسية كاملة على الملصقات"},{id:72,q:"مناطق تحضير منفصلة للأصناف الخالية من الحساسية"},{id:73,q:"أدوات مخصصة لتحضير الأغذية الخاصة"},{id:74,q:"تدريب الموظفين على مسببات الحساسية"}]} ];
        const sectionsBranches = [ { title: "الواجهة والصالات | Exterior & Lounges", items: [{id:1,q:"check the restaurant front section\nتشيك قسم واجهة المطعم"},{id:2,q:"Check lounge section 1\nتشيك قسم صالة 1"},{id:3,q:"check bathroom hall 1\nتشيك الحمام صالة 1"},{id:4,q:"Check lounge section 2\nتشيك قسم صالة 2"},{id:5,q:"check bathroom hall 2\nتشيك الحمام صالة 2"}]},{ title: "الإدارة والعمليات | Admin & Operations", items: [{id:6,q:"checks, the cashier department\nتشيك قسم الكاشير"},{id:7,q:"Monitor and Google Maps\nمتابعة قوقل ماب"},{id:8,q:"Check all plants/trees\nالتشيك على الأشجار"},{id:9,q:"Check attendance and leave\nكشف الحضور"},{id:10,q:"conducted employee meeting today?\nالاجتماع اليومي"},{id:11,q:"Follow-up supervisors daily tasks\nمتابعة مهام المشرفين"}]},{ title: "الإنتاج والمخزون | Production & Inventory", items: [{id:12,q:"Check the juices section\nتشيك قسم العصائر"},{id:13,q:"Check store section\nتشيك المستودع"},{id:14,q:"Check Restaurant back side\nالقسم الخلفي"},{id:15,q:"Send orders schedule\nرفع الطلبات"},{id:16,q:"check requests\nتشيك الطلبات"}]},{ title: "العمال والمرافق | Staff & Facilities", items: [{id:17,q:"Check the employees (Personal hygiene)\nتشيك العمال"},{id:18,q:"General check (sanitary facilities + broken tools)\nتشيك عام للمرافق"}]} ];

        function startSync() {
            db.collection("inspections").onSnapshot(snap => {
                cloudReports = snap.docs.map(doc => ({ docId: doc.id, ...doc.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                updateUI();
            });
            db.collection("branches").orderBy("name").onSnapshot(snap => {
                cloudBranches = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderBranches();
            });
            // مزامنة المشرفين
            db.collection("authorized_users").onSnapshot(snap => {
                cloudUsers = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderUsers();
            });
        }

        function updateUI() {
            document.getElementById('reportCount').innerText = fixNums(cloudReports.length);
            if(cloudReports.length > 0) {
                let avg = Math.round(cloudReports.reduce((s, r) => s + (r.score || 0), 0) / cloudReports.length);
                document.getElementById('totalScore').innerText = fixNums(avg) + "%";
            }
            if(!document.getElementById('reportsPage').classList.contains('hidden')) renderReportsList();
        }

        function renderReportsList() {
            document.getElementById('reportsList').innerHTML = cloudReports.map((r, i) => `
                <div onclick="viewDetail(${i})" class="verra-card p-6 border-r-8 ${r.score < 70 ? 'border-red-500' : 'border-green-500'} mb-4 active:scale-95 transition-transform">
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-black text-gray-800 text-lg">${r.branch}</h4>
                        <button onclick="event.stopPropagation(); if(confirm('حذف التقرير؟')) db.collection('inspections').doc('${r.docId}').delete()" class="text-red-400">🗑️</button>
                    </div>
                    <p class="text-[11px] text-gray-400 font-bold mb-1">📅 ${fixNums(r.date)} | المشرف: ${r.inspector ? r.inspector.split('@')[0] : '---'}</p>
                    <span class="text-xs font-black ${r.score < 70 ? 'text-red-600' : 'text-green-600'}">${fixNums(r.score)}% مطابق</span>
                </div>`).join('');
        }

        function viewDetail(idx) {
            const r = cloudReports[idx];
            const isBranch = r.type && r.type.includes("Branch");
            document.getElementById('detailBody').innerHTML = `
                <div class="verra-card p-6 border border-gray-100 text-center mb-4 shadow-sm">
                    <h2 class="text-2xl font-black text-[#004b47] mb-2">${r.branch}</h2>
                    <div class="grid grid-cols-2 gap-4 text-xs font-bold py-4 border-t border-b my-4">
                        <div><p class="text-gray-400 mb-1">📅 التاريخ</p><p>${fixNums(r.date)}</p></div>
                        <div><p class="text-gray-400 mb-1">👤 المفتش</p><p>${r.inspector}</p></div>
                    </div>
                    <div class="flex justify-between px-6 pt-2">
                        <span class="font-bold text-gray-500 italic">الامتثال العام:</span>
                        <span class="text-3xl font-black ${r.score < 70 ? 'text-red-500' : 'text-green-600'}">${fixNums(r.score)}%</span>
                    </div>
                </div>
                <p class="text-center font-bold text-gray-400 text-[10px]">نوع التقرير: ${isBranch ? 'إشراف فروع' : 'جودة وسلامة'}</p>`;
            document.getElementById('downloadBtn').onclick = () => generateFullPDF(r);
            document.getElementById('reportDetailModal').classList.add('active');
        }

        function generateFullPDF(r) {
            document.getElementById('btnText').innerText = "جاري البناء... ⏳";
            const isBranch = r.type && r.type.includes("Branch");
            const targetSections = isBranch ? sectionsBranches : sectionsQuality;
            
            let contentHtml = targetSections.map(sec => `
                <div style="background:#e8f5ee; padding:12px; border-right:8px solid #d1ba89; color:#004b47; font-weight:900; margin-top:30px; text-align:right; font-size:18px;">${sec.title}</div>
                ${sec.items.map(i => {
                    const ans = r.answers ? r.answers[i.id] : 'na';
                    const note = r.notes ? r.notes[i.id] : '';
                    const pics = (r.photos && r.photos[i.id]) ? r.photos[i.id] : [];
                    let status = ans === 'yes' ? '✅ مطابق / Yes' : ans === 'no' ? '❌ مخالف / No' : '🔘 N/A';
                    let color = ans === 'yes' ? '#059669' : ans === 'no' ? '#dc2626' : '#64748b';
                    return `<div style="padding:15px; border-bottom:1px solid #f1f5f9; text-align:right; page-break-inside:avoid;">
                        <p style="margin:0; font-weight:900; font-size:15px; color:#1e293b; white-space: pre-line;">${fixNums(i.id)}. ${i.q}</p>
                        <p style="font-size:13px; margin:8px 0; font-weight:bold; color:${color};">الحالة: ${status}</p>
                        ${note ? `<div style="background:#fffbeb; padding:10px; border-radius:8px; font-size:12px; border:1px solid #fde68a; margin:10px 0;">الملاحظة: ${note}</div>` : ''}
                        <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;">${pics.map(p => `<img src="${p}" style="width:200px; height:150px; border-radius:12px; object-fit:cover; border:1px solid #e2e8f0;" />`).join('')}</div>
                    </div>`;
                }).join('')}
            `).join('');

            const html = `<div style="width:800px; margin:0 auto; padding:40px; background:white; font-family:'Cairo'; direction:rtl; box-sizing:border-box;">
                <div style="text-align:center; border-bottom:5px solid #004b47; padding-bottom:25px; margin-bottom:40px;">
                    <img src="${LOGO_URL}" style="height:120px; margin-bottom:15px;" />
                    <h1 style="color:#004b47; margin:0; font-size:32px; font-weight:900;">تقرير تدقيق VERRA PRO</h1>
                </div>
                <div style="background:#f8fafc; padding:30px; border-radius:20px; border:1px solid #e2e8f0; display:flex; justify-content:space-between; margin-bottom:40px;">
                    <div style="flex:1; line-height:2.2; text-align:right;">
                        <p><b>🏢 الفرع:</b> ${r.branch}</p>
                        <p><b>👤 المشرف:</b> ${r.inspector}</p>
                        <p><b>📅 التاريخ والوقت:</b> ${fixNums(r.date)}</p>
                    </div>
                    <div style="width:180px; text-align:center; border-right:3px solid #004b47; padding-right:25px;">
                         <p style="font-size:12px; font-weight:900; color:#64748b;">الامتثال</p>
                         <div style="font-size:50px; font-weight:900; color:${r.score >= 70 ? '#059669':'#dc2626'};">${fixNums(r.score)}%</div>
                    </div>
                </div>
                ${contentHtml}
                <div style="margin-top:60px; border-top:3px solid #004b47; pt:30px; text-align:left;">
                    <p style="font-weight:900; color:#004b47;">التوقيع المعتمد:</p>
                    <img src="${r.signature}" style="width:300px; border-bottom:2px solid #004b47;" />
                </div>
            </div>`;

            html2pdf().from(html).set({ margin:0, filename:`Verra_Report_${r.branch}.pdf`, html2canvas:{scale:2, useCORS:true}, jsPDF:{unit:'mm', format:'a4', orientation:'portrait'} }).save().then(() => {
                document.getElementById('btnText').innerText = "📄 تحميل PDF التقرير الكامل";
            });
        }

        // --- وظائف إدارة المستخدمين ---
        function addUserToCloud() {
            const email = document.getElementById('newUserEmail').value.toLowerCase().trim();
            if(!email) return;
            db.collection("authorized_users").add({ email: email }).then(() => {
                document.getElementById('newUserEmail').value = "";
                alert("✅ تم تفعيل صلاحية المشرف.");
            });
        }

        function renderUsers() {
            document.getElementById('usersList').innerHTML = cloudUsers.map(u => `
                <div class="bg-white p-5 rounded-3xl flex justify-between items-center shadow-sm border-r-8 border-[#d1ba89]">
                    <span class="font-bold text-xs">${u.email}</span>
                    <button onclick="db.collection('authorized_users').doc('${u.id}').delete()" class="text-red-500 font-bold text-[10px]">سحب الصلاحية</button>
                </div>`).join('');
        }

        function addBranchToCloud() {
            const n = document.getElementById('newBranchInput').value; if(!n) return;
            db.collection("branches").add({name: n}).then(() => document.getElementById('newBranchInput').value = "");
        }

        function renderBranches() {
            document.getElementById('branchesList').innerHTML = cloudBranches.map(b => `<div class="bg-white p-5 rounded-2xl flex justify-between items-center shadow-sm border-r-8 border-[#d1ba89] font-black"><span>${b.name}</span><button onclick="db.collection('branches').doc('${b.id}').delete()" class="text-red-400 text-xs font-bold">🗑️</button></div>`).join('');
        }

        function navigateTo(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-[#d1ba89]', 'text-white/40'));
            const btnId = 'nav-' + id.replace('Page','');
            if(document.getElementById(btnId)) document.getElementById(btnId).classList.replace('text-white/40', 'text-[#d1ba89]');
        }

        function closeModal() { document.getElementById('reportDetailModal').classList.remove('active'); }
    </script>
</body>
</html>
