    .btn-no.active { background: #ef4444 !important; color: white; }
    .btn-na.active { background: #64748b !important; color: white; }
    .floating-score { position: fixed; bottom: 24px; right: 24px; width: 72px; height: 72px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-weight: 800; box-shadow: 0 4px 20px rgba(0,0,0,0.3); border: 4px solid white; z-index: 50; background: #004b47; cursor: pointer; }

          { id: 29, en: 'Proper drainage slope', ar: 'ميل مناسب للصرف' },

          { id: 37, en: 'Daily deep cleaning', ar: 'التنظيف العميق يومياً' },

          { id: 49, en: 'Exclude sick workers', ar: 'استبعاد العاملين المصابين' }
      ]},
      { id: 'equipment', titleEn: 'Equipment & Utensils', titleAr: 'المعدات والأدوات', items: [
          { id: 50, en: 'Food-grade materials', ar: 'المعدات مصنوعة من مواد آمنة' },
          { id: 51, en: 'Functioning thermometers', ar: 'المقاييس تعمل بشكل صحيح' },
          { id: 52, en: 'Fridge temp records', ar: 'الثلاجات تحافظ على الحرارة' },

          { id: 58, en: 'Traceability guide', ar: 'دليل تتبع الأغذية متاح' },
          { id: 59, en: '180 days records', ar: 'حفظ السجلات لـ 180 يوماً' },
          { id: 60, en: 'Product coding', ar: 'ترميز المنتجات وتاريخها' },
          { id: 61, en: 'Supplier certificates', ar: 'شهادات اعتماد الموردين' },

          { id: 65, en: 'Signed temp records', ar: 'سجلات مراقبة الحرارة موقعة' }
      ]},
      { id: 'water', titleEn: 'Water Supply', titleAr: 'إمداد المياه والسباكة', items: [
          { id: 66, en: 'Clean potable water', ar: 'إمداد مياه الشرب كافٍ' },
          { id: 67, en: 'Water filter maintenance', ar: 'فلاتر المياه نظيفة ومصانة' },
          { id: 68, en: 'No sewage leaks', ar: 'عدم وجود تسربات صرف صحي' },
          { id: 69, en: 'Closed sewage holes', ar: 'فتحات الصرف مغلقة بإحكام' },

      ]},
      { id: 'allergen', titleEn: 'Allergen Management', titleAr: 'إدارة مسببات الحساسية', items: [
          { id: 71, en: 'Allergen labels', ar: 'معلومات الحساسية على الملصق' },
          { id: 72, en: 'Separate prep area', ar: 'مناطق تحضير خالية من الحساسية' },
          { id: 73, en: 'Dedicated utensils', ar: 'أدوات مخصصة للأغذية الخاصة' },
          { id: 74, en: 'Staff allergen training', ar: 'تدريب الموظفين على التوعية' }
      ]}
    ];

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [answers, setAnswers] = useState({});
      const [expanded, setExpanded] = useState(new Set(['receiving']));
      const [branch, setBranch] = useState("");
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        auth.onAuthStateChanged(u => { setUser(u); setLoading(false); });
      }, []);

      const getScore = () => {
        const vals = Object.values(answers);
        const yes = vals.filter(v => v === 'yes').length;
        const total = vals.filter(v => v !== 'na').length;
        return total > 0 ? Math.round((yes / total) * 100) : 0;
      };

      const handleSave = async () => {
        if(!branch) return alert("أدخل اسم الفرع");
        setSaving(true);
        try {
          await db.collection("reports").add({
            branch, inspector: user.email, score: getScore(),
            date: new Date().toLocaleDateString('ar-EG'),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
          alert("تم الإرسال للسحابة!");
          location.reload();
        } catch(e) { alert(e.message); }
        setSaving(false);
      };

      if (loading) return <div className="h-screen flex items-center justify-center">جاري التحميل...</div>;
      if (!user) return <LoginPage auth={auth} />;

      return (
        <div className="pb-24">
          <header className="header text-center shadow-2xl">
             <div className="flex justify-center mb-4">
                <img src="https://chef-ayo.github.io/verra-food-safety-inspector/logo.png" className="h-16" />
             </div>
             <h1 className="text-2xl font-black gold-text">VERRA PRO</h1>
             <p className="text-[10px] font-bold opacity-80 uppercase tracking-widest">Food Safety & Quality Inspection</p>
             <div className="mt-4 bg-white/10 p-3 rounded-2xl flex justify-between text-[10px] font-bold">
                <span>👤 {user.email.split('@')[0]}</span>
                <span>📅 {new Date().toLocaleDateString()}</span>
             </div>
          </header>

          <div className="progress-bar flex justify-between items-center px-6">
             <div className="text-xs font-bold text-gray-500">التقدم: {Object.keys(answers).length}/74</div>
             <div className="text-2xl font-black text-green-700">الدرجة: {getScore()}%</div>
             <button onClick={() => auth.signOut()} className="text-red-500 text-xs font-bold">خروج</button>
          </div>

          <main className="p-4 max-w-2xl mx-auto">
             <div className="bg-white p-5 rounded-2xl shadow-sm mb-6 border-b-4 border-green-800">
                <label className="block text-[10px] font-black text-gray-400 uppercase mb-1">الفرع المستهدف</label>
                <input className="w-full text-lg font-bold outline-none" placeholder="اسم المطعم..." onChange={e=>setBranch(e.target.value)} />
             </div>

             {fullInspectionData.map(s => (
               <div key={s.id} className="bg-white rounded-2xl mb-4 overflow-hidden shadow-sm border border-gray-100">
                  <div className="section-header" onClick={()=>{
                    const n = new Set(expanded); n.has(s.id)?n.delete(s.id):n.add(s.id); setExpanded(n);
                  }}>
                    <div>
                       <h3 className="text-sm font-bold text-green-900">{s.titleEn}</h3>
                       <p className="text-[11px] text-gray-500 font-bold">{s.titleAr}</p>
                    </div>
                    <span>{expanded.has(s.id)?'▲':'▼'}</span>
                  </div>
                  
                  {expanded.has(s.id) && (
                    <div className="bg-white">
                      {s.items.map(i => (
                        <div key={i.id} className="item-card flex justify-between items-center">
                           <div className="flex-1 pr-3">
                              <p className="text-xs font-bold text-green-950 mb-1">{i.id}. {i.en}</p>
                              <p className="text-[11px] text-gray-500 font-medium">{i.ar}</p>
                           </div>
                           <div className="flex gap-1">
                              <button onClick={()=>setAnswers({...answers, [i.id]:'yes'})} className={`answer-btn btn-yes ${answers[i.id]==='yes'?'active':''}`}>نعم</button>
                              <button onClick={()=>setAnswers({...answers, [i.id]:'no'})} className={`answer-btn btn-no ${answers[i.id]==='no'?'active':''}`}>لا</button>
                              <button onClick={()=>setAnswers({...answers, [i.id]:'na'})} className={`answer-btn btn-na ${answers[i.id]==='na'?'active':''}`}>N/A</button>
                           </div>
                        </div>
                      ))}
                    </div>
                  )}
               </div>
             ))}
          </main>

          <div className="floating-score" onClick={handleSave}>
             <span className="text-[10px] opacity-70 uppercase">إرسال</span>
             <span className="text-xl">{getScore()}%</span>
          </div>
        </div>
      );
    }

    function LoginPage({ auth }) {
      const [e, setE] = useState(""); const [p, setP] = useState("");
      return (
        <div className="h-screen bg-[#004b47] flex items-center justify-center p-6">
           <div className="bg-white p-10 rounded-[40px] shadow-2xl w-full max-w-sm text-center">
              <h1 className="text-3xl font-black text-green-900 mb-8 italic">VERRA PRO</h1>
              <input className="w-full border-2 p-4 rounded-2xl mb-4 outline-none focus:border-green-600 text-right" placeholder="البريد الإلكتروني" onChange={v=>setE(val.target.value)} />
              <input className="w-full border-2 p-4 rounded-2xl mb-8 outline-none focus:border-green-600 text-right" type="password" placeholder="كلمة المرور" onChange={v=>setP(val.target.value)} />
              <button onClick={()=>auth.signInWithEmailAndPassword(e,p).catch(err=>alert("خطأ بالدخول"))} className="w-full bg-green-800 text-white font-bold py-5 rounded-2xl shadow-lg">دخول النظام</button>
           </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
