<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERRA PRO - الإدارة المركزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none; }
        .verra-card { background: white; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; display: none; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; height: 92vh; border-radius: 40px 40px 0 0; padding: 40px 25px 25px; overflow-y: auto; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; position: sticky; top: -10px; background: white; z-index: 20; }
        .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
        .delete-btn { color: #ef4444; padding: 8px; border-radius: 12px; background: #fff1f2; border: 1px solid #ffe4e6; }
        .user-row { background: white; padding: 15px; border-radius: 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-right: 6px solid #d1ba89; }
        select.role-selector { font-size: 10px; padding: 4px; border-radius: 8px; border: 1px solid #ddd; outline: none; font-weight: bold; background: #f9fafb; margin-top: 5px; }
    </style>
</head>
<body class="pb-32 text-right">

    <div id="lockScreen" class="fixed inset-0 bg-white z-[500] flex flex-col items-center justify-center font-bold text-[#004b47]">
        <div class="w-12 h-12 border-4 border-t-green-500 border-gray-200 rounded-full animate-spin mb-4"></div>
        جاري الاتصال بنظام VERRA PRO...
    </div>

    <div id="dashboardPage" class="page">
        <header class="bg-[#004b47] p-10 pb-28 rounded-b-[60px] text-white shadow-2xl relative text-right">
            <div class="flex justify-between items-center relative z-10">
                <div>
                    <h1 class="text-3xl font-black italic uppercase tracking-tighter">Verra <span class="text-[#d1ba89]">Pro</span></h1>
                    <p class="text-[10px] opacity-70 font-bold tracking-widest uppercase text-right">لوحة التحكم المركزية</p>
                </div>
                <button onclick="auth.signOut()" class="bg-red-500/20 text-red-200 px-4 py-2 rounded-xl text-[10px] font-bold border border-red-500/30">خروج ↪</button>
            </div>
        </header>

        <main class="px-6 -mt-16 relative z-10">
            <div class="grid grid-cols-2 gap-4 mb-8 text-center">
                <div class="verra-card p-6 border-b-4 border-green-600 shadow-lg"><p class="text-gray-400 text-[10px] font-bold mb-1 uppercase text-right">الامتثال العام</p><h2 id="totalScore" class="text-3xl font-black text-green-700">--</h2></div>
                <div onclick="navigateTo('reportsPage')" class="verra-card p-6 border-b-4 border-blue-600 shadow-lg text-right"><p class="text-gray-400 text-[10px] font-bold mb-1">التقارير</p><h2 id="reportCount" class="text-3xl font-black text-blue-700">0</h2></div>
            </div>
            <div class="verra-card p-7 mb-4 border-r-[12px] border-[#004b47] shadow-xl" onclick="window.location.href='quality-inspection.html'"><h3 class="font-black text-gray-800 text-lg">🛡️ مراقبة الجودة</h3></div>
            <div class="verra-card p-7 mb-4 border-r-[12px] border-blue-600 shadow-xl" onclick="window.location.href='branches-inspector.html'"><h3 class="font-black text-gray-800 text-lg text-right">🏢 متابعة الفروع</h3></div>
            <div class="verra-card p-7 mb-4 border-r-[12px] border-green-700 shadow-xl text-right" onclick="window.location.href='checklist.html'"><h3 class="font-black text-gray-800 text-lg">✅ تشيك ليست المساعدين</h3></div>
            <div class="verra-card p-7 mb-10 border-r-[12px] border-[#d1ba89] shadow-xl text-right" onclick="navigateTo('usersPage')"><h3 class="font-black text-gray-800 text-lg text-right">👤 إدارة المستخدمين</h3><p id="pendingBadge" class="text-[9px] text-red-500 font-bold hidden mt-1">طلبات جديدة ⚠️</p></div>
        </main>
    </div>

    <!-- سجل التقارير -->
    <div id="reportsPage" class="page hidden px-6 pt-10">
        <div class="flex justify-between items-center mb-10 text-right"><h2 class="text-2xl font-black text-[#004b47] italic underline decoration-[#d1ba89] underline-offset-8 text-right">سجل التقارير</h2><button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full text-xs font-black shadow-sm border text-right">رجوع</button></div>
        <div id="reportsList" class="space-y-4 pb-24 text-right"></div>
    </div>

    <!-- إدارة المستخدمين -->
    <div id="usersPage" class="page hidden px-6 pt-10 text-right">
        <div class="flex justify-between items-center mb-8"><h2 class="text-2xl font-black text-[#004b47]">الصلاحيات</h2><div class="flex gap-2"><button onclick="startSync()" class="bg-blue-600 text-white p-2 rounded-xl text-[10px] font-bold">تحديث 🔄</button><button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full border shadow-sm text-right">X</button></div></div>
        <div id="usersList" class="space-y-6 pb-24 text-right"></div>
    </div>

    <!-- نافذة المعاينة والتحميل -->
    <div id="reportDetailModal" class="modal">
        <div class="modal-content text-right">
            <div class="modal-header text-right"><button onclick="closeModal()" class="bg-red-50 text-red-500 w-10 h-10 rounded-full font-black flex items-center justify-center shadow-sm text-right">X</button><h3 class="text-2xl font-black text-green-950 italic text-right">تفاصيل التقرير</h3></div>
            <div id="detailBody" class="space-y-5 text-right"></div>
            <div class="mt-10 pb-10 border-t pt-8 text-right">
                <button id="downloadBtn" class="w-full verra-gradient text-white p-5 rounded-3xl font-black shadow-xl flex justify-center items-center gap-3">
                    <span id="btnText">📄 تحميل PDF التقرير الكامل</span>
                </button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-[#004b47] text-white flex justify-around p-5 z-50 rounded-t-[45px] shadow-2xl border-t border-white/10 text-right">
        <button onclick="navigateTo('dashboardPage')" id="nav-dashboard" class="flex flex-col items-center text-[#d1ba89]"><span class="text-2xl">🏠</span><span class="text-[9px] font-black mt-1 uppercase">Main</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-2xl">📊</span><span class="text-[9px] font-black mt-1 uppercase">Logs</span></button>
        <button onclick="navigateTo('usersPage')" id="nav-users" class="flex flex-col items-center text-white/40"><span class="text-2xl text-right">👤</span><span class="text-[9px] font-black mt-1 uppercase">Users</span></button>
    </nav>

    <script>
        const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";
        const firebaseConfig = { apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0", authDomain: "verra-system-828f2.firebaseapp.com", projectId: "verra-system-828f2", storageBucket: "verra-system-828f2.firebasestorage.app", messagingSenderId: "961104891607", appId: "1:961104891607:web:5ffd3af4983a8b015b6a92" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let cloudReports = []; let cloudUsers = []; let cloudPending = [];

        auth.onAuthStateChanged(user => {
            if (user && user.email === "ch3f.ramzi@gmail.com") { document.getElementById('lockScreen').classList.add('hidden'); startSync(); } 
            else { window.location.href = "checklist.html"; }
        });

        function fixNums(str) { return str ? str.toString().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)) : "0"; }

        const sectionsAssistant = [
            {
                title: "الواجهة والصالات - Front & Lounges",
                items: [
                    {id:1, en:"Restaurant front section (front + entrance floor + thermometer + air curtain)", ar:"واجهة المطعم (أرضية المدخل + جهاز الحرارة + الستارة الهوائية)"},
                    {id:2, en:"Lounge section 1 (tables + Chairs + walls and floor + air conditioning)", ar:"قسم الصالة 1 (الطاولات + الكراسي + الجدران والأرضية + التكييف)"},
                    {id:3, en:"Bathroom hall 1 (general cleaning + tissue machine + soap machine + perfume machine)", ar:"حمام صالة 1 (نظافة عامة + المناديل + الصابون + مكينة المعطر)"},
                    {id:9, en:"Lounge section 2 (tables + Chairs + walls and floor + air conditioning)", ar:"قسم الصالة 2 (الطاولات + الكراسي + الجدران والأرضية + التكييف)"},
                    {id:10, en:"Bathroom hall 2 (general cleaning + tissue machine + soap machine + perfume machine)", ar:"حمام صالة 2 (نظافة عامة + المناديل + الصابون + مكينة المعطر)"},
                    {id:11, en:"Check and monitor all plants/trees in the branch", ar:"متابعة الأشجار والنباتات داخل الفرع"}
                ]
            },
            {
                title: "قسم المطبخ والإنتاج - Kitchen & Production",
                items: [
                    {id:4, en:"The pizza section (hygiene + dates + chillers control)", ar:"قسم البيتزا (النظافة + التواريخ + التحكم في التبريد)"},
                    {id:12, en:"Kitchen department A (cleanliness + air conditioning + Hoods + dates + utensils)", ar:"قسم المطبخ أ (النظافة + التكييف + الشفاطات + التواريخ + الأدوات)"},
                    {id:13, en:"Kitchen department B (fridges temp + food arrangement + tool storage)", ar:"قسم المطبخ ب (حرارة الثلاجات + ترتيب الطعام + مكان الأدوات المخصص)"},
                    {id:14, en:"Laundry section (general cleanliness + equipment + oil filters + dishwasher)", ar:"قسم الغسيل (النظافة العامة + المعدات + فلاتر الزيت + غسالة الأطباق)"},
                    {id:15, en:"Restaurant back side (general cleaning + air curtains)", ar:"القسم الخلفي للمطعم (النظافة العامة + الستائر الهوائية)"}
                ]
            },
            {
                title: "الإدارة والتشغيل - Admin & Operation",
                items: [
                    {id:5, en:"Cashier department (net + phone + cashier + applications)", ar:"قسم الكاشير (الإنترنت + الهاتف + الصندوق + التطبيقات)"},
                    {id:6, en:"Monitor the Dashboard and Google Maps", ar:"متابعة لوحة التحكم وجوجل ماب"},
                    {id:7, en:"Juices section (mixers + Pepsi machine + CO2 gas + chiller + dates)", ar:"قسم العصائر (الخلاطات + مكينة البيبسي + الغاز + التبريد + التواريخ)"},
                    {id:8, en:"Store section (elevator + arrangement + cleaning + stacking + dates)", ar:"المستودع (المصعد + الترتيب + النظافة + التواريخ + أسفل الدرج)"},
                    {id:16, en:"Employees (hygiene + uniform + certificates + PPE)", ar:"الموظفون (النظافة الشخصية + الزي + الشهادات الصحية + الكمامات)"},
                    {id:17, en:"Send orders according to schedule", ar:"إرسال الطلبات حسب الجدول"},
                    {id:18, en:"Check requests", ar:"تشيك الطلبات"},
                    {id:20, en:"Attendance and leave + Financial covenant", ar:"الحضور والانصراف + متابعة العهدة المالية"}
                ]
            },
            {
                title: "الصيانة والمهام الختامية - Maintenance & Closing",
                items: [
                    {id:21, en:"Has a meeting been conducted with all employees today?", ar:"هل تم إجراء الاجتماع اليومي مع الموظفين؟"},
                    {id:19, en:"General check (sanitary + lamps + tiles + equipment status)", ar:"تشيك عام (المرافق + المصابيح + البلاط + الأدوات والمعدات)"},
                    {id:22, en:"End-of-shift tasks (AC + lights + signboard)", ar:"مهام نهاية الوردية (التكييف + الإضاءة + اللوحة الخارجية)"}
                ]
            }
        ];

        const sectionsBranches = [{ title: "متابعة الفروع", items: [{id:1, en:"check restaurant front", ar:"تشيك قسم واجهة المطعم"}] }];
        const sectionsQuality = [ { title: "مراقبة الجودة", items: [{id:1,q:"فحص درجات حرارة المواد الغذائية عند التسليم"}] } ];

        function startSync() {
            db.collection("inspections").onSnapshot(snap => {
                cloudReports = snap.docs.map(doc => ({ docId: doc.id, ...doc.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                updateUI();
            });
            db.collection("authorized_users").onSnapshot(snap => { cloudUsers = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderUsers(); });
            db.collection("pending_authorizations").onSnapshot(snap => { cloudPending = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); document.getElementById('pendingBadge').style.display = cloudPending.length > 0 ? 'block' : 'none'; renderUsers(); });
        }

        function updateUI() {
            document.getElementById('reportCount').innerText = fixNums(cloudReports.length);
            if(cloudReports.length > 0) {
                let sum = cloudReports.reduce((acc, curr) => acc + (parseFloat(curr.score) || 0), 0);
                document.getElementById('totalScore').innerText = fixNums(Math.round(sum / cloudReports.length)) + "%";
            }
            if(!document.getElementById('reportsPage').classList.contains('hidden')) renderReportsList();
        }

        function renderReportsList() {
            document.getElementById('reportsList').innerHTML = cloudReports.map((r, i) => `
                <div onclick="viewDetail(${i})" class="verra-card p-6 border-r-8 ${r.score < 70 ? 'border-red-500' : 'border-green-500'} mb-4 active:scale-95 transition-transform text-right">
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-black text-gray-800 text-lg">${r.branch || 'تقرير'}</h4>
                        <button onclick="event.stopPropagation(); if(confirm('حذف التقرير نهائياً؟')) db.collection('inspections').doc('${r.docId}').delete()" class="delete-btn">🗑️</button>
                    </div>
                    <p class="text-[11px] text-gray-400 font-bold mb-1">📅 ${fixNums(r.date)} | المشرف: ${r.inspector ? r.inspector.split('@')[0] : '---'}</p>
                </div>`).join('');
        }

        function viewDetail(idx) {
            const r = cloudReports[idx];
            document.getElementById('detailBody').innerHTML = `<div class="verra-card p-6 border border-gray-100 text-center mb-4 shadow-sm text-right"><h2 class="text-2xl font-black text-[#004b47] mb-2 uppercase text-right">${r.branch || '---'}</h2><div class="grid grid-cols-2 gap-4 text-xs font-bold py-4 border-t border-b my-4 text-right"><div><p class="text-gray-400 mb-1">📅 التاريخ</p><p>${fixNums(r.date)}</p></div><div><p class="text-gray-400 mb-1">👤 المفتش</p><p>${r.inspector || '---'}</p></div></div><div class="flex justify-between px-10 text-right"><span class="font-bold text-gray-500 italic">الامتثال العام:</span><span class="text-3xl font-black ${r.score < 70 ? 'text-red-500' : 'text-green-600'}">${fixNums(r.score)}%</span></div></div>`;
            document.getElementById('downloadBtn').onclick = () => generateFullPDF(r);
            document.getElementById('reportDetailModal').classList.add('active');
        }

        function generateFullPDF(r) {
            document.getElementById('btnText').innerText = "جاري بناء الملف... ⏳";
            let targetSections;
            if(r.type === "Assistant Checklist") targetSections = sectionsAssistant;
            else if(r.type === "Branch Report") targetSections = sectionsBranches;
            else targetSections = sectionsQuality;

            let contentHtml = targetSections.map(sec => {
                let itemsHtml = sec.items.map(i => {
                    const ans = r.answers ? r.answers[i.id] : 'na';
                    const pics = (r.photos && r.photos[i.id]) ? r.photos[i.id] : [];
                    let statusColor = ans === 'yes' ? '#059669' : ans === 'no' ? '#dc2626' : '#64748b';
                    let statusText = ans === 'yes' ? 'مطابق ✅' : ans === 'no' ? 'مخالفة ❌' : 'غير متوفر N/A';

                    return `
                        <div style="padding: 15px; border-bottom: 1px solid #f1f5f9; text-align: right; page-break-inside: avoid; width: 100%; display: block; clear: both; margin-bottom: 10px;">
                            <div style="font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 14px; color: #1e293b; direction: rtl; line-height: 1.6;">
                                ${i.ar || i.q}
                            </div>
                            <div style="margin-top: 8px;">
                                <span style="font-size: 12px; color: ${statusColor}; font-weight: bold; background: ${statusColor}15; padding: 2px 8px; border-radius: 5px;">
                                    الحالة: ${statusText}
                                </span>
                            </div>
                            ${pics.length > 0 ? `
                            <div style="margin-top: 12px; display: block; width: 100%;">
                                ${pics.map(p => `
                                    <img src="${p}" style="width: 140px; height: 140px; object-fit: cover; border-radius: 10px; margin-left: 8px; margin-bottom: 8px; border: 1px solid #eee; display: inline-block;" />
                                `).join('')}
                            </div>` : ''}
                        </div>`;
                }).join('');

                return `
                    <div style="page-break-inside: avoid;">
                        <div style="background: #f0fdf4; padding: 10px 15px; border-right: 6px solid #d1ba89; color: #004b47; font-weight: 900; margin-top: 25px; text-align: right; font-size: 16px; font-family: 'Cairo', sans-serif;">
                            ${sec.title}
                        </div>
                        ${itemsHtml}
                    </div>`;
            }).join('');

            const html = `
            <div style="width: 750px; margin: 0 auto; padding: 30px; background: white; font-family: 'Cairo', sans-serif; direction: rtl; box-sizing: border-box; text-align: right;">
                <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
                <table style="width: 100%; margin-bottom: 20px;">
                    <tr>
                        <td style="text-align: center;">
                            <img src="${LOGO_URL}" style="height: 80px; margin-bottom: 10px;" />
                            <div style="color: #004b47; font-size: 28px; font-weight: 900; border-bottom: 4px solid #d1ba89; display: inline-block; padding-bottom: 8px;">
                                تقرير التدقيق الرسمي لـ "فيرا برو"
                            </div>
                        </td>
                    </tr>
                </table>
                <div style="background: #f8fafc; padding: 20px; border-radius: 15px; border: 1px solid #e2e8f0; margin-bottom: 30px; display: table; width: 100%; box-sizing: border-box;">
                    <div style="display: table-cell; width: 70%; line-height: 2; vertical-align: middle;">
                        <p style="margin: 0;"><b>🏢 الفرع المستهدف:</b> ${r.branch}</p>
                        <p style="margin: 0;"><b>👤 المسؤول المفتش:</b> ${r.inspector}</p>
                        <p style="margin: 0;"><b>📅 تاريخ ووقت التقرير:</b> ${fixNums(r.date)}</p>
                    </div>
                    <div style="display: table-cell; width: 30%; text-align: center; border-right: 2px solid #004b47; vertical-align: middle;">
                        <p style="font-size: 12px; font-weight: 900; color: #64748b; margin: 0;">نسبة الامتثال</p>
                        <div style="font-size: 45px; font-weight: 900; color: ${r.score >= 70 ? '#059669':'#dc2626'};">
                            ${fixNums(r.score)}%
                        </div>
                    </div>
                </div>
                ${contentHtml}
                <div style="margin-top: 40px; border-top: 2px solid #eee; padding-top: 20px; page-break-inside: avoid;">
                    <p style="font-weight: 900; color: #004b47; font-size: 16px; margin-bottom: 10px;">توقيع المسؤول:</p>
                    <img src="${r.signature}" style="width: 250px; height: 100px; object-fit: contain; display: block;" />
                </div>
                <div style="margin-top: 20px; text-align: center; color: #94a3b8; font-size: 10px;">هذا التقرير صادر من نظام الإدارة المركزية VERRA PRO</div>
            </div>`;

            const opt = {
                margin: [10, 10],
                filename: `تقرير_${r.branch}_${r.date}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, letterRendering: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().from(html).set(opt).save().then(() => {
                document.getElementById('btnText').innerText = "📄 تحميل PDF التقرير الكامل";
            });
        }

        function renderUsers() {
            let pendingHtml = cloudPending.map(u => `<div class="user-row" style="border-right-color:#ef4444; background:#fff1f2;"><div class="flex flex-col text-right"><span class="font-bold text-xs">${u.email}</span><select id="role_${u.id}" class="role-selector text-right"><option value="assistant">مساعد مشرف</option><option value="supervisor">متابعة الفروع</option><option value="quality">مراقبة الجودة</option></select></div><div class="flex gap-2"><button onclick="rejectUser('${u.id}')" class="bg-red-50 text-red-600 font-bold text-[10px] px-4 py-2 rounded-xl border border-red-100 shadow-sm">رفض</button><button onclick="approveUser('${u.id}', '${u.email}')" class="bg-green-600 text-white font-bold text-[10px] px-4 py-2 rounded-xl shadow-sm">موافقة</button></div></div>`).join('');
            let activeHtml = cloudUsers.map(u => `<div class="user-row"><div class="flex flex-col text-right"><span class="font-bold text-xs text-gray-700">${u.email}</span><span class="text-[8px] text-blue-500 font-bold uppercase tracking-widest">${u.role === 'assistant' ? 'مساعد مشرف' : u.role === 'quality' ? 'مشرف جودة' : 'مشرف فروع'}</span></div><button onclick="if(confirm('سحب الصلاحية؟')) db.collection('authorized_users').doc('${u.id}').delete()" class="text-red-500 font-bold text-[10px] bg-red-50 px-3 py-1 rounded-lg">سحب</button></div>`).join('');
            document.getElementById('usersList').innerHTML = `<div class="mb-10 text-right"><h4 class="text-[11px] font-bold text-red-500 mb-3 uppercase tracking-widest text-right">قيد الانتظار (${cloudPending.length})</h4>${pendingHtml || '<p class="text-[9px] text-gray-400">لا توجد طلبات جديدة.</p>'}</div><hr class="mb-10 border-gray-100 text-right"><div class="text-right"><h4 class="text-[10px] font-bold text-green-600 mb-3 uppercase tracking-widest text-right">المشرفين المعتمدين</h4>${activeHtml}</div>`;
        }

        function approveUser(docId, email) { const role = document.getElementById('role_' + docId).value; db.collection("authorized_users").add({ email: email.toLowerCase().trim(), role: role }).then(() => db.collection("pending_authorizations").doc(docId).delete()); }
        function rejectUser(docId) { if(confirm("رفض الطلب؟")) db.collection("pending_authorizations").doc(docId).delete(); }
        function navigateTo(id) { document.querySelectorAll('.page').forEach(p => p.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-[#d1ba89]', 'text-white/40')); const btnId = 'nav-' + id.replace('Page',''); if(document.getElementById(btnId)) document.getElementById(btnId).classList.replace('text-white/40', 'text-[#d1ba89]'); if(id === 'reportsPage') renderReportsList(); }
        function closeModal() { document.getElementById('reportDetailModal').classList.remove('active'); }
        startSync();
    </script>
</body>
</html>
