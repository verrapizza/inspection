<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERRA PRO - لوحة الإدارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f8fafc; }
        .hidden { display: none; }
        .verra-card { background: white; border-radius: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); }
    </style>
</head>
<body class="pb-32 text-right">

    <div id="dashboardPage" class="page">
        <header class="bg-[#004b47] p-10 pb-28 rounded-b-[60px] text-white shadow-2xl relative">
            <h1 class="text-3xl font-black italic">VERRA <span class="text-[#d1ba89]">PRO</span></h1>
            <p class="text-[10px] opacity-80 uppercase italic">Control Center</p>
        </header>

        <main class="px-6 -mt-16 relative z-10">
            <div class="grid grid-cols-2 gap-4 mb-8 text-center">
                <div class="verra-card p-6 border-b-4 border-green-600"><p class="text-[10px] text-gray-400 font-bold uppercase">الامتثال</p><h2 id="totalScore" class="text-3xl font-black text-green-700">100%</h2></div>
                <div class="verra-card p-6 border-b-4 border-blue-600"><p class="text-[10px] text-gray-400 font-bold uppercase">التقارير</p><h2 id="reportCount" class="text-3xl font-black text-blue-700">0</h2></div>
            </div>

            <div class="verra-card p-8 mb-10 border-r-[12px] border-[#004b47] shadow-xl">
                <h3 class="font-black text-gray-800 text-xl mb-2">🛡️ تقرير المشرف</h3>
                <p class="text-[11px] text-gray-500 mb-8 font-bold leading-relaxed">بوابة المشرف لإجراء عمليات التفتيش الميداني وإصدار تقارير الجودة.</p>
                <a href="https://verrapizza.github.io/inspection/" class="w-full bg-[#004b47] text-white p-5 rounded-[22px] font-black shadow-lg flex justify-between items-center active:scale-95 transition-all text-center"><span>دخول الأداة</span><span>⬅</span></a>
            </div>
        </main>
    </div>

    <div id="reportsPage" class="page hidden px-6 pt-10">
        <div class="flex justify-between items-center mb-10"><h2 class="text-2xl font-black text-[#004b47] italic underline decoration-[#d1ba89]">سجل التقارير</h2><button onclick="navigateTo('dashboardPage')" class="bg-gray-100 p-3 rounded-full text-xs font-black">إغلاق</button></div>
        <div id="reportsList" class="space-y-4"></div>
    </div>

    <nav class="fixed bottom-0 w-full bg-[#004b47] text-white flex justify-around p-5 z-50 rounded-t-[45px] shadow-2xl">
        <button onclick="navigateTo('dashboardPage')" id="nav-dashboard" class="flex flex-col items-center text-[#d1ba89]"><span class="text-2xl">🏠</span><span class="text-[9px] font-black mt-1">الرئيسية</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-2xl">📊</span><span class="text-[9px] font-black mt-1">السجل</span></button>
    </nav>

    <script>
        function syncData() {
            const reports = JSON.parse(localStorage.getItem('v2_reports')) || [];
            document.getElementById('reportCount').innerText = reports.length;
            if (reports.length > 0) {
                const avg = Math.round(reports.reduce((s, r) => s + r.score, 0) / reports.length);
                document.getElementById('totalScore').innerText = avg + "%";
            }
            document.getElementById('reportsList').innerHTML = reports.map(r => `
                <div class="bg-white p-6 rounded-[30px] shadow-md border-r-8 ${r.score < 70 ? 'border-red-500' : 'border-green-600'}">
                    <h4 class="font-black text-gray-800 text-lg">${r.branch}</h4>
                    <p class="text-[10px] text-gray-400 font-bold mb-1">📅 ${r.date} | 👤 المشرف: ${r.inspector.split('@')[0]}</p>
                    <span class="text-xs font-black ${r.score < 70 ? 'text-red-600' : 'text-green-600'}">${r.score}% مطابق</span>
                </div>`).join('');
        }
        function navigateTo(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            syncData();
        }
        window.addEventListener('focus', syncData);
        syncData();
    </script>
</body>
</html>
