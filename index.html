        function startSync() {
            db.collection("inspections").onSnapshot(snap => {
                cloudReports = snap.docs.map(doc => ({ docId: doc.id, ...doc.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                updateUI();
                document.getElementById('loadingOverlay').classList.add('hidden');
            });
            db.collection("branches").orderBy("name").onSnapshot(snap => {
                cloudBranches = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderBranches();
            });
            db.collection("authorized_users").onSnapshot(snap => { cloudUsers = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderUsers(); });
            db.collection("pending_authorizations").onSnapshot(snap => { cloudPending = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); document.getElementById('pendingBadge').style.display = cloudPending.length > 0 ? 'block' : 'none'; renderUsers(); });
        }

        function updateUI() {
            document.getElementById('reportCount').innerText = fixNums(cloudReports.length);
            if(cloudReports.length > 0) {
                let sum = cloudReports.reduce((acc, curr) => acc + (parseFloat(curr.score) || 0), 0);
                document.getElementById('totalScore').innerText = fixNums(Math.round(sum / cloudReports.length)) + "%";
            } else { document.getElementById('totalScore').innerText = "100%"; }
            if(!document.getElementById('reportsPage').classList.contains('hidden')) renderReportsList();
        }

        function renderReportsList() {
            document.getElementById('reportsList').innerHTML = cloudReports.map((r, i) => `
                <div onclick="viewDetail(${i})" class="verra-card p-6 border-r-8 ${r.score < 70 ? 'border-red-500' : 'border-green-500'} mb-4 active:scale-95 transition-transform shadow-md">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex-1">
                            <h4 class="font-black text-gray-800 text-lg">${r.branch || 'تقرير'}</h4>
                            <p class="text-[10px] text-blue-600 font-bold uppercase tracking-wider">${r.type || 'Quality Audit'}</p>
                        </div>
                        <button onclick="event.stopPropagation(); if(confirm('حذف نهائي؟')) db.collection('inspections').doc('${r.docId}').delete()" class="delete-btn text-right">🗑️</button>
                    </div>
                    <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-50">
                        <p class="text-[11px] text-gray-400 font-bold italic">📅 ${fixNums(r.date)} | المشرف: ${r.inspector ? r.inspector.split('@')[0] : '---'}</p>
                        <span class="text-xs font-black bg-gray-50 px-3 py-1 rounded-full text-[#004b47]">${fixNums(r.score)}%</span>
                    </div>
                </div>`).join('');
        }

        function viewDetail(idx) {
            const r = cloudReports[idx];
            const isBranch = r.type && (r.type.includes("Branch") || r.type.includes("Operation"));
            document.getElementById('detailBody').innerHTML = `
                <div class="verra-card p-6 border border-gray-100 text-center mb-4 shadow-sm">
                    <h2 class="text-2xl font-black text-[#004b47] mb-2 uppercase">${r.branch || '---'}</h2>
                    <div class="grid grid-cols-2 gap-4 text-xs font-bold py-4 border-t border-b my-4">
                        <div><p class="text-gray-400 mb-1">📅 التاريخ</p><p>${fixNums(r.date)}</p></div>
                        <div><p class="text-gray-400 mb-1 text-right text-right">👤 المفتش</p><p class="text-right text-right">${r.inspector || '---'}</p></div>
                    </div>
                    <div class="flex justify-between px-10">
                        <span class="font-bold text-gray-500 italic">الامتثال العام:</span>
                        <span class="text-3xl font-black ${r.score < 70 ? 'text-red-500' : 'text-green-600'}">${fixNums(r.score)}%</span>
                    </div>
                </div>`;
            document.getElementById('downloadBtn').onclick = () => generateFullPDF(r);
            document.getElementById('reportDetailModal').classList.add('active');
        }

        function generateFullPDF(r) {
            document.getElementById('btnText').innerText = "جاري بناء الملف... ⏳";
            const isBranch = r.type && (r.type.includes("Branch") || r.type.includes("Operation"));
            const targetSections = isBranch ? sectionsBranches : sectionsQuality;
            
            let contentHtml = targetSections.map(sec => `
                <div style="background:#e8f5ee; padding:12px; border-right:8px solid #d1ba89; color:#004b47; font-weight:900; margin-top:30px; text-align:right; font-size:18px;">${sec.title}</div>
                ${sec.items.map(i => {
                    const ans = r.answers ? r.answers[i.id] : 'na';
                    const note = r.notes ? r.notes[i.id] : '';
                    const pics = (r.photos && r.photos[i.id]) ? r.photos[i.id] : [];
                    let status = ans === 'yes' ? '✅ مطابق / Yes' : ans === 'no' ? '❌ مخالف / No' : '🔘 N/A';
                    let color = ans === 'yes' ? '#059669' : ans === 'no' ? '#dc2626' : '#64748b';
                    return `<div style="padding:15px; border-bottom:1px solid #f1f5f9; text-align:right; page-break-inside:avoid;">
                        <p style="margin:0; font-weight:900; font-size:15px; color:#1e293b; white-space: pre-line;">${fixNums(i.q)}</p>
                        <p style="font-size:13px; margin:8px 0; font-weight:bold; color:${ans==='no'?'red':'green'};">الحالة: ${status}</p>
                        ${note ? `<div style="background:#fffbeb; padding:10px; border-radius:8px; font-size:12px; border:1px solid #fde68a; margin:10px 0;">الملاحظة: ${note}</div>` : ''}
                        <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;">${pics.map(p => `<img src="${p}" style="width:200px; height:150px; border-radius:12px; object-fit:cover; border:1px solid #e2e8f0;" />`).join('')}</div>
                    </div>`;
                }).join('')}
            `).join('');

            const html = `<div style="width:800px; margin:0 auto; padding:40px; background:white; font-family:'Cairo'; direction:rtl; box-sizing:border-box; text-align:right;">
                <div style="text-align:center; border-bottom:5px solid #004b47; padding-bottom:25px; margin-bottom:40px;"><img src="${LOGO_URL}" style="height:120px; margin-bottom:15px;" /><h1 style="color:#004b47; margin:0; font-size:32px; font-weight:900;">تقرير تدقيق VERRA PRO</h1></div>
                <div style="background:#f8fafc; padding:30px; border-radius:20px; border:1px solid #e2e8f0; display:flex; justify-content:space-between; margin-bottom:40px; text-align:right;"><div style="flex:1; line-height:2.2; text-align:right;"><p><b>🏢 الفرع:</b> ${r.branch}</p><p><b>👤 المشرف:</b> ${r.inspector}</p><p><b>📅 التاريخ:</b> ${fixNums(r.date)}</p></div><div style="width:180px; text-align:center; border-right:3px solid #004b47; padding-right:25px;"><p style="font-size:12px; font-weight:900; color:#64748b;">الامتثال</p><div style="font-size:50px; font-weight:900; color:${r.score >= 70 ? '#059669':'#dc2626'};">${fixNums(r.score)}%</div></div></div>${contentHtml}
                <div style="margin-top:60px; border-top:3px solid #004b47; pt:30px; text-align:left;"><p style="font-weight:900; color:#004b47;">التوقيع المعتمد:</p><img src="${r.signature}" style="width:300px; border-bottom:2px solid #004b47;" /></div></div>`;
            
            html2pdf().from(html).set({ margin:0, filename:`Verra_Report_${r.branch}.pdf`, html2canvas:{scale:2, useCORS:true}, jsPDF:{unit:'mm', format:'a4', orientation:'portrait'} }).save().then(() => { document.getElementById('btnText').innerText = "📄 تحميل PDF التقرير الكامل"; });
        }

        function renderUsers() {
            let pendingHtml = cloudPending.map(u => `<div class="user-row" style="border-right-color:#ef4444; background:#fff1f2;"><div class="flex flex-col text-right text-right text-right"><span class="font-bold text-xs">${u.email}</span><span class="text-[8px] text-red-500 uppercase tracking-widest italic">طلب جديد</span></div><button onclick="approveUser('${u.id}', '${u.email}')" class="bg-green-600 text-white font-bold text-[10px] px-4 py-2 rounded-xl">موافقة</button></div>`).join('');
            let activeHtml = cloudUsers.map(u => `<div class="user-row"><span class="font-bold text-xs text-gray-700">${u.email}</span><button onclick="if(confirm('سحب؟')) db.collection('authorized_users').doc('${u.id}').delete()" class="text-red-500 font-bold text-[10px] bg-red-50 px-3 py-1 rounded-lg">سحب</button></div>`).join('');
            document.getElementById('usersList').innerHTML = `<div class="mb-10 text-right"><h4 class="text-[10px] font-bold text-red-500 mb-3 uppercase tracking-widest text-right">قيد الانتظار</h4>${pendingHtml || '<p class="text-[9px] text-gray-400 text-right">لا توجد طلبات.</p>'}</div><hr class="mb-10 text-right text-right"><div class="text-right text-right"><h4 class="text-[10px] font-bold text-green-600 mb-3 uppercase tracking-widest text-right">المشرفين</h4>${activeHtml}</div>`;
        }

        function approveUser(docId, email) { db.collection("authorized_users").add({ email: email, role: "supervisor" }).then(() => { db.collection("pending_authorizations").doc(docId).delete(); alert("✅ تم التفعيل."); }); }
        function addBranchToCloud() { const n = document.getElementById('newBranchInput').value; if(!n) return; db.collection("branches").add({name: n}).then(() => { document.getElementById('newBranchInput').value = ""; alert("تمت الإضافة."); }); }
        function renderBranches() { document.getElementById('branchesList').innerHTML = cloudBranches.map(b => `<div class="bg-white p-5 rounded-2xl flex justify-between items-center shadow-sm border-r-8 border-[#d1ba89] font-black"><span>${b.name}</span><button onclick="if(confirm('حذف؟')) db.collection('branches').doc('${b.id}').delete()" class="text-red-400 text-xs font-bold">🗑️</button></div>`).join(''); }

        function navigateTo(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-[#d1ba89]', 'text-white/40'));
            const btnId = 'nav-' + id.replace('Page','');
            if(document.getElementById(btnId)) document.getElementById(btnId).classList.replace('text-white/40', 'text-[#d1ba89]');
            if(id === 'reportsPage') renderReportsList();
        }
        function closeModal() { document.getElementById('reportDetailModal').classList.remove('active'); }
    </script>
</body>
</html>
