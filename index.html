        function startSync() {
            db.collection("inspections").onSnapshot(snap => {
                cloudReports = snap.docs.map(doc => ({ docId: doc.id, ...doc.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                updateUI();
                document.getElementById('loadingOverlay').classList.add('hidden');
            });
            db.collection("authorized_users").onSnapshot(snap => { cloudUsers = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderUsers(); });
            db.collection("pending_authorizations").onSnapshot(snap => { cloudPending = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); document.getElementById('pendingBadge').style.display = cloudPending.length > 0 ? 'block' : 'none'; renderUsers(); });
        }

        function updateUI() {
            document.getElementById('reportCount').innerText = cloudReports.length;
            if(cloudReports.length > 0) {
                let sum = cloudReports.reduce((s, r) => s + (parseFloat(r.score) || 0), 0);
                document.getElementById('totalScore').innerText = fixNums(Math.round(sum / cloudReports.length)) + "%";
            } else { document.getElementById('totalScore').innerText = "100%"; }
            if(!document.getElementById('reportsPage').classList.contains('hidden')) renderReportsList();
        }

        function renderReportsList() {
            document.getElementById('reportsList').innerHTML = cloudReports.map((r, i) => `
                <div onclick="viewDetail(${i})" class="verra-card p-6 border-r-8 ${r.score < 70 ? 'border-red-500' : 'border-green-500'} mb-4 active:scale-95 transition-transform text-right">
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-black text-gray-800 text-lg">${r.branch || 'تقرير'}</h4>
                        <button onclick="event.stopPropagation(); if(confirm('حذف؟')) db.collection('inspections').doc('${r.docId}').delete()" class="delete-btn">🗑️</button>
                    </div>
                    <p class="text-[10px] text-blue-600 font-bold uppercase mb-1">${r.type || 'Audit'}</p>
                    <p class="text-[11px] text-gray-400 font-bold">📅 ${fixNums(r.date)} | المشرف: ${r.inspector ? r.inspector.split('@')[0] : '---'}</p>
                    <span class="text-xs font-black ${r.score < 70 ? 'text-red-600' : 'text-green-600'}">${fixNums(r.score)}% مطابق</span>
                </div>`).join('');
        }

        function viewDetail(idx) {
            const r = cloudReports[idx];
            document.getElementById('detailBody').innerHTML = `<div class="verra-card p-6 border border-gray-100 text-center mb-4 shadow-sm text-right"><h2 class="text-2xl font-black text-[#004b47] mb-2 uppercase text-right">${r.branch || '---'}</h2><div class="grid grid-cols-2 gap-4 text-xs font-bold py-4 border-t border-b my-4 text-right"><div><p class="text-gray-400 mb-1">📅 التاريخ</p><p>${fixNums(r.date)}</p></div><div><p class="text-gray-400 mb-1 text-right">👤 المفتش</p><p class="text-right">${r.inspector || '---'}</p></div></div><div class="flex justify-between px-10 text-right"><span class="font-bold text-gray-500 italic">الامتثال العام:</span><span class="text-3xl font-black ${r.score < 70 ? 'text-red-500' : 'text-green-600'}">${fixNums(r.score)}%</span></div></div>`;
            document.getElementById('downloadBtn').onclick = () => generateFullPDF(r);
            document.getElementById('reportDetailModal').classList.add('active');
        }

        function generateFullPDF(r) {
            document.getElementById('btnText').innerText = "جاري البناء... ⏳";
            let targetSections;
            if(r.type === "Assistant Checklist") targetSections = sectionsAssistant;
            else if(r.type === "Branch Report") targetSections = sectionsBranches;
            else targetSections = sectionsQuality;

            let contentHtml = targetSections.map(sec => {
                let itemsHtml = sec.items.map(i => {
                    const ans = r.answers ? r.answers[i.id] : 'na';
                    const note = r.notes ? r.notes[i.id] : '';
                    const pics = (r.photos && r.photos[i.id]) ? r.photos[i.id] : [];
                    let statusColor = ans === 'yes' ? '#059669' : ans === 'no' ? '#dc2626' : '#64748b';
                    return `<div style="padding: 15px; border-bottom: 1px solid #f1f5f9; text-align: right; page-break-inside: avoid; width: 100%; display: block; clear: both;"><div style="font-family: 'Cairo', sans-serif; font-weight: bold; font-size: 11px; color: #64748b; direction: ltr; text-align: left; margin-bottom: 5px;">${i.en || i.q}</div><div style="font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 14px; color: #1e293b; direction: rtl; text-align: right; line-height: 1.5;">${i.ar || i.q}</div><div style="margin-top: 10px;"><span style="font-family: 'Cairo', sans-serif; font-size: 12px; color: ${statusColor}; font-weight: bold;">الحالة: ${ans === 'yes' ? 'مطابق ✅' : ans === 'no' ? 'مخالفة ❌' : 'N/A'}</span>${note ? `<div style="background: #fff9e6; padding: 10px; border-radius: 8px; font-size: 11px; margin-top: 10px; color: #92400e;">الملاحظة: ${note}</div>` : ''}<div style="display: block; margin-top: 15px; text-align: right;">${pics.map(p => `<img src="${p}" style="width: 200px; height: auto; max-height: 200px; border-radius: 12px; object-fit: cover; border: 2px solid #e2e8f0; margin-left: 10px; margin-bottom: 10px; display: inline-block;" />`).join('')}</div></div></div>`;
                }).join('');
                return `<div style="background: #e8f5ee; padding: 12px; border-right: 8px solid #d1ba89; color: #004b47; font-weight: 900; margin-top: 35px; text-align: right; font-size: 18px; font-family: 'Cairo', sans-serif; clear: both; display: block;">${sec.title}</div>${itemsHtml}`;
            }).join('');

            const html = `<div style="width: 800px; margin: 0 auto; padding: 40px; background: white; font-family: 'Cairo', sans-serif; direction: rtl; box-sizing: border-box; text-align: right;"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><div style="text-align: center; border-bottom: 5px solid #004b47; padding-bottom: 25px; margin-bottom: 40px;"><img src="${LOGO_URL}" style="height: 110px; display: inline-block;" /><h1 style="color: #004b47; margin: 0; font-size: 32px; font-weight: 900;">تقرير تدقيق VERRA PRO الرسمي</h1></div><div style="background: #f8fafc; padding: 30px; border-radius: 20px; border: 1px solid #e2e8f0; display: block; width: 100%; box-sizing: border-box; overflow: hidden; margin-bottom: 40px; clear: both;"><div style="float: right; width: 70%; line-height: 2.2; text-align: right;"><p><b>🏢 الفرع المستهدف:</b> ${r.branch}</p><p><b>👤 المشرف المسؤول:</b> ${r.inspector}</p><p><b>📅 التاريخ والوقت:</b> ${fixNums(r.date)}</p></div><div style="float: left; width: 25%; text-align: center; border-right: 3px solid #004b47; padding-right: 25px;"><p style="font-size: 12px; font-weight: 900; color: #64748b;">الامتثال</p><div style="font-size: 55px; font-weight: 900; color: ${r.score >= 70 ? '#059669':'#dc2626'}; line-height: 1;">${fixNums(r.score)}%</div></div></div><div style="clear: both; width: 100%; display: block;">${contentHtml}</div><div style="margin-top: 60px; border-top: 4px solid #004b47; padding-top: 30px; text-align: right; page-break-inside: avoid; display: block; width: 100%; clear: both;"><p style="font-weight: 900; color: #004b47; font-size: 18px; margin-bottom: 20px;">التوقيع الرقمي المعتمد:</p><img src="${r.signature}" style="width: 320px; height: 120px; border-bottom: 2px solid #004b47; object-fit: contain; display: block;" /><p style="font-size: 10px; color: #94a3b8; margin-top: 15px;">تم توليد هذا التقرير آلياً عبر نظام VERRA PRO السحابي.</p></div></div>`;
            html2pdf().from(html).set({ margin: 0, filename: `Verra_Full_Report.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true, scrollY: 0, letterRendering: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).save().then(() => { document.getElementById('btnText').innerText = "📄 تحميل PDF التقرير الكامل"; });
        }

        function renderUsers() {
            let pendingHtml = cloudPending.map(u => `<div class="user-row" style="border-right-color:#ef4444; background:#fff1f2;"><div class="flex flex-col text-right"><span class="font-bold text-xs">${u.email}</span><select id="role_${u.id}" class="role-selector text-right"><option value="assistant">مساعد مشرف (Checklist)</option><option value="supervisor">متابعة الفروع</option><option value="quality">مراقبة الجودة</option></select></div><div class="flex gap-2"><button onclick="rejectUser('${u.id}')" class="bg-red-50 text-red-600 font-bold text-[10px] px-4 py-2 rounded-xl">رفض</button><button onclick="approveUser('${u.id}', '${u.email}')" class="bg-green-600 text-white font-bold text-[10px] px-4 py-2 rounded-xl shadow-md">موافقة</button></div></div>`).join('');
            let activeHtml = cloudUsers.map(u => `<div class="user-row"><div class="flex flex-col text-right"><span class="font-bold text-xs text-gray-700">${u.email}</span><span class="text-[8px] text-blue-500 font-bold uppercase tracking-widest">${u.role === 'assistant' ? 'مساعد مشرف' : u.role === 'quality' ? 'مشرف جودة' : 'مشرف فروع'}</span></div><button onclick="if(confirm('سحب؟')) db.collection('authorized_users').doc('${u.id}').delete()" class="text-red-500 font-bold text-[10px] bg-red-50 px-3 py-1 rounded-lg text-right">سحب</button></div>`).join('');
            document.getElementById('usersList').innerHTML = `<div class="mb-10 text-right"><h4 class="text-[11px] font-bold text-red-500 mb-3 uppercase tracking-widest text-right">قيد الانتظار (${cloudPending.length})</h4>${pendingHtml || '<p class="text-[9px] text-gray-400 text-right">لا توجد طلبات.</p>'}</div><hr class="mb-10 border-gray-100"><div class="text-right text-right"><h4 class="text-[10px] font-bold text-green-600 mb-3 uppercase tracking-widest text-right">المشرفين</h4>${activeHtml}</div>`;
        }

        function approveUser(docId, email) { const role = document.getElementById('role_' + docId).value; db.collection("authorized_users").add({ email: email.toLowerCase().trim(), role: role }).then(() => db.collection("pending_authorizations").doc(docId).delete()); }
        function rejectUser(docId) { if(confirm("رفض؟")) db.collection("pending_authorizations").doc(docId).delete(); }
        function navigateTo(id) { document.querySelectorAll('.page').forEach(p => p.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-[#d1ba89]', 'text-white/40')); const btnId = 'nav-' + id.replace('Page',''); if(document.getElementById(btnId)) document.getElementById(btnId).classList.replace('text-white/40', 'text-[#d1ba89]'); if(id === 'reportsPage') renderReportsList(); }
        function closeModal() { document.getElementById('reportDetailModal').classList.remove('active'); }
        startSync();
    </script>
</body>
</html>
