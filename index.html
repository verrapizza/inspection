<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERRA PRO - الإدارة المركزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none; }
        .verra-card { background: white; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; display: none; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; height: 94vh; border-radius: 40px 40px 0 0; padding: 25px; overflow-y: auto; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; position: sticky; top: -10px; background: white; z-index: 20; }
        .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
        .delete-btn { color: #ef4444; padding: 8px; border-radius: 12px; background: #fff1f2; border: 1px solid #ffe4e6; }
        .user-row { background: white; padding: 15px; border-radius: 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-right: 6px solid #d1ba89; }
    </style>
</head>
<body class="pb-32 text-right">

    <div id="lockScreen" class="fixed inset-0 bg-white z-[500] flex flex-col items-center justify-center font-bold text-[#004b47]">
        <div class="w-12 h-12 border-4 border-t-green-500 border-gray-200 rounded-full animate-spin mb-4"></div>
        جاري مزامنة النظام...
    </div>

    <!-- الصفحة الرئيسية -->
    <div id="dashboardPage" class="page">
        <header class="bg-[#004b47] p-10 pb-28 rounded-b-[60px] text-white shadow-2xl relative">
            <h1 class="text-3xl font-black italic uppercase tracking-tighter">Verra <span class="text-[#d1ba89]">Pro</span></h1>
            <p class="text-[10px] opacity-70 font-bold tracking-widest uppercase">Admin Management</p>
        </header>
        <main class="px-6 -mt-16 relative z-10">
            <div class="grid grid-cols-2 gap-4 mb-8 text-center">
                <div class="verra-card p-6 border-b-4 border-green-600 shadow-lg"><p class="text-gray-400 text-[10px] font-bold mb-1">الامتثال</p><h2 id="totalScore" class="text-3xl font-black text-green-700">--</h2></div>
                <div onclick="navigateTo('reportsPage')" class="verra-card p-6 border-b-4 border-blue-600 shadow-lg"><p class="text-gray-400 text-[10px] font-bold mb-1">التقارير</p><h2 id="reportCount" class="text-3xl font-black text-blue-700">0</h2></div>
            </div>
            <div class="verra-card p-7 mb-4 border-r-[12px] border-[#004b47] shadow-xl italic" onclick="window.location.href='inspection.html'"><h3 class="font-black text-gray-800 text-lg">🛡️ تفتيش الجودة</h3></div>
            <div class="verra-card p-7 mb-4 border-r-[12px] border-blue-600 shadow-xl italic" onclick="window.location.href='branches-inspector.html'"><h3 class="font-black text-gray-800 text-lg">🏢 إشراف الفروع</h3></div>
            <div class="verra-card p-7 mb-4 border-r-[12px] border-[#d1ba89] shadow-xl italic" onclick="navigateTo('usersPage')"><h3 class="font-black text-gray-800 text-lg">👤 إدارة المستخدمين</h3><p id="pendingBadge" class="text-[9px] text-red-500 font-bold hidden mt-1">توجد طلبات جديدة ⚠️</p></div>
            <div class="verra-card p-7 mb-10 border-r-[12px] border-gray-400 shadow-xl italic" onclick="navigateTo('branchesPage')"><h3 class="font-black text-gray-800 text-lg">📍 إدارة الفروع</h3></div>
        </main>
    </div>

    <!-- سجل التقارير -->
    <div id="reportsPage" class="page hidden px-6 pt-10">
        <div class="flex justify-between items-center mb-8"><h2 class="text-2xl font-black text-[#004b47] italic underline decoration-[#d1ba89]">سجل التقارير</h2><button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full text-xs font-black shadow-sm border">رجوع</button></div>
        <div id="reportsList" class="space-y-4 pb-24">
            <!-- سيتم الملء هنا -->
        </div>
    </div>

    <!-- إدارة الفروع -->
    <div id="branchesPage" class="page hidden px-6 pt-10">
        <div class="flex justify-between items-center mb-8"><h2 class="text-2xl font-black text-[#004b47]">الفروع</h2><button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full shadow-sm border">إغلاق</button></div>
        <div class="bg-white p-6 rounded-[30px] shadow-sm mb-6"><input type="text" id="newBranchInput" placeholder="اسم الفرع الجديد" class="w-full bg-gray-50 p-4 rounded-2xl border mb-3"><button onclick="addBranchToCloud()" class="w-full bg-green-600 text-white p-4 rounded-2xl font-black">إضافة +</button></div>
        <div id="branchesList" class="space-y-3 pb-24"></div>
    </div>

    <!-- إدارة المستخدمين -->
    <div id="usersPage" class="page hidden px-6 pt-10">
        <div class="flex justify-between items-center mb-8"><h2 class="text-2xl font-black text-[#004b47]">الصلاحيات</h2><button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full border">إغلاق</button></div>
        <div id="usersList" class="space-y-6 pb-24"></div>
    </div>

    <!-- نافذة المعاينة -->
    <div id="reportDetailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><button onclick="closeModal()" class="bg-red-50 text-red-500 w-10 h-10 rounded-full font-black">X</button><h3 class="text-xl font-black text-green-950">تفاصيل التقرير</h3></div>
            <div id="detailBody" class="space-y-5"></div>
            <div class="mt-10 pb-10 border-t pt-8"><button id="downloadBtn" class="w-full verra-gradient text-white p-5 rounded-3xl font-black shadow-xl">📄 تحميل PDF الكامل</button></div>
        </div>
    </div>

    <!-- المنيو السفلي -->
    <nav class="fixed bottom-0 w-full bg-[#004b47] text-white flex justify-around p-5 z-50 rounded-t-[45px] shadow-2xl border-t border-white/10">
        <button onclick="navigateTo('dashboardPage')" id="nav-dashboard" class="flex flex-col items-center text-[#d1ba89]"><span class="text-2xl">🏠</span><span class="text-[9px] font-black mt-1">MAIN</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-2xl">📊</span><span class="text-[9px] font-black mt-1">LOGS</span></button>
        <button onclick="navigateTo('usersPage')" id="nav-users" class="flex flex-col items-center text-white/40"><span class="text-2xl">👤</span><span class="text-[9px] font-black mt-1">USERS</span></button>
    </nav>

    <script>
        const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";
        const firebaseConfig = { apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0", authDomain: "verra-system-828f2.firebaseapp.com", projectId: "verra-system-828f2", storageBucket: "verra-system-828f2.firebasestorage.app", messagingSenderId: "961104891607", appId: "1:961104891607:web:5ffd3af4983a8b015b6a92" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let cloudReports = []; let cloudBranches = []; let cloudUsers = []; let cloudPending = [];

        auth.onAuthStateChanged(user => {
            if (user && user.email === "ch3f.ramzi@gmail.com") {
                document.getElementById('lockScreen').classList.add('hidden');
                startSync();
            } else { window.location.href = "branches-inspector.html"; }
        });

        function fixNums(s) { return s ? s.toString().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)) : "0"; }

        function startSync() {
            db.collection("inspections").onSnapshot(snap => {
                cloudReports = snap.docs.map(doc => ({ docId: doc.id, ...doc.data() }));
                cloudReports.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                updateUI();
            });
            db.collection("branches").orderBy("name").onSnapshot(snap => {
                cloudBranches = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderBranches();
            });
            db.collection("authorized_users").onSnapshot(snap => {
                cloudUsers = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderUsers();
            });
            db.collection("pending_authorizations").onSnapshot(snap => {
                cloudPending = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                document.getElementById('pendingBadge').style.display = cloudPending.length > 0 ? 'block' : 'none';
                renderUsers();
            });
        }

        function updateUI() {
            document.getElementById('reportCount').innerText = fixNums(cloudReports.length);
            if(cloudReports.length > 0) {
                let sum = cloudReports.reduce((acc, curr) => acc + (parseFloat(curr.score) || 0), 0);
                document.getElementById('totalScore').innerText = fixNums(Math.round(sum / cloudReports.length)) + "%";
            }
            renderReportsList();
        }

        function renderReportsList() {
            const list = document.getElementById('reportsList');
            if (cloudReports.length === 0) {
                list.innerHTML = '<div class="text-center py-20 text-gray-400 font-bold italic">لا توجد تقارير في السحابة..</div>';
                return;
            }
            list.innerHTML = cloudReports.map((r, i) => {
                // صمام أمان لبيانات المفتش
                const inspectorName = r.inspector ? r.inspector.split('@')[0] : 'غير معروف';
                const reportType = r.type || 'تقرير جودة';
                
                return `
                <div onclick="viewDetail(${i})" class="verra-card p-6 border-r-8 ${r.score < 70 ? 'border-red-500' : 'border-green-500'} mb-4 active:scale-95 transition-transform shadow-md">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h4 class="font-black text-gray-800 text-lg">${r.branch || 'بدون اسم'}</h4>
                            <p class="text-[10px] text-blue-600 font-bold uppercase tracking-wider">${reportType}</p>
                        </div>
                        <button onclick="event.stopPropagation(); if(confirm('حذف نهائي؟')) db.collection('inspections').doc('${r.docId}').delete()" class="delete-btn">🗑️</button>
                    </div>
                    <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-50">
                        <p class="text-[11px] text-gray-400 font-bold italic">📅 ${fixNums(r.date)} | المشرف: ${inspectorName}</p>
                        <span class="text-xs font-black bg-gray-50 px-3 py-1 rounded-full text-[#004b47]">${fixNums(r.score)}%</span>
                    </div>
                </div>`;
            }).join('');
        }

        function viewDetail(idx) {
            const r = cloudReports[idx];
            document.getElementById('detailBody').innerHTML = `
                <div class="verra-card p-6 border border-gray-100 text-center mb-4">
                    <h2 class="text-2xl font-black text-[#004b47] mb-2 uppercase">${r.branch || '---'}</h2>
                    <div class="grid grid-cols-2 gap-4 text-xs font-bold py-4 border-t border-b my-4">
                        <div><p class="text-gray-400 mb-1">📅 التاريخ</p><p>${fixNums(r.date)}</p></div>
                        <div><p class="text-gray-400 mb-1">👤 المفتش</p><p>${r.inspector || '---'}</p></div>
                    </div>
                    <div class="flex justify-between px-10">
                        <span class="font-bold text-gray-500 italic">معدل الامتثال:</span>
                        <span class="text-3xl font-black ${r.score < 70 ? 'text-red-500' : 'text-green-600'}">${fixNums(r.score)}%</span>
                    </div>
                </div>`;
            document.getElementById('reportDetailModal').classList.add('active');
            // هنا يربط زر التحميل بنفس المنطق السابق (مع حذف الكود من أجل الاختصار)
        }

        function renderUsers() {
            let pendingHtml = cloudPending.map(u => `<div class="user-row" style="border-right-color:#ef4444; background:#fff1f2;"><div class="flex flex-col"><span class="font-bold text-xs">${u.email}</span><span class="text-[8px] text-red-500 font-bold uppercase tracking-widest italic">طلب انضمام ⚠️</span></div><button onclick="approveUser('${u.id}', '${u.email}')" class="bg-green-600 text-white font-bold text-[10px] px-4 py-2 rounded-xl shadow-sm">موافقة</button></div>`).join('');
            let activeHtml = cloudUsers.map(u => `<div class="user-row"><span class="font-bold text-xs text-gray-700">${u.email}</span><button onclick="if(confirm('سحب الصلاحية؟')) db.collection('authorized_users').doc('${u.id}').delete()" class="text-red-500 font-bold text-[10px] bg-red-50 px-3 py-1 rounded-lg">سحب الصلاحية</button></div>`).join('');
            document.getElementById('usersList').innerHTML = `<div class="mb-10 text-right"><h4 class="text-[10px] font-bold text-red-500 mb-3 mr-2 uppercase tracking-widest">بانتظار التفعيل (${cloudPending.length})</h4>${pendingHtml || '<p class="text-[9px] text-gray-400 mr-2 italic">لا توجد طلبات جديدة.</p>'}</div><hr class="border-gray-100 mb-10"><div class="text-right"><h4 class="text-[10px] font-bold text-green-600 mb-3 mr-2 uppercase tracking-widest">المشرفين النشطين (${cloudUsers.length})</h4>${activeHtml}</div>`;
        }

        function approveUser(docId, email) {
            if(confirm(`تفعيل حساب ${email}؟`)) {
                db.collection("authorized_users").add({ email: email, role: "supervisor" }).then(() => {
                    db.collection("pending_authorizations").doc(docId).delete();
                    alert("✅ تم التفعيل.");
                });
            }
        }

        function addBranchToCloud() {
            const n = document.getElementById('newBranchInput').value; if(!n) return;
            db.collection("branches").add({name: n}).then(() => { document.getElementById('newBranchInput').value = ""; alert("تمت الإضافة."); });
        }

        function renderBranches() {
            document.getElementById('branchesList').innerHTML = cloudBranches.map(b => `<div class="bg-white p-5 rounded-2xl flex justify-between items-center shadow-sm border-r-8 border-[#d1ba89] font-black"><span>${b.name}</span><button onclick="if(confirm('حذف؟')) db.collection('branches').doc('${b.id}').delete()" class="text-red-400 text-xs font-bold">🗑️</button></div>`).join('');
        }

        function navigateTo(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-[#d1ba89]', 'text-white/40'));
            const btnId = 'nav-' + id.replace('Page','');
            if(document.getElementById(btnId)) document.getElementById(btnId).classList.replace('text-white/40', 'text-[#d1ba89]');
        }
        function closeModal() { document.getElementById('reportDetailModal').classList.remove('active'); }
    </script>
</body>
</html>
