<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERRA PRO - الإدارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none; }
        .verra-card { background: white; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; }
        .user-row { background: white; padding: 18px; border-radius: 25px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-right: 8px solid #d1ba89; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; display: none; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; height: 92vh; border-radius: 40px 40px 0 0; padding: 25px; overflow-y: auto; position: relative; }
        .role-selector { font-size: 11px; padding: 6px; border-radius: 10px; border: 1px solid #ddd; font-weight: bold; background: #f9fafb; margin-top: 5px; width: 100%; }
        .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    </style>
</head>
<body class="pb-32 text-right">

    <div id="lockScreen" class="fixed inset-0 bg-white z-[500] flex flex-col items-center justify-center font-bold text-[#004b47]">
        <div class="w-12 h-12 border-4 border-t-green-500 border-gray-200 rounded-full animate-spin mb-4"></div>
        جاري مزامنة نظام VERRA...
    </div>

    <!-- الصفحة الرئيسية -->
    <div id="dashboardPage" class="page">
        <header class="bg-[#004b47] p-10 pb-28 rounded-b-[60px] text-white shadow-2xl relative text-right">
            <div class="flex justify-between items-center relative z-10">
                <div>
                    <h1 class="text-3xl font-black italic uppercase tracking-tighter">Verra <span class="text-[#d1ba89]">Pro</span></h1>
                    <p class="text-[10px] opacity-70 font-bold uppercase italic">Admin Dashboard</p>
                </div>
                <button onclick="auth.signOut()" class="bg-red-500/20 text-red-200 px-4 py-2 rounded-xl text-[10px] font-bold border border-red-500/30">خروج ↪</button>
            </div>
        </header>
        <main class="px-6 -mt-16 relative z-10">
            <div class="grid grid-cols-2 gap-4 mb-8 text-center text-right">
                <div class="verra-card p-6 border-b-4 border-green-600 shadow-lg"><p class="text-gray-400 text-[10px] font-bold mb-1">الامتثال</p><h2 id="totalScore" class="text-3xl font-black text-green-700">--</h2></div>
                <div onclick="navigateTo('reportsPage')" class="verra-card p-6 border-b-4 border-blue-600 shadow-lg text-right"><p class="text-gray-400 text-[10px] font-bold mb-1">التقارير</p><h2 id="reportCount" class="text-3xl font-black text-blue-700">0</h2></div>
            </div>
            <div class="verra-card p-7 mb-4 border-r-[12px] border-[#004b47] shadow-xl italic text-right" onclick="window.location.href='quality-inspection.html'"><h3 class="font-black text-gray-800 text-lg">🛡️ مراقبة الجودة</h3></div>
            <div class="verra-card p-7 mb-4 border-r-[12px] border-blue-600 shadow-xl italic text-right" onclick="window.location.href='branches-inspector.html'"><h3 class="font-black text-gray-800 text-lg text-right">🏢 متابعة الفروع</h3></div>
            <div class="verra-card p-7 mb-10 border-r-[12px] border-[#d1ba89] shadow-xl italic text-right" onclick="navigateTo('usersPage')">
                <h3 class="font-black text-gray-800 text-lg text-right">👤 إدارة المشرفين</h3>
                <p id="pendingBadge" class="text-[9px] text-red-500 font-bold hidden mt-1 text-right">طلبات جديدة ⚠️</p>
            </div>
        </main>
    </div>

    <!-- صفحة المستخدمين (المصلحة) -->
    <div id="usersPage" class="page hidden px-6 pt-10 text-right">
        <div class="flex justify-between items-center mb-8 text-right">
            <h2 class="text-2xl font-black text-[#004b47]">إدارة الصلاحيات</h2>
            <div class="flex gap-2">
                <button onclick="startSync()" class="bg-blue-600 text-white p-2 rounded-xl text-[10px] font-bold shadow-md">تحديث 🔄</button>
                <button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full border shadow-sm text-xs font-black text-gray-400">X</button>
            </div>
        </div>

        <!-- الخانة المضافة: إضافة مستخدم يدوياً -->
        <div class="bg-white p-6 rounded-[30px] shadow-sm mb-10 border-r-[10px] border-green-600 text-right">
            <p class="text-[11px] font-black text-gray-400 mb-4 italic">إضافة مشرف/مساعد يدوياً من السحابة:</p>
            <input type="email" id="manualEmailInput" placeholder="أدخل البريد الإلكتروني" class="w-full bg-gray-50 p-4 rounded-2xl border mb-3 outline-none font-bold text-left">
            <select id="manualRoleSelect" class="role-selector mb-4 p-4 text-sm text-right">
                <option value="assistant">مساعد مشرف</option>
                <option value="supervisor">مشرف فروع</option>
                <option value="quality">مشرف جودة</option>
            </select>
            <button onclick="manualAddUser()" class="w-full bg-green-600 text-white p-4 rounded-2xl font-black shadow-lg">إضافة وتفعيل الصلاحية ✅</button>
        </div>

        <div id="usersList" class="space-y-8 pb-24 text-right">
            <!-- قوائم الانتظار والمشرفين تظهر هنا -->
        </div>
    </div>

    <!-- سجل التقارير -->
    <div id="reportsPage" class="page hidden px-6 pt-10 text-right">
        <div class="flex justify-between items-center mb-10"><h2 class="text-2xl font-black text-[#004b47] italic underline decoration-[#d1ba89] underline-offset-8 text-right text-right">سجل التقارير</h2><button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full shadow-sm border text-xs font-bold text-right text-right">رجوع</button></div>
        <div id="reportsList" class="space-y-4 pb-24 text-right"></div>
    </div>

    <nav class="fixed bottom-0 w-full bg-[#004b47] text-white flex justify-around p-5 z-50 rounded-t-[45px] shadow-2xl border-t border-white/10 text-right">
        <button onclick="navigateTo('dashboardPage')" id="nav-dashboard" class="flex flex-col items-center text-[#d1ba89]"><span class="text-2xl text-right">🏠</span><span class="text-[9px] font-black mt-1">MAIN</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-2xl text-right">📊</span><span class="text-[9px] font-black mt-1">LOGS</span></button>
        <button onclick="navigateTo('usersPage')" id="nav-users" class="flex flex-col items-center text-white/40"><span class="text-2xl text-right text-right">👤</span><span class="text-[9px] font-black mt-1">USERS</span></button>
    </nav>

    <script>
        const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";
        const firebaseConfig = { apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0", authDomain: "verra-system-828f2.firebaseapp.com", projectId: "verra-system-828f2", storageBucket: "verra-system-828f2.firebasestorage.app", messagingSenderId: "961104891607", appId: "1:961104891607:web:5ffd3af4983a8b015b6a92" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let cloudReports = []; let cloudUsers = []; let cloudPending = [];

        auth.onAuthStateChanged(user => {
            if (user && user.email === "ch3f.ramzi@gmail.com") { document.getElementById('lockScreen').classList.add('hidden'); startSync(); } 
            else { window.location.href = "branches-inspector.html"; }
        });

        function fixNums(s) { return s ? s.toString().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)) : "0"; }

        function startSync() {
            db.collection("inspections").onSnapshot(snap => {
                cloudReports = snap.docs.map(doc => ({ docId: doc.id, ...doc.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                updateUI();
            });
            db.collection("authorized_users").onSnapshot(snap => {
                cloudUsers = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderUsers();
            });
            db.collection("pending_authorizations").onSnapshot(snap => {
                cloudPending = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                document.getElementById('pendingBadge').style.display = cloudPending.length > 0 ? 'block' : 'none';
                renderUsers();
            });
        }

        // دالة الإضافة اليدوية الجديدة
        function manualAddUser() {
            const email = document.getElementById('manualEmailInput').value.toLowerCase().trim();
            const role = document.getElementById('manualRoleSelect').value;
            if(!email) return alert("يرجى إدخال البريد الإلكتروني");
            
            db.collection("authorized_users").add({ email: email, role: role })
            .then(() => {
                document.getElementById('manualEmailInput').value = "";
                alert("✅ تم تفعيل صلاحية " + email + " بنجاح.");
            }).catch(e => alert("❌ خطأ: " + e.message));
        }

        function renderUsers() {
            let pendingHtml = cloudPending.map(u => `
                <div class="user-row" style="border-right-color:#ef4444; background:#fff1f2;">
                    <div class="flex flex-col text-right"><span class="font-bold text-xs">${u.email}</span><select id="role_${u.id}" class="role-selector text-right"><option value="assistant">مساعد مشرف</option><option value="supervisor">متابعة الفروع</option></select></div>
                    <div class="flex gap-2"><button onclick="rejectUser('${u.id}')" class="bg-red-100 text-red-600 font-bold text-[10px] px-3 py-2 rounded-xl">رفض</button><button onclick="approveUser('${u.id}', '${u.email}')" class="bg-green-600 text-white font-bold text-[10px] px-4 py-2 rounded-xl">موافقة</button></div>
                </div>`).join('');

            let activeHtml = cloudUsers.map(u => `
                <div class="user-row">
                    <div class="flex flex-col text-right"><span class="font-bold text-xs text-gray-700">${u.email}</span><span class="text-[9px] text-blue-600 font-bold uppercase italic">${u.role === 'assistant' ? 'مساعد مشرف' : u.role === 'quality' ? 'مشرف جودة' : 'مشرف فروع'}</span></div>
                    <button onclick="if(confirm('سحب؟')) db.collection('authorized_users').doc('${u.id}').delete()" class="text-red-400 font-bold text-[10px] bg-red-50 px-3 py-1 rounded-lg">سحب</button>
                </div>`).join('');

            document.getElementById('usersList').innerHTML = `<div class="mb-10 text-right"><h4 class="text-[11px] font-bold text-red-500 mb-3 uppercase tracking-widest text-right">طلبات قيد الانتظار (${cloudPending.length})</h4>${pendingHtml || '<p class="text-[9px] text-gray-400 text-right">لا توجد طلبات جديدة.</p>'}</div><hr class="mb-10 border-gray-100"><div class="text-right text-right"><h4 class="text-[11px] font-bold text-green-600 mb-3 uppercase tracking-widest text-right">المشرفين النشطين (${cloudUsers.length})</h4>${activeHtml}</div>`;
        }

        function approveUser(docId, email) {
            const role = document.getElementById('role_' + docId).value;
            db.collection("authorized_users").add({ email: email.toLowerCase().trim(), role: role })
            .then(() => db.collection("pending_authorizations").doc(docId).delete());
        }

        function rejectUser(docId) { if(confirm("حذف الطلب؟")) db.collection("pending_authorizations").doc(docId).delete(); }

        function updateUI() {
            document.getElementById('reportCount').innerText = cloudReports.length;
            if(cloudReports.length > 0) {
                let sum = cloudReports.reduce((acc, curr) => acc + (parseFloat(curr.score) || 0), 0);
                document.getElementById('totalScore').innerText = fixNums(Math.round(sum / cloudReports.length)) + "%";
            }
        }

        function navigateTo(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-[#d1ba89]', 'text-white/40'));
            const btnId = 'nav-' + id.replace('Page','');
            if(document.getElementById(btnId)) document.getElementById(btnId).classList.replace('text-white/40', 'text-[#d1ba89]');
        }

        startSync();
    </script>
</body>
</html>
