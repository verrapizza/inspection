<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VERRA PRO - الإدارة المركزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <!-- مكتبة الـ PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none; }
        .verra-card { background: white; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; display: none; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; height: 92vh; border-radius: 40px 40px 0 0; padding: 25px; overflow-y: auto; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; position: sticky; top: -10px; background: white; z-index: 20; }
        .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
        .delete-btn { color: #ef4444; padding: 8px; border-radius: 12px; background: #fff1f2; border: 1px solid #ffe4e6; }
        .user-row { background: white; padding: 15px; border-radius: 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-right: 6px solid #d1ba89; }
    </style>
</head>
<body class="pb-32 text-right">

    <div id="lockScreen" class="fixed inset-0 bg-white z-[500] flex flex-col items-center justify-center font-bold text-[#004b47]">
        <div class="w-12 h-12 border-4 border-t-green-500 border-gray-200 rounded-full animate-spin mb-4"></div>
        جاري مزامنة النظام...
    </div>

    <!-- الصفحة الرئيسية -->
    <div id="dashboardPage" class="page text-right">
        <header class="bg-[#004b47] p-10 pb-28 rounded-b-[60px] text-white shadow-2xl relative">
            <h1 class="text-3xl font-black italic uppercase tracking-tighter">Verra <span class="text-[#d1ba89]">Pro</span></h1>
            <p class="text-[10px] opacity-70 font-bold tracking-widest uppercase">Admin Management</p>
        </header>
        <main class="px-6 -mt-16 relative z-10">
            <div class="grid grid-cols-2 gap-4 mb-8 text-center text-right">
                <div class="verra-card p-6 border-b-4 border-green-600 shadow-lg text-right"><p class="text-gray-400 text-[10px] font-bold mb-1">الامتثال</p><h2 id="totalScore" class="text-3xl font-black text-green-700">--</h2></div>
                <div onclick="navigateTo('reportsPage')" class="verra-card p-6 border-b-4 border-blue-600 shadow-lg text-right"><p class="text-gray-400 text-[10px] font-bold mb-1 text-right">التقارير</p><h2 id="reportCount" class="text-3xl font-black text-blue-700">0</h2></div>
            </div>
            <div class="verra-card p-7 mb-4 border-r-[12px] border-[#004b47] shadow-xl italic" onclick="window.location.href='inspection.html'"><h3 class="font-black text-gray-800 text-lg">🛡️ تفتيش الجودة</h3></div>
            <div class="verra-card p-7 mb-4 border-r-[12px] border-blue-600 shadow-xl italic" onclick="window.location.href='branches-inspector.html'"><h3 class="font-black text-gray-800 text-lg">🏢 إشراف الفروع</h3></div>
            <div class="verra-card p-7 mb-4 border-r-[12px] border-[#d1ba89] shadow-xl italic" onclick="navigateTo('usersPage')"><h3 class="font-black text-gray-800 text-lg">👤 إدارة المستخدمين</h3><p id="pendingBadge" class="text-[9px] text-red-500 font-bold hidden mt-1">توجد طلبات جديدة ⚠️</p></div>
        </main>
    </div>

    <!-- سجل التقارير -->
    <div id="reportsPage" class="page hidden px-6 pt-10">
        <div class="flex justify-between items-center mb-8"><h2 class="text-2xl font-black text-[#004b47] italic underline decoration-[#d1ba89]">سجل التقارير</h2><button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full text-xs font-black shadow-sm border">رجوع</button></div>
        <div id="reportsList" class="space-y-4 pb-24"></div>
    </div>

    <!-- إدارة المستخدمين -->
    <div id="usersPage" class="page hidden px-6 pt-10">
        <div class="flex justify-between items-center mb-8"><h2 class="text-2xl font-black text-[#004b47]">الصلاحيات</h2><button onclick="navigateTo('dashboardPage')" class="bg-white p-3 rounded-full border">إغلاق</button></div>
        <div id="usersList" class="space-y-6 pb-24"></div>
    </div>

    <!-- نافذة المعاينة والتحميل -->
    <div id="reportDetailModal" class="modal text-right">
        <div class="modal-content text-right">
            <div class="modal-header"><button onclick="closeModal()" class="bg-red-50 text-red-500 w-10 h-10 rounded-full font-black flex items-center justify-center shadow-sm">X</button><h3 class="text-2xl font-black text-green-950 italic">تفاصيل التقرير</h3></div>
            <div id="detailBody" class="space-y-5 text-right"></div>
            <div class="mt-10 pb-10 border-t pt-8">
                <button id="downloadBtn" class="w-full verra-gradient text-white p-5 rounded-3xl font-black shadow-xl flex justify-center items-center gap-3 active:scale-95 transition-all text-right">
                    <span id="btnText">📄 تحميل PDF التقرير الكامل</span>
                </button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-[#004b47] text-white flex justify-around p-5 z-50 rounded-t-[45px] shadow-2xl border-t border-white/10 text-right">
        <button onclick="navigateTo('dashboardPage')" id="nav-dashboard" class="flex flex-col items-center text-[#d1ba89]"><span class="text-2xl text-right">🏠</span><span class="text-[9px] font-black mt-1 uppercase text-right">Main</span></button>
        <button onclick="navigateTo('reportsPage')" id="nav-reports" class="flex flex-col items-center text-white/40"><span class="text-2xl">📊</span><span class="text-[9px] font-black mt-1 uppercase">Logs</span></button>
        <button onclick="navigateTo('usersPage')" id="nav-users" class="flex flex-col items-center text-white/40"><span class="text-2xl">👤</span><span class="text-[9px] font-black mt-1 uppercase">Users</span></button>
    </nav>

    <script>
        const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";
        const firebaseConfig = { apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0", authDomain: "verra-system-828f2.firebaseapp.com", projectId: "verra-system-828f2", storageBucket: "verra-system-828f2.firebasestorage.app", messagingSenderId: "961104891607", appId: "1:961104891607:web:5ffd3af4983a8b015b6a92" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let cloudReports = []; let cloudUsers = []; let cloudPending = [];

        // حماية الآدمن
        auth.onAuthStateChanged(user => {
            if (user && user.email === "ch3f.ramzi@gmail.com") { document.getElementById('lockScreen').classList.add('hidden'); startSync(); } 
            else { window.location.href = "branches-inspector.html"; }
        });

        function fixNums(s) { return s ? s.toString().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)) : "0"; }

        // --- مصفوفات البيانات لإعادة بناء التقرير ---
        const sectionsQuality = [{title:"الاستلام والتخزين",items:[{id:1,q:"فحص درجات حرارة المواد الغذائية الواردة عند التسليم"},{id:2,q:"درجة حرارة المجمدات لا تتجاوز -18°م عند الاستلام"},{id:3,q:"درجة حرارة المبردات لا تتجاوز 4°م عند الاستلام"},{id:4,q:"استخدام مقياس حرارة معاير للأغذية عالية الخطورة"},{id:5,q:"نقل الأغذية المبردة إلى التخزين خلال أقل من 20 دقيقة"},{id:6,q:"مطابقة المنتجات للمواصفات القياسية السعودية"},{id:7,q:"اللحوم الطازجة من مسالخ معتمدة ومختومة رسمياً"},{id:8,q:"التعبئة سليمة وخالية من الآفات أو التلف"},{id:9,q:"التحقق من تواريخ الصلاحية وتسجيلها عند الاستلام"},{id:10,q:"أماكن التخزين نظيفة وجافة وجيدة التهوية"}]},{title:"تحضير الأغذية",items:[{id:11,q:"مراجعة ومتابعة بروسيس تحضير العجين"},{id:12,q:"متابعة بروسيس تكوير العجين"},{id:13,q:"مراجعة تحضير الصوصات"},{id:14,q:"فصل مناطق تحضير الأغذية النيئة عن المطبوخة"},{id:15,q:"منع التلوث الخلطي أثناء التحضير"},{id:16,q:"إذابة الأغذية في الثلاجة أو تحت ماء بارد جارٍ"},{id:17,q:"عدم ترك الأغذية المحضرة في حرارة الغرفة > ساعتين"},{id:18,q:"وصول درجات حرارة الطهي لـ (≥75°م)"},{id:19,q:"إعادة التسخين لدرجة حرارة لا تقل عن 75°م"},{id:20,q:"استخدام لوحات تقطيع ملونة لأنواع مختلفة"},{id:21,q:"ارتداء القفازات عند لمس الأغذية الجاهزة"}]}]; // استكملها للـ 74 في نسختك
        const sectionsBranches = [{title:"قسم الواجهة والصالات",items:[{id:1,q:"تشيك قسم واجهة المطعم"},{id:2,q:"تشيك قسم صالة 1"},{id:3,q:"تشيك الحمام صالة 1"},{id:4,q:"تشيك قسم صالة 2"},{id:5,q:"تشيك الحمام صالة 2"}]},{title:"قسم الإدارة والتشغيل",items:[{id:6,q:"تشيك قسم الكاشير"},{id:7,q:"متابعة قوقل ماب"},{id:8,q:"التشيك على الأشجار"},{id:9,q:"كشف الحضور"},{id:10,q:"الاجتماع اليومي"},{id:11,q:"متابعة مهام المشرفين"}]}]; // استكملها للـ 17 في نسختك

        function startSync() {
            db.collection("inspections").onSnapshot(snap => {
                cloudReports = snap.docs.map(doc => ({ docId: doc.id, ...doc.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                updateUI();
            });
            db.collection("authorized_users").onSnapshot(snap => { cloudUsers = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderUsers(); });
            db.collection("pending_authorizations").onSnapshot(snap => { cloudPending = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); document.getElementById('pendingBadge').style.display = cloudPending.length > 0 ? 'block' : 'none'; renderUsers(); });
        }

        function updateUI() {
            document.getElementById('reportCount').innerText = fixNums(cloudReports.length);
            if(cloudReports.length > 0) {
                let sum = cloudReports.reduce((acc, curr) => acc + (parseFloat(curr.score) || 0), 0);
                document.getElementById('totalScore').innerText = fixNums(Math.round(sum / cloudReports.length)) + "%";
            }
            renderReportsList();
        }

        function renderReportsList() {
            const list = document.getElementById('reportsList');
            list.innerHTML = cloudReports.map((r, i) => `
                <div onclick="viewDetail(${i})" class="verra-card p-6 border-r-8 ${r.score < 70 ? 'border-red-500' : 'border-green-500'} mb-4 active:scale-95 shadow-md text-right">
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-black text-gray-800 text-lg">${r.branch || 'تقرير'}</h4>
                        <button onclick="event.stopPropagation(); if(confirm('حذف؟')) db.collection('inspections').doc('${r.docId}').delete()" class="delete-btn text-right">🗑️</button>
                    </div>
                    <p class="text-[11px] text-gray-400 font-bold mb-1">📅 ${fixNums(r.date)} | المشرف: ${r.inspector ? r.inspector.split('@')[0] : '---'}</p>
                    <span class="text-xs font-black ${r.score < 70 ? 'text-red-600' : 'text-green-600'}">${fixNums(r.score)}% مطابق</span>
                </div>`).join('');
        }

        function viewDetail(idx) {
            const r = cloudReports[idx];
            const isBranch = r.type && r.type.includes("Branch");
            document.getElementById('detailBody').innerHTML = `
                <div class="verra-card p-6 border border-gray-100 text-center mb-4">
                    <h2 class="text-2xl font-black text-[#004b47] mb-2 uppercase">${r.branch || '---'}</h2>
                    <div class="grid grid-cols-2 gap-4 text-xs font-bold py-4 border-t border-b my-4">
                        <div><p class="text-gray-400 mb-1">📅 التاريخ</p><p>${fixNums(r.date)}</p></div>
                        <div><p class="text-gray-400 mb-1 text-right">👤 المفتش</p><p class="text-right">${r.inspector || '---'}</p></div>
                    </div>
                    <div class="flex justify-between px-10">
                        <span class="font-bold text-gray-500 italic">الامتثال العام:</span>
                        <span class="text-3xl font-black ${r.score < 70 ? 'text-red-500' : 'text-green-600'}">${fixNums(r.score)}%</span>
                    </div>
                </div>`;
            
            // ربط زر التحميل بالمحرك الفعلي
            document.getElementById('downloadBtn').onclick = () => generateFullPDF(r);
            document.getElementById('reportDetailModal').classList.add('active');
        }

        // --- محرك الـ PDF الكامل والمصلح ---
        function generateFullPDF(r) {
            document.getElementById('btnText').innerText = "جاري البناء... ⏳";
            const isBranch = r.type && r.type.includes("Branch");
            const targetSections = isBranch ? sectionsBranches : sectionsQuality;
            
            let contentHtml = targetSections.map(sec => `
                <div style="background:#e8f5ee; padding:12px; border-right:8px solid #d1ba89; color:#004b47; font-weight:900; margin-top:30px; text-align:right; font-size:18px;">${sec.title}</div>
                ${sec.items.map(i => {
                    const ans = r.answers ? r.answers[i.id] : 'na';
                    const note = r.notes ? r.notes[i.id] : '';
                    const pics = (r.photos && r.photos[i.id]) ? r.photos[i.id] : [];
                    let status = ans === 'yes' ? '✅ مطابق / Yes' : ans === 'no' ? '❌ مخالف / No' : '🔘 N/A';
                    let color = ans === 'yes' ? '#059669' : ans === 'no' ? '#dc2626' : '#64748b';
                    return `<div style="padding:15px; border-bottom:1px solid #f1f5f9; text-align:right; page-break-inside:avoid;">
                        <p style="margin:0; font-weight:900; font-size:15px; color:#1e293b; white-space: pre-line;">${fixNums(i.id)}. ${i.q}</p>
                        <p style="font-size:13px; margin:8px 0; font-weight:bold; color:${color};">الحالة: ${status}</p>
                        ${note ? `<div style="background:#fffbeb; padding:10px; border-radius:8px; font-size:12px; border:1px solid #fde68a; margin:10px 0;">الملاحظة: ${note}</div>` : ''}
                        <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;">${pics.map(p => `<img src="${p}" style="width:200px; height:150px; border-radius:12px; object-fit:cover; border:1px solid #e2e8f0;" />`).join('')}</div>
                    </div>`;
                }).join('')}
            `).join('');

            const html = `<div style="width:800px; margin:0 auto; padding:40px; background:white; font-family:'Cairo'; direction:rtl; box-sizing:border-box; text-align:right;">
                <div style="text-align:center; border-bottom:5px solid #004b47; padding-bottom:25px; margin-bottom:40px;">
                    <img src="${LOGO_URL}" style="height:120px; margin-bottom:15px;" />
                    <h1 style="color:#004b47; margin:0; font-size:32px; font-weight:900;">تقرير تدقيق VERRA PRO الشامل</h1>
                </div>
                <div style="background:#f8fafc; padding:30px; border-radius:20px; border:1px solid #e2e8f0; display:flex; justify-content:space-between; margin-bottom:40px; text-align:right;">
                    <div style="flex:1; line-height:2.2; text-align:right;">
                        <p><b>🏢 الفرع:</b> ${r.branch}</p>
                        <p><b>👤 المشرف:</b> ${r.inspector}</p>
                        <p><b>📅 التاريخ:</b> ${fixNums(r.date)}</p>
                    </div>
                    <div style="width:180px; text-align:center; border-right:3px solid #004b47; padding-right:25px;">
                         <p style="font-size:12px; font-weight:900; color:#64748b;">الامتثال</p>
                         <div style="font-size:50px; font-weight:900; color:${r.score >= 70 ? '#059669':'#dc2626'};">${fixNums(r.score)}%</div>
                    </div>
                </div>
                ${contentHtml}
                <div style="margin-top:60px; border-top:3px solid #004b47; pt:30px; text-align:left;">
                    <p style="font-weight:900; color:#004b47;">التوقيع المعتمد:</p>
                    <img src="${r.signature}" style="width:300px; border-bottom:2px solid #004b47;" />
                </div>
            </div>`;

            html2pdf().from(html).set({ margin:0, filename:`Verra_Full_Report.pdf`, html2canvas:{scale:2, useCORS:true}, jsPDF:{unit:'mm', format:'a4'} }).save().then(() => {
                document.getElementById('btnText').innerText = "📄 تحميل PDF التقرير الكامل";
            });
        }

        function approveUser(docId, email) {
            db.collection("authorized_users").add({ email: email, role: "supervisor" }).then(() => {
                db.collection("pending_authorizations").doc(docId).delete();
                alert("✅ تم التفعيل.");
            });
        }

        function renderUsers() {
            let pendingHtml = cloudPending.map(u => `<div class="user-row" style="border-right-color:#ef4444; background:#fff1f2;"><div class="flex flex-col"><span class="font-bold text-xs">${u.email}</span><span class="text-[8px] text-red-500 uppercase tracking-widest italic">طلب جديد</span></div><button onclick="approveUser('${u.id}', '${u.email}')" class="bg-green-600 text-white font-bold text-[10px] px-4 py-2 rounded-xl">موافقة</button></div>`).join('');
            let activeHtml = cloudUsers.map(u => `<div class="user-row"><span class="font-bold text-xs">${u.email}</span><button onclick="db.collection('authorized_users').doc('${u.id}').delete()" class="text-red-500 font-bold text-[10px]">سحب</button></div>`).join('');
            document.getElementById('usersList').innerHTML = `<div class="mb-10 text-right"><h4 class="text-[10px] font-bold text-red-500 mb-3 uppercase tracking-widest text-right">قيد الانتظار</h4>${pendingHtml || '<p class="text-[9px] text-gray-400 text-right">لا توجد طلبات.</p>'}</div><hr class="mb-10 text-right"><div class="text-right text-right"><h4 class="text-[10px] font-bold text-green-600 mb-3 uppercase tracking-widest text-right text-right text-right">المشرفين</h4>${activeHtml}</div>`;
        }

        function navigateTo(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-[#d1ba89]', 'text-white/40'));
            const btnId = 'nav-' + id.replace('Page','');
            if(document.getElementById(btnId)) document.getElementById(btnId).classList.replace('text-white/40', 'text-[#d1ba89]');
            if(id === 'reportsPage') renderReportsList();
        }
        function closeModal() { document.getElementById('reportDetailModal').classList.remove('active'); }
    </script>
</body>
</html>
