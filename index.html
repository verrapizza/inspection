<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VERRA PRO - Final Fixed Edition</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Inter', 'Noto Naskh Arabic', sans-serif; background: #f0f7f4; color: #1a4d36; margin: 0; padding: 0; }
    .header-grad { background: linear-gradient(135deg, #004b47 0%, #003d3a 100%); color: white; }
    .progress-sticky { position: sticky; top: 0; z-index: 50; background: white; border-bottom: 2px solid #d1ba89; padding: 15px; }
    .section-card { background: white; border-radius: 15px; margin-bottom: 12px; border: 1px solid #c8ddd3; overflow: hidden; }
    .section-header { background: #e8f5ee; padding: 12px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .item-card { padding: 15px; border-bottom: 1px solid #f1f5f9; background: white; }
    .answer-btn { width: 52px; height: 38px; border-radius: 8px; font-size: 11px; font-weight: bold; background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; }
    .btn-yes.active { background: #22c55e !important; color: white; }
    .btn-no.active { background: #ef4444 !important; color: white; }
    .btn-na.active { background: #64748b !important; color: white; }
    .notes-area { width: 100%; margin-top: 10px; padding: 10px; border-radius: 8px; border: 1px solid #fde68a; background: #fffbeb; font-size: 13px; }
    .photo-box { position: relative; display: inline-block; margin: 5px; }
    .photo-img { width: 70px; height: 70px; object-fit: cover; border-radius: 10px; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .del-img-btn { position: absolute; top: -6px; right: -6px; background: #ef4444; color: white; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white; cursor: pointer; }
    .upload-btn { background: #e8f5ee; color: #004b47; padding: 8px 12px; border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .sig-canvas { border: 2px dashed #cbd5e1; background: #fff; border-radius: 12px; width: 100%; height: 180px; touch-action: none; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
      authDomain: "verra-system-828f2.firebaseapp.com",
      projectId: "verra-system-828f2",
      storageBucket: "verra-system-828f2.firebasestorage.app",
      messagingSenderId: "961104891607",
      appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const inspectionData = [
      { id: 'S1', title: 'الاستلام والتخزين', items: [
        { id: 1, q: 'فحص درجات حرارة المواد الغذائية الواردة عند التسليم' },
        { id: 2, q: 'درجة حرارة المجمدات لا تتجاوز -18°م عند الاستلام' },
        { id: 3, q: 'درجة حرارة المبردات لا تتجاوز 4°م عند الاستلام' },
        { id: 4, q: 'استخدام مقياس حرارة معاير للأغذية عالية الخطورة' },
        { id: 5, q: 'نقل الأغذية المبردة إلى التخزين خلال أقل من 20 دقيقة' },
        { id: 6, q: 'مطابقة المنتجات للمواصفات القياسية السعودية' },
        { id: 7, q: 'اللحوم الطازجة من مسالخ معتمدة ومختومة رسمياً' },
        { id: 8, q: 'التعبئة سليمة وخالية من الآفات أو التلف' },
        { id: 9, q: 'التحقق من تواريخ الصلاحية وتسجيلها عند الاستلام' },
        { id: 10, q: 'أماكن التخزين نظيفة وجافة وجيدة التهوية' }
      ]},
      { id: 'S2', title: 'تحضير الأغذية', items: [
        { id: 11, q: 'مراجعة ومتابعة بروسيس تحضير العجين' },
        { id: 12, q: 'متابعة بروسيس تكوير العجين' },
        { id: 13, q: 'مراجعة تحضير الصوصات' },
        { id: 14, q: 'فصل مناطق تحضير الأغذية النيئة عن المطبوخة' },
        { id: 15, q: 'منع التلوث الخلطي أثناء التحضير' },
        { id: 16, q: 'إذابة الأغذية في الثلاجة أو تحت ماء بارد جارٍ' },
        { id: 17, q: 'عدم ترك الأغذية المحضرة في حرارة الغرفة > ساعتين' },
        { id: 18, q: 'وصول درجات حرارة الطهي لـ (≥75°م)' },
        { id: 19, q: 'إعادة التسخين لدرجة حرارة لا تقل عن 75°م' },
        { id: 20, q: 'استخدام لوحات تقطيع ملونة لأنواع مختلفة' },
        { id: 21, q: 'ارتداء القفازات عند لمس الأغذية الجاهزة' }
      ]},
      { id: 'S3', title: 'جودة المنتج', items: [
        { id: 22, q: 'معاينة جودة المنتج النهائي (قسم الباستا)' },
        { id: 23, q: 'معاينة جودة المنتج النهائي (قسم البيتزا)' },
        { id: 24, q: 'رفع صورة المنتج النهائي على الواتساب' }
      ]},
      { id: 'S4', title: 'المنشأة والبيئة', items: [
        { id: 25, q: 'المنشأة تقع بعيداً عن مصادر التلوث' },
        { id: 26, q: 'خلو الجدران والأرضيات والأسقف من التشققات' },
        { id: 27, q: 'الأبواب محكمة الإغلاق وتغلق تلقائياً' },
        { id: 28, q: 'النوافذ مزودة بشبكات معدنية سليمة' },
        { id: 29, q: 'ميل مناسب للصرف في جميع المناطق' },
        { id: 30, q: 'أجهزة التكييف فعالة وتعمل بشكل صحيح' },
        { id: 31, q: 'وجود شفاطات فوق الأفران والشوايات' },
        { id: 32, q: 'إضاءة كافية في جميع مناطق التعامل مع الأغذية' },
        { id: 33, q: 'الأرضيات مقاومة للماء وغير زلقة' }
      ]},
      { id: 'S5', title: 'التنظيف والتعقيم', items: [
        { id: 34, q: 'جدول التنظيف موثق ويتم اتباعه' },
        { id: 35, q: 'المطهرات آمنة وبالتركيزات الصحيحة' },
        { id: 36, q: 'تنظيف وتعقيم المعدات بعد كل استخدام' },
        { id: 37, q: 'التنظيف العميق يومياً لجميع الأسطح' },
        { id: 38, q: 'حاويات النفايات تفتح بالقدم وتفرغ بانتظام' },
        { id: 39, q: 'التخلص من النفايات يمنع تلوث المياه' },
        { id: 40, q: 'عقد مكافحة آفات ساري مع شركة متخصصة' },
        { id: 41, q: 'عدم وجود دلائل على القوارض أو الحشرات' }
      ]},
      { id: 'S6', title: 'النظافة الشخصية', items: [
        { id: 42, q: 'جميع العاملين يرتدون زياً نظيفاً وأغطية للشعر' },
        { id: 43, q: 'ارتداء الكمامات في مناطق الأغذية القابلة للتلف' },
        { id: 44, q: 'محطات غسل اليدين مزودة بالصابون والماء الساخن' },
        { id: 45, q: 'غسل اليدين قبل التعامل مع الأغذية وبعد الاستراحة' },
        { id: 46, q: 'عدم ارتداء المجوهرات أو طلاء الأظافر' },
        { id: 47, q: 'فحوصات طبية قبل التوظيف' },
        { id: 48, q: 'فحوصات طبية روتينية سنوية' },
        { id: 49, q: 'استبعاد العاملين المصابين بالأمراض المعدية' }
      ]},
      { id: 'S7', title: 'المعدات والأدوات', items: [
        { id: 50, q: 'المعدات مصنوعة من مواد مقاومة للتآكل' },
        { id: 51, q: 'مقاييس الحرارة معايرة وتعمل بشكل صحيح' },
        { id: 52, q: 'الثلاجات والمجمدات تحافظ على الحرارة' },
        { id: 53, q: 'تسجيل سجلات درجة الحرارة مرتين يومياً' },
        { id: 54, q: 'صيانة وتنظيف معدات الطهي بانتظام' },
        { id: 55, q: 'أسطح ملامسة للأغذية ناعمة وبدون شقوق' }
      ]},
      { id: 'S8', title: 'التتبع والتوثيق', items: [
        { id: 56, q: 'الالتزام بسجلات مراقبة الجودة' },
        { id: 57, q: 'رفع لوائح التشييك يومياً على الواتساب' },
        { id: 58, q: 'دليل تتبع الأغذية متاح وكامل' },
        { id: 59, q: 'الاحتفاظ بسجلات التتبع 180 يوماً' },
        { id: 60, q: 'ترميز المنتجات لتحديد الدفعة والتاريخ' },
        { id: 61, q: 'سجلات اعتماد الموردين والشهادات' },
        { id: 62, q: 'جميع العاملين يحملون شهادات صحية' },
        { id: 63, q: 'خطة HACCP موثقة ومعتمدة' },
        { id: 64, q: 'سجلات التنظيف والتعقيم محدثة' },
        { id: 65, q: 'الاحتفاظ بسجلات مراقبة درجة الحرارة' }
      ]},
      { id: 'S9', title: 'إمداد المياه والسباكة', items: [
        { id: 66, q: 'إمداد مياه الشرب كافٍ ونظيف' },
        { id: 67, q: 'تركيب وصيانة فلاتر المياه' },
        { id: 68, q: 'عدم وجود تسربات في مواسير الصرف' },
        { id: 69, q: 'إغلاق فتحات الصرف أثناء العمل' },
        { id: 70, q: 'أحواض غسل اليدين بها أجهزة تجفيف' }
      ]},
      { id: 'S10', title: 'إدارة مسببات الحساسية', items: [
        { id: 71, q: 'معلومات الحساسية كاملة على الملصقات' },
        { id: 72, q: 'مناطق تحضير منفصلة للأصناف الخاصة' },
        { id: 73, q: 'أدوات مخصصة لتحضير الأغذية الخاصة' },
        { id: 74, q: 'تدريب الموظفين على مسببات الحساسية' }
      ]}
    ];

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [branch, setBranch] = useState("");
      const [answers, setAnswers] = useState({});
      const [notes, setNotes] = useState({});
      const [photos, setPhotos] = useState({});
      const [expanded, setExpanded] = useState(new Set(['S1']));
      const canvasRef = useRef(null);
      const sigPad = useRef(null);

      useEffect(() => {
        auth.onAuthStateChanged(u => { setUser(u); setLoading(false); });
      }, []);

      useEffect(() => {
        if (user && canvasRef.current) {
          sigPad.current = new SignaturePad(canvasRef.current);
        }
      }, [user, loading]);

      const getScore = () => {
        const yes = Object.values(answers).filter(v => v === 'yes').length;
        const na = Object.values(answers).filter(v => v === 'na').length;
        const total = Object.keys(answers).length - na;
        return total > 0 ? Math.round((yes / total) * 100) : 0;
      };

      const handlePhoto = (id, e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setPhotos(prev => ({...prev, [id]: [...(prev[id] || []), ev.target.result].slice(0,3)}));
        };
        reader.readAsDataURL(file);
        e.target.value = "";
      };

      const downloadPDF = () => {
        const score = getScore();
        const scoreColor = score >= 90 ? '#16a34a' : score >= 70 ? '#ca8a04' : '#dc2626';
        const signature = sigPad.current ? sigPad.current.toDataURL() : "";

        // بناء التقرير في حاوية مؤقتة منفصلة تماماً عن الـ DOM الحالي
        const printContainer = document.createElement('div');
        printContainer.style.width = '800px';
        printContainer.style.padding = '40px';
        printContainer.style.background = 'white';
        printContainer.style.direction = 'rtl';
        printContainer.style.position = 'absolute';
        printContainer.style.left = '-9999px';
        document.body.appendChild(printContainer);

        printContainer.innerHTML = `
          <div style="text-align:center; border-bottom: 5px solid #004b47; padding-bottom: 20px;">
            <h1 style="color:#004b47; font-size:32px; margin:0">تقرير فحص سلامة وجودة الأغذية</h1>
            <p style="font-size:18px; margin:10px 0">المنشأة: <b>${branch || 'غير محدد'}</b></p>
            <p>التاريخ: ${new Date().toLocaleDateString('ar-EG')} | المفتش: ${user.email}</p>
            <div style="background:${scoreColor}; color:white; padding:15px 40px; border-radius:10px; display:inline-block; margin-top:10px">
              <h2 style="margin:0">درجة الامتثال الكلية: ${score}%</h2>
            </div>
          </div>
          <div style="margin-top:30px">
            ${inspectionData.map(s => `
              <div style="background:#e8f5ee; padding:12px; font-weight:bold; border-right:6px solid #004b47; margin-top:20px; font-size:18px">
                ${s.title}
              </div>
              ${s.items.map(i => {
                const ans = answers[i.id];
                const note = notes[i.id];
                const itemPhotos = photos[i.id] || [];
                return `
                  <div style="padding:15px; border-bottom:1px solid #eee; page-break-inside: avoid">
                    <p style="margin:0 0 8px 0; font-size:15px"><b>${i.id}. ${i.q}</b></p>
                    <p style="margin:0; font-size:14px">الحالة: ${ans === 'yes' ? '<span style="color:green">✅ مطابق</span>' : ans === 'no' ? '<span style="color:red">❌ مخالف</span>' : '⚪ N/A'}</p>
                    ${note ? `<p style="margin:10px 0; font-size:13px; color:#713f12; background:#fefce8; padding:10px; border-radius:5px; border:1px solid #fde68a">الملاحظة: ${note}</p>` : ''}
                    <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:12px">
                      ${itemPhotos.map(p => `<img src="${p}" style="width:200px; height:150px; object-fit:cover; border-radius:8px; border:1px solid #ccc" />`).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            `).join('')}
          </div>
          <div style="margin-top:50px; border-top: 2px solid #eee; padding-top:30px; display:flex; justify-content:space-between; align-items:flex-end">
             <div style="text-align:center">
                <p style="font-weight:bold; margin-bottom:10px">توقيع المفتش</p>
                ${signature ? `<img src="${signature}" style="width:200px; border-bottom:2px solid #000" />` : '<div style="height:80px"></div>'}
                <p style="margin-top:5px; font-size:12px">${user.email}</p>
             </div>
             <div style="text-align:left; color:#999; font-size:11px">
                توليد آلي عبر نظام فيرا PRO <br/> الرقم المرجعي: ${Date.now()}
             </div>
          </div>
        `;

        const options = {
          margin: [10, 10, 10, 10],
          filename: `VERRA_${branch || 'Report'}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, scrollY: 0, scrollX: 0 },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        html2pdf().set(options).from(printContainer).toPdf().get('pdf').then(() => {
          document.body.removeChild(printContainer); // تنظيف الـ DOM بعد الانتهاء
        }).save();
      };

      if (loading) return <div className="h-screen flex items-center justify-center italic text-green-900 animate-pulse">جاري التحميل...</div>;
      if (!user) return <Login auth={auth} />;

      return (
        <div className="pb-40">
          <header className="header-grad p-6 text-center shadow-xl">
             <img src="https://chef-ayo.github.io/verra-food-safety-inspector/logo.png" className="h-14 mx-auto mb-3" />
             <h1 className="text-xl font-bold italic tracking-widest text-[#d1ba89]">VERRA PRO CLOUD</h1>
          </header>

          <div className="progress-sticky shadow-md flex justify-between items-center">
             <div>
                <p className="text-[10px] font-bold text-gray-400">التقدم: {Object.keys(answers).length}/74</p>
                <p className="text-2xl font-black text-green-700">{getScore()}%</p>
             </div>
             <div className="flex gap-2">
                <button onClick={() => {if(confirm("مسح الكل؟")) location.reload()}} className="bg-red-500 text-white px-3 py-2 rounded-xl text-[11px] font-bold">Reset</button>
                <button onClick={downloadPDF} className="bg-blue-600 text-white px-4 py-2 rounded-xl text-[11px] font-bold shadow-lg">View Report</button>
             </div>
          </div>

          <main className="p-4 max-w-2xl mx-auto">
             <div className="bg-white p-5 rounded-2xl shadow-sm mb-6 border-b-4 border-green-800">
                <p className="text-[10px] font-bold text-gray-400 mb-1 uppercase tracking-widest">اسم المنشأة:</p>
                <input className="w-full text-lg font-bold outline-none" placeholder="اكتب اسم المطعم..." value={branch} onChange={e=>setBranch(e.target.value)} />
             </div>

             {inspectionData.map(s => (
               <div key={s.id} className="section-card shadow-sm border border-gray-100">
                  <div className="section-header" onClick={()=>{
                    const n = new Set(expanded); n.has(s.id)?n.delete(s.id):n.add(s.id); setExpanded(n);
                  }}>
                    <span className="font-bold text-sm text-green-900">{s.title}</span>
                    <span className="text-xs text-gray-400 font-bold">{expanded.has(s.id)?'إخفاء ▲':'عرض ▼'}</span>
                  </div>
                  
                  {expanded.has(s.id) && s.items.map(i => (
                    <div key={i.id} className="item-card">
                       <div className="flex justify-between items-start mb-3">
                          <p className="text-sm font-bold text-green-950 ml-4 leading-relaxed">{i.id}. {i.q}</p>
                          <div className="flex gap-1">
                             <button onClick={()=>setAnswers({...answers, [i.id]:'yes'})} className={`answer-btn btn-yes ${answers[i.id]==='yes'?'active':''}`}>نعم</button>
                             <button onClick={()=>setAnswers({...answers, [i.id]:'no'})} className={`answer-btn btn-no ${answers[i.id]==='no'?'active':''}`}>لا</button>
                             <button onClick={()=>setAnswers({...answers, [i.id]:'na'})} className={`answer-btn btn-na ${answers[i.id]==='na'?'active':''}`}>N/A</button>
                          </div>
                       </div>
                       <textarea className="notes-area" placeholder="اكتب ملاحظة أو مخالفة..." value={notes[i.id]||""} onChange={e=>setNotes({...notes, [i.id]:e.target.value})} />
                       <div className="mt-4 flex flex-wrap gap-2 items-center">
                          <label className="upload-btn">📷 الكاميرا
                             <input type="file" className="hidden" accept="image/*" capture="environment" onChange={e=>handlePhoto(i.id, e)} />
                          </label>
                          <label className="upload-btn" style={{background:'#eff6ff', color:'#1e40af'}}>🖼️ المعرض
                             <input type="file" className="hidden" accept="image/*" onChange={e=>handlePhoto(i.id, e)} />
                          </label>
                          <div className="flex flex-wrap mt-2">
                             {(photos[i.id] || []).map((img, idx) => (
                                <div key={idx} className="photo-box">
                                   <img src={img} className="photo-img" />
                                   <div className="del-img-btn" onClick={()=>setPhotos(p=>({...p, [i.id]: p[i.id].filter((_,x)=>x!==idx)}))}>×</div>
                                </div>
                             ))}
                          </div>
                       </div>
                    </div>
                  ))}
               </div>
             ))}

             <div className="bg-white p-6 rounded-2xl shadow-sm mt-10 border-2 border-dashed border-gray-300">
                <h3 className="font-bold text-green-900 mb-4 text-center">توقيع المفتش المسؤول</h3>
                <canvas ref={canvasRef} className="sig-canvas"></canvas>
                <button onClick={()=>sigPad.current.clear()} className="text-red-500 text-xs font-bold mt-2 underline">مسح التوقيع</button>
             </div>

             <button onClick={async () => {
                 if(!branch) return alert("أدخل اسم الفرع أولاً");
                 await db.collection("reports").add({ branch, score: getScore(), inspector: user.email, date: new Date().toLocaleDateString('ar-EG'), signature: sigPad.current.toDataURL(), timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                 alert("تم الحفظ في السحابة بنجاح!");
                 location.reload();
               }} className="w-full bg-green-800 text-white font-bold py-5 rounded-2xl shadow-2xl text-xl mt-8 mb-20"
             >إرسال للسحابة</button>
          </main>
        </div>
      );
    }

    function Login({ auth }) {
      const [e, setE] = useState(""); const [p, setP] = useState("");
      return (
        <div className="h-screen bg-[#004b47] flex items-center justify-center p-6">
           <form onSubmit={(ev)=>{ev.preventDefault(); auth.signInWithEmailAndPassword(e, p).catch(err=>alert(err.message))}} className="bg-white p-8 rounded-[40px] shadow-2xl w-full max-w-sm text-center">
              <h1 className="text-3xl font-black text-green-900 mb-8 italic">VERRA PRO</h1>
              <input className="w-full border-2 p-4 rounded-2xl mb-4 text-right outline-none focus:border-green-600" placeholder="البريد الإلكتروني" onChange={v=>setE(v.target.value)} />
              <input className="w-full border-2 p-4 rounded-2xl mb-8 text-right outline-none focus:border-green-600" type="password" placeholder="كلمة المرور" onChange={v=>setP(v.target.value)} />
              <button type="submit" className="w-full bg-green-800 text-white font-bold py-4 rounded-2xl shadow-lg transition duration-200">دخول النظام السحابي</button>
           </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
