<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام فيرا PRO - المفتش الميداني</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f1f5f9; color: #1e293b; margin: 0; padding: 0; }
    .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    .gold-text { color: #d1ba89; }
    .inspector-card { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 1rem; padding: 10px 15px; }
    .section-title { background: #e8f5ee; border-right: 6px solid #d1ba89; padding: 15px; border-radius: 12px; font-weight: 900; color: #004b47; margin: 20px 0 10px; }
    .item-card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
    .ans-btn { width: 52px; height: 40px; border-radius: 10px; font-weight: 800; font-size: 11px; background: #f1f5f9; border: 1px solid #e2e8f0; }
    .btn-yes.active { background: #22c55e !important; color: white; border-color: #16a34a; }
    .btn-no.active { background: #ef4444 !important; color: white; border-color: #dc2626; }
    .btn-na.active { background: #64748b !important; color: white; }
    .notes-input { width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid #d1ba89; background: #fffdf5; font-size: 13px; outline: none; }
    .sig-canvas { border: 2px dashed #cbd5e1; border-radius: 15px; background: white; width: 100%; height: 180px; touch-action: none; }
    .photo-thumb { width: 75px; height: 75px; object-fit: cover; border-radius: 10px; border: 2px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .del-btn { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 1px solid white; cursor: pointer; }
    .upload-btn { background: #e8f5ee; color: #004b47; padding: 8px 12px; border-radius: 10px; font-size: 10px; font-weight: bold; cursor: pointer; border: 1px solid #c8ddd3; display: inline-flex; align-items: center; gap: 5px; }
    .sticky-header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-bottom: 2px solid #004b47; padding: 10px 15px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
      authDomain: "verra-system-828f2.firebaseapp.com",
      projectId: "verra-system-828f2",
      storageBucket: "verra-system-828f2.firebasestorage.app",
      messagingSenderId: "961104891607",
      appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // القائمة الكاملة بـ 74 بنداً مقسمة باحترافية
    const checklistData = [
      { title: "الاستلام والتخزين", items: [
        {id:1, q:"فحص درجات حرارة المواد الغذائية الواردة عند التسليم"}, {id:2, q:"درجة حرارة المجمدات لا تتجاوز -18°م عند الاستلام"}, {id:3, q:"درجة حرارة المبردات لا تتجاوز 4°م عند الاستلام"}, {id:4, q:"استخدام مقياس حرارة معاير للأغذية عالية الخطورة"}, {id:5, q:"نقل الأغذية المبردة إلى التخزين خلال أقل من 20 دقيقة"}, {id:6, q:"مطابقة المنتجات للمواصفات القياسية السعودية"}, {id:7, q:"اللحوم الطازجة من مسالخ معتمدة ومختومة رسمياً"}, {id:8, q:"التعبئة سليمة وخالية من الآفات أو التلف"}, {id:9, q:"التحقق من تواريخ الصلاحية وتسجيلها عند الاستلام"}, {id:10, q:"أماكن التخزين نظيفة وجافة وجيدة التهوية"}
      ]},
      { title: "تحضير الأغذية", items: [
        {id:11, q:"مراجعة ومتابعة بروسيس تحضير العجين"}, {id:12, q:"متابعة بروسيس تكوير العجين"}, {id:13, q:"مراجعة تحضير الصوصات"}, {id:14, q:"فصل مناطق تحضير الأغذية النيئة عن المطبوخة"}, {id:15, q:"منع التلوث الخلطي أثناء التحضير"}, {id:16, q:"إذابة الأغذية في الثلاجة أو تحت ماء بارد جارٍ"}, {id:17, q:"عدم ترك الأغذية المحضرة في حرارة الغرفة > ساعتين"}, {id:18, q:"وصول درجات حرارة الطهي لـ (≥75°م)"}, {id:19, q:"إعادة التسخين لدرجة حرارة لا تقل عن 75°م"}, {id:20, q:"استخدام لوحات تقطيع ملونة لأنواع مختلفة"}, {id:21, q:"ارتداء القفازات عند لمس الأغذية الجاهزة"}
      ]},
      { title: "جودة المنتج", items: [
        {id:22, q:"معاينة جودة المنتج النهائي (قسم الباستا)"}, {id:23, q:"معاينة جودة المنتج النهائي (قسم البيتزا)"}, {id:24, q:"رفع صورة المنتج النهائي على الواتساب في كل الفروع"}
      ]},
      { title: "المنشأة والبيئة", items: [
        {id:25, q:"المنشأة تقع بعيداً عن مصادر التلوث"}, {id:26, q:"خلو الجدران والأرضيات والأسقف من التشققات"}, {id:27, q:"الأبواب محكمة الإغلاق وتغلق تلقائياً"}, {id:28, q:"النوافذ مزودة بشبكات معدنية سليمة"}, {id:29, q:"ميل مناسب للصرف في جميع المناطق"}, {id:30, q:"أجهزة التكييف فعالة وتعمل بشكل صحيح"}, {id:31, q:"وجود شفاطات فوق الأفران والشوايات"}, {id:32, q:"إضاءة كافية في جميع مناطق التعامل مع الأغذية"}, {id:33, q:"الأرضيات مقاومة للماء وغير زلقة وسهلة التنظيف"}
      ]},
      { title: "التنظيف والتعقيم", items: [
        {id:34, q:"جدول التنظيف موثق ويتم اتباعه بدقة"}, {id:35, q:"المطهرات آمنة للأغذية وبالتركيزات الصحيحة"}, {id:36, q:"تنظيف وتعقيم المعدات بعد كل استخدام"}, {id:37, q:"التنظيف العميق يومياً لجميع الأسطح الملامسة"}, {id:38, q:"حاويات النفايات تفتح بالقدم وتفرغ بانتظام"}, {id:39, q:"التخلص من النفايات يمنع تلوث المياه أو الأغذية"}, {id:40, q:"عقد مكافحة آفات ساري مع شركة متخصصة"}, {id:41, q:"عدم وجود دلائل على القوارض أو الحشرات"}
      ]},
      { title: "النظافة الشخصية", items: [
        {id:42, q:"جميع العاملين يرتدون زياً نظيفاً وأغطية للشعر"}, {id:43, q:"ارتداء الكمامات في مناطق الأغذية القابلة للتلف"}, {id:44, q:"محطات غسل اليدين مزودة بالصابون والماء الساخن"}, {id:45, q:"غسل اليدين قبل التعامل مع الأغذية وبعد الاستراحة"}, {id:46, q:"عدم ارتداء المجوهرات أو طلاء الأظافر"}, {id:47, q:"فحوصات طبية قبل التوظيف من جهات معتمدة"}, {id:48, q:"فحوصات طبية روتينية سنوية لجميع العاملين"}, {id:49, q:"استبعاد العاملين المصابين بالأمراض المعدية"}
      ]},
      { title: "المعدات والأدوات", items: [
        {id:50, q:"المعدات مصنوعة من مواد مقاومة للتآكل وآمنة"}, {id:51, q:"مقاييس الحرارة معايرة وتعمل بشكل صحيح"}, {id:52, q:"الثلاجات والمجمدات تحافظ على درجات الحرارة المطلوبة"}, {id:53, q:"تسجيل سجلات درجة الحرارة مرتين يومياً على الأقل"}, {id:54, q:"صيانة وتنظيف معدات الطهي بانتظام"}, {id:55, q:"أسطح ملامسة للأغذية ناعمة وخالية من التشققات"}
      ]},
      { title: "التتبع والتوثيق", items: [
        {id:56, q:"الالتزام بسجلات مراقبة الجودة (ديفروست، تعقيم، زيت)"}, {id:57, q:"رفع لوائح التشييك يومياً على مجموعة الواتساب"}, {id:58, q:"دليل تتبع الأغذية متاح وكامل في المنشأة"}, {id:59, q:"الاحتفاظ بسجلات التتبع 180 يوماً بعد الصلاحية"}, {id:60, q:"ترميز المنتجات لتحديد كل دفعة وتاريخ الإنتاج"}, {id:61, q:"سجلات اعتماد الموردين تشمل الشهادات والمواصفات"}, {id:62, q:"جميع العاملين يحملون شهادات صحية سارية المفعول"}, {id:63, q:"خطة HACCP موثقة ومعتمدة ومراجعتها بانتظام"}, {id:64, q:"سجلات التنظيف والتعقيم كاملة ومحدثة"}, {id:65, q:"الاحتفاظ بسجلات مراقبة درجة الحرارة وتوقيعها"}
      ]},
      { title: "إمداد المياه والسباكة", items: [
        {id:66, q:"إمداد مياه الشرب كافٍ ونظيف تماماً"}, {id:67, q:"تركيب فلاتر المياه وتنظيفها وصيانتها"}, {id:68, q:"عدم وجود تسربات في مواسير الصرف أو وصلاتها"}, {id:69, q:"إغلاق فتحات الصرف أثناء ساعات العمل"}, {id:70, q:"أحواض غسل اليدين مزودة بأجهزة تجفيف"}
      ]},
      { title: "إدارة مسببات الحساسية", items: [
        {id:71, q:"معلومات مسببات الحساسية كاملة على الملصقات"}, {id:72, q:"مناطق تحضير منفصلة للأصناف الخالية من الحساسية"}, {id:73, q:"أدوات مخصصة لتحضير الأغذية الخاصة"}, {id:74, q:"تدريب الموظفين على التوعية بمسببات الحساسية"}
      ]}
    ];

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [branch, setBranch] = useState("");
      const [location, setLoc] = useState("تحديد الموقع...");
      const [answers, setAnswers] = useState({});
      const [notes, setNotes] = useState({});
      const [photos, setPhotos] = useState({});
      const [expanded, setExpanded] = useState(new Set([checklistData[0].title]));
      const canvasRef = useRef(null);
      const sigPad = useRef(null);

      useEffect(() => {
        auth.onAuthStateChanged(u => { setUser(u); setLoading(false); });
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(pos => {
            setLoc(`Lat: ${pos.coords.latitude.toFixed(4)}, Lng: ${pos.coords.longitude.toFixed(4)}`);
          });
        }
      }, []);

      useEffect(() => {
        if (user && canvasRef.current) sigPad.current = new SignaturePad(canvasRef.current);
      }, [user, loading]);

      const getScore = () => {
        const vals = Object.values(answers);
        const yes = vals.filter(v => v === 'yes').length;
        const total = vals.filter(v => v !== 'na').length;
        return total > 0 ? Math.round((yes / total) * 100) : 0;
      };

      const handlePhoto = (id, e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setPhotos(prev => ({...prev, [id]: [...(prev[id] || []), ev.target.result].slice(0,3)}));
        };
        reader.readAsDataURL(file);
      };

      const downloadPDF = () => {
        const score = getScore();
        const scoreColor = score >= 70 ? '#10b981' : '#ef4444';
        const signature = sigPad.current ? sigPad.current.toDataURL() : "";

        // بناء المستند برمجياً بعيداً عن الشاشة وبدون أي علاقة بوضعية التمرير
        const element = document.createElement('div');
        element.style.cssText = "width: 790px; padding: 40px; background: white; direction: rtl; font-family: 'Cairo', sans-serif;";
        
        element.innerHTML = `
          <div style="text-align: center; border-bottom: 5px solid #004b47; padding-bottom: 30px;">
            <img src="https://chef-ayo.github.io/verra-food-safety-inspector/logo.png" style="height: 120px; margin-bottom: 15px" />
            <h1 style="color:#004b47; font-size:32px; margin:0; font-weight:900">تقرير فحص الجودة والسلامة الغذائية</h1>
            <p style="color:#64748b; font-size:14px; margin-top:5px">نظام فيرا PRO السحابي المتكامل</p>
          </div>

          <div style="display: flex; justify-content: space-between; margin-top: 30px; background: #f8fafc; padding: 25px; border-radius: 20px; border: 1px solid #e2e8f0;">
            <div style="line-height: 2.2; font-size: 15px">
              <p><b>🏢 المنشأة:</b> <span style="color:#004b47">${branch || 'غير محدد'}</span></p>
              <p><b>👤 المفتش المعتمد:</b> ${user.email.split('@')[0].toUpperCase()}</p>
              <p><b>📍 الموقع الجغرافي:</b> ${location}</p>
              <p><b>📅 تاريخ الفحص:</b> ${new Date().toLocaleDateString('ar-EG')}</p>
            </div>
            <div style="text-align: center; border-right: 3px solid #ddd; padding-right: 40px">
              <p style="font-weight: 900; color: #64748b; font-size: 14px; text-transform: uppercase">نسبة الامتثال</p>
              <div style="font-size: 60px; font-weight: 900; color: ${scoreColor}; margin-top: -10px">${score}%</div>
              <p style="font-weight: bold; color: ${scoreColor}">${score >= 70 ? 'مقبول' : 'يحتاج تحسين'}</p>
            </div>
          </div>

          <div style="margin-top: 30px">
            ${checklistData.map(sec => `
              <div style="background: #e8f5ee; padding: 12px; font-weight: 900; border-right: 8px solid #d1ba89; margin-top: 25px; font-size: 18px; color: #004b47; page-break-after: avoid">${sec.title}</div>
              ${sec.items.map((i, idx) => {
                const ans = answers[i.id];
                const note = notes[i.id];
                const itemPhotos = photos[i.id] || [];
                return `
                  <div style="padding: 20px; border-bottom: 1px solid #eee; page-break-inside: avoid">
                    <p style="margin: 0; font-size: 15px"><b>${idx+1}. ${i.q}</b></p>
                    <p style="margin: 5px 0; font-size: 13px">الحالة: ${ans === 'yes' ? '<span style="color:green">✅ مطابق</span>' : ans === 'no' ? '<span style="color:red">❌ مخالف</span>' : '⚪ N/A'}</p>
                    ${note ? `<div style="background: #fffbeb; padding: 10px; border-radius: 8px; font-size: 12px; border: 1px solid #fde68a; margin: 10px 0; line-height:1.6"><b>ملاحظة المفتش:</b> ${note}</div>` : ''}
                    <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px">
                      ${itemPhotos.map(p => `<img src="${p}" style="width: 200px; height: 140px; border-radius: 12px; object-fit: cover; border: 1px solid #ddd" />`).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            `).join('')}
          </div>

          <div style="margin-top: 60px; border-top: 2px solid #eee; padding-top: 30px; display: flex; justify-content: space-between; align-items: flex-end; page-break-inside: avoid">
            <div style="text-align: center">
              <p style="font-weight: 900; color: #004b47; margin-bottom: 15px">توقيع المفتش المسؤول</p>
              ${signature ? `<img src="${signature}" style="width: 250px; border-bottom: 2px solid #004b47" />` : '<div style="height:100px; width:200px; border-bottom: 2px solid #ddd"></div>'}
              <p style="margin-top: 10px; font-size: 12px; color: #64748b">${user.email}</p>
            </div>
            <div style="text-align: left">
              <p style="color: #94a3b8; font-size: 11px">الرقم المرجعي للتقرير: VERRA-${Date.now()}</p>
              <p style="color: #94a3b8; font-size: 11px">توليد آلي بواسطة خوادم فيرا السحابية</p>
            </div>
          </div>
        `;

        // إعدادات قوية جداً لقتل البياض
        const opt = {
          margin: 0,
          filename: `VERRA_Report_${branch || 'Export'}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { 
            scale: 2, 
            useCORS: true, 
            scrollY: 0, // هذا هو مفتاح الحل: تصفير إزاحة الواي
            scrollX: 0,
            windowWidth: 800
          },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        html2pdf().from(element).set(opt).save();
      };

      if (loading) return <div className="h-screen flex items-center justify-center font-bold text-green-900 animate-pulse text-3xl italic tracking-tighter">VERRA PRO...</div>;
      if (!user) return <Login auth={auth} />;

      return (
        <div className="pb-40">
          {/* Header */}
          <div className="verra-gradient p-10 text-center shadow-2xl rounded-b-[4rem]">
            <img src="https://chef-ayo.github.io/verra-food-safety-inspector/logo.png" className="h-28 mx-auto mb-4 drop-shadow-2xl" />
            <div className="flex flex-wrap justify-center gap-3 mt-6">
              <div className="inspector-card">
                 <p className="text-[10px] uppercase font-bold gold-text opacity-70">Inspector</p>
                 <p className="text-white font-black text-sm">{user.email.split('@')[0].toUpperCase()}</p>
              </div>
              <div className="inspector-card">
                 <p className="text-[10px] uppercase font-bold gold-text opacity-70">Live Location</p>
                 <p className="text-white font-black text-[11px]">{location}</p>
              </div>
            </div>
          </div>

          <div className="sticky-header flex justify-between items-center shadow-xl px-8 py-5">
            <div>
              <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest">Compliance Score</p>
              <p className="text-4xl font-black text-green-700 leading-none mt-1">{getScore()}%</p>
            </div>
            <div className="flex gap-2">
              <button onClick={()=>location.reload()} className="bg-red-500 text-white p-3.5 rounded-2xl shadow-lg active:scale-90 transition hover:bg-red-600"><svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg></button>
              <button onClick={downloadPDF} className="bg-blue-600 text-white px-8 py-3 rounded-2xl font-black shadow-2xl active:scale-95 transition tracking-widest text-xs hover:bg-blue-700">PRINT REPORT</button>
            </div>
          </div>

          <main className="p-4 max-w-2xl mx-auto space-y-10 mt-6">
            <div className="verra-card p-8 border-r-[15px] border-green-800 shadow-2xl">
              <p className="text-[10px] font-black text-gray-400 mb-2 uppercase tracking-[0.2em]">Target Branch Name</p>
              <input className="w-full text-3xl font-black outline-none text-green-950 bg-transparent placeholder-gray-200" placeholder="اسم المنشأة..." value={branch} onChange={e=>setBranch(e.target.value)} />
            </div>

            {checklistData.map(sec => (
              <div key={sec.title}>
                <div className="section-title flex justify-between items-center shadow-sm" onClick={() => {
                  const n = new Set(expanded); n.has(sec.title) ? n.delete(sec.title) : n.add(sec.title); setExpanded(n);
                }}>
                  <span className="text-lg">{sec.title}</span>
                  <span className="text-xs bg-white/50 px-3 py-1 rounded-full">{expanded.has(sec.title) ? 'إغلاق ▲' : 'عرض ▼'}</span>
                </div>

                {expanded.has(sec.title) && sec.items.map((i, idx) => {
                  const id = `${sec.title}-${idx}`;
                  return (
                    <div key={id} className="item-card shadow-lg border-gray-100 hover:border-green-300 transition-colors">
                      <div className="flex justify-between items-start mb-6">
                        <p className="text-md font-bold text-green-950 ml-4 leading-relaxed">{idx+1}. {i.q}</p>
                        <div className="flex gap-1">
                          <button onClick={()=>setAnswers({...answers, [id]:'yes'})} className={`ans-btn btn-yes ${answers[id]==='yes'?'active':''}`}>نعم</button>
                          <button onClick={()=>setAnswers({...answers, [id]:'no'})} className={`ans-btn btn-no ${answers[id]==='no'?'active':''}`}>لا</button>
                          <button onClick={()=>setAnswers({...answers, [id]:'na'})} className={`ans-btn btn-na ${answers[id]==='na'?'active':''}`}>N/A</button>
                        </div>
                      </div>
                      <textarea className="notes-input shadow-inner focus:border-green-600 transition-all" placeholder="اكتب ملاحظة أو مخالفة فنية..." value={notes[id]||""} onChange={e=>setNotes({...notes, [id]:e.target.value})} />
                      <div className="mt-6 flex flex-wrap gap-4 items-center">
                        <label className="upload-btn shadow-md hover:shadow-lg transition">📷 التقاط صورة
                          <input type="file" className="hidden" accept="image/*" capture="environment" onChange={e=>handlePhoto(id, e)} />
                        </label>
                        <label className="upload-btn shadow-md hover:shadow-lg transition" style={{background:'#eff6ff', color:'#1e40af'}}>🖼️ المعرض
                          <input type="file" className="hidden" accept="image/*" onChange={e=>handlePhoto(id, e)} />
                        </label>
                        <div className="flex flex-wrap gap-2">
                          {(photos[id] || []).map((img, i) => (
                            <div key={i} className="relative m-1">
                              <img src={img} className="photo-thumb animate-in zoom-in" />
                              <div className="del-btn shadow-md" onClick={()=>setPhotos({...photos, [id]: photos[id].filter((_,x)=>x!==i)})}>×</div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            ))}

            <div className="verra-card p-10 border-2 border-dashed border-gray-300 text-center shadow-inner">
              <h3 className="font-black text-green-900 mb-6 uppercase tracking-widest italic text-lg">Official Signature / التوقيع</h3>
              <canvas ref={canvasRef} className="sig-canvas shadow-lg"></canvas>
              <button onClick={()=>sigPad.current.clear()} className="text-red-500 text-sm font-bold mt-6 underline uppercase tracking-tighter block mx-auto hover:text-red-700">Clear Signature</button>
            </div>

            <button onClick={async () => {
                if(!branch) return alert("يرجى إدخال اسم الفرع");
                try {
                  await db.collection("inspections").add({ 
                    branch, score: getScore(), inspector: user.email, 
                    date: new Date().toLocaleDateString('ar-EG'), 
                    signature: sigPad.current.toDataURL(), 
                    location: location, timestamp: firebase.firestore.FieldValue.serverTimestamp() 
                  });
                  alert("تم الإرسال للسحابة بنجاح!"); location.reload();
                } catch(e) { alert("خطأ في السحابة: " + e.message); }
            }} className="w-full verra-gradient text-white font-black py-7 rounded-[3rem] shadow-2xl text-2xl active:scale-95 transition hover:brightness-110"
            >إرسال التقرير النهائي</button>
          </main>
        </div>
      );
    }

    function Login({ auth }) {
      const [e, setE] = useState(""); const [p, setP] = useState("");
      const loginAction = (ev) => { ev.preventDefault(); auth.signInWithEmailAndPassword(e, p).catch(err=>alert("بيانات الدخول غير صحيحة")); };
      return (
        <div className="h-screen verra-gradient flex items-center justify-center p-6">
           <form onSubmit={loginAction} className="bg-white p-12 rounded-[4rem] shadow-2xl w-full max-w-sm text-center transform transition hover:scale-105 duration-500">
              <img src="https://chef-ayo.github.io/verra-food-safety-inspector/logo.png" className="h-20 mx-auto mb-8" />
              <h1 className="text-3xl font-black text-green-900 mb-10 italic tracking-tighter uppercase">Verra Pro</h1>
              <input className="w-full border-2 p-5 rounded-2xl mb-4 text-right outline-none focus:border-green-600 shadow-sm transition-all" placeholder="البريد الإلكتروني" onChange={v=>setE(v.target.value)} />
              <input className="w-full border-2 p-5 rounded-2xl mb-10 text-right outline-none focus:border-green-600 shadow-sm transition-all" type="password" placeholder="كلمة المرور" onChange={v=>setP(v.target.value)} />
              <button type="submit" className="w-full verra-gradient text-white font-black py-5 rounded-2xl shadow-xl active:scale-95 transition tracking-widest uppercase">Login System</button>
           </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
