<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام VERRA PRO - مفتش الجودة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background: #f1f5f9; color: #1e293b; -webkit-tap-highlight-color: transparent; }
    .verra-gradient { background: linear-gradient(135deg, #004b47 0%, #002b29 100%); }
    .section-title { background: #e8f5ee; border-right: 8px solid #d1ba89; padding: 12px; border-radius: 10px; font-weight: 900; color: #004b47; margin: 20px 0 10px; cursor: pointer; }
    .item-card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid #e2e8f0; }
    .ans-btn { width: 50px; height: 35px; border-radius: 8px; font-weight: 700; font-size: 10px; background: #f1f5f9; border: 1px solid #e2e8f0; }
    .btn-yes.active { background: #10b981 !important; color: white; }
    .btn-no.active { background: #ef4444 !important; color: white; }
    .btn-na.active { background: #64748b !important; color: white; }
    .notes-input { width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid #d1ba89; background: #fffdf5; font-size: 12px; outline: none; }
    .photo-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 10px; border: 1px solid #ddd; }
    .sticky-header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-bottom: 2px solid #004b47; padding: 10px 15px; }
  </style>
</head>
<body class="text-right">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyA_-10rTZAM_aJnYiyivMx-yQY7tU6l3K0",
      authDomain: "verra-system-828f2.firebaseapp.com",
      projectId: "verra-system-828f2",
      storageBucket: "verra-system-828f2.firebasestorage.app",
      messagingSenderId: "961104891607",
      appId: "1:961104891607:web:5ffd3af4983a8b015b6a92"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const LOGO_URL = "https://verrapizza.github.io/inspection/verralogo.png";

    // البنود كاملة (يجب ملء جميع البنود الـ 74 هنا)
    const sectionsData = [
      {
        title: "الاستلام والتخزين | Receiving",
        items: [
          { id: 1, ar: "فحص درجة حرارة المواد الغذائية الواردة" },
          { id: 2, ar: "حرارة المجمدات لا تتجاوز -18 م" },
          { id: 3, ar: "حرارة المبردات لا تتجاوز 4 م" },
          // ... أكمل البنود حتى 10
        ]
      },
      {
        title: "تحضير الأغذية | Prep",
        items: [
          { id: 11, ar: "تحضير العجين حسب المواصفات" },
          { id: 12, ar: "عملية تكوير العجين" },
          // ... أكمل البنود حتى 21
        ]
      },
      {
        title: "جودة المنتج | Product Quality",
        items: [
          { id: 22, ar: "جودة شكل وطعم منتج الباستا" },
          { id: 23, ar: "جودة نضج وشكل منتج البيتزا" },
          { id: 24, ar: "رفع الصور لمجموعة الواتساب" }
        ]
      },
      // أضف بقية الأقسام (المبنى، المعدات، النظافة، الشخصية، التخزين) حتى تصل لـ 74
    ];

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [branch, setBranch] = useState("");
      const [branches, setBranches] = useState([]);
      const [answers, setAnswers] = useState({});
      const [notes, setNotes] = useState({});
      const [photos, setPhotos] = useState({});
      const [expanded, setExpanded] = useState(new Set([sectionsData[0].title]));
      const canvasRef = useRef(null);
      const sigPad = useRef(null);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(async u => {
            if (u) { setUser(u); db.collection("branches").orderBy("name").onSnapshot(s => setBranches(s.docs.map(d => d.data().name))); }
            setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => { if (user && canvasRef.current) sigPad.current = new SignaturePad(canvasRef.current); }, [user]);

      const compressExtreme = (file) => {
        return new Promise((resolve) => {
          const reader = new FileReader(); reader.readAsDataURL(file);
          reader.onload = (e) => {
            const img = new Image(); img.src = e.target.result;
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_W = 180; // حجم صغير جداً لضمان نجاح الـ PDF
              const scale = MAX_W / img.width;
              canvas.width = MAX_W; canvas.height = img.height * scale;
              const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', 0.1)); // جودة 10% فقط
            };
          };
        });
      };

      const handlePhoto = async (id, e) => {
        const file = e.target.files[0]; if (!file) return;
        const compressed = await compressExtreme(file);
        setPhotos(prev => ({...prev, [id]: [...(prev[id] || []), compressed]}));
      };

      const handlePreview = async () => {
        if (!branch) return alert("اختر المنشأة");
        const score = Math.round(Object.values(answers).filter(v => v === 'yes').length / (Object.values(answers).filter(v => v !== 'na').length || 1) * 100);
        const signatureImg = sigPad.current ? sigPad.current.toDataURL() : "";

        let reportHTML = "";
        sectionsData.forEach(sec => {
          const items = sec.items.filter(i => answers[i.id]);
          if (items.length > 0) {
            reportHTML += `<div style="background:#f0fdf4; padding:8px; border-right:8px solid #d1ba89; color:#004b47; font-weight:bold; margin-top:15px; font-size:16px;">${sec.title}</div>`;
            items.forEach(i => {
              const pics = photos[i.id] || [];
              reportHTML += `
                <div style="padding:10px; border-bottom:1px solid #eee; page-break-inside:avoid; clear:both;">
                  <div style="font-weight:bold; font-size:12px;">${i.ar}</div>
                  <div style="font-size:10px; color:${answers[i.id]==='yes'?'green':'red'}; font-weight:bold;">الحالة: ${answers[i.id]==='yes'?'مطابق':'مخالفة'}</div>
                  ${notes[i.id] ? `<div style="font-size:9px; background:#fff9e6; padding:4px;">ملاحظة: ${notes[i.id]}</div>` : ""}
                  <div style="margin-top:5px; display:block;">
                    ${pics.map(p => `<img src="${p}" style="width:130px; height:100px; object-fit:cover; margin:2px; float:right;" />`).join('')}
                    <div style="clear:both;"></div>
                  </div>
                </div>`;
            });
          }
        });

        const renderArea = document.createElement('div');
        renderArea.innerHTML = `
          <div style="width:700px; margin:0 auto; padding:20px; background:white; direction:rtl; text-align:right; font-family:sans-serif;">
            <table style="width:100%;">
              <tr>
                <td style="text-align:right;"><h2 style="color:#004b47; margin:0;">تقرير تدقيق الجودة</h2></td>
                <td style="text-align:left;"><img src="${LOGO_URL}" style="height:50px;" /></td>
              </tr>
            </table>
            <div style="background:#f8fafc; padding:10px; border:1px solid #eee; margin:15px 0; font-size:12px;">
              <b>المنشأة:</b> ${branch} | <b>التاريخ:</b> ${new Date().toLocaleString('en-GB')} | <b>النسبة:</b> ${score}%
            </div>
            ${reportHTML}
            <div style="margin-top:30px; border-top:1px solid #eee; padding-top:10px;">
              <b>توقيع المفتش:</b><br/><img src="${signatureImg}" style="width:200px; height:80px; object-fit:contain;" />
            </div>
          </div>`;

        alert("جاري إنشاء التقرير الخفيف جداً...");
        const opt = {
          margin: 10,
          filename: `Quality_Report.pdf`,
          image: { type: 'jpeg', quality: 0.95 },
          html2canvas: { scale: 1.0, useCORS: true }, // سكيل 1.0 يمنع الصفحات البيضاء
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        
        setTimeout(() => {
          html2pdf().from(renderArea).set(opt).save();
        }, 1000);
      };

      if (loading) return <div className="h-screen flex items-center justify-center font-bold">جاري التحميل...</div>;
      if (!user) return <div className="p-20 text-center font-bold">يرجى تسجيل الدخول.</div>;

      return (
        <div className="pb-40 text-right">
          <div className="verra-gradient p-10 text-center text-white rounded-b-[3rem] shadow-xl">
            <img src={LOGO_URL} className="h-20 mx-auto mb-4" />
            <h1 className="text-xl font-bold">مراقب الجودة المعتمد</h1>
          </div>

          <div className="sticky-header flex justify-between items-center shadow-lg">
            <p className="text-2xl font-black text-green-700">{Math.round(Object.values(answers).filter(v => v === 'yes').length / (Object.values(answers).filter(v => v !== 'na').length || 1) * 100)}%</p>
            <div className="flex gap-2">
                <button onClick={handlePreview} className="bg-[#d1ba89] text-[#004b47] px-4 py-2 rounded-xl font-bold text-xs shadow">PDF معاينة</button>
                <button className="verra-gradient text-white px-5 py-2 rounded-xl font-bold text-xs shadow">إرسال</button>
            </div>
          </div>

          <main className="p-5 max-w-2xl mx-auto space-y-6">
            <div className="item-card p-6 border-r-8 border-[#d1ba89]">
                <select className="w-full text-lg font-bold bg-transparent outline-none" value={branch} onChange={e=>setBranch(e.target.value)}>
                    <option value="">-- اختر الفرع --</option>
                    {branches.map(b => <option key={b} value={b}>{b}</option>)}
                </select>
            </div>

            {sectionsData.map(sec => (
              <div key={sec.title}>
                <div className="section-title" onClick={() => { const n = new Set(expanded); n.has(sec.title) ? n.delete(sec.title) : n.add(sec.title); setExpanded(n); }}>
                  {sec.title} {expanded.has(sec.title) ? '▲' : '▼'}
                </div>
                {expanded.has(sec.title) && sec.items.map(i => (
                  <div key={i.id} className="item-card">
                    <p className="font-bold text-gray-800 mb-2">{i.ar}</p>
                    <div className="flex gap-2 justify-end mb-4">
                      <button onClick={()=>setAnswers({...answers, [i.id]:'yes'})} className={`ans-btn ${answers[i.id]==='yes'?'active btn-yes':''}`}>نعم</button>
                      <button onClick={()=>setAnswers({...answers, [i.id]:'no'})} className={`ans-btn ${answers[i.id]==='no'?'active btn-no':''}`}>لا</button>
                      <button onClick={()=>setAnswers({...answers, [i.id]:'na'})} className={`ans-btn ${answers[i.id]==='na'?'active btn-na':''}`}>N/A</button>
                    </div>
                    <textarea className="notes-input" placeholder="ملاحظات..." value={notes[i.id]||""} onChange={e=>setNotes({...notes, [i.id]:e.target.value})} />
                    <div className="mt-4 flex flex-wrap gap-2 items-center justify-end">
                        <label className="bg-gray-100 p-2 rounded cursor-pointer text-[10px] font-bold">📷 إضافة صورة<input type="file" className="hidden" accept="image/*" onChange={e => handlePhoto(i.id, e)} /></label>
                        <div className="flex flex-wrap mr-auto">
                          {(photos[i.id] || []).map((img, idx) => (
                            <div key={idx} className="relative m-1"><img src={img} className="photo-thumb" /></div>
                          ))}
                        </div>
                    </div>
                  </div>
                ))}
              </div>
            ))}

            <div className="item-card p-10 border-2 border-dashed border-gray-300 text-center shadow-inner">
                <h3 className="font-black text-green-900 mb-4">توقيع المفتش</h3>
                <canvas ref={canvasRef} className="w-full h-40 bg-gray-50 rounded-2xl border"></canvas>
                <button onClick={()=>sigPad.current.clear()} className="text-red-500 text-xs mt-3 underline font-bold">مسح التوقيع</button>
            </div>
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
